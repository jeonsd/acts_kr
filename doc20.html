(function () {
  const TITLE = "사도행전_20장", AUDIO_SRC = "doc20_2610231348.mp3", DUR = 374, SEGS = [{"t":"사도행전 20장","s":0,"e":1.752,"p":true,"h":false},{"t":"전체 흐름","s":2.412,"e":3.444,"p":true,"h":false},{"t":"소동이 가라앉자 바울은 제자들을 불러 권면하고 작별한 뒤 마게도냐로 떠납니다.","s":4.32,"e":9.846,"p":false,"h":false},{"t":"그 지방을 다니며 많은 말로 제자들을 권면하고 헬라에 이르러 석 달을 머뭅니다.","s":10.044,"e":15.403,"p":false,"h":false},{"t":"바울이 배를 타고 수리아로 가려는데 유대인들이 음모를 꾸미자 마게도냐를 거쳐 돌아가기로 합니다(20:1-3).","s":15.624,"e":23.87,"p":false,"h":false},{"t":"그의 일행은 소바더, 아리스다고, 세군도, 가이오, 디모데, 두기고, 드로비모였고, 이들이 먼저 가서 드로아에서 기다렸습니다(20:4-6).","s":24.084,"e":37.043,"p":true,"h":false},{"t":"드로아에서 안식 후 첫날, 제자들이 떡을 떼려고 모였을 때 바울은 이튿날 떠날 예정이어서 말씀을 강론하다 밤중까지 이야기를 계속했습니다(20:7).","s":37.728,"e":48.65,"p":false,"h":false},{"t":"다락방에는 등불이 많이 켜져 있었는데, 유두고라는 청년이 창에 걸터앉아 있다가 바울의 말이 길어지자 깊이 졸다가 삼층에서 떨어졌습니다.","s":48.852,"e":58.336,"p":false,"h":false},{"t":"일으켜 보니 죽어 있었습니다(20:8-9).","s":58.68,"e":62.74,"p":false,"h":false},{"t":"바울이 내려가 그 위에 엎드려 안고 말합니다.","s":62.928,"e":66.212,"p":false,"h":false},{"t":"\"소동하지 말라.","s":66.42,"e":67.84,"p":false,"h":false},{"t":"생명이 그에게 있다.\"","s":68.328,"e":69.962,"p":false,"h":false},{"t":"그는 올라가 떡을 떼어 먹고 날이 새도록 오래 이야기한 뒤 떠났고, 사람들은 산 청년을 데리고 와서 크게 위로를 받았습니다(20:10-12).","s":70.236,"e":80.858,"p":true,"h":false},{"t":"바울은 에베소를 지나치기로 합니다.","s":81.54,"e":84.112,"p":false,"h":false},{"t":"오순절까지 예루살렘에 이르기 위해서입니다(20:16).","s":84.312,"e":89.277,"p":false,"h":false},{"t":"그러나 밀레도에서 에베소 교회의 장로들을 청해 작별 설교를 합니다.","s":89.496,"e":94.171,"p":false,"h":false},{"t":"그는 자신이 어떻게 겸손과 눈물로 주를 섬겼는지, 유익한 것은 공중 앞에서나 집집마다 꺼리지 않고 전했고, 유대인과 헬라인에게 하나님께 대한 회개와 우리 주 예수께 대한 믿음을 증언했음을 말합니다(20:17-21).","s":94.356,"e":110.816,"p":false,"h":false},{"t":"그리고 이어서 말합니다.","s":111.06,"e":112.969,"p":false,"h":false},{"t":"\"이제 나는 성령에 매여 예루살렘으로 가는데, 거기서 무슨 일을 당할지 알지 못합니다.","s":113.184,"e":119.109,"p":false,"h":false},{"t":"다만 성령이 각 성에서 결박과 환난이 나를 기다린다고 증언하십니다.","s":119.304,"e":124.084,"p":false,"h":false},{"t":"그러나 나는 내 생명을 조금도 귀하게 여기지 않습니다.","s":124.308,"e":128.281,"p":false,"h":false},{"t":"나의 달려갈 길과 주 예수께 받은 사명, 곧 하나님의 은혜의 복음을 증언하는 일을 마치려는 것뿐입니다\"(20:22-24).","s":128.484,"e":137.869,"p":true,"h":false},{"t":"그는 장로들에게 당부합니다.","s":138.564,"e":140.781,"p":false,"h":false},{"t":"\"여러분 자신과 온 양 떼를 위하여 조심하십시오.","s":140.976,"e":144.486,"p":false,"h":false},{"t":"성령이 여러분을 양 떼 가운데 감독자로 삼으셔서 하나님의 교회를 보살피게 하셨습니다.","s":144.684,"e":150.652,"p":false,"h":false},{"t":"이 교회는 하나님이 자기 피로 사신 것입니다\"(20:28).","s":151.02,"e":156.144,"p":false,"h":false},{"t":"내가 떠난 뒤에 사나운 이리가 들어와 양 떼를 아끼지 않고, 여러분 중에서도 제자들을 끌어 자기를 따르게 하려고 어그러진 말을 하는 사람이 일어날 것이니 깨어 있으라고 합니다(20:29-31).","s":156.348,"e":169.9,"p":false,"h":false},{"t":"\"이제 내가 여러분을 하나님과 그 은혜의 말씀에 맡깁니다.","s":170.136,"e":174.083,"p":false,"h":false},{"t":"그 말씀이 능히 여러분을 든든히 세우고 거룩해진 모든 사람 가운데서 기업을 얻게 하십니다\"(20:32).","s":174.276,"e":181.997,"p":false,"h":false},{"t":"그는 자신이 아무의 은이나 금이나 의복을 탐내지 않았고, 이 손으로 자기와 일행의 쓸 것을 해결했다고 말하고, 이렇게 일하여 약한 사람들을 돕고 주 예수의 말씀을 기억하라고 합니다.","s":182.232,"e":194.586,"p":false,"h":false},{"t":"\"받는 것보다 주는 것이 복이 있다\"(20:33-35).","s":194.94,"e":200.165,"p":true,"h":false},{"t":"말을 마치고 바울이 무릎을 꿇고 모든 사람과 함께 기도하자, 모두 크게 울며 바울의 목을 안고 입을 맞춥니다.","s":200.844,"e":208.641,"p":false,"h":false},{"t":"다시는 자기 얼굴을 보지 못하리라 한 말 때문에 가장 마음 아파하며 그를 배까지 전송합니다(20:36-38).","s":208.98,"e":217.949,"p":true,"h":false},{"t":"구절 풀이","s":218.628,"e":219.675,"p":true,"h":false},{"t":"20장 22절에서 24절은 이 책의 흐름을 바꾸는 말입니다.","s":220.536,"e":225.115,"p":false,"h":false},{"t":"지금까지 성령은 선교의 길을 열고 인도하셨는데, 이제 성령은 바울을 환난이 기다리는 예루살렘으로 이끄십니다.","s":225.324,"e":233.37,"p":false,"h":false},{"t":"성령의 인도는 언제나 평탄한 길을 뜻하지 않습니다.","s":233.712,"e":237.346,"p":false,"h":false},{"t":"이 말씀은 사도행전 후반부 전체를 읽는 열쇠입니다.","s":237.564,"e":241.586,"p":false,"h":false},{"t":"바울은 이것을 스스로의 결단이 아니라 \"성령에 매여\" 가는 길로 설명합니다.","s":241.812,"e":247.291,"p":true,"h":false},{"t":"20장 28절은 교회를 세우고 감독을 세우시는 분이 누구인지를 분명히 말합니다.","s":247.968,"e":253.767,"p":false,"h":false},{"t":"장로들은 스스로 지도자가 된 사람들이 아니라 \"성령이 감독자로 삼으신\" 사람들이고, 그들이 돌보는 교회는 \"하나님이 자기 피로 사신\" 교회입니다.","s":253.944,"e":264.63,"p":false,"h":false},{"t":"이 표현은 사본과 번역에 따라 \"주의 교회\" 또는 \"자기 아들의 피\"로 읽는 등 차이가 있어 해석이 갈립니다.","s":264.96,"e":272.739,"p":false,"h":false},{"t":"그러나 어느 쪽이든 교회가 사람의 것이 아니라 그리스도의 피값으로 얻으신 것이라는 점은 같습니다.","s":273.096,"e":279.595,"p":false,"h":false},{"t":"이 구절은 장로의 권위를 높이는 구절이 아니라, 장로가 맡은 것이 얼마나 귀한 것인지를 일깨우는 구절로 읽는 것이 좋습니다.","s":279.936,"e":288.883,"p":false,"h":false},{"t":"장로와 감독이 같은 사람들을 가리킨다는 점은 17절과 28절에서 확인되지만, 이 하나의 본문으로 교회 직분 제도를 확정하지는 않겠습니다.","s":289.224,"e":298.986,"p":true,"h":false},{"t":"20장 32절은 바울이 마지막으로 의지하는 것이 사람의 지도력이 아니라 \"하나님과 그 은혜의 말씀\"이라는 것을 보여 줍니다.","s":299.772,"e":308.555,"p":false,"h":false},{"t":"자기를 떠나보내는 교회를 하나님과 말씀에 맡기는 모습입니다.","s":308.916,"e":313.04,"p":true,"h":false},{"t":"20장 35절의 \"받는 것보다 주는 것이 복이 있다\"는 복음서에는 없지만 예수님이 하신 말씀으로 바울이 전하는 유일한 곳입니다.","s":313.704,"e":322.953,"p":false,"h":false},{"t":"5장의 아나니아와 바나바 이야기, 4장의 나눔과 이어서 읽을 수 있는 마음입니다.","s":323.316,"e":329.14,"p":false,"h":false},{"t":"이 말씀을 \"주면 더 받는다\"는 식으로 읽으면 본문과 어긋납니다.","s":329.328,"e":334.387,"p":true,"h":false},{"t":"20장 7절의 \"안식 후 첫날\" 모임은 초대교회의 주일 예배를 보여 준다고 널리 읽습니다.","s":335.052,"e":341.433,"p":false,"h":false},{"t":"다만 본문이 이 모임을 규범으로 명령하지는 않습니다.","s":341.784,"e":345.606,"p":true,"h":false},{"t":"20장 9절에서 12절의 유두고는 \"죽은 것을 일으켰다\"로 읽는 입장과 \"생명이 그에게 있다\"는 바울의 말을 근거로 죽지는 않았다고 보는 입장이 있습니다.","s":346.248,"e":357.374,"p":false,"h":false},{"t":"본문은 \"죽은 것을 일으켜\"라고 적고 있고, 누가는 이 사건을 전하는 데 길게 설명하지 않습니다.","s":357.732,"e":364.828,"p":false,"h":false},{"t":"오래 설교하여 졸게 한 사도의 이야기에 웃음이 나오지만, 그 자리에 하나님의 능력이 있었다는 것이 본문의 방향입니다.","s":365.184,"e":373.163,"p":true,"h":false}], NAV = {"prev":{"href":"doc19.html","title":"사도행전_19장"},"next":{"href":"doc21.html","title":"사도행전_21장"},"list":"index.html"};

  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
