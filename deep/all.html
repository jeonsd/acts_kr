 말씀하셨습니다.","s":3931.992,"e":3942.585,"p":true,"h":false},{"t":"이 한 절이 책 전체를 세 부분으로 나눕니다.","s":3943.44,"e":3946.455,"p":false,"h":false},{"t":"처음 일곱 장은 예루살렘에서 일어난 일입니다.","s":3947.076,"e":3950.302,"p":false,"h":false},{"t":"오순절에 성령이 임하시고 교회가 세워지고, 박해와 스데반의 순교로 막이 내립니다.","s":3950.928,"e":3956.621,"p":false,"h":false},{"t":"다음 다섯 장은 유대와 사마리아로 복음이 퍼지는 이야기입니다.","s":3957.228,"e":3961.347,"p":false,"h":false},{"t":"빌립이 사마리아로 가고, 사울이 회심하고, 베드로가 고넬료의 집으로 가고, 안디옥에서 교회가 이방인에게까지 열립니다.","s":3961.98,"e":3970.775,"p":false,"h":false},{"t":"나머지 열여섯 장은 안디옥에서 파송된 바울을 따라 로마까지 이르는 땅끝의 이야기입니다.","s":3971.376,"e":3977.542,"p":true,"h":false},{"t":"이 책은 복음이 어떻게 한 도시에서 시작해 제국의 중심에 이르렀는지를 보여 주는 이야기이고, 그 이야기의 구조는 처음부터 주님이 약속하신 것이었습니다.","s":3978.468,"e":3988.837,"p":false,"h":false},{"t":"사도들이 계획을 세워 이 길을 만든 것이 아니라, 주님이 말씀하신 길을 따라 책이 전개됩니다.","s":3989.52,"e":3995.991,"p":true,"h":false},{"t":"한 문장으로 이어지는 보고들","s":3996.864,"e":3999.084,"p":true,"h":false},{"t":"누가는 이 큰 흐름 속에 짧은 보고문을 곳곳에 끼워 넣습니다.","s":3999.888,"e":4004.189,"p":false,"h":false},{"t":"하나님의 말씀이 점점 왕성하여 제자의 수가 더 많아졌다고 합니다(행 6:7).","s":4004.82,"e":4011.321,"p":false,"h":false},{"t":"교회가 평안하여 든든히 서 가고 수가 더 많아졌다고 합니다(행 9:31).","s":4011.768,"e":4017.921,"p":false,"h":false},{"t":"하나님의 말씀이 흥왕하여 더하였다고 합니다(행 12:24).","s":4018.464,"e":4023.706,"p":false,"h":false},{"t":"교회들이 믿음이 더 굳건해지고 수가 날마다 늘어 갔다고 합니다(행 16:5).","s":4024.224,"e":4030.628,"p":false,"h":false},{"t":"주의 말씀이 힘이 있어 흥왕하여 세력을 얻었다고 합니다(행 19:20).","s":4031.244,"e":4037.074,"p":false,"h":false},{"t":"그리고 책의 마지막 문장은 바울이 거침없이 하나님 나라를 전파하더라는 말입니다(행 28:31).","s":4037.544,"e":4045.403,"p":true,"h":false},{"t":"이 보고들이 나오는 자리를 살펴보면 공통점이 있습니다.","s":4046.148,"e":4050.102,"p":false,"h":false},{"t":"대개 큰 위기 직후입니다.","s":4050.648,"e":4052.644,"p":false,"h":false},{"t":"스데반이 죽은 뒤, 박해가 일어난 뒤, 야고보가 죽고 헤롯이 죽은 뒤, 에베소에서 소동이 일어난 뒤입니다.","s":4053.276,"e":4061.716,"p":false,"h":false},{"t":"누가는 위기와 박해가 있을 때마다 이렇게 말합니다.","s":4062.348,"e":4065.978,"p":false,"h":false},{"t":"그러나 말씀은 자라났다.","s":4066.596,"e":4068.531,"p":false,"h":false},{"t":"사도행전은 사도들의 이야기이기 전에 말씀이 자라난 이야기입니다.","s":4068.828,"e":4073.324,"p":true,"h":false},{"t":"주어가 누구인가","s":4074.228,"e":4075.62,"p":true,"h":false},{"t":"이 책의 주어는 처음부터 한 분이었습니다.","s":4076.496,"e":4079.438,"p":false,"h":false},{"t":"1장 1절은 예수께서 행하시며 가르치시기를 시작하신 모든 일을 앞의 책에 기록했다고 말합니다.","s":4080.024,"e":4086.458,"p":false,"h":false},{"t":"그렇다면 이 책은 그 일의 계속입니다.","s":4087.08,"e":4090.026,"p":true,"h":false},{"t":"오순절에 성령을 부어 주시는 분이 승천하신 주님이십니다.","s":4090.572,"e":4094.569,"p":false,"h":false},{"t":"스데반이 죽을 때 하늘에서 서 계시던 분이 그 주님이십니다.","s":4095.18,"e":4099.233,"p":false,"h":false},{"t":"다메섹 길에서 사울을 붙드신 분도, 고넬료와 베드로에게 환상을 주신 분도, 옥문을 여신 분도, 폭풍 속에서 바울 곁에 서신 분도 같은 주님이십니다.","s":4099.86,"e":4110.695,"p":false,"h":false},{"t":"사도들은 일하는 사람들이었으나 이 일의 주체는 아니었습니다.","s":4111.344,"e":4115.725,"p":true,"h":false},{"t":"이 점이 이 책을 읽는 방식을 정합니다.","s":4116.276,"e":4119.029,"p":false,"h":false},{"t":"사도행전은 사도들을 흉내 내라고 쓴 모범 사례집이 아닙니다.","s":4119.66,"e":4124.028,"p":false,"h":false},{"t":"교회가 따라야 할 제도와 방법을 모아 놓은 지침서도 아닙니다.","s":4124.556,"e":4128.6,"p":false,"h":false},{"t":"승천하신 주님이 하늘에서 성령으로 교회를 세우시고 확장하신 일의 기록입니다.","s":4129.236,"e":4134.396,"p":false,"h":false},{"t":"그러므로 사도행전을 읽는 가장 좋은 방식은 이 장면에서 나는 무엇을 해야 하는가를 먼저 묻는 것이 아니라, 이 장면에서 주님은 무엇을 하고 계신가를 먼저 묻는 것입니다.","s":4134.96,"e":4145.807,"p":true,"h":false},{"t":"열여섯 개의 물음이 가리킨 곳","s":4146.696,"e":4148.737,"p":true,"h":false},{"t":"돌아보면 우리가 다룬 물음들은 모두 같은 분을 가리켰습니다.","s":4149.54,"e":4153.871,"p":true,"h":false},{"t":"승천하신 주님은 나라의 회복을 묻는 제자들에게 때가 아니라 성령과 땅끝을 말씀하셨습니다.","s":4154.76,"e":4160.902,"p":false,"h":false},{"t":"오순절에 성령이 임하신 것은 그 주님이 보내신 선물이었고, 이후 사마리아와 이방인과 요한의 제자들에게 같은 성령이 임하신 것은 복음이 모든 경계를 넘는다는 증거였습니다.","s":4161.492,"e":4172.889,"p":false,"h":false},{"t":"십자가가 하나님의 정하신 뜻이면서 사람의 죄라는 설교는 가장 큰 죄가 구원의 자리가 되었다는 소식이었습니다.","s":4173.516,"e":4180.714,"p":true,"h":false},{"t":"재산을 나눈 교회와 아나니아의 죽음은 성령이 임하신 공동체의 은혜와 거룩을 함께 보였고, 스데반은 성전에 갇히지 않으시는 하나님과 하늘에서 서신 인자를 보았습니다.","s":4181.616,"e":4192.521,"p":false,"h":false},{"t":"교회를 박해하던 사울이 택함받은 것은 하나님의 은혜가 사람의 자격과 무관하다는 증거였고, 고넬료의 집에서 하나님은 편견의 벽을 환상으로 허무셨습니다.","s":4193.136,"e":4203.655,"p":false,"h":false},{"t":"야고보의 죽음과 베드로의 구출은 설명되지 않는 하나님의 주권 앞에 우리를 세웠습니다.","s":4204.296,"e":4209.977,"p":true,"h":false},{"t":"영생으로 작정된 사람들은 믿었고 바울은 그들을 위해 침묵하지 않았습니다.","s":4210.848,"e":4216.24,"p":false,"h":false},{"t":"이스라엘의 거절 앞에서도 복음은 이방인에게 길을 열었습니다.","s":4216.86,"e":4221.248,"p":false,"h":false},{"t":"예루살렘 회의는 구원이 오직 주 예수의 은혜로 이루어진다는 것을 지켜냈고, 사도들의 인도하심은 하나님이 복음 사역을 어떻게 이끄시는지 보였습니다.","s":4221.9,"e":4231.841,"p":false,"h":false},{"t":"아테네의 바울은 접촉점을 말의 수준에서만 쓰고 선포의 내용은 한 치도 바꾸지 않았으며, 사도들의 표적은 말씀을 증언하는 일에 쓰였습니다.","s":4232.484,"e":4241.528,"p":false,"h":false},{"t":"마지막으로 재판받고 갇힌 바울은 복음이 쇠사슬에 매이지 않는다는 것을 보여 주었습니다.","s":4242.096,"e":4247.775,"p":true,"h":false},{"t":"모든 물음의 밑바닥에는 한 가지 확신이 있었습니다.","s":4248.648,"e":4252.278,"p":false,"h":false},{"t":"일하시는 분은 하나님이시고, 하나님은 사람의 약함과 죄와 반대까지도 쓰셔서 자기 말씀을 이루신다는 것입니다.","s":4252.896,"e":4260.439,"p":true,"h":false},{"t":"아직 끝나지 않은 이야기","s":4261.32,"e":4263.079,"p":true,"h":false},{"t":"사도행전은 28장에서 끝나지만 이야기는 끝나지 않았습니다.","s":4263.912,"e":4268.343,"p":false,"h":false},{"t":"책이 시작하신 일이라고 말하며 열어 놓은 문은 닫히지 않았습니다.","s":4268.988,"e":4273.43,"p":false,"h":false},{"t":"지금 우리가 사는 시대가 바로 그 계속입니다.","s":4274.1,"e":4277.365,"p":false,"h":false},{"t":"승천하신 주님은 지금도 하늘에서 성령으로 교회를 세우시고, 말씀이 흥왕하게 하시고, 땅끝으로 복음을 보내십니다.","s":4277.952,"e":4286.021,"p":true,"h":false},{"t":"그리고 이 이야기에는 아직 이루어지지 않은 마지막이 있습니다.","s":4286.808,"e":4291.036,"p":false,"h":false},{"t":"승천 때 흰 옷 입은 두 사람이 말했습니다.","s":4291.704,"e":4294.796,"p":false,"h":false},{"t":"너희가 하늘로 올라가심을 본 그대로 이 예수께서 오시리라(행 1:11).","s":4295.448,"e":4301.313,"p":false,"h":false},{"t":"사도행전의 처음에 있었던 약속은 책이 끝난 뒤에도 남아 있습니다.","s":4301.892,"e":4306.22,"p":true,"h":false},{"t":"그러니 사도행전을 읽는 사람은 두 방향을 바라봅니다.","s":4307.112,"e":4310.815,"p":false,"h":false},{"t":"하나는 하늘에서 지금도 일하시는 왕이시고, 하나는 다시 오실 그 왕이십니다.","s":4311.144,"e":4316.611,"p":false,"h":false},{"t":"그 사이에 놓인 시간이 증인의 시대이고, 그 시간 속에 우리가 있습니다.","s":4317.228,"e":4322.231,"p":false,"h":false},{"t":"증인이 되라는 명령이 아니라 증인이 되리라는 약속을 받은 사람들로서입니다.","s":4322.88,"e":4328.029,"p":false,"h":false},{"t":"우리를 증인이 되게 하시는 분은 성령이시고, 그 성령을 보내신 분은 승천하신 왕이십니다.","s":4328.676,"e":4334.693,"p":false,"h":false},{"t":"이 책이 시작과 끝에서 가리키는 이름은 하나입니다.","s":4335.3,"e":4338.722,"p":false,"h":false},{"t":"예수 그리스도, 하늘에 오르신 주님이십니다.","s":4339.332,"e":4342.612,"p":true,"h":false}]}];
  const N = TRACKS.length;
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narrbook:' + TITLE + ':' + (N ? TRACKS[0].audio : '');
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let auto = true, spd = 1, fsi = 2, ti = 0, lastK = -1, lastI = -1, lastUser = 0, playing = false, tickId = 0, lastSave = 0, curSrc = '', inited = false;
  const audio = new Audio();
  audio.preload = 'metadata';
  const warmed = {};

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }
  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }
  function segs() { return TRACKS[ti].segs; }
  function localT() { return Math.max(0, (audio.currentTime || 0) - TRACKS[ti].start); }

  /* 글 그리기 (모든 글을 위에서 아래로 이어서) */
  (function build() {
    let html = '', toc = '', total = 0;
    TRACKS.forEach((tr, k) => {
      total += tr.dur || 0;
      html += '<section class="trk" id="t' + k + '"><h2 class="tt">' + (k + 1) + '. ' + esc(tr.title) + '</h2>';
      let para = '';
      tr.segs.forEach((g, i) => {
        const span = '<span class="seg" id="g' + k + '_' + i + '" data-k="' + k + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
        if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h3 class="hd">' + span + '</h3>'; }
        else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
      });
      if (para) { html += '<p>' + para + '</p>'; }
      html += '</section>';
      toc += '<li><a href="#' + (k + 1) + '" data-k="' + k + '">' + esc(tr.title) + '<span class="d">' + fmt(tr.dur) + '</span></a></li>';
    });
    $('text').innerHTML = html;
    $('toc').innerHTML = toc;
    $('meta').textContent = '글 ' + N + '개 · 전체 듣는 시간 약 ' + fmt(total) + ' · 끝나면 다음 글로 이어서 들려요';
  })();

  function applyAuto() {
    const b = $('auto'), h = $('autohint');
    b.classList.toggle('on', auto); b.setAttribute('aria-pressed', auto ? 'true' : 'false');
    b.textContent = auto ? '🔁 이어듣기 켜짐 ✔' : '⏹ 이어듣기 꺼짐';
    h.classList.toggle('off', !auto);
    h.textContent = auto ? '초록색이면 켜진 상태입니다. 그대로 두고 아래 ▶ 재생만 누르세요. (이 단추를 누르면 꺼집니다)' : '지금은 꺼져 있어서 한 글만 듣고 멈춥니다. 위 회색 단추를 눌러 켜세요.';
  }
  function hideNote() { $('note').style.display = 'none'; }
  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.defaultPlaybackRate = SPEEDS[spd]; audio.playbackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applyAuto();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { const S = segs(); let k = -1; for (let i = 0; i < S.length; i++) { if (S[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function clearMark() { const o = $('g' + lastK + '_' + lastI); if (o) { o.classList.remove('on'); } lastK = -1; lastI = -1; }
  function mark(i, follow) {
    if (i === lastI && ti === lastK) { return; }
    const old = $('g' + lastK + '_' + lastI); if (old) { old.classList.remove('on'); }
    lastK = ti; lastI = i;
    const el = $('g' + ti + '_' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function updateNow() { $('now').textContent = (ti + 1) + ' / ' + N + ' · ' + TRACKS[ti].title; }
  function setHash() { if (!inited) { return; } try { history.replaceState(null, '', location.pathname + location.search + '#' + (ti + 1)); } catch (e) {} }
  function mediaMeta() {
    try { if ('mediaSession' in navigator && window.MediaMetadata) { navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[ti].title, artist: TITLE, album: TITLE }); } } catch (e) {}
  }
  /* 지금 소리 파일 안에서 시간에 맞는 글 번호 */
  function trackAt(t) {
    for (let k = N - 1; k >= 0; k--) { if (TRACKS[k].audio === curSrc && t >= TRACKS[k].start - 0.02) { return k; } }
    return ti;
  }
  /* 다음 소리 파일을 미리 받아 두기 (파일이 바뀔 때 끊김을 줄입니다) */
  function warmNext() {
    const nx = TRACKS[ti + 1]; if (!nx || nx.audio === curSrc || warmed[nx.audio]) { return; }
    warmed[nx.audio] = 1; try { const a = new Audio(); a.preload = 'auto'; a.src = nx.audio; } catch (e) {}
  }
  function switchTo(k) { clearMark(); ti = k; updateNow(); mediaMeta(); setHash(); warmNext(); }
  function paint() {
    const t = audio.currentTime || 0;
    const k = trackAt(t); if (k !== ti) { switchTo(k); }
    const d = TRACKS[ti].dur || 0, rel = Math.max(0, t - TRACKS[ti].start);
    $('cur').textContent = fmt(rel); $('tot').textContent = fmt(d);
    if (d > 0) { $('fill').style.width = Math.min(100, rel / d * 100) + '%'; }
    mark(idxAt(t), playing);
  }
  /* 이어듣기가 꺼져 있을 때: 같은 파일 안에서 다음 글로 넘어가는 순간 멈춥니다 */
  function boundary() {
    if (!playing || auto || ti >= N - 1) { return false; }
    const nx = TRACKS[ti + 1]; if (nx.audio !== curSrc) { return false; }
    if ((audio.currentTime || 0) >= nx.start - 0.05) {
      audio.pause(); setPlaying(false);
      try { audio.currentTime = nx.start; } catch (e) {}
      clearMark(); ti = ti + 1; updateNow(); mediaMeta(); setHash(); pref('pos', ti + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); play(); };
      paint();
      return true;
    }
    return false;
  }
  function loop() { if (boundary()) { return; } paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
    try { if ('mediaSession' in navigator) { navigator.mediaSession.playbackState = p ? 'playing' : 'paused'; } } catch (e) {}
  }
  function savePos() { pref('pos', ti + ':' + localT()); }
  function play() { const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); savePos(); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seekAbs(t) {
    const d = audio.duration; const hi = (d && isFinite(d)) ? d : TRACKS[ti].end;
    try { audio.currentTime = Math.max(0, Math.min(t, hi)); } catch (e) {}
    paint();
  }

  /* 글 바꾸기: 소리 파일이 같으면 위치만 옮기고, 다르면 다음 파일을 불러옵니다 (같은 재생기를 계속 써서 폰에서도 이어집니다) */
  function loadTrack(k, st, autoPlay) {
    if (k < 0 || k >= N) { return; }
    lastUser = 0; clearMark(); ti = k; updateNow(); mediaMeta(); setHash(); warmNext();
    const tr = TRACKS[k], target = tr.start + (st || 0);
    if (curSrc !== tr.audio) { curSrc = tr.audio; audio.src = tr.audio; applySpd(); }
    try { audio.currentTime = target; } catch (e) {}
    if (autoPlay) { play(); } else { paint(); }
  }
  function jump(k, i) {
    const S = TRACKS[k] && TRACKS[k].segs; if (!S || i < 0 || i >= S.length) { return; }
    lastUser = 0;
    if (k !== ti || TRACKS[k].audio !== curSrc) { loadTrack(k, S[i].s - TRACKS[k].start, true); mark(i, true); return; }
    seekAbs(S[i].s); mark(i, true); if (!playing) { play(); }
  }

  audio.addEventListener('timeupdate', () => {
    if (boundary()) { return; }
    if (!playing) { paint(); }
    if (Date.now() - lastSave > 4000) { lastSave = Date.now(); savePos(); }
  });
  audio.addEventListener('loadedmetadata', () => {
    const want = TRACKS[ti].start + 0; /* 파일을 바꾼 직후 위치가 어긋났다면 바로잡습니다 */
    if (curSrc === TRACKS[ti].audio && (audio.currentTime || 0) < TRACKS[ti].start - 1 && audio.currentTime < 0.5 && TRACKS[ti].start > 1 && !playing) { try { audio.currentTime = want; } catch (e) {} }
    paint();
  });
  audio.addEventListener('ended', () => {
    if (ti < N - 1) {
      if (auto) { loadTrack(ti + 1, 0, true); return; }
      setPlaying(false); clearMark(); pref('pos', (ti + 1) + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); loadTrack(ti + 1, 0, true); };
    } else { setPlaying(false); pref('pos', '0:0'); clearMark(); }
  });
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일(' + curSrc + ')을 불러오지 못했습니다. mp3 파일들이 이 페이지와 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('auto').onclick = () => { auto = !auto; applyAuto(); hideNote(); };
  $('play').onclick = toggle;
  $('back').onclick = () => seekAbs((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seekAbs((audio.currentTime || 0) + 10);
  $('prev').onclick = () => {
    const t = audio.currentTime || 0, i = idxAt(t), cur = segs()[i];
    if (cur && t - cur.s > 2) { jump(ti, i); }
    else if (i > 0) { jump(ti, i - 1); }
    else if (ti > 0) { loadTrack(ti - 1, 0, true); }
    else { seekAbs(0); }
  };
  $('next').onclick = () => {
    const i = idxAt(audio.currentTime || 0) + 1;
    if (i < segs().length) { jump(ti, i); } else if (ti < N - 1) { loadTrack(ti + 1, 0, true); }
  };
  $('pt').onclick = () => { if (localT() > 5 || ti === 0) { loadTrack(ti, 0, true); } else { loadTrack(ti - 1, 0, true); } };
  $('nt').onclick = () => { if (ti < N - 1) { loadTrack(ti + 1, 0, true); } };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = TRACKS[ti].dur || 0; seekAbs(TRACKS[ti].start + ((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-k'), +s.getAttribute('data-i')); } });
  $('toc').addEventListener('click', e => {
    const a = e.target.closest ? e.target.closest('a') : null; if (!a) { return; }
    e.preventDefault(); $('lst').open = false; lastUser = 0;
    const k = +a.getAttribute('data-k');
    loadTrack(k, 0, true);
    const sec = $('t' + k); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
  });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seekAbs((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seekAbs((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  /* 잠금 화면·이어폰 단추 */
  try {
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
      set('play', play); set('pause', pause);
      set('nexttrack', () => $('nt').onclick()); set('previoustrack', () => $('pt').onclick());
      set('seekbackward', () => seekAbs((audio.currentTime || 0) - 10)); set('seekforward', () => seekAbs((audio.currentTime || 0) + 10));
    }
  } catch (e) {}

  /* 시작: 주소 끝의 #번호가 있으면 그 글을, 없으면 첫 글을 준비하고, 지난번 위치가 있으면 이어 듣기 안내 */
  const hm = /^#(\d+)$/.exec(location.hash || '');
  let k0 = 0; if (hm) { const q = parseInt(hm[1], 10) - 1; if (q >= 0 && q < N) { k0 = q; } }
  loadTrack(k0, 0, false);
  inited = true;
  if (hm) { const sec = $('t' + k0); if (sec) { setTimeout(() => { try { sec.scrollIntoView({ block: 'start' }); } catch (x) {} }, 60); } }
  else {
    const sp = (pref('pos') || '').split(':'), rk = parseInt(sp[0], 10), rt = parseFloat(sp[1]);
    if (rk >= 0 && rk < N && rt > 10 && rt < (TRACKS[rk].dur || 1e9) - 5) {
      const r = $('resume'); r.style.display = 'block';
      r.innerHTML = '지난번 <b>' + esc(TRACKS[rk].title) + '</b> ' + fmt(rt) + '까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
      $('rb').onclick = () => { r.style.display = 'none'; loadTrack(rk, rt, true); const sec = $('t' + rk); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} } };
    }
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, loadTrack, toggle, audio, TRACKS, seekAbs, state: () => ({ ti, auto, playing, curSrc }) };
})();
</script>
</body>
</html>
