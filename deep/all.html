결 규정","s":4633.704,"e":4635.274,"p":true,"h":false},{"t":"오늘 우리에게 이 본문은 낯선 음식 규정이 아니라 마음의 구분선을 묻습니다.","s":4636.116,"e":4641.31,"p":false,"h":false},{"t":"교회는 얼마나 자주 사람을 깨끗한 사람과 그렇지 않은 사람으로 나누어 왔습니까.","s":4641.948,"e":4647.095,"p":false,"h":false},{"t":"학력이나 지역이나 직업이나 과거의 허물이나 신분이 선을 긋는 기준이 되기도 합니다.","s":4647.708,"e":4653.339,"p":true,"h":false},{"t":"하나님이 깨끗하게 하신 것을 속되다 하지 말라는 음성은 오늘 우리에게도 들려옵니다.","s":4654.152,"e":4659.483,"p":false,"h":false},{"t":"그 선을 그을 수 있는 분은 하나님뿐이시고, 하나님은 그 선을 그리스도 안에서 지우셨습니다.","s":4660.092,"e":4666.295,"p":false,"h":false},{"t":"이방인에게 열린 문은 지금 우리가 서 있는 자리가 열린 문이라는 사실입니다.","s":4666.932,"e":4671.656,"p":true,"h":false}]},{"title":"9. 야고보는 죽고 베드로는 구출되었다: 같은 기도 앞에서 다른 결과를 주시는 하나님","audio":"book_2610272355_1.mp3","start":4672.584,"end":5250.78,"dur":578.2,"segs":[{"t":"9.","s":4672.584,"e":4673.127,"p":false,"h":false},{"t":"야고보는 죽고 베드로는 구출되었다: 같은 기도 앞에서 다른 결과를 주시는 하나님","s":4674.492,"e":4681.014,"p":true,"h":false},{"t":"본문: 사도행전 12장 1-25절 (함께 읽을 본문: 막 10:35-40, 요 21:18-19, 행 5:17-21, 시 34:19, 계 6:9-11)","s":4681.8,"e":4701.656,"p":true,"h":false},{"t":"사도행전 12장은 교회가 가장 대답하기 어려운 물음 앞에 서게 하는 장입니다.","s":4702.32,"e":4707.517,"p":true,"h":false},{"t":"헤롯 왕이 교회를 박해하며 사도 야고보를 칼로 죽였습니다(행 12:2).","s":4708.404,"e":4714.336,"p":false,"h":false},{"t":"그리고 베드로도 잡아 가둡니다.","s":4714.884,"e":4717.136,"p":false,"h":false},{"t":"교회는 베드로를 위해 간절히 기도했습니다.","s":4717.728,"e":4720.885,"p":false,"h":false},{"t":"그런데 베드로는 천사에게 이끌려 감옥에서 나옵니다.","s":4721.508,"e":4725.165,"p":false,"h":false},{"t":"한 사도는 칼 아래 죽었고 한 사도는 감옥에서 구출되었습니다.","s":4725.72,"e":4730.463,"p":true,"h":false},{"t":"기도하는 교회에게 하나님은 왜 한 사람은 구원하시고 한 사람은 구원하지 않으셨습니까.","s":4731.336,"e":4737.198,"p":false,"h":false},{"t":"이 글에서는 본문이 이 물음에 어떻게 말하고, 어떻게 침묵하는지를 따라가 봅니다.","s":4737.852,"e":4743.574,"p":true,"h":false},{"t":"한 문장으로 끝나는 야고보의 죽음","s":4744.476,"e":4747.027,"p":true,"h":false},{"t":"본문에서 먼저 놀라운 것은 야고보의 죽음이 얼마나 짧게 기록되어 있는가입니다.","s":4747.86,"e":4753.198,"p":false,"h":false},{"t":"헤롯이 요한의 형제 야고보를 칼로 죽였다는 것이 전부입니다(행 12:2).","s":4753.836,"e":4759.843,"p":false,"h":false},{"t":"변론도 없고, 마지막 말도 없고, 이유도 없습니다.","s":4760.46,"e":4765.038,"p":false,"h":false},{"t":"스데반은 한 장 반에 걸쳐 설교와 죽음이 기록되었는데 야고보는 한 줄입니다.","s":4765.68,"e":4771.098,"p":true,"h":false},{"t":"야고보는 열두 사도 가운데 처음으로 순교한 사람입니다.","s":4771.944,"e":4775.791,"p":false,"h":false},{"t":"그는 요한의 형제이자 세베대의 아들이고, 예수께서 가장 가까이 두셨던 세 사람 중 하나였습니다.","s":4776.408,"e":4782.85,"p":false,"h":false},{"t":"그런데 누가는 그의 죽음을 설명하지 않습니다.","s":4783.5,"e":4786.701,"p":false,"h":false},{"t":"하나님이 왜 이 사람을 지키지 않으셨는지 한 마디도 하지 않습니다.","s":4787.316,"e":4791.739,"p":true,"h":false},{"t":"이 침묵은 의도된 것으로 보입니다.","s":4792.644,"e":4795.227,"p":false,"h":false},{"t":"누가는 신학적으로 설득력 있는 해설을 덧붙일 수 있었지만 그러지 않았습니다.","s":4795.848,"e":4800.845,"p":false,"h":false},{"t":"설명되지 않는 죽음을 설명되지 않은 채로 놓아 둔 것입니다.","s":4801.5,"e":4805.215,"p":false,"h":false},{"t":"그것이 이 장을 읽는 첫 번째 정직한 자세입니다.","s":4805.82,"e":4809.448,"p":true,"h":false},{"t":"다만 한 가지 단서는 있습니다.","s":4809.996,"e":4812.301,"p":false,"h":false},{"t":"복음서에서 야고보와 요한이 예수께 높은 자리를 구했을 때 예수께서는 이렇게 물으셨습니다.","s":4812.912,"e":4819.178,"p":false,"h":false},{"t":"내가 마시는 잔을 너희가 마실 수 있느냐.","s":4819.824,"e":4822.589,"p":false,"h":false},{"t":"그리고 너희가 내가 마시는 잔을 마실 것이라고 하셨습니다(막 10:38-39).","s":4823.208,"e":4830.336,"p":false,"h":false},{"t":"야고보의 순교는 주님이 이미 말씀하신 길이었습니다.","s":4830.948,"e":4834.63,"p":false,"h":false},{"t":"그것이 설명이 되는 것은 아닙니다.","s":4835.196,"e":4837.699,"p":false,"h":false},{"t":"그러나 이 죽음이 주님의 계획과 무관하게 일어난 사고는 아니었다는 것을 알려 줍니다.","s":4838.004,"e":4843.506,"p":true,"h":false},{"t":"베드로의 감옥과 교회의 기도","s":4844.376,"e":4846.522,"p":true,"h":false},{"t":"야고보가 죽고 유대인들이 기뻐하는 것을 본 헤롯은 베드로도 잡습니다.","s":4847.328,"e":4852.035,"p":false,"h":false},{"t":"무교절 기간이어서 유월절이 지난 뒤에 백성 앞에 끌어내려고 옥에 가두고, 네 명씩 네 패로 모두 열여섯 군인에게 지키게 합니다(행 12:3-4).","s":4852.584,"e":4863.604,"p":false,"h":false},{"t":"도망갈 수 없는 철저한 감시입니다.","s":4863.888,"e":4866.394,"p":true,"h":false},{"t":"본문은 이 상황에서 짧지만 중요한 문장을 둡니다.","s":4867.236,"e":4870.826,"p":false,"h":false},{"t":"베드로는 옥에 갇혔고 교회는 그를 위하여 간절히 하나님께 기도하더라(행 12:5).","s":4871.412,"e":4878.342,"p":false,"h":false},{"t":"이 문장 하나가 이 장의 축입니다.","s":4878.936,"e":4881.547,"p":false,"h":false},{"t":"교회는 군사력이나 정치적 영향력을 가지고 있지 않았습니다.","s":4882.176,"e":4886.31,"p":false,"h":false},{"t":"가진 것은 기도뿐이었습니다.","s":4886.964,"e":4889.16,"p":true,"h":false},{"t":"천사에게 이끌려 나온 밤","s":4889.736,"e":4891.791,"p":true,"h":false},{"t":"헤롯이 베드로를 끌어내려 하던 바로 전날 밤, 베드로는 두 쇠사슬에 매여 두 군인 사이에서 자고 있었습니다(행 12:6).","s":4892.688,"e":4901.852,"p":false,"h":false},{"t":"이 장면이 마음에 남습니다.","s":4902.444,"e":4904.472,"p":false,"h":false},{"t":"내일 죽을지 모르는 사람이 잠을 자고 있습니다.","s":4905.072,"e":4908.155,"p":false,"h":false},{"t":"천사가 와서 옆구리를 쳐서 깨워야 할 만큼 깊이 자고 있었습니다.","s":4908.78,"e":4913.076,"p":true,"h":false},{"t":"천사가 그를 이끌고 나가자 쇠사슬이 벗어지고 문이 저절로 열립니다.","s":4914,"e":4918.778,"p":false,"h":false},{"t":"베드로는 이것이 환상인 줄 알았다고 합니다(행 12:9).","s":4919.4,"e":4924.303,"p":false,"h":false},{"t":"길거리에 서서야 비로소 정신이 들어 주께서 천사를 보내어 나를 헤롯의 손에서 건지신 줄 알겠다고 말합니다(행 12:11).","s":4924.872,"e":4934.091,"p":true,"h":false},{"t":"기도하던 사람들이 놀라다","s":4934.916,"e":4937.017,"p":true,"h":false},{"t":"그런데 이야기의 가장 인간적인 부분이 이 다음에 나옵니다.","s":4937.58,"e":4941.652,"p":false,"h":false},{"t":"베드로가 마가라 하는 요한의 어머니 마리아의 집으로 가니 많은 사람이 모여 기도하고 있었습니다.","s":4942.296,"e":4948.075,"p":false,"h":false},{"t":"문을 두드리자 로데라는 여종이 나와 베드로의 음성임을 알고 기뻐서 문을 열지 않고 달려 들어가 베드로가 문 밖에 서 있다고 알립니다.","s":4948.632,"e":4957.242,"p":true,"h":false},{"t":"기도하던 사람들의 반응이 이렇습니다.","s":4958.136,"e":4960.841,"p":false,"h":false},{"t":"네가 미쳤다.","s":4961.16,"e":4962.407,"p":false,"h":false},{"t":"여종이 사실이라고 우기자 그들은 그러면 그의 천사라고 합니다(행 12:15).","s":4963.068,"e":4969.602,"p":false,"h":false},{"t":"그 사이에 베드로는 계속 문을 두드리고 있었습니다.","s":4970.196,"e":4973.591,"p":false,"h":false},{"t":"문을 열어 보니 베드로가 서 있어서 그들은 놀랐다고 합니다.","s":4974.228,"e":4978.211,"p":true,"h":false},{"t":"이 장면이 얼마나 정직한지 보십시오.","s":4979.088,"e":4981.659,"p":false,"h":false},{"t":"교회는 베드로를 위해 간절히 기도했습니다.","s":4982.292,"e":4985.449,"p":false,"h":false},{"t":"그런데 정작 기도가 응답되어 베드로가 문 앞에 서 있자 믿지 못했습니다.","s":4986.072,"e":4990.977,"p":false,"h":false},{"t":"응답을 놓고 기도하던 사람들이 응답을 믿지 못한 것입니다.","s":4991.652,"e":4995.682,"p":false,"h":false},{"t":"이 이야기는 교회의 믿음이 훌륭해서 기도가 응답된 것이 아님을 분명히 합니다.","s":4996.26,"e":5001.812,"p":false,"h":false},{"t":"약한 믿음으로 드린 기도에도 하나님이 응답하신 것입니다.","s":5002.416,"e":5006.46,"p":false,"h":false},{"t":"기도의 응답은 기도하는 사람의 믿음의 크기가 아니라 기도를 들으시는 하나님의 뜻에 달려 있습니다.","s":5007.096,"e":5013.438,"p":true,"h":false},{"t":"두 사람의 차이를 어떻게 읽을 것인가","s":5014.296,"e":5017.013,"p":true,"h":false},{"t":"그렇다면 같은 교회가 야고보를 위해서도 기도하지 않았을까요.","s":5017.86,"e":5022.116,"p":false,"h":false},{"t":"본문은 그것을 말하지 않습니다.","s":5022.756,"e":5025.093,"p":false,"h":false},{"t":"야고보를 위한 기도가 있었는지, 있었다면 그 기도가 응답되지 않은 이유가 무엇인지 알 수 없습니다.","s":5025.708,"e":5032.952,"p":false,"h":false},{"t":"우리가 확인할 수 있는 것은 두 가지 결과가 모두 하나님의 손 안에 있었다는 것입니다.","s":5033.592,"e":5039.111,"p":true,"h":false},{"t":"베드로가 구출된 일도 영원한 보호를 의미하지는 않았습니다.","s":5040.036,"e":5044.155,"p":false,"h":false},{"t":"요한복음 21장에서 주님은 베드로에게 그가 늙어서 남에게 띠 띠우고 원하지 않는 곳으로 끌려가리라고 하시며, 그가 어떠한 죽음으로 하나님께 영광을 돌릴 것을 가리키셨다고 합니다(요 21:18-19).","s":5044.788,"e":5059.747,"p":false,"h":false},{"t":"베드로의 구출은 죽음을 면한 것이 아니라 죽음의 때가 아직 아니었다는 뜻이었습니다.","s":5060.376,"e":5066.094,"p":false,"h":false},{"t":"야고보에게는 그 때가 먼저 왔고 베드로에게는 나중에 왔습니다.","s":5066.676,"e":5071.341,"p":true,"h":false},{"t":"이것으로 모든 물음이 풀리지는 않습니다.","s":5072.22,"e":5075.075,"p":false,"h":false},{"t":"왜 그 순서였는지는 여전히 하나님만 아십니다.","s":5075.568,"e":5079.087,"p":false,"h":false},{"t":"신자가 이 앞에서 정직하게 말할 수 있는 것은, 하나님은 기도에 응답하시되 우리가 원하는 방식으로만 응답하지는 않으신다는 것이고, 응답받지 못한 것처럼 보이는 자리에서도 하나님이 부재하지 않으셨다는 것입니다.","s":5079.708,"e":5094.024,"p":false,"h":false},{"t":"시편은 의인에게는 고난이 많으나 여호와께서 그의 모든 고난에서 건지신다고 말하지만(시 34:19), 그 건지심은 때로 죽음을 통과해서 오기도 합니다.","s":5094.648,"e":5105.929,"p":true,"h":false},{"t":"헤롯의 최후","s":5106.852,"e":5108.001,"p":true,"h":false},{"t":"이 장의 후반부에서 헤롯이 등장합니다.","s":5108.76,"e":5111.565,"p":false,"h":false},{"t":"두로와 시돈 사람들이 왕의 은혜를 구하려고 나아왔을 때, 헤롯은 날을 정해 왕복을 입고 단상에 앉아 연설합니다.","s":5112.216,"e":5120.126,"p":false,"h":false},{"t":"사람들이 이것은 신의 소리요 사람의 소리가 아니라고 소리칩니다.","s":5120.784,"e":5124.899,"p":false,"h":false},{"t":"그 순간 주의 사자가 그를 쳤다고 합니다.","s":5125.5,"e":5128.305,"p":false,"h":false},{"t":"그가 영광을 하나님께 돌리지 않았기 때문입니다.","s":5128.92,"e":5132.398,"p":false,"h":false},{"t":"그는 벌레에게 먹혀 죽었다고 기록됩니다(행 12:21-23).","s":5133.024,"e":5139.136,"p":true,"h":false},{"t":"역사가 요세푸스도 헤롯 아그립바 1세가 가이사랴에서 열린 행사에서 신이라는 칭송을 받다가 얼마 후 갑자기 복통으로 죽었다고 기록합니다.","s":5139.864,"e":5149.207,"p":false,"h":false},{"t":"세부는 다르지만 급사했다는 점에서 일치합니다.","s":5149.836,"e":5153.303,"p":false,"h":false},{"t":"칼로 야고보를 죽이고 베드로를 죽이려던 왕이 닷새 만에 쓰러진 것입니다.","s":5153.94,"e":5158.873,"p":true,"h":false},{"t":"이 대목은 앞의 이야기와 대비됩니다.","s":5159.772,"e":5162.579,"p":false,"h":false},{"t":"교회는 눈에 보이는 힘이 하나도 없었고, 헤롯은 군대와 왕권을 가지고 있었습니다.","s":5163.228,"e":5169.113,"p":false,"h":false},{"t":"그러나 최후에 쓰러진 것은 왕이었습니다.","s":5169.744,"e":5172.56,"p":false,"h":false},{"t":"하나님이 왕을 세우고 폐하신다는 사실이 이렇게 드러납니다.","s":5173.092,"e":5177.062,"p":false,"h":false},{"t":"이것이 야고보의 죽음에 대한 설명은 아닙니다.","s":5177.736,"e":5180.814,"p":false,"h":false},{"t":"다만 야고보를 죽인 칼이 마지막 말을 하지 못했다는 것을 보여 줍니다.","s":5181.372,"e":5185.971,"p":true,"h":false},{"t":"왕은 죽고 말씀은 흥왕한다","s":5186.844,"e":5189.03,"p":true,"h":false},{"t":"그리고 이 장은 한 문장으로 닫힙니다.","s":5189.904,"e":5192.746,"p":false,"h":false},{"t":"하나님의 말씀은 흥왕하여 더하더라(행 12:24).","s":5193.324,"e":5198.179,"p":false,"h":false},{"t":"야고보가 죽고, 베드로가 갇히고, 헤롯이 죽은 이 모든 과정을 지나서 남은 것은 하나님의 말씀이 자라났다는 사실입니다.","s":5198.724,"e":5207.308,"p":true,"h":false},{"t":"누가는 이 문장으로 이 장의 의미를 요약합니다.","s":5208.228,"e":5211.859,"p":false,"h":false},{"t":"교회가 이긴 것도 아니고 박해자가 이긴 것도 아닙니다.","s":5212.476,"e":5216.483,"p":false,"h":false},{"t":"말씀이 이겼습니다.","s":5217.12,"e":5218.739,"p":false,"h":false},{"t":"누가 살고 누가 죽느냐에 따라 복음의 운명이 갈리지 않습니다.","s":5219.316,"e":5223.706,"p":false,"h":false},{"t":"사도 한 사람이 쓰러져도, 왕이 군대를 보내어도, 말씀은 계속 퍼집니다.","s":5224.32,"e":5229.896,"p":true,"h":false},{"t":"우리가 이 장에서 얻는 위로는 이것입니다.","s":5230.764,"e":5233.566,"p":false,"h":false},{"t":"우리가 드린 기도가 응답된 것처럼 보이지 않는 자리에도 하나님이 계시고, 응답된 것처럼 보이는 자리에서도 영광은 우리의 믿음이 아니라 하나님께 돌아갑니다.","s":5234.148,"e":5244.303,"p":false,"h":false},{"t":"그리고 우리의 삶과 죽음이 어느 쪽이든 하나님의 말씀은 계속 흥왕합니다.","s":5244.948,"e":5249.892,"p":true,"h":false}]},{"title":"10. 영생으로 작정된 사람들은 다 믿었다는데 왜 그렇게 열심히 설득하는가: 선택과 전도","audio":"book_2610272355_1.mp3","start":5250.78,"end":5840.352,"dur":589.6,"segs":[{"t":"10.","s":5250.78,"e":5251.308,"p":false,"h":false},{"t":"영생으로 작정된 사람들은 다 믿었다는데 왜 그렇게 열심히 설득하는가: 선택과 전도","s":5252.688,"e":5259.232,"p":true,"h":false},{"t":"본문: 사도행전 13장 44-52절, 18장 1-11절 (함께 읽을 본문: 요 6:37, 요 10:16, 롬 10:14-17, 엡 1:3-6, 딤후 2:10, 행 16:13-15)","s":5259.996,"e":5283.033,"p":true,"h":false},{"t":"사도행전 13장 48절은 신학 논쟁에서 자주 인용되는 구절입니다.","s":5283.72,"e":5288.792,"p":false,"h":false},{"t":"이방인들이 듣고 기뻐하여 하나님의 말씀을 영화롭게 하며 영생을 주시기로 작정된 사람은 다 믿었다는 말씀입니다.","s":5289.408,"e":5297.313,"p":true,"h":false},{"t":"이 구절은 두 가지 오해를 낳아 왔습니다.","s":5298.228,"e":5301.108,"p":false,"h":false},{"t":"하나는 하나님이 이미 정하셨다면 전도할 필요가 없다는 생각입니다.","s":5301.756,"e":5306.374,"p":false,"h":false},{"t":"다른 하나는 그런 말은 위험하니 신자에게 가르치지 말아야 한다는 생각입니다.","s":5306.688,"e":5311.589,"p":false,"h":false},{"t":"그런데 사도행전의 바울은 이 구절이 나오는 도시에서도, 다른 도시에서도 밤낮 없이 설득하고 권면합니다.","s":5312.232,"e":5319.603,"p":true,"h":false},{"t":"이 글에서는 이 구절이 무엇을 말하는지, 그리고 선택하심과 전도가 어떻게 한 가지 사역 안에서 함께 가는지를 살펴봅니다.","s":5320.476,"e":5329.288,"p":true,"h":false},{"t":"비시디아 안디옥의 두 안식일","s":5330.16,"e":5332.389,"p":true,"h":false},{"t":"바울과 바나바는 첫 선교 여행 중 비시디아 안디옥에 이르러 첫 안식일에 회당에서 설교합니다(행 13:14-41).","s":5333.22,"e":5342.841,"p":false,"h":false},{"t":"사람들이 다음 안식일에도 이 말씀을 해 달라고 청하고, 많은 유대인과 경건한 개종자들이 바울을 따랐습니다.","s":5343.156,"e":5350.798,"p":false,"h":false},{"t":"그리고 다음 안식일에는 온 시민이 거의 다 하나님의 말씀을 들으러 모였다고 합니다(행 13:44).","s":5351.436,"e":5359.318,"p":true,"h":false},{"t":"그러자 유대인들이 시기하여 바울의 말을 반박하고 비방합니다(행 13:45).","s":5360.112,"e":5366.782,"p":false,"h":false},{"t":"바울과 바나바는 담대히 말합니다.","s":5367.312,"e":5369.793,"p":false,"h":false},{"t":"하나님의 말씀을 먼저 너희에게 전할 것이었으나 너희가 그것을 버리고 영생을 얻기에 합당하지 않은 자로 자처하므로 우리가 이방인에게로 향한다는 것입니다(행 13:46).","s":5370.444,"e":5383.002,"p":false,"h":false},{"t":"그리고 이사야 49장 6절을 인용하며 이것이 주께서 명하신 일이라고 말합니다(행 13:47).","s":5383.548,"e":5391.653,"p":true,"h":false},{"t":"이어서 이 구절이 나옵니다.","s":5392.548,"e":5394.615,"p":false,"h":false},{"t":"이방인들이 듣고 기뻐하여 하나님의 말씀을 영화롭게 하며 영생을 주시기로 작정된 사람은 다 믿으니라(행 13:48).","s":5395.248,"e":5404.614,"p":false,"h":false},{"t":"같은 설교를 같은 회당에서 들었는데 어떤 사람은 시기하며 반박하고 어떤 사람은 기뻐하며 믿었습니다.","s":5405.112,"e":5412.18,"p":false,"h":false},{"t":"누가는 그 차이를 사람들의 성향이나 지혜로 설명하지 않고 하나님의 작정으로 설명합니다.","s":5412.852,"e":5418.895,"p":true,"h":false},{"t":"작정된 자라는 말","s":5419.728,"e":5421.321,"p":true,"h":false},{"t":"여기서 쓰인 말의 번역을 두고 해석이 갈립니다.","s":5422.212,"e":5425.202,"p":false,"h":false},{"t":"개역개정은 영생을 주시기로 작정된 사람이라고 옮겼습니다.","s":5425.776,"e":5429.783,"p":false,"h":false},{"t":"원어는 정해지다, 배치되다는 뜻을 가진 말이 수동태로 쓰인 형태입니다.","s":5430.384,"e":5435.496,"p":false,"h":false},{"t":"대부분의 개혁파 해석자와 많은 주석가는 이것을 하나님이 영생을 위해 정해 두셨다는 뜻으로 읽습니다.","s":5436.108,"e":5442.867,"p":true,"h":false},{"t":"다른 해석도 있습니다.","s":5443.776,"e":5445.408,"p":false,"h":false},{"t":"이 말을 스스로 마음을 정한 사람들로 보고, 영생을 구하려는 태도를 정한 사람이라는 뜻으로 읽는 입장입니다.","s":5445.936,"e":5453.371,"p":false,"h":false},{"t":"이 해석에서는 믿음이 사람의 선택으로 먼저 일어난 것이 됩니다.","s":5453.964,"e":5458.281,"p":true,"h":false},{"t":"문법만으로 이 논쟁을 끝내기는 어렵습니다.","s":5459.076,"e":5462.432,"p":false,"h":false},{"t":"그러나 문맥은 첫 번째 읽기를 지지합니다.","s":5463.036,"e":5466.018,"p":false,"h":false},{"t":"누가가 앞에서 시기하는 유대인들과 기뻐하는 이방인들을 나란히 놓고 그 차이를 설명하는 자리이기 때문입니다.","s":5466.312,"e":5473.633,"p":false,"h":false},{"t":"만일 사람의 마음가짐이 차이를 만들었다면 그 마음가짐을 누가 주었는지를 다시 물어야 합니다.","s":5474.232,"e":5480.592,"p":false,"h":false},{"t":"그래서 바울은 다른 곳에서 이렇게 말합니다.","s":5481.216,"e":5484.363,"p":false,"h":false},{"t":"하나님이 창세 전에 그리스도 안에서 우리를 택하사 사랑 안에서 우리를 예정하셨다고 합니다(엡 1:4-5).","s":5484.96,"e":5493.215,"p":false,"h":false},{"t":"그리고 주님은 아버지께서 내게 주시는 자는 다 내게로 올 것이라고 하셨습니다(요 6:37).","s":5493.816,"e":5501.38,"p":true,"h":false},{"t":"그러므로 이 글은 이 구절을 하나님이 영생으로 정해 두신 사람들이 복음을 듣고 믿는다는 뜻으로 읽습니다.","s":5502.096,"e":5509.479,"p":false,"h":false},{"t":"그러나 다른 해석이 가능하다는 점도 숨기지 않습니다.","s":5510.124,"e":5513.749,"p":true,"h":false},{"t":"그런데도 왜 설득하는가","s":5514.624,"e":5516.495,"p":true,"h":false},{"t":"이 구절을 오해하는 사람은 이렇게 묻습니다.","s":5517.36,"e":5520.315,"p":false,"h":false},{"t":"하나님이 이미 작정하셨다면 사람이 말할 필요가 있습니까.","s":5520.96,"e":5524.85,"p":false,"h":false},{"t":"그러나 사도행전에서 이 구절을 쓴 누가가 바로 바울의 쉼 없는 전도를 가장 열심히 기록한 사람입니다.","s":5525.424,"e":5532.468,"p":true,"h":false},{"t":"18장에서 바울은 고린도에서 안식일마다 회당에서 강론하며 유대인과 헬라인을 설득했다고 합니다(행 18:4).","s":5533.38,"e":5542.37,"p":false,"h":false},{"t":"유대인들이 대적하고 비방하자 바울은 옷을 털며 말합니다.","s":5542.92,"e":5547.08,"p":false,"h":false},{"t":"너희 피가 너희 머리로 돌아갈 것이요 나는 깨끗하니 이후로는 이방인에게로 가리라(행 18:6).","s":5547.744,"e":5554.994,"p":false,"h":false},{"t":"이 말은 책임이 청중에게 있다는 선언입니다.","s":5555.592,"e":5558.561,"p":false,"h":false},{"t":"거절한 사람의 거절은 그 사람 자신의 책임입니다.","s":5559.192,"e":5562.695,"p":true,"h":false},{"t":"이어서 주님이 밤에 환상 중에 바울에게 말씀하십니다.","s":5563.548,"e":5567.157,"p":false,"h":false},{"t":"두려워하지 말며 침묵하지 말고 말하라.","s":5567.796,"e":5570.523,"p":false,"h":false},{"t":"내가 너와 함께 있으므로 너를 해할 사람이 없을 것이니 이 성 중에 내 백성이 많음이라(행 18:9-10).","s":5571.216,"e":5579.542,"p":true,"h":false},{"t":"이 말씀이 핵심입니다.","s":5580.36,"e":5582.115,"p":false,"h":false},{"t":"고린도의 그 많은 이방인은 아직 믿지 않았습니다.","s":5582.772,"e":5586.161,"p":false,"h":false},{"t":"그런데 주님은 그들을 내 백성이라고 부르십니다.","s":5586.768,"e":5590.21,"p":false,"h":false},{"t":"주님이 이미 택하신 사람들이 그 성에 많이 있었던 것입니다.","s":5590.764,"e":5594.761,"p":false,"h":false},{"t":"그리고 바울에게 말하는 이유가 바로 그것이라고 하십니다.","s":5595.372,"e":5599.214,"p":false,"h":false},{"t":"선택하신 사람이 많기 때문에 침묵하지 말고 전하라는 것입니다.","s":5599.836,"e":5604.043,"p":true,"h":false},{"t":"선택이 전도를 막지 않고 전도를 지탱한다","s":5604.876,"e":5608.231,"p":true,"h":false},{"t":"바울은 자기 사역을 이렇게 설명합니다.","s":5608.764,"e":5611.518,"p":false,"h":false},{"t":"내가 택하신 자를 위하여 모든 것을 참음은 그들도 그리스도 예수 안에 있는 구원을 영원한 영광과 함께 받게 하려 함이라(딤후 2:10).","s":5612.184,"e":5621.648,"p":false,"h":false},{"t":"택하신 자가 있기 때문에 참고, 택하신 자가 있기 때문에 전합니다.","s":5622.3,"e":5627.143,"p":false,"h":false},{"t":"선택은 전도를 멈추게 하는 이유가 아니라 전도가 헛되지 않으리라는 확신의 근거입니다.","s":5627.772,"e":5633.394,"p":true,"h":false},{"t":"만일 구원이 전적으로 사람의 결단에 달려 있다면 전도자는 설득이 실패할 때마다 절망해야 합니다.","s":5634.288,"e":5640.772,"p":false,"h":false},{"t":"그러나 하나님이 이미 사람들을 택하셨고 말씀 안에서 그들을 부르신다면, 전도자는 거절을 당해도 낙담하지 않고 담대히 전할 수 있습니다.","s":5641.416,"e":5650.821,"p":false,"h":false},{"t":"주님의 양은 내 음성을 듣는다고 하셨고, 이 우리에 들지 않은 다른 양들이 내게 있어 그들도 내 음성을 듣고 한 무리가 되리라고 하셨습니다(요 10:16).","s":5651.46,"e":5663.439,"p":true,"h":false},{"t":"또한 하나님은 말씀을 통해서 사람들을 믿음으로 이끄십니다.","s":5664.168,"e":5668.199,"p":false,"h":false},{"t":"믿음은 들음에서 나고 들음은 그리스도의 말씀으로 말미암습니다(롬 10:17).","s":5668.812,"e":5674.96,"p":false,"h":false},{"t":"작정은 말씀 선포를 대신하지 않습니다.","s":5675.436,"e":5678.316,"p":false,"h":false},{"t":"작정을 이루시는 하나님의 방법이 말씀 선포입니다.","s":5678.856,"e":5682.496,"p":false,"h":false},{"t":"빌립보의 루디아에 대하여 누가는 주께서 그 마음을 열어 바울의 말을 따르게 하셨다고 기록합니다(행 16:14).","s":5683.14,"e":5691.507,"p":false,"h":false},{"t":"마음을 여시는 분은 주님이시고, 주님이 쓰신 수단은 바울의 말이었습니다.","s":5692.068,"e":5697.011,"p":true,"h":false},{"t":"그래서 선택과 전도는 서로 다투지 않습니다.","s":5697.9,"e":5701.028,"p":false,"h":false},{"t":"하나님은 목적과 수단을 함께 정하십니다.","s":5701.608,"e":5704.55,"p":false,"h":false},{"t":"영생으로 작정하셨고, 그 영생에 이르게 할 복음 선포자를 보내십니다.","s":5705.064,"e":5710.201,"p":true,"h":false},{"t":"선택의 가르침이 위로가 되는 이유","s":5711.076,"e":5713.454,"p":true,"h":false},{"t":"본문에서 한 가지 더 눈여겨볼 점이 있습니다.","s":5714.352,"e":5717.486,"p":false,"h":false},{"t":"이방인들이 이 말을 듣고 기뻐했다는 것입니다.","s":5718.096,"e":5721.496,"p":false,"h":false},{"t":"선택의 교리는 오늘 교회에서 종종 논쟁의 무기로 쓰이지만, 성경에서는 믿는 이들에게 기쁨이었습니다.","s":5722.128,"e":5729.263,"p":true,"h":false},{"t":"내가 믿게 된 것이 내 지혜나 결단 때문이 아니라 하나님이 먼저 나를 택하셨기 때문이라면, 나의 구원은 나의 흔들리는 믿음에 달려 있지 않습니다.","s":5730.156,"e":5739.553,"p":false,"h":false},{"t":"하나님이 시작하신 일은 하나님이 이루십니다.","s":5740.2,"e":5743.172,"p":false,"h":false},{"t":"안디옥의 이방인들은 말씀을 듣고 기뻐하며 하나님의 말씀을 영화롭게 했습니다.","s":5743.728,"e":5748.999,"p":false,"h":false},{"t":"누가는 그들의 믿음의 뿌리가 하나님의 작정이었다고 설명하는데, 그 설명은 믿음을 자랑거리가 아니라 감사의 이유로 만듭니다.","s":5749.668,"e":5757.914,"p":true,"h":false},{"t":"그리고 박해가 일어나 바울과 바나바가 그 지역에서 쫓겨났을 때에도, 본문은 제자들이 기쁨과 성령이 충만했다고 기록합니다(행 13:52).","s":5758.704,"e":5769.683,"p":false,"h":false},{"t":"선택하시는 하나님을 아는 사람들은 환경에 따라 흔들리지 않습니다.","s":5769.972,"e":5774.594,"p":true,"h":false},{"t":"한국 교회의 두 가지 실수","s":5775.444,"e":5777.422,"p":true,"h":false},{"t":"한국 교회에는 이 문제를 두고 두 가지 실수가 있어 왔습니다.","s":5778.036,"e":5782.357,"p":true,"h":false},{"t":"하나는 선택을 전도하지 않는 이유로 삼는 것입니다.","s":5783.256,"e":5786.613,"p":false,"h":false},{"t":"하나님이 알아서 하실 일이라며 복음을 전하는 수고를 거두는 태도입니다.","s":5787.144,"e":5791.819,"p":false,"h":false},{"t":"그러나 바울은 선택하신 백성이 많다는 이유로 침묵하지 말고 말하라는 주님의 말씀을 들었습니다.","s":5792.436,"e":5798.639,"p":true,"h":false},{"t":"다른 하나는 선택의 가르침을 성도에게 숨기고, 구원을 사람의 결심이 만드는 것처럼 설교하는 것입니다.","s":5799.564,"e":5806.399,"p":false,"h":false},{"t":"그러면 신자는 자기 믿음이 약해질 때마다 구원이 흔들린다고 느끼게 됩니다.","s":5807.052,"e":5811.94,"p":false,"h":false},{"t":"성경이 위로로 준 가르침을 가리면 신자는 위로를 잃습니다.","s":5812.56,"e":5816.853,"p":true,"h":false},{"t":"본문이 우리에게 주는 것은 이 두 가지를 함께 붙드는 길입니다.","s":5817.744,"e":5822.111,"p":false,"h":false},{"t":"하나님이 영생으로 정하신 사람은 반드시 믿는다는 사실, 그리고 그 믿음에 이르게 하시려고 우리를 복음의 전달자로 부르셨다는 사실입니다.","s":5822.784,"e":5832.401,"p":false,"h":false},{"t":"전도는 하나님의 선택을 이루는 하나님의 도구이고, 도구로 쓰임받는 것은 위로이며 영광입니다.","s":5833.044,"e":5839.459,"p":true,"h":false}]},{"title":"11. 바울은 왜 세 번이나 \"이제 이방인에게로 가겠다\"고 선언하는가: 이스라엘의 불신과 복음","audio":"book_2610272355_2.mp3","start":0,"end":540.432,"dur":540.4,"segs":[{"t":"11.","s":0,"e":0.694,"p":false,"h":false},{"t":"바울은 왜 세 번이나 \"이제 이방인에게로 가겠다\"고 선언하는가: 이스라엘의 불신과 복음","s":1.908,"e":8.207,"p":true,"h":false},{"t":"본문: 사도행전 13장 44-47절, 18장 4-6절, 28장 17-31절 (함께 읽을 본문: 사 6:9-10, 사 49:6, 롬 1:16, 롬 9:1-5, 롬 11:1-2, 롬 11:25-27)","s":9.036,"e":34.678,"p":true,"h":false},{"t":"사도행전을 끝까지 읽은 독자는 같은 장면이 세 번 되풀이되는 것을 발견합니다.","s":35.352,"e":40.443,"p":false,"h":false},{"t":"바울이 유대인들에게 복음을 전하고, 유대인들이 거절하고, 바울이 이제 이방인에게로 향한다고 선언합니다.","s":41.004,"e":48.499,"p":true,"h":false},{"t":"비시디아 안디옥에서(행 13:46), 고린도에서(행 18:6), 그리고 책의 마지막 장면인 로마에서(행 28:28) 같은 선언이 나옵니다.","s":49.392,"e":64.261,"p":false,"h":false},{"t":"세 번이나 같은 말을 한다면 바울은 유대인을 포기한 것입니까.","s":64.908,"e":69.122,"p":false,"h":false},{"t":"사도행전은 반유대적인 책입니까.","s":69.768,"e":72.161,"p":false,"h":false},{"t":"이 글에서는 이 물음에 정직하게 답해 봅니다.","s":72.792,"e":76.012,"p":true,"h":false},{"t":"세 번의 선언","s":76.896,"e":78.013,"p":true,"h":false},{"t":"첫 번째는 비시디아 안디옥입니다.","s":78.804,"e":81.41,"p":false,"h":false},{"t":"유대인들이 시기하여 바울의 말을 반박하자 바울은 하나님의 말씀을 먼저 너희에게 전할 것이었으나 너희가 버렸으니 우리가 이방인에게로 향한다고 말합니다(행 13:46).","s":81.972,"e":94.606,"p":false,"h":false},{"t":"그러면서 이사야 49장 6절을 인용합니다.","s":95.22,"e":98.61,"p":false,"h":false},{"t":"하나님이 이방의 빛으로 삼아 구원이 땅끝까지 이르게 하시겠다는 약속입니다.","s":99.252,"e":104.386,"p":true,"h":false},{"t":"두 번째는 고린도입니다.","s":105.228,"e":107.245,"p":false,"h":false},{"t":"유대인들이 대적하고 비방하자 바울은 옷을 털며 말합니다.","s":107.892,"e":112.052,"p":false,"h":false},{"t":"너희 피가 너희 머리로 돌아갈 것이요 나는 깨끗하니 이후로는 이방인에게로 가리라(행 18:6).","s":112.716,"e":119.966,"p":true,"h":false},{"t":"마지막은 로마입니다.","s":120.816,"e":122.554,"p":false,"h":false},{"t":"바울은 로마에 도착한 뒤 유대인의 지도자들을 먼저 청하여 복음을 설명합니다.","s":123.192,"e":128.398,"p":false,"h":false},{"t":"어떤 사람은 믿고 어떤 사람은 믿지 않았습니다.","s":129.024,"e":132.666,"p":false,"h":false},{"t":"서로 의견이 맞지 않아 흩어질 때 바울이 한 마디를 덧붙입니다.","s":133.236,"e":137.559,"p":false,"h":false},{"t":"성령이 선지자 이사야를 통하여 너희 조상들에게 말씀하신 것이 옳도다 하고 이사야 6장을 인용합니다.","s":138.204,"e":145.398,"p":false,"h":false},{"t":"듣기는 들어도 깨닫지 못하고 보기는 보아도 알지 못한다는 말씀입니다(행 28:25-27).","s":146.016,"e":154.372,"p":false,"h":false},{"t":"그리고 결론을 내립니다.","s":154.62,"e":156.421,"p":false,"h":false},{"t":"그러므로 하나님의 이 구원이 이방인에게 보내진 줄 알라 그들은 이것을 들으리라(행 28:28).","s":157.032,"e":164.808,"p":true,"h":false},{"t":"이 마지막 인용에 주목하십시오.","s":165.528,"e":167.831,"p":false,"h":false},{"t":"이사야서 깊이 읽기의 첫 번째 글에서 우리가 본 바로 그 본문입니다.","s":168.372,"e":173.137,"p":false,"h":false},{"t":"이사야 6장은 이스라엘이 하나님의 말씀을 듣고도 깨닫지 못하는 현상이 이스라엘 역사에서 처음 생긴 일이 아니라 이사야 때부터 있어 온 일임을 보여 줍니다.","s":173.772,"e":183.662,"p":false,"h":false},{"t":"바울은 로마의 유대인들이 복음을 거절하는 것도 이 오래된 패턴의 연장으로 이해합니다.","s":184.176,"e":190.098,"p":false,"h":false},{"t":"예수께서 가르치실 때도 같은 말씀이 인용되었고, 이제 그것이 책의 마지막 장면에서 되풀이됩니다.","s":190.728,"e":197.782,"p":true,"h":false},{"t":"이스라엘을 포기한 것이 아니다","s":198.684,"e":200.75,"p":true,"h":false},{"t":"그렇다면 이 선언은 바울이 유대인 선교를 그만두겠다는 뜻이었습니까.","s":201.636,"e":206.48,"p":false,"h":false},{"t":"본문을 따라가 보면 그렇지 않습니다.","s":207.108,"e":209.685,"p":true,"h":false},{"t":"비시디아 안디옥에서 이방인에게 가겠다고 선언한 바울은 다음 도시 이고니온에서 어떻게 합니까.","s":210.528,"e":216.461,"p":false,"h":false},{"t":"유대인의 회당에 들어가서 말했다고 합니다(행 14:1).","s":217.116,"e":221.957,"p":false,"h":false},{"t":"데살로니가에서도 자기 규례대로 회당에 들어갔습니다(행 17:1-2).","s":222.588,"e":228.692,"p":false,"h":false},{"t":"고린도에서 이방인에게 가겠다고 선언한 뒤에도 에베소에 이르러 회당에 들어가 석 달 동안 담대히 말했습니다(행 19:8).","s":229.212,"e":238.151,"p":false,"h":false},{"t":"그리고 로마에 도착해서는 가장 먼저 유대인 지도자들을 청했습니다.","s":238.752,"e":243.334,"p":true,"h":false},{"t":"그러므로 이 선언은 영구적인 전환이 아니라 해당 도시, 그 장면에서의 선언이었습니다.","s":244.188,"e":250.353,"p":false,"h":false},{"t":"바울은 회당이 거절하는 곳에서 복음의 방향을 이방인에게 돌렸고, 다음 도시에서는 다시 회당으로 향했습니다.","s":250.992,"e":258.26,"p":false,"h":false},{"t":"이 반복은 바울이 유대인을 포기하지 않았다는 증거입니다.","s":258.84,"e":262.78,"p":true,"h":false},{"t":"바울 자신이 로마서에서 이 문제를 직접 다룹니다.","s":263.664,"e":267.161,"p":false,"h":false},{"t":"그는 복음이 모든 믿는 자에게 구원을 주시는 하나님의 능력이며 먼저는 유대인에게요 또한 헬라인에게라고 합니다(롬 1:16).","s":267.768,"e":277.271,"p":false,"h":false},{"t":"그리고 로마서 9장에서는 이렇게 고백합니다.","s":277.776,"e":280.891,"p":false,"h":false},{"t":"내게 큰 근심이 있고 마음에 고통이 그치지 않는다.","s":281.412,"e":285.403,"p":false,"h":false},{"t":"나의 형제 곧 골육의 친척을 위하여 내 자신이 저주를 받아 그리스도에게서 끊어질지라도 원하는 바로라(롬 9:2-3).","s":285.912,"e":294.939,"p":false,"h":false},{"t":"이스라엘의 불신을 앞에 둔 바울은 냉정한 심판자가 아니라 눈물 흘리는 형제였습니다.","s":295.488,"e":301.248,"p":true,"h":false},{"t":"로마서 11장은 더 분명합니다.","s":302.112,"e":304.756,"p":false,"h":false},{"t":"하나님이 그의 백성을 버리셨느냐 결코 그렇지 아니하니라고 하면서 자기 자신이 이스라엘 사람임을 증거로 듭니다(롬 11:1).","s":305.352,"e":314.705,"p":false,"h":false},{"t":"그러므로 사도행전의 세 번의 선언은 이스라엘 전체에 대한 하나님의 최종 판결이 아니라, 복음의 문이 이방인에게 열리는 구속사의 전환점을 보여 주는 장면입니다.","s":315.216,"e":325.62,"p":true,"h":false},{"t":"왜 하나님은 이스라엘의 불신을 허락하시는가","s":326.52,"e":329.826,"p":true,"h":false},{"t":"바울은 로마서에서 이 난제에 답합니다.","s":330.696,"e":333.524,"p":false,"h":false},{"t":"이스라엘의 넘어짐이 이방인에게 구원이 이르게 하는 일이 되었다는 것입니다(롬 11:11).","s":334.116,"e":340.836,"p":false,"h":false},{"t":"그리고 이스라엘의 일부가 완악하게 된 것은 이방인의 충만한 수가 들어오기까지라고 합니다(롬 11:25).","s":341.28,"e":349.554,"p":true,"h":false},{"t":"그러니 이스라엘의 불신조차 하나님의 계획 밖에 있지 않았습니다.","s":350.424,"e":354.642,"p":false,"h":false},{"t":"앞에서 십자가가 사람의 죄이면서 하나님의 계획이었던 것과 같은 구조입니다.","s":355.212,"e":360.447,"p":false,"h":false},{"t":"이사야 6장이 이미 말씀한 대로, 듣고도 깨닫지 못하는 현상을 하나님은 구원 역사의 일부로 쓰십니다.","s":361.08,"e":368.426,"p":true,"h":false},{"t":"그렇다면 이스라엘의 장래는 어떻게 됩니까.","s":369.324,"e":372.447,"p":false,"h":false},{"t":"바울은 이 신비를 알려 주겠다고 하면서 온 이스라엘이 구원을 받으리라고 말합니다(롬 11:26).","s":372.996,"e":380.877,"p":false,"h":false},{"t":"이 구절을 어떻게 읽을지에 대해서는 교회 안에서 해석이 갈립니다.","s":381.492,"e":385.864,"p":false,"h":false},{"t":"어떤 이들은 이스라엘 민족이 장차 대규모로 회심할 것이라는 뜻으로 읽습니다.","s":386.46,"e":391.394,"p":false,"h":false},{"t":"다른 이들은 온 이스라엘을 이방인과 유대인으로 이루어진 하나님의 백성 전체로 읽습니다.","s":392.04,"e":397.75,"p":false,"h":false},{"t":"이 글은 이 논쟁을 이 자리에서 결정하지는 않습니다.","s":398.376,"e":402.172,"p":false,"h":false},{"t":"다만 이스라엘의 장래에 대해 하나님의 약속이 취소되지 않았다는 바울의 확신은 분명하다는 점을 말해 둡니다.","s":402.804,"e":409.628,"p":true,"h":false},{"t":"반유대주의로 오용해서는 안 되는 이유","s":410.508,"e":413.227,"p":true,"h":false},{"t":"이 본문은 교회사에서 반유대주의를 정당화하는 데 쓰인 불행한 역사가 있습니다.","s":414.108,"e":419.326,"p":false,"h":false},{"t":"하나님이 유대인을 버리셨고 교회가 그 자리를 대신했다고 가르치는 방식입니다.","s":419.94,"e":425.546,"p":false,"h":false},{"t":"그러나 이 읽기는 본문에 맞지 않습니다.","s":426.204,"e":429.082,"p":true,"h":false},{"t":"바울은 유대인이었고 이사야도 유대인이었으며 예수님도 유대인이셨습니다.","s":429.984,"e":435.285,"p":false,"h":false},{"t":"복음은 유대인에게서 나와 이방인에게 간 것이지 유대인을 떠나 이방인에게로 간 것이 아닙니다.","s":435.924,"e":441.955,"p":false,"h":false},{"t":"로마서 11장에서 바울은 접붙여진 이방인 신자들이 원가지를 향해 교만해서는 안 된다고 경고합니다.","s":442.584,"e":449.485,"p":false,"h":false},{"t":"뿌리가 너를 지탱하고 있고 네가 뿌리를 지탱하는 것이 아니라고 합니다(롬 11:18).","s":450.108,"e":456.86,"p":false,"h":false},{"t":"이방인 신자는 교만이 아니라 겸손으로 이 본문을 읽어야 합니다.","s":457.344,"e":461.95,"p":true,"h":false},{"t":"바울이 선언했을 때 그것은 복수의 선언이 아니라 슬픔의 선언이었습니다.","s":462.816,"e":468.064,"p":false,"h":false},{"t":"책임이 청중에게 있다는 말은 분명했으나, 그 말을 한 사람은 그들을 위해 저주받는 것도 불사하겠다고 한 사람입니다.","s":468.72,"e":476.542,"p":true,"h":false},{"t":"거침없이","s":477.432,"e":478.51,"p":true,"h":false},{"t":"사도행전의 마지막 두 절은 이 선언 직후에 온 문장으로서 다시 읽을 가치가 있습니다.","s":479.376,"e":485.336,"p":false,"h":false},{"t":"바울은 만 이태 동안 자기 셋집에 머물면서 자기에게 오는 사람을 다 영접하고 하나님 나라를 전파하며 주 예수 그리스도의 일을 가르치되 담대히 거침없이 하더라(행 28:30-31).","s":486,"e":500.321,"p":true,"h":false},{"t":"자기에게 오는 사람을 다 영접했다고 합니다.","s":501.048,"e":504.1,"p":false,"h":false},{"t":"이 사람 가운데는 유대인도 있었을 것이고 이방인도 있었을 것입니다.","s":504.72,"e":509.75,"p":false,"h":false},{"t":"이방인에게로 간다는 선언이 있은 후에도 바울의 집 문은 닫히지 않았습니다.","s":510.408,"e":515.287,"p":true,"h":false},{"t":"이 마지막 장면이 말해 주는 것은 이것입니다.","s":516.168,"e":519.225,"p":false,"h":false},{"t":"인간의 거절은 하나님의 구원 계획을 멈추지 못합니다.","s":519.84,"e":523.559,"p":false,"h":false},{"t":"이스라엘의 거절이 복음이 이방인에게 가는 길을 열었듯, 누군가의 거절은 하나님 나라에서 끝이 아닙니다.","s":524.088,"e":531.219,"p":false,"h":false},{"t":"그리고 복음은 쇠사슬에 매인 사도의 입을 통해서도 거침없이 선포됩니다.","s":531.792,"e":536.714,"p":false,"h":false},{"t":"막히지 않는 것은 복음입니다.","s":537.3,"e":539.592,"p":true,"h":false}]},{"title":"12. 율법에서 자유롭다면서 예루살렘 회의는 왜 \"피를 멀리하라\"고 하고 바울은 디모데에게 할례를 받게 하는가","audio":"book_2610272355_2.mp3","start":540.432,"end":1182.6,"dur":642.2,"segs":[{"t":"12.","s":540.432,"e":541.086,"p":false,"h":false},{"t":"율법에서 자유롭다면서 예루살렘 회의는 왜 \"피를 멀리하라\"고 하고 바울은 디모데에게 할례를 받게 하는가","s":542.34,"e":549.606,"p":true,"h":false},{"t":"본문: 사도행전 15장 1-35절, 16장 1-5절, 21장 17-26절 (함께 읽을 본문: 갈 2:1-5, 갈 5:1-6, 고전 8:1-13, 고전 9:19-23, 고전 10:23-33, 엡 2:8-9, 골 2:16-17)","s":550.512,"e":581.845,"p":true,"h":false},{"t":"사도행전 15장은 교회 역사에서 가장 중요한 회의 가운데 하나입니다.","s":582.624,"e":587.383,"p":false,"h":false},{"t":"이방인이 그리스도인이 되려면 먼저 유대인이 되어야 하는가를 두고 교회가 결정한 자리였습니다.","s":588.024,"e":594.454,"p":true,"h":false},{"t":"그런데 이 장을 읽고 나면 오히려 의문이 늘어납니다.","s":595.332,"e":599.123,"p":false,"h":false},{"t":"율법의 멍에를 이방인에게 지우지 말자고 결정해 놓고는, 곧이어 우상의 제물과 음행과 목매어 죽인 것과 피를 멀리하라고 권합니다.","s":599.76,"e":608.557,"p":false,"h":false},{"t":"같은 사도행전에서 바울은 디모데에게 할례를 받게 하는데, 갈라디아서에서는 디도에게 할례를 받게 하지 않았다고 합니다.","s":609.156,"e":617.127,"p":false,"h":false},{"t":"그리고 훗날 예루살렘에서는 율법을 따르는 의식에 몸소 참여합니다.","s":617.76,"e":622.563,"p":true,"h":false},{"t":"바울이 일관성이 없었습니까.","s":623.448,"e":625.547,"p":false,"h":false},{"t":"이 글에서는 이 겉보기의 모순을 하나씩 풀어 봅니다.","s":626.184,"e":629.677,"p":false,"h":false},{"t":"풀고 나면 하나의 원칙이 보입니다.","s":630.288,"e":632.752,"p":true,"h":false},{"t":"무엇을 놓고 논쟁했는가","s":633.636,"e":635.549,"p":true,"h":false},{"t":"사건은 안디옥에서 시작됩니다.","s":636.408,"e":638.785,"p":false,"h":false},{"t":"유대에서 내려온 어떤 사람들이 형제들을 가르치며 너희가 모세의 관습대로 할례를 받지 아니하면 구원을 받을 수 없다고 했습니다(행 15:1).","s":639.324,"e":649.919,"p":false,"h":false},{"t":"바울과 바나바가 이들과 큰 다툼을 벌이고, 이 문제를 예루살렘 사도들과 장로들에게 가져갑니다.","s":650.52,"e":657.237,"p":true,"h":false},{"t":"쟁점은 분명합니다.","s":658.116,"e":659.837,"p":false,"h":false},{"t":"구원받는 데 무엇이 필요한가입니다.","s":660.42,"e":663.077,"p":false,"h":false},{"t":"이방인이 예수를 믿는 것으로 충분한가, 아니면 할례와 모세의 율법 준수가 더해져야 하는가.","s":663.696,"e":670.138,"p":false,"h":false},{"t":"이 물음은 복음의 본질을 건드립니다.","s":670.788,"e":673.43,"p":false,"h":false},{"t":"만일 믿음에 율법 준수가 더해져야 한다면, 그리스도의 십자가는 구원을 완성하지 못한 것이 됩니다.","s":674.028,"e":680.77,"p":true,"h":false},{"t":"베드로가 일어나 말합니다.","s":681.66,"e":683.529,"p":false,"h":false},{"t":"하나님이 이방인에게도 우리에게처럼 성령을 주셔서 믿음으로 그 마음을 깨끗하게 하셨으니, 어찌하여 우리 조상과 우리도 능히 메지 못하던 멍에를 그들의 목에 두어 하나님을 시험하느냐고 묻습니다.","s":684.18,"e":696.923,"p":false,"h":false},{"t":"그리고 결론을 내립니다.","s":697.536,"e":699.337,"p":false,"h":false},{"t":"우리가 주 예수의 은혜로 구원받는 줄을 믿노라 그들도 그와 같이 되리라(행 15:11).","s":699.948,"e":706.852,"p":true,"h":false},{"t":"이 문장은 이 회의의 신학적 중심입니다.","s":707.724,"e":710.767,"p":false,"h":false},{"t":"구원은 유대인이든 이방인이든 한 가지 방식으로 이루어집니다.","s":711.396,"e":715.552,"p":false,"h":false},{"t":"주 예수의 은혜로, 믿음으로 받습니다.","s":716.22,"e":719.326,"p":true,"h":false},{"t":"야고보의 결론","s":720.252,"e":721.591,"p":true,"h":false},{"t":"야고보는 아모스의 예언을 인용하여 이방인의 입교가 하나님이 옛적부터 말씀하신 일임을 보입니다(행 15:15-18).","s":722.304,"e":731.811,"p":false,"h":false},{"t":"그리고 결론을 말합니다.","s":732.384,"e":734.187,"p":false,"h":false},{"t":"이방인 가운데서 하나님께로 돌아오는 사람들을 괴롭게 하지 말고, 다만 우상의 더러운 것과 음행과 목매어 죽인 것과 피를 멀리하라고 편지하자는 것입니다(행 15:19-20).","s":734.76,"e":748.207,"p":true,"h":false},{"t":"이유도 덧붙입니다.","s":749.016,"e":750.619,"p":false,"h":false},{"t":"모세의 율법은 옛적부터 각 성에서 그것을 전하는 사람이 있어 안식일마다 회당에서 읽히고 있다는 것입니다(행 15:21).","s":751.248,"e":760.851,"p":false,"h":false},{"t":"이 말의 뜻은 이렇게 읽힙니다.","s":761.364,"e":763.829,"p":false,"h":false},{"t":"이방인 신자들이 유대인 신자들과 한 교회에서 식탁을 나누려면 유대인에게 특히 혐오스러운 몇 가지는 삼가는 것이 사랑이라는 것입니다.","s":764.136,"e":772.896,"p":true,"h":false},{"t":"그러므로 이 네 가지는 구원의 조건이 아닙니다.","s":773.748,"e":777.051,"p":false,"h":false},{"t":"편지에도 이 점이 분명하게 나타납니다.","s":777.636,"e":780.505,"p":false,"h":false},{"t":"성령과 우리는 이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 아니하는 것이 옳은 줄 알았노니(행 15:28).","s":781.128,"e":789.755,"p":false,"h":false},{"t":"구원받으려면 이것을 지켜야 한다고 하지 않고, 짐으로 지우지 않되 요긴한 것들은 지키라고 합니다.","s":790.272,"e":796.854,"p":false,"h":false},{"t":"앞의 것은 구원의 문제이고, 뒤의 것은 교제의 배려입니다.","s":797.508,"e":802.025,"p":true,"h":false},{"t":"피와 목매어 죽인 것","s":802.908,"e":804.526,"p":true,"h":false},{"t":"이 네 가지 가운데 오늘의 독자에게 가장 낯선 것이 피와 목매어 죽인 것입니다.","s":805.248,"e":810.566,"p":false,"h":false},{"t":"이것은 오늘도 지켜야 하는 규정입니까.","s":811.188,"e":813.878,"p":true,"h":false},{"t":"교회 안에서 이 물음에는 두 가지 대답이 있습니다.","s":814.752,"e":818.258,"p":false,"h":false},{"t":"하나는 이 요구를 당시 유대인과 이방인이 함께 식사하는 교회의 형편을 위한 일시적 배려로 보는 입장입니다.","s":818.856,"e":826.074,"p":false,"h":false},{"t":"이 입장은 바울이 훗날 고린도 교회에 쓴 편지에서 우상 제물 문제를 다루는 방식을 근거로 듭니다.","s":826.704,"e":833.323,"p":false,"h":false},{"t":"바울은 우상은 아무것도 아니니 우상 제물을 먹는다고 해서 더럽혀지지 않는다고 하면서도, 약한 형제가 그것을 보고 걸려 넘어지면 먹지 않겠다고 합니다(고전 8:4-13).","s":833.904,"e":847.006,"p":false,"h":false},{"t":"시장에서 파는 것은 양심 때문에 묻지 말고 먹되, 누가 이것은 제물이라고 알려 주면 그 알려 준 사람과 양심을 위해 먹지 말라고 합니다(고전 10:25-28).","s":847.548,"e":860.463,"p":false,"h":false},{"t":"이것은 율법을 구원의 조건으로 삼는 것이 아니라 사랑으로 자유를 절제하는 방식입니다.","s":860.976,"e":866.848,"p":true,"h":false},{"t":"다른 입장은 우상 제물과 음행이 도덕적으로 항구적인 금지이고, 피와 목매어 죽인 것도 창세기 9장에서 노아에게 주어진 오래된 규정에 닿아 있다고 봅니다.","s":867.744,"e":878.326,"p":false,"h":false},{"t":"이 해석에서는 이 네 가지가 이방인에게도 요구되는 최소한의 규범입니다.","s":879.012,"e":883.967,"p":true,"h":false},{"t":"이 글은 앞의 읽기에 기울어 있으나, 이 구절이 쉽게 풀리는 것은 아니라는 점은 말해 둡니다.","s":884.808,"e":891.005,"p":false,"h":false},{"t":"어느 쪽 입장이든 공통된 점이 있습니다.","s":891.612,"e":894.429,"p":false,"h":false},{"t":"이것은 구원의 조건이 아니라는 점, 그리고 그리스도 안에서 서로를 배려하는 교제의 방식이라는 점입니다.","s":895.068,"e":902.199,"p":true,"h":false},{"t":"디모데의 할례와 디도의 할례","s":903.096,"e":905.152,"p":true,"h":false},{"t":"이제 바울의 일관성 문제로 넘어갑니다.","s":905.868,"e":908.741,"p":false,"h":false},{"t":"16장에서 바울은 루스드라에서 디모데를 동행자로 삼으려 하면서 그에게 할례를 받게 합니다.","s":909.396,"e":915.406,"p":false,"h":false},{"t":"그 지방에 있는 유대인들 때문이라고 이유를 말합니다(행 16:3).","s":916.056,"e":921.864,"p":false,"h":false},{"t":"디모데는 믿는 유대 여자의 아들이었고 아버지는 헬라인이었습니다.","s":922.392,"e":927.014,"p":true,"h":false},{"t":"그런데 갈라디아서 2장에서 바울은 디도를 예루살렘에 데리고 갔을 때 그가 헬라인이었으나 억지로 할례를 받게 하지 않았다고 말합니다.","s":927.9,"e":936.747,"p":false,"h":false},{"t":"몰래 들어온 거짓 형제들이 우리를 종으로 삼으려 하였으나 우리는 그들에게 한 시도 복종하지 않았다고 합니다(갈 2:3-5).","s":937.368,"e":947.135,"p":false,"h":false},{"t":"같은 바울이 한 사람에게는 할례를 받게 하고 한 사람에게는 거부했습니다.","s":947.412,"e":952.159,"p":true,"h":false},{"t":"두 사건을 가르는 것은 구원과의 관계입니다.","s":953.028,"e":956.187,"p":false,"h":false},{"t":"디도의 경우 할례는 구원에 필요하다는 주장의 시험대였습니다.","s":956.844,"e":961.117,"p":false,"h":false},{"t":"이것을 받아들이면 복음의 진리가 무너지기 때문에 바울은 한 치도 물러서지 않았습니다.","s":961.776,"e":967.33,"p":false,"h":false},{"t":"반면 디모데의 경우는 구원의 조건이라는 주장이 개입한 것이 아니었습니다.","s":967.896,"e":972.827,"p":false,"h":false},{"t":"유대인 어머니에게서 난 디모데가 할례를 받지 않으면 유대인들에게 복음을 전할 때 걸림돌이 되기 때문에, 선교를 위한 자발적인 배려로 받게 한 것입니다.","s":973.368,"e":983.228,"p":true,"h":false},{"t":"원칙은 하나입니다.","s":984.132,"e":985.651,"p":false,"h":false},{"t":"구원의 조건으로 요구되면 거부하고, 복음을 위한 자유로운 선택이라면 허용합니다.","s":986.256,"e":992.046,"p":false,"h":false},{"t":"바울은 이 원칙을 고린도 교회에 이렇게 설명합니다.","s":992.7,"e":996.418,"p":false,"h":false},{"t":"유대인에게는 유대인 같이 되었으니 이는 유대인을 얻고자 함이라 하고, 모두에게 모든 것이 되었으니 이는 어떠하든지 몇 사람을 구원하고자 함이라고 합니다(고전 9:20-22).","s":997.056,"e":1010.309,"p":true,"h":false},{"t":"예루살렘에서의 서원","s":1011.06,"e":1012.814,"p":true,"h":false},{"t":"바울의 일관성 문제가 가장 날카롭게 제기되는 곳은 21장입니다.","s":1013.688,"e":1018.342,"p":false,"h":false},{"t":"바울이 예루살렘에 올라가자 야고보와 장로들이 이런 말을 합니다.","s":1018.98,"e":1023.218,"p":false,"h":false},{"t":"유대인 가운데 믿는 사람이 수만 명인데 다 율법에 열성인 사람들이고, 그들이 당신에 대해 이방인 가운데 사는 유대인에게 모세를 배척하고 할례를 행하지 말라고 가르친다고 들었다는 것입니다(행 21:20-21).","s":1023.876,"e":1039.881,"p":false,"h":false},{"t":"그래서 서원한 네 사람과 함께 결례를 행하고 그 비용을 대어 주라고 제안합니다.","s":1040.4,"e":1045.894,"p":true,"h":false},{"t":"바울은 이 제안을 따릅니다(행 21:26).","s":1046.772,"e":1051.513,"p":false,"h":false},{"t":"이 일은 이전에도 비슷하게 나타났습니다.","s":1052.136,"e":1055.146,"p":false,"h":false},{"t":"18장에서 바울은 겐그레아에서 서원이 있어 머리를 깎았다고 합니다(행 18:18).","s":1055.772,"e":1062.675,"p":true,"h":false},{"t":"이 일에 대해 어떤 학자들은 바울이 복음의 자유를 훼손하며 타협했다고 비판합니다.","s":1063.188,"e":1068.604,"p":false,"h":false},{"t":"다른 학자들은 이것이 바울의 일관된 원칙의 적용이라고 봅니다.","s":1069.236,"e":1073.661,"p":false,"h":false},{"t":"구원의 조건이 아니라면 유대인의 관습에 참여하는 것이 복음에 해가 되지 않고, 오히려 오해를 풀어 복음의 길을 여는 일이라는 것입니다.","s":1074.204,"e":1083.06,"p":false,"h":false},{"t":"이 글은 두 번째 읽기를 따릅니다.","s":1083.744,"e":1086.339,"p":false,"h":false},{"t":"다만 이 일이 결과적으로 바울에게 이익이 되지 않았다는 사실은 기억해야 합니다.","s":1086.66,"e":1092.218,"p":false,"h":false},{"t":"바울은 이 직후 성전에서 체포됩니다.","s":1092.852,"e":1095.608,"p":true,"h":false},{"t":"복음과 자유","s":1096.488,"e":1097.714,"p":true,"h":false},{"t":"이 모든 논의를 지나서 남는 중심은 복음의 한 문장입니다.","s":1098.612,"e":1102.644,"p":false,"h":false},{"t":"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라(엡 2:8).","s":1103.292,"e":1112.57,"p":false,"h":false},{"t":"구원은 할례나 음식이나 절기나 어떤 행위의 보탬으로 이루어지지 않습니다.","s":1113.048,"e":1117.983,"p":false,"h":false},{"t":"골로새서는 먹고 마시는 것이나 절기나 안식일을 이유로 누구도 너희를 비판하지 못하게 하라고 하며, 이것들은 장래 일의 그림자이고 몸은 그리스도의 것이라고 합니다(골 2:16-17).","s":1118.628,"e":1132.824,"p":true,"h":false},{"t":"그러나 이 자유는 제멋대로 살 자유가 아닙니다.","s":1133.64,"e":1137.142,"p":false,"h":false},{"t":"자유를 받은 사람은 그 자유를 사랑을 위해 씁니다.","s":1137.744,"e":1141.197,"p":false,"h":false},{"t":"약한 형제 때문에 먹지 않고, 복음을 위해 유대인 같이 되기도 합니다.","s":1141.776,"e":1146.757,"p":false,"h":false},{"t":"자유는 구원의 문제에서는 한 치도 물러서지 않는 단호함으로, 교제의 문제에서는 형제를 배려하는 유연함으로 나타납니다.","s":1147.392,"e":1155.335,"p":true,"h":false},{"t":"오늘 교회에도 비슷한 일이 많습니다.","s":1156.212,"e":1158.906,"p":false,"h":false},{"t":"어떤 음식이나 절기나 습관이나 외형을 신앙의 조건처럼 요구하는 일이 있고, 반대로 아무것도 삼가지 않고 형제를 걸려 넘어지게 하는 일이 있습니다.","s":1159.524,"e":1169.102,"p":false,"h":false},{"t":"예루살렘 회의가 우리에게 주는 지혜는 이 두 쪽을 모두 막습니다.","s":1169.424,"e":1174.162,"p":false,"h":false},{"t":"구원의 조건에는 그리스도 외에 아무것도 더하지 않고, 형제와의 교제에서는 사랑이 앞서는 길입니다.","s":1174.752,"e":1181.72,"p":true,"h":false}]},{"title":"13. 성령이 막으시고 환상으로 부르시고 제비를 뽑게 하시는 인도하심은 어떻게 읽어야 하는가","audio":"book_2610272355_2.mp3","start":1182.6,"end":1858.176,"dur":675.6,"segs":[{"t":"13.","s":1182.6,"e":1183.38,"p":false,"h":false},{"t":"성령이 막으시고 환상으로 부르시고 제비를 뽑게 하시는 인도하심은 어떻게 읽어야 하는가","s":1184.508,"e":1190.349,"p":true,"h":false},{"t":"본문: 사도행전 1장 21-26절, 16장 6-10절 (함께 읽을 본문: 행 8:26-29, 행 13:1-3, 행 15:28, 행 20:22-24, 행 21:4, 10-14, 잠 16:9, 잠 16:33, 롬 12:2, 살전 4:3)","s":1191.24,"e":1223.248,"p":true,"h":false},{"t":"교회 안에서 가장 자주 쓰이는 말 가운데 하나가 하나님이 인도하셨다는 말입니다.","s":1223.928,"e":1229.113,"p":false,"h":false},{"t":"직장과 배우자와 이사와 교회의 일을 두고 하나님의 뜻을 구하는 일은 신자의 일상입니다.","s":1229.76,"e":1235.482,"p":false,"h":false},{"t":"그리고 사도행전은 인도하심의 이야기로 가득합니다.","s":1236.096,"e":1239.662,"p":true,"h":false},{"t":"그런데 사도행전을 가만히 읽어 보면 하나님이 인도하시는 방식이 너무 다양하다는 것을 발견합니다.","s":1240.524,"e":1246.903,"p":false,"h":false},{"t":"제비를 뽑기도 하고, 천사가 말하기도 하고, 성령이 직접 말씀하시기도 하고, 환상이 나타나기도 하고, 성령이 막으시기도 합니다.","s":1247.544,"e":1257.061,"p":false,"h":false},{"t":"이것을 어떻게 읽어야 합니까.","s":1257.588,"e":1259.715,"p":false,"h":false},{"t":"이 가운데 어느 것이 오늘의 신자에게 기대되는 방식입니까.","s":1260.324,"e":1264.162,"p":true,"h":false},{"t":"이 글에서는 사도행전의 인도하심의 장면들을 살펴보며, 그것이 우리에게 무엇을 말하고 무엇을 말하지 않는지 구별해 보겠습니다.","s":1265.04,"e":1273.971,"p":true,"h":false},{"t":"마지막 제비뽑기","s":1274.868,"e":1276.421,"p":true,"h":false},{"t":"사도행전 1장에서 열한 사도는 가룟 유다의 자리를 채우기로 합니다.","s":1276.992,"e":1281.53,"p":false,"h":false},{"t":"조건에 맞는 두 사람 요셉 바사바와 맛디아를 세워 놓고 기도합니다.","s":1282.176,"e":1286.668,"p":false,"h":false},{"t":"주여 못 사람의 마음을 아시오니 이 두 사람 중에서 누구를 택하신 것을 보이시옵소서.","s":1287.324,"e":1292.826,"p":false,"h":false},{"t":"그리고 제비를 뽑아 맛디아가 뽑혔고 열한 사도와 함께 더해졌습니다(행 1:23-26).","s":1293.48,"e":1301.537,"p":true,"h":false},{"t":"제비뽑기는 구약에서 하나님의 뜻을 구하는 방법으로 쓰였습니다.","s":1302.264,"e":1306.492,"p":false,"h":false},{"t":"잠언은 사람이 제비는 뽑으나 일을 작정하기는 여호와께 있다고 합니다(잠 16:33).","s":1307.124,"e":1313.885,"p":false,"h":false},{"t":"그런데 사도행전 전체에서 제비뽑기가 이렇게 쓰인 것은 이 한 번뿐입니다.","s":1314.216,"e":1319.431,"p":false,"h":false},{"t":"성령이 오순절에 임하신 뒤로는 다시 나오지 않습니다.","s":1320.012,"e":1323.697,"p":true,"h":false},{"t":"이것은 중요한 사실을 보여 줍니다.","s":1324.512,"e":1326.965,"p":false,"h":false},{"t":"제비뽑기는 성령이 아직 오시기 전, 승천과 오순절 사이의 과도기에 쓰인 방식이었습니다.","s":1327.284,"e":1333.68,"p":false,"h":false},{"t":"성령이 오신 뒤에는 인도하시는 방식이 달라졌습니다.","s":1334.34,"e":1338.105,"p":false,"h":false},{"t":"사도행전의 사도들은 앞으로 중요한 결정을 제비로 하지 않았습니다.","s":1338.732,"e":1343.086,"p":true,"h":false},{"t":"덧붙여 한 가지는 정직하게 말해야 합니다.","s":1343.952,"e":1346.836,"p":false,"h":false},{"t":"맛디아는 이후 사도행전에서 다시 언급되지 않고, 열두 번째 사도를 바울로 보아야 하는지를 두고 교회에는 오랜 논쟁이 있습니다.","s":1347.48,"e":1356.518,"p":false,"h":false},{"t":"누가는 맛디아가 열두 사도에 더해졌다고 기록하고 그 선택을 부정하지 않으므로, 이 글은 이 선택을 그대로 받아들이고 논쟁은 여기서 접어 둡니다.","s":1357.128,"e":1367.184,"p":true,"h":false},{"t":"성령과 천사와 환상","s":1368.072,"e":1369.962,"p":true,"h":false},{"t":"이후의 인도하심은 다양합니다.","s":1370.52,"e":1372.789,"p":false,"h":false},{"t":"천사가 빌립에게 말하여 광야 길로 가라고 합니다(행 8:26).","s":1373.4,"e":1379.143,"p":false,"h":false},{"t":"곧이어 성령이 빌립에게 그 수레로 가까이 가라고 말씀하십니다(행 8:29).","s":1379.772,"e":1386.182,"p":false,"h":false},{"t":"안디옥 교회가 금식하며 예배할 때 성령이 바나바와 사울을 따로 세우라고 하십니다(행 13:2).","s":1386.828,"e":1394.348,"p":false,"h":false},{"t":"환상이 고넬료와 베드로에게 나타납니다.","s":1395,"e":1397.817,"p":false,"h":false},{"t":"예루살렘 회의의 결정은 이렇게 표현됩니다.","s":1398.456,"e":1401.548,"p":false,"h":false},{"t":"성령과 우리는 이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 아니하는 것이 옳은 줄 알았노니(행 15:28).","s":1402.2,"e":1410.827,"p":true,"h":false},{"t":"이 모든 장면에서 공통점이 있습니다.","s":1411.56,"e":1414.277,"p":false,"h":false},{"t":"하나님이 복음의 길을 열기 위해 인도하셨다는 것입니다.","s":1414.908,"e":1418.514,"p":false,"h":false},{"t":"개인의 안락이나 성공을 위한 인도가 아니라 복음이 새로운 사람에게 이르도록 하는 인도였습니다.","s":1419.048,"e":1425.104,"p":false,"h":false},{"t":"그리고 그 대부분이 사도들과 교회의 지도자들이 복음 사역의 결정적인 순간에 경험한 일이었습니다.","s":1425.708,"e":1432.13,"p":true,"h":false},{"t":"막으시는 성령","s":1433.016,"e":1434.37,"p":true,"h":false},{"t":"가장 흥미로운 장면은 16장입니다.","s":1435.212,"e":1437.843,"p":false,"h":false},{"t":"바울 일행은 아시아에서 말씀을 전하는 것을 성령이 금하셔서 브루기아와 갈라디아 땅으로 다닙니다.","s":1438.38,"e":1444.634,"p":false,"h":false},{"t":"무시아 맞은편에 이르러 비두니아로 가려고 했으나 예수의 영이 허락하지 않으셨습니다(행 16:6-7).","s":1445.256,"e":1453.476,"p":false,"h":false},{"t":"그래서 무시아를 지나 드로아로 내려갑니다.","s":1453.788,"e":1456.641,"p":true,"h":false},{"t":"이 대목에서 우리는 이상한 점을 발견합니다.","s":1457.208,"e":1460.374,"p":false,"h":false},{"t":"성령은 바울에게 복음을 전하지 말라고 막으셨습니다.","s":1461.024,"e":1464.548,"p":false,"h":false},{"t":"아시아에는 훗날 에베소 교회가 서고 요한계시록의 일곱 교회가 있게 될 곳입니다.","s":1465.2,"e":1470.267,"p":false,"h":false},{"t":"그런데 이때는 아직 때가 아니었습니다.","s":1470.888,"e":1473.668,"p":false,"h":false},{"t":"본문은 어떻게 막으셨는지, 왜 막으셨는지를 말하지 않습니다.","s":1474.344,"e":1479.167,"p":false,"h":false},{"t":"성령이 말씀으로 말씀하셨는지, 상황으로 막으셨는지, 마음의 감동이었는지 알 수 없습니다.","s":1479.78,"e":1487.14,"p":false,"h":false},{"t":"이유도 알려 주지 않습니다.","s":1487.736,"e":1489.666,"p":true,"h":false},{"t":"그리고 밤에 드로아에서 바울이 환상을 봅니다.","s":1490.58,"e":1493.651,"p":false,"h":false},{"t":"마게도냐 사람 하나가 서서 건너와서 우리를 도우라고 청합니다.","s":1494.288,"e":1498.394,"p":false,"h":false},{"t":"이 환상을 본 뒤 본문은 이렇게 기록합니다.","s":1499.04,"e":1502.125,"p":false,"h":false},{"t":"우리가 곧 마게도냐로 떠나가기를 힘쓰니 이는 하나님이 우리를 불러 그들에게 복음을 전하게 하시는 줄로 인정함이라(행 16:10).","s":1502.784,"e":1511.761,"p":true,"h":false},{"t":"여기서 인정함이라는 말에 주목해야 합니다.","s":1512.612,"e":1515.365,"p":false,"h":false},{"t":"이 말은 여러 가지 근거를 모아서 결론에 이르렀다는 뜻을 가진 말입니다.","s":1516.032,"e":1520.988,"p":false,"h":false},{"t":"바울 일행은 환상 하나만 보고 달려간 것이 아닙니다.","s":1521.648,"e":1525.082,"p":false,"h":false},{"t":"아시아에서 막히고, 비두니아에서 막히고, 드로아에 이르러 환상이 나타난 일련의 일들을 종합해서 하나님이 부르신다고 판단했습니다.","s":1525.752,"e":1534.458,"p":false,"h":false},{"t":"그리고 그 판단은 공동체 안에서 함께 이루어졌습니다.","s":1535.076,"e":1538.87,"p":false,"h":false},{"t":"이 구절에서 처음으로 본문의 주어가 우리로 바뀌는데, 누가가 이 여행에 합류한 것입니다.","s":1539.504,"e":1545.585,"p":false,"h":false},{"t":"인도하심은 개인의 신비로운 체험으로 끝나지 않고 함께하는 사람들의 판단으로 이어졌습니다.","s":1546.236,"e":1552.676,"p":true,"h":false},{"t":"성령의 인도와 다른 신자의 말","s":1553.544,"e":1556.062,"p":true,"h":false},{"t":"인도하심이 항상 명쾌하지만은 않다는 것을 보여 주는 대목이 더 있습니다.","s":1556.964,"e":1561.695,"p":false,"h":false},{"t":"바울은 예루살렘으로 올라가면서 성령에 매여 가는데 거기서 무슨 일을 당할지 알지 못한다고 말합니다.","s":1562.364,"e":1569.085,"p":false,"h":false},{"t":"다만 성령이 각 성에서 결박과 환난이 나를 기다린다고 증언하신다고 합니다(행 20:22-23).","s":1569.744,"e":1578.028,"p":false,"h":false},{"t":"그런데 두로에서 제자들은 성령의 감동으로 바울에게 예루살렘에 올라가지 말라고 말했다고 기록합니다(행 21:4).","s":1578.528,"e":1587.369,"p":false,"h":false},{"t":"가이사랴에서는 아가보 선지자가 바울의 허리띠로 자기 손발을 묶고 이 띠의 임자가 이같이 결박당하리라고 예언합니다.","s":1587.96,"e":1596.316,"p":false,"h":false},{"t":"사람들이 올라가지 말라고 간청하자 바울은 나는 예루살렘에서 주 예수의 이름을 위하여 결박당할 뿐 아니라 죽을 각오가 되어 있다고 답합니다(행 21:10-13).","s":1596.96,"e":1609.125,"p":true,"h":false},{"t":"이 장면은 우리를 곤란하게 합니다.","s":1609.956,"e":1612.473,"p":false,"h":false},{"t":"성령의 감동으로 올라가지 말라고 한 제자들이 있었고, 같은 성령에 매여 올라간다고 한 바울이 있었습니다.","s":1613.124,"e":1620.053,"p":false,"h":false},{"t":"누가 옳았습니까.","s":1620.684,"e":1622.066,"p":false,"h":false},{"t":"본문은 바울의 길을 따라 이야기를 이어 가므로, 바울이 주님의 뜻을 따른 것이라고 읽을 수 있습니다.","s":1622.7,"e":1629.154,"p":false,"h":false},{"t":"그러나 이 장면은 성령의 인도하심을 안다고 주장하는 사람들끼리도 서로 다른 말을 할 수 있음을 보여 줍니다.","s":1629.756,"e":1637.024,"p":false,"h":false},{"t":"주관적인 감동만으로는 인도하심을 확정할 수 없다는 뜻입니다.","s":1637.676,"e":1642.152,"p":true,"h":false},{"t":"인도하심에 대한 두 입장","s":1643.076,"e":1644.977,"p":true,"h":false},{"t":"이 문제를 두고 오늘의 교회에는 두 가지 큰 이해가 있습니다.","s":1645.848,"e":1650.152,"p":true,"h":false},{"t":"하나는 성령이 오늘도 사도행전 때처럼 환상과 음성과 감동으로 직접 인도하신다는 이해입니다.","s":1651.032,"e":1657.536,"p":false,"h":false},{"t":"이 입장은 성령의 직접적인 말씀을 사모하고 분별해야 한다고 가르칩니다.","s":1658.124,"e":1663.193,"p":true,"h":false},{"t":"다른 하나는 하나님의 뜻이 성경에 충분히 계시되었으므로 오늘 신자는 성경의 원리와 지혜로운 판단, 그리고 하나님의 섭리 속에서 길을 찾는다는 이해입니다.","s":1664.064,"e":1674.432,"p":false,"h":false},{"t":"개혁파 전통은 대체로 이쪽에 서 있습니다.","s":1675.044,"e":1678.025,"p":false,"h":false},{"t":"하나님이 오늘도 섭리로 우리를 인도하신다는 점은 두 입장이 모두 인정합니다.","s":1678.68,"e":1683.773,"p":false,"h":false},{"t":"다만 새로운 계시를 기대하는지가 갈립니다.","s":1684.368,"e":1687.427,"p":true,"h":false},{"t":"이 글은 두 번째 입장에서 읽습니다.","s":1688.256,"e":1690.95,"p":false,"h":false},{"t":"이유는 사도행전의 인도하심이 대부분 복음 사역의 결정적인 전환점에서 사도들에게 주어진 것이고, 이것을 모든 신자가 일상의 결정에서 기대해야 하는 규범으로 삼을 근거가 본문에 없기 때문입니다.","s":1691.496,"e":1704.788,"p":false,"h":false},{"t":"서신서는 일상의 결정에서 신자에게 다른 것을 말합니다.","s":1705.392,"e":1709.486,"p":false,"h":false},{"t":"하나님의 뜻은 너희의 거룩함이라고 하며(살전 4:3), 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하라고 합니다(롬 12:2).","s":1710.108,"e":1724.692,"p":false,"h":false},{"t":"직업과 이사와 배우자를 고르는 일에서 신자는 성경이 이미 말한 원리와 지혜와 기도 가운데 판단하고, 그 결과를 하나님께 맡깁니다.","s":1725.228,"e":1734.097,"p":true,"h":false},{"t":"인도하심이라는 말이 위험해질 때","s":1734.912,"e":1737.211,"p":true,"h":false},{"t":"이 글을 쓰는 자리에서 말하기 어렵지만 말해야 할 것이 있습니다.","s":1738.116,"e":1742.226,"p":false,"h":false},{"t":"한국 교회에는 하나님이 말씀하셨다는 말이 너무 쉽게 쓰입니다.","s":1742.868,"e":1747.271,"p":false,"h":false},{"t":"자기 계획에 하나님의 이름을 입히거나, 자기 판단을 반박할 수 없는 권위로 삼는 데 쓰이는 일이 있습니다.","s":1747.908,"e":1754.643,"p":false,"h":false},{"t":"하나님이 내게 환상으로 보이셨다고 말하면 아무도 반박하기 어렵기 때문입니다.","s":1755.288,"e":1760.385,"p":true,"h":false},{"t":"사도행전의 사도들은 환상을 보았다고 말하면서도 자기 판단을 검증받는 과정을 거쳤습니다.","s":1761.264,"e":1767.143,"p":false,"h":false},{"t":"고넬료 사건 후에 베드로는 예루살렘 교회 앞에서 자기가 한 일을 설명해야 했습니다.","s":1767.78,"e":1773.102,"p":false,"h":false},{"t":"예루살렘 회의에서는 사도들이 함께 모여 성경과 경험을 놓고 논의했습니다.","s":1773.756,"e":1778.765,"p":false,"h":false},{"t":"자신이 들은 음성을 근거로 모든 것을 결정하는 것은 사도행전의 방식이 아닙니다.","s":1779.408,"e":1784.662,"p":true,"h":false},{"t":"신자가 하나님의 뜻을 구하는 일은 마땅합니다.","s":1785.528,"e":1788.573,"p":false,"h":false},{"t":"잠언은 사람이 마음으로 자기 길을 계획할지라도 그 걸음을 인도하는 이는 여호와시라고 합니다(잠 16:9).","s":1788.876,"e":1796.632,"p":false,"h":false},{"t":"그러나 이 말씀은 하나님이 신비한 신호로 우리의 모든 선택을 대신해 주신다는 뜻이 아니라, 우리가 계획하고 걸어가는 모든 걸음의 배후에 하나님의 손이 계신다는 뜻입니다.","s":1797.228,"e":1808.432,"p":true,"h":false},{"t":"모르는 가운데 걷는 신자","s":1809.36,"e":1811.479,"p":true,"h":false},{"t":"사도행전의 인도하심이 우리에게 주는 가장 큰 위로는 이것입니다.","s":1812.384,"e":1817.027,"p":false,"h":false},{"t":"하나님은 일을 주관하시고, 우리가 알지 못할 때에도 일하고 계십니다.","s":1817.64,"e":1822.637,"p":false,"h":false},{"t":"바울은 아시아가 왜 막혔는지 몰랐습니다.","s":1823.292,"e":1826.305,"p":false,"h":false},{"t":"비두니아가 왜 닫혔는지 몰랐습니다.","s":1826.928,"e":1829.522,"p":false,"h":false},{"t":"알지 못하는 채로 걸어갔을 때 마게도냐의 문이 열렸습니다.","s":1830.168,"e":1834.394,"p":true,"h":false},{"t":"신자의 길은 대부분 이렇습니다.","s":1835.28,"e":1837.624,"p":false,"h":false},{"t":"우리는 모든 이유를 알지 못한 채 성경이 말한 것을 따라 걷고, 막히면 돌아서고, 열리면 들어갑니다.","s":1838.232,"e":1845.684,"p":false,"h":false},{"t":"그리고 훗날 돌아보면 막힌 문도 열린 문도 같은 손이 만드신 길이었음을 알게 됩니다.","s":1846.296,"e":1852.036,"p":false,"h":false},{"t":"이 확신이 있으면 모르는 것 앞에서도 불안하지 않고 걸을 수 있습니다.","s":1852.596,"e":1857.318,"p":true,"h":false}]},{"title":"14. 아테네 설교는 접촉점을 찾은 것인가 선포인가: 아레오바고의 바울","audio":"book_2610272355_2.mp3","start":1858.176,"end":2481.768,"dur":623.6,"segs":[{"t":"14.","s":1858.176,"e":1858.895,"p":false,"h":false},{"t":"아테네 설교는 접촉점을 찾은 것인가 선포인가: 아레오바고의 바울","s":1860.084,"e":1864.993,"p":true,"h":false},{"t":"본문: 사도행전 17장 16-34절 (함께 읽을 본문: 사 44:9-20, 시 19:1-4, 행 14:15-17, 롬 1:18-25, 롬 2:14-15, 고전 2:1-5)","s":1865.772,"e":1887.725,"p":true,"h":false},{"t":"바울의 설교 가운데 가장 많이 연구된 설교는 아테네의 아레오바고 설교입니다.","s":1888.524,"e":1893.577,"p":false,"h":false},{"t":"구약 이야기가 하나도 나오지 않고, 청중이 철학자들이라는 점에서 다른 설교와 다릅니다.","s":1894.248,"e":1900.176,"p":true,"h":false},{"t":"이 설교를 두고 교회 안에서 오랜 논쟁이 있습니다.","s":1901.052,"e":1904.537,"p":false,"h":false},{"t":"바울은 이 설교에서 이방인의 종교심을 칭찬했는가, 아니면 정죄했는가.","s":1905.192,"e":1910.508,"p":false,"h":false},{"t":"그리고 이 설교를 전도의 모범으로 삼아야 하는가, 아니면 실패한 설교의 반면교사로 삼아야 하는가.","s":1911.096,"e":1917.772,"p":false,"h":false},{"t":"이 글에서는 본문이 말하는 대로 설교의 구조를 따라가면서 이 물음에 답해 보겠습니다.","s":1918.44,"e":1924.346,"p":true,"h":false},{"t":"바울의 첫 반응","s":1925.244,"e":1926.547,"p":true,"h":false},{"t":"이 설교는 바울의 감정에서 시작됩니다.","s":1927.332,"e":1930.278,"p":false,"h":false},{"t":"바울은 아덴에서 동료들을 기다리다가 그 성에 우상이 가득한 것을 보고 마음에 분개했다고 합니다(행 17:16).","s":1930.896,"e":1939.2,"p":false,"h":false},{"t":"이 분개라는 말은 마음이 격해져 괴로워한다는 뜻을 가진 강한 말입니다.","s":1939.752,"e":1944.532,"p":false,"h":false},{"t":"구경하는 사람의 감상이 아니라 마음이 찔린 사람의 반응입니다.","s":1945.116,"e":1949.484,"p":true,"h":false},{"t":"아덴은 철학과 학문과 예술의 중심 도시였습니다.","s":1950.372,"e":1953.764,"p":false,"h":false},{"t":"관광객이었다면 감탄했을 도시입니다.","s":1954.332,"e":1957.284,"p":false,"h":false},{"t":"그러나 바울은 그 도시의 아름다움 속에서 우상을 먼저 보았습니다.","s":1957.824,"e":1962.504,"p":false,"h":false},{"t":"이것이 설교의 출발점입니다.","s":1963.188,"e":1965.456,"p":false,"h":false},{"t":"바울은 이 도시와 사귀려고 한 것이 아니라 이 도시의 영혼이 하나님을 떠나 있음을 슬퍼했습니다.","s":1966.068,"e":1972.41,"p":true,"h":false},{"t":"그래서 회당에서는 유대인과 경건한 사람들과, 장터에서는 날마다 만나는 사람들과 변론합니다.","s":1973.304,"e":1980.234,"p":false,"h":false},{"t":"에피쿠로스 학파와 스토아 학파의 철학자들도 그와 맞서 논쟁했고, 그들은 바울을 말쟁이라고 부르며 이상한 신들을 전하는 사람이라고 했습니다.","s":1980.828,"e":1990.232,"p":false,"h":false},{"t":"바울이 전한 내용이 예수와 부활이었기 때문입니다(행 17:18).","s":1990.872,"e":1996.458,"p":false,"h":false},{"t":"그리고 그들은 바울을 아레오바고로 데려가 그 새 교훈이 무엇인지 알 수 있겠느냐고 묻습니다.","s":1996.992,"e":2003.327,"p":true,"h":false},{"t":"알지 못하는 신","s":2004.228,"e":2005.649,"p":true,"h":false},{"t":"바울은 설교를 이렇게 시작합니다.","s":2006.424,"e":2008.878,"p":false,"h":false},{"t":"아덴 사람들아 내가 보니 너희가 모든 일에 종교심이 많도다.","s":2009.52,"e":2013.815,"p":false,"h":false},{"t":"그리고 다니며 너희가 위하는 것들을 보다가 알지 못하는 신에게라고 새긴 제단도 보았다고 합니다.","s":2014.416,"e":2020.747,"p":false,"h":false},{"t":"그러므로 너희가 알지 못하고 위하는 그것을 내가 너희에게 알게 하리라고 말합니다(행 17:22-23).","s":2021.4,"e":2030.09,"p":true,"h":false},{"t":"이 도입부는 종종 바울이 이교도의 종교심을 인정하고 그것을 접촉점으로 삼았다는 증거로 읽힙니다.","s":2030.94,"e":2038.024,"p":false,"h":false},{"t":"그러나 본문을 자세히 보면 바울이 하는 일은 접촉이 아니라 지적입니다.","s":2038.68,"e":2043.387,"p":false,"h":false},{"t":"너희가 알지 못하고 위한다는 말은 칭찬이 아니라 진단입니다.","s":2043.972,"e":2048,"p":false,"h":false},{"t":"너희가 예배하는 대상이 무엇인지도 모르고 예배하고 있다는 말입니다.","s":2048.652,"e":2053.047,"p":false,"h":false},{"t":"알지 못하는 신이라고 새긴 제단은 그들이 자기 신들의 목록에 자신 없는 틈이 있음을 스스로 인정한 증거였고, 바울은 그 틈을 이용하여 참 하나님을 선포합니다.","s":2053.692,"e":2064.023,"p":true,"h":false},{"t":"설교의 순서","s":2064.852,"e":2066.043,"p":true,"h":false},{"t":"바울의 설교 순서는 눈여겨볼 만합니다.","s":2066.76,"e":2069.452,"p":false,"h":false},{"t":"그는 창조에서 시작합니다.","s":2070.036,"e":2072.182,"p":false,"h":false},{"t":"세계와 그 가운데 있는 만물을 지으신 하나님은 천지의 주재시니 손으로 지은 전에 계시지 않고, 무엇이 부족한 것처럼 사람의 손으로 섬김을 받지 않으신다고 합니다(행 17:24-25).","s":2072.628,"e":2086.736,"p":false,"h":false},{"t":"이것은 유대인이면 누구나 동의할 말이지만 아덴의 철학자와 신전 숭배자들에게는 충격이었습니다.","s":2087.316,"e":2093.757,"p":false,"h":false},{"t":"신들이 사람의 제물로 먹고 산다는 생각을 정면으로 거절합니다.","s":2094.408,"e":2098.753,"p":true,"h":false},{"t":"이어서 한 혈통에서 모든 민족을 만드시고 그들의 연대와 거주의 경계를 정하셨다고 합니다.","s":2099.556,"e":2105.861,"p":false,"h":false},{"t":"이는 사람이 혹 하나님을 더듬어 찾아 발견하게 하려는 것이라고 합니다(행 17:26-27).","s":2106.468,"e":2114.421,"p":false,"h":false},{"t":"그리고 하나님은 우리 각 사람에게서 멀리 계시지 않다고 말합니다.","s":2114.748,"e":2118.993,"p":true,"h":false},{"t":"이 대목에서 바울은 그들의 시인의 말을 인용합니다.","s":2119.896,"e":2123.389,"p":false,"h":false},{"t":"그 안에서 우리가 살며 기동하며 존재하느니라 하는 말과, 우리가 그의 소생이라는 말입니다(행 17:28).","s":2124,"e":2132.545,"p":false,"h":false},{"t":"이 인용은 스토아 계열의 시인들이 제우스를 두고 한 말이었습니다.","s":2133.108,"e":2137.437,"p":false,"h":false},{"t":"바울은 그 말을 참 하나님에게 적용했습니다.","s":2138.04,"e":2141.121,"p":false,"h":false},{"t":"이것은 시인의 신학을 승인한 것이 아닙니다.","s":2141.676,"e":2144.625,"p":false,"h":false},{"t":"바울은 그 말을 가져다가 그들의 우상숭배를 반박하는 데 씁니다.","s":2145.24,"e":2149.608,"p":false,"h":false},{"t":"하나님의 소생이 되었으면 하나님을 금이나 은이나 돌에 사람의 기술로 새긴 것으로 여기는 것이 말이 안 된다는 것입니다(행 17:29).","s":2150.244,"e":2160.376,"p":false,"h":false},{"t":"그들 자신의 입에서 나온 말로 그들의 우상을 무너뜨립니다.","s":2160.9,"e":2165.103,"p":true,"h":false},{"t":"이 논법은 이사야 44장에서 나무로 우상을 만들고 그 절반으로 불을 때는 사람을 풍자한 말씀과 같은 줄기입니다.","s":2165.976,"e":2174.154,"p":false,"h":false},{"t":"이사야서 깊이 읽기를 들으신 분이라면 그 풍자와 이 설교가 이어진다는 것을 알아보실 수 있습니다.","s":2174.796,"e":2181.426,"p":true,"h":false},{"t":"회개의 선포","s":2182.32,"e":2183.468,"p":true,"h":false},{"t":"그러고 나서 설교의 전환점이 나옵니다.","s":2184.264,"e":2187.097,"p":false,"h":false},{"t":"하나님이 알지 못하던 시대에는 허물치 않으셨으나 이제는 어디서든지 사람은 다 회개하라고 명하신다는 것입니다(행 17:30).","s":2187.684,"e":2197.591,"p":false,"h":false},{"t":"앞에서 부드럽게 이어 오던 어조가 여기서 바뀝니다.","s":2198.16,"e":2201.763,"p":false,"h":false},{"t":"이제는이라는 말에 구속사의 전환이 담겨 있습니다.","s":2202.408,"e":2205.795,"p":false,"h":false},{"t":"그리스도가 오신 뒤로 알지 못함은 변명이 되지 않습니다.","s":2206.44,"e":2210.197,"p":true,"h":false},{"t":"이유는 하나님이 정하신 사람을 통하여 천하를 의로 심판할 날을 정하셨다는 것입니다.","s":2211.048,"e":2216.765,"p":false,"h":false},{"t":"그리고 그 사람을 죽은 자 가운데서 살리심으로 이에 대한 확신을 모든 사람에게 주셨다고 합니다(행 17:31).","s":2217.384,"e":2225.977,"p":false,"h":false},{"t":"심판과 부활이 설교의 정점입니다.","s":2226.456,"e":2229.021,"p":false,"h":false},{"t":"바울은 여기서 예수라는 이름조차 말하지 않았지만, 부활하신 분이 심판주이시라는 것이 분명했습니다.","s":2229.624,"e":2236.518,"p":true,"h":false},{"t":"반응은 갈렸습니다.","s":2237.4,"e":2238.926,"p":false,"h":false},{"t":"부활이라는 말에 어떤 사람은 조롱했고, 어떤 사람은 우리가 이것에 대하여 다시 들으리라고 했습니다(행 17:32).","s":2239.56,"e":2248.592,"p":false,"h":false},{"t":"바울은 그들 가운데서 떠납니다.","s":2249.208,"e":2251.511,"p":true,"h":false},{"t":"접촉점인가 선포인가","s":2252.412,"e":2254.211,"p":true,"h":false},{"t":"이 설교를 두고 가장 오래된 논쟁은 이것입니다.","s":2255.112,"e":2258.654,"p":false,"h":false},{"t":"바울은 이교도의 종교심과 시인의 말에서 접촉점을 찾았다고 보아야 하는가, 아니면 처음부터 끝까지 이교의 세계관을 무너뜨리는 선포였다고 보아야 하는가.","s":2259.252,"e":2269.343,"p":true,"h":false},{"t":"한쪽은 이 설교가 선교의 모범이라고 봅니다.","s":2270.196,"e":2273.394,"p":false,"h":false},{"t":"바울은 청중이 아는 말로 시작해서 그들의 세계 안에서 복음에 이르는 길을 만들었으니, 오늘의 전도도 문화와 접촉점을 찾아야 한다는 것입니다.","s":2274.012,"e":2282.868,"p":false,"h":false},{"t":"다른 쪽은 바울이 접촉점처럼 보이는 말들을 쓰면서도 그것을 모두 창조주 하나님 중심으로 다시 정의했다고 봅니다.","s":2283.516,"e":2291.644,"p":false,"h":false},{"t":"알지 못하는 신은 참 하나님이 아니고, 시인의 소생이라는 말은 우상숭배를 정죄하는 논증이 되었습니다.","s":2292.264,"e":2299.195,"p":true,"h":false},{"t":"본문은 두 번째 읽기를 지지합니다.","s":2300.076,"e":2302.691,"p":false,"h":false},{"t":"바울의 말투는 청중에게 맞추었지만 말의 내용은 청중의 사상을 따르지 않았습니다.","s":2303.208,"e":2308.625,"p":false,"h":false},{"t":"그는 청중의 말을 빌렸으나 청중의 세계관을 인정하지 않았습니다.","s":2309.256,"e":2313.874,"p":false,"h":false},{"t":"창조와 심판과 부활과 회개라는 설교의 뼈대는 아덴의 철학에는 없는 것이었습니다.","s":2314.512,"e":2320.181,"p":false,"h":false},{"t":"로마서 1장이 말하는 바도 이와 같습니다.","s":2320.812,"e":2323.779,"p":false,"h":false},{"t":"하나님의 보이지 않는 속성이 만물에 나타나 알려졌으므로 사람이 핑계하지 못한다고 하지만, 사람이 그 진리를 막아 우상으로 바꾸었다고 합니다(롬 1:18-23).","s":2324.412,"e":2336.477,"p":false,"h":false},{"t":"접촉점은 사람이 이미 하나님을 알고 있다는 사실이 아니라, 알고도 거부하고 있다는 사실이었습니다.","s":2336.976,"e":2343.443,"p":true,"h":false},{"t":"실패한 설교인가","s":2344.356,"e":2345.751,"p":true,"h":false},{"t":"이 설교의 결과를 두고 또 하나의 해석이 있습니다.","s":2346.624,"e":2350.283,"p":false,"h":false},{"t":"이 설교는 별 열매가 없었으니 바울이 철학을 써서 실패했고, 그래서 고린도에서는 예수 그리스도와 그가 십자가에 못 박히신 것 외에는 아무것도 알지 않기로 작정했다는 것입니다(고전 2:2).","s":2350.908,"e":2365.586,"p":false,"h":false},{"t":"아덴에서 고린도로 간 순서가 이 해석을 뒷받침하는 듯 보입니다.","s":2366.064,"e":2370.483,"p":true,"h":false},{"t":"그러나 본문은 그렇게 기록하지 않습니다.","s":2371.392,"e":2374.257,"p":false,"h":false},{"t":"누가는 몇 사람이 바울을 가까이하여 믿었는데 그 중에 아레오바고 관리 디오누시오와 다마리라 하는 여자와 다른 사람들이 있었다고 적습니다(행 17:34).","s":2374.56,"e":2385.705,"p":false,"h":false},{"t":"아레오바고 회의의 일원이 믿은 것은 작지 않은 결과였습니다.","s":2386.332,"e":2390.313,"p":false,"h":false},{"t":"누가는 이 설교를 실패담으로 기록하지 않았습니다.","s":2390.904,"e":2394.448,"p":false,"h":false},{"t":"고린도전서의 말씀도 아덴 설교를 후회하는 말로 읽을 근거가 본문에 없습니다.","s":2395.08,"e":2400.259,"p":false,"h":false},{"t":"바울은 어디서나 십자가의 도를 중심에 두었고, 아덴에서도 그 중심이 부활과 심판이라는 형태로 있었습니다.","s":2400.876,"e":2408.281,"p":true,"h":false},{"t":"오늘의 전도자에게","s":2409.156,"e":2410.662,"p":true,"h":false},{"t":"이 설교가 오늘 전도에 주는 지혜는 이것입니다.","s":2411.28,"e":2414.471,"p":false,"h":false},{"t":"복음을 전할 때 상대의 말과 문화와 질문을 아는 것은 중요합니다.","s":2415.06,"e":2419.525,"p":false,"h":false},{"t":"바울은 그들의 도시를 걸으며 그들의 제단을 읽고, 그들의 시인을 알았습니다.","s":2420.136,"e":2425.677,"p":false,"h":false},{"t":"상대를 모르고 하는 전도는 담장 너머에서 소리치는 것과 같습니다.","s":2426.328,"e":2430.682,"p":true,"h":false},{"t":"그러나 말을 맞추는 것과 내용을 맞추는 것은 다른 일입니다.","s":2431.512,"e":2435.593,"p":false,"h":false},{"t":"아레오바고의 바울은 말을 맞추었으나 내용은 맞추지 않았습니다.","s":2435.904,"e":2440.159,"p":false,"h":false},{"t":"복음은 청중의 필요에 복음을 맞추는 것이 아니라, 청중의 필요 자체를 새로 정의합니다.","s":2440.8,"e":2446.555,"p":false,"h":false},{"t":"사람들이 원하는 것을 먼저 주고 나중에 복음을 주는 방식은 이 본문에 없습니다.","s":2447.172,"e":2452.579,"p":true,"h":false},{"t":"그리고 마지막으로, 복음 앞에서 어떤 사람은 조롱하고 어떤 사람은 믿는다는 것을 받아들여야 합니다.","s":2453.472,"e":2460.348,"p":false,"h":false},{"t":"부활이라는 말에 아덴의 철학자들이 웃었듯이 오늘도 같은 반응이 있습니다.","s":2460.996,"e":2466.14,"p":false,"h":false},{"t":"전도자가 할 일은 설득력 있는 말솜씨로 그 웃음을 이기는 것이 아니라, 하나님이 심판하시고 부활시키신 사람이 있다는 것을 변함없이 선포하는 것입니다.","s":2466.792,"e":2476.721,"p":false,"h":false},{"t":"그 선포를 통해 하나님이 한두 사람의 마음을 여십니다.","s":2477.376,"e":2480.861,"p":true,"h":false}]},{"title":"15. 사도 시대의 표적과 기적은 오늘도 있는가: 사도행전의 능력 이야기를 읽는 법","audio":"book_2610272355_2.mp3","start":2481.768,"end":3136.248,"dur":654.5,"segs":[{"t":"15.","s":2481.768,"e":2482.371,"p":false,"h":false},{"t":"사도 시대의 표적과 기적은 오늘도 있는가: 사도행전의 능력 이야기를 읽는 법","s":2483.676,"e":2489.392,"p":true,"h":false},{"t":"본문: 사도행전 3장 1-10절, 5장 12-16절, 14장 3절, 19장 11-20절 (함께 읽을 본문: 행 2:43, 행 8:6-13, 고후 12:12, 히 2:3-4, 딤후 4:20, 딤전 5:23, 빌 2:25-27, 마 7:21-23, 약 5:14-16)","s":2490.228,"e":2525.607,"p":true,"h":false},{"t":"사도행전은 기적의 책으로 읽혀 왔습니다.","s":2526.336,"e":2529.229,"p":false,"h":false},{"t":"앉은뱅이가 일어나고, 베드로의 그림자가 병자를 덮고, 바울의 손수건이 병을 고치고, 죽은 사람이 살아납니다.","s":2529.792,"e":2538.145,"p":false,"h":false},{"t":"그래서 오늘의 교회가 이렇게 묻는 것은 당연합니다.","s":2538.792,"e":2542.316,"p":false,"h":false},{"t":"이런 일이 왜 오늘은 이렇게 드뭅니까.","s":2542.86,"e":2545.453,"p":false,"h":false},{"t":"우리가 믿음이 부족해서입니까, 아니면 이런 일의 시대가 지났기 때문입니까.","s":2546.064,"e":2551.27,"p":true,"h":false},{"t":"이 물음은 교회 안에서 가장 큰 상처와 논쟁을 낳아 온 문제 가운데 하나입니다.","s":2552.148,"e":2557.494,"p":false,"h":false},{"t":"이 글에서는 어느 한쪽 입장을 편들기에 앞서, 사도행전이 이 기적들을 어떻게 기록하는지를 먼저 살펴봅니다.","s":2558.124,"e":2565.592,"p":true,"h":false},{"t":"누가 행했는가","s":2566.476,"e":2567.735,"p":true,"h":false},{"t":"사도행전의 표적과 기사를 찬찬히 읽으면 한 가지 사실이 눈에 들어옵니다.","s":2568.564,"e":2573.607,"p":false,"h":false},{"t":"대부분의 기적이 사도들과 그들의 동료의 손으로 일어난다는 점입니다.","s":2573.892,"e":2578.214,"p":false,"h":false},{"t":"많은 기사와 표적이 사도들을 통하여 나타났다고 합니다(행 2:43).","s":2578.788,"e":2584.433,"p":false,"h":false},{"t":"사도들의 손으로 많은 표적과 기사가 백성 가운데 나타났다고 합니다(행 5:12).","s":2585.052,"e":2591.434,"p":false,"h":false},{"t":"바울과 바나바가 이고니온에서 오래 있으면서 주를 힘입어 담대히 말했을 때, 주께서 표적과 기사를 그들의 손으로 행하게 하여 그 은혜의 말씀을 증언하셨다고 합니다(행 14:3).","s":2592.072,"e":2605.06,"p":true,"h":false},{"t":"기적이 사도 아닌 사람에게서도 일어납니다.","s":2605.824,"e":2608.642,"p":false,"h":false},{"t":"집사 스데반과 빌립이 그렇습니다.","s":2609.28,"e":2611.845,"p":false,"h":false},{"t":"그러나 이들은 사도들이 안수하여 세운 사람들이었고(행 6:6), 빌립의 사마리아 기적은 사도들의 확인을 거쳤습니다.","s":2612.34,"e":2621.3,"p":false,"h":false},{"t":"다메섹의 제자 아나니아가 사울에게 안수하여 눈을 뜨게 한 일처럼 사도가 아닌 사람이 쓰임받은 장면이 있기는 합니다.","s":2621.952,"e":2629.274,"p":false,"h":false},{"t":"그러나 그것도 주님이 환상으로 직접 그를 보내신 특별한 경우였습니다(행 9:10-18).","s":2629.908,"e":2637.509,"p":false,"h":false},{"t":"일반 신자가 표적을 일상적으로 행하는 모습은 사도행전에 나오지 않습니다.","s":2637.792,"e":2642.901,"p":false,"h":false},{"t":"누가는 이 기적들을 사도적 증언과 묶어서 기록합니다.","s":2643.516,"e":2647.431,"p":true,"h":false},{"t":"기적의 목적","s":2648.304,"e":2649.483,"p":true,"h":false},{"t":"이 기적들이 무엇을 위해 일어났는지도 본문이 말해 줍니다.","s":2650.248,"e":2654.282,"p":false,"h":false},{"t":"14장 3절은 표적과 기사가 그 은혜의 말씀을 증언하신 것이라고 했습니다.","s":2654.928,"e":2660.109,"p":false,"h":false},{"t":"기적은 말씀의 보증이었습니다.","s":2660.76,"e":2663.087,"p":true,"h":false},{"t":"3장에서 베드로와 요한이 성전 미문 앞에서 앉은뱅이를 일으킨 일을 보십시오.","s":2663.64,"e":2668.872,"p":false,"h":false},{"t":"사람들이 놀라 달려오자 베드로는 즉시 설교합니다.","s":2669.328,"e":2672.85,"p":false,"h":false},{"t":"어찌하여 이 일을 이상히 여기느냐, 우리 개인의 능력이나 경건으로 걷게 한 것처럼 우리를 주목하느냐고 묻고, 예수의 이름을 믿는 믿음으로 이 사람이 낫게 된 것이라고 말합니다(행 3:12-16).","s":2673.396,"e":2688.212,"p":false,"h":false},{"t":"그리고 그 설교는 회개하라는 초청으로 이어집니다(행 3:19).","s":2688.732,"e":2694.511,"p":false,"h":false},{"t":"기적은 그 자체로 끝나지 않고 곧바로 예수를 가리키는 손가락이 되었습니다.","s":2695.032,"e":2700.288,"p":true,"h":false},{"t":"신약은 이 점을 분명히 합니다.","s":2701.188,"e":2703.43,"p":false,"h":false},{"t":"히브리서는 구원의 말씀이 주께서 처음 말씀하시고 들은 자들이 우리에게 확증하신 것이며, 하나님도 표적과 기사와 여러 가지 능력과 성령의 나누어 주심으로 그들과 함께 증언하셨다고 합니다(히 2:3-4).","s":2703.996,"e":2719.041,"p":false,"h":false},{"t":"바울은 자기 사도직을 변호하며 사도의 표 곧 표적과 기사와 능력이 너희 가운데서 나타났다고 말합니다(고후 12:12).","s":2719.44,"e":2728.67,"p":false,"h":false},{"t":"기적이 사도의 신임장 역할을 했다는 것입니다.","s":2729.268,"e":2732.383,"p":true,"h":false},{"t":"모든 병이 낫지는 않았다","s":2733.156,"e":2735.162,"p":true,"h":false},{"t":"사도행전의 기적을 읽을 때 놓치기 쉬운 사실이 있습니다.","s":2736,"e":2739.967,"p":false,"h":false},{"t":"사도 시대에도 모든 병이 즉시 낫지는 않았다는 것입니다.","s":2740.572,"e":2744.465,"p":true,"h":false},{"t":"바울은 자기 동역자 드로비모를 밀레도에 병들어 두고 왔다고 합니다(딤후 4:20).","s":2745.36,"e":2752.004,"p":false,"h":false},{"t":"디모데에게는 자주 나는 병 때문에 포도주를 조금 쓰라고 권합니다(딤전 5:23).","s":2752.524,"e":2759.315,"p":false,"h":false},{"t":"에바브로디도는 병들어 죽게 되었다가 하나님이 그를 긍휼히 여기셔서 낫게 되었다고 합니다(빌 2:26-27).","s":2759.832,"e":2768.55,"p":false,"h":false},{"t":"바울 자신은 육체에 가시가 있어 세 번이나 주께 간구했으나 주님은 내 은혜가 네게 족하다고 하셨습니다(고후 12:7-9).","s":2769.048,"e":2778.893,"p":true,"h":false},{"t":"죽은 자도 살린 바울이 병든 동역자를 낫게 하지 못했습니다.","s":2779.704,"e":2783.795,"p":false,"h":false},{"t":"이것은 기적이 사도의 의지에 달린 능력이 아니라 하나님의 뜻에 따라 일어나는 일이었음을 보여 줍니다.","s":2784.456,"e":2790.997,"p":false,"h":false},{"t":"기적은 언제든 꺼내 쓸 수 있는 권능이 아니었습니다.","s":2791.62,"e":2795.026,"p":true,"h":false},{"t":"베드로의 그림자와 바울의 손수건","s":2795.868,"e":2798.283,"p":true,"h":false},{"t":"두 장면은 특별히 조심해서 읽어야 합니다.","s":2798.82,"e":2801.71,"p":false,"h":false},{"t":"사람들이 병자를 길에 내다 놓고 베드로의 그림자라도 그 중 몇 사람에게 덮이기를 바랐다고 합니다(행 5:15).","s":2802.312,"e":2811.279,"p":false,"h":false},{"t":"또 사람들이 바울의 몸에서 손수건과 앞치마를 가져다가 병든 사람에게 얹으면 병이 떠나가고 악귀도 나갔다고 합니다(행 19:12).","s":2811.852,"e":2821.574,"p":true,"h":false},{"t":"이 장면들을 근거로 어떤 물건이나 사람에게 능력이 깃들었다고 가르치는 것은 본문을 크게 오해하는 일입니다.","s":2822.4,"e":2829.76,"p":false,"h":false},{"t":"먼저 본문은 베드로의 그림자가 병을 고쳤다고 말하지 않습니다.","s":2830.356,"e":2834.773,"p":false,"h":false},{"t":"사람들이 그렇게 바랐다고만 합니다.","s":2835.396,"e":2837.887,"p":false,"h":false},{"t":"바울의 손수건에 대해서는 누가가 이렇게 설명합니다.","s":2838.204,"e":2841.755,"p":false,"h":false},{"t":"하나님이 바울의 손으로 놀라운 능력을 행하게 하셨다는 것입니다(행 19:11).","s":2842.38,"e":2848.524,"p":false,"h":false},{"t":"누가는 그것을 평범하지 않은 능력이라고 부르며, 일반적인 일이 아니라 특별한 일이라는 점을 스스로 밝힙니다.","s":2849.004,"e":2856.246,"p":true,"h":false},{"t":"그리고 바로 이어지는 이야기가 이 점을 분명히 합니다.","s":2857.068,"e":2860.738,"p":false,"h":false},{"t":"유대 마술사 스게와의 일곱 아들이 예수의 이름을 주문처럼 써서 귀신을 쫓으려 하다가, 악귀 들린 사람에게 맞아 상처를 입고 벌거벗은 채 도망했습니다(행 19:13-16).","s":2861.28,"e":2874.358,"p":false,"h":false},{"t":"예수의 이름은 사람이 쓰는 도구가 아니었습니다.","s":2874.924,"e":2878.209,"p":false,"h":false},{"t":"그리고 이 일로 에베소 사람들이 두려워 주의 이름을 크게 높였고, 마술을 행하던 많은 사람이 책을 모아 불살랐는데 그 값이 은 오만이었다고 합니다(행 19:17-19).","s":2878.848,"e":2891.819,"p":false,"h":false},{"t":"능력의 결과는 신비한 물건의 숭배가 아니라 마술의 포기와 하나님의 이름이 높아진 것이었습니다.","s":2892.384,"e":2898.694,"p":true,"h":false},{"t":"오늘의 교회는 어떻게 읽는가","s":2899.62,"e":2901.786,"p":true,"h":false},{"t":"이 문제에서 교회는 크게 두 입장으로 나뉘어 있습니다.","s":2902.644,"e":2906.436,"p":true,"h":false},{"t":"하나는 사도적 표적은 사도 시대에 한정되었다는 입장입니다.","s":2907.324,"e":2911.543,"p":false,"h":false},{"t":"이 입장은 기적이 사도들의 말씀이 하나님께로부터 왔음을 확증하는 역할을 했고, 신약 성경이 완성된 뒤에는 이 역할이 성경 자체로 대체되었다고 봅니다.","s":2912.148,"e":2922.302,"p":false,"h":false},{"t":"개혁파 전통의 상당수가 이 입장에 서 있습니다.","s":2922.948,"e":2926.463,"p":true,"h":false},{"t":"다른 하나는 하나님이 오늘도 사도 시대와 같은 방식으로 표적을 행하신다는 입장입니다.","s":2927.34,"e":2933.087,"p":false,"h":false},{"t":"이 입장은 사도행전과 고린도전서의 은사들이 폐지되었다는 근거가 성경에 없다고 봅니다.","s":2933.712,"e":2939.659,"p":false,"h":false},{"t":"오순절 계통과 은사주의 교회뿐 아니라 개혁파 안에서도 이 입장을 지지하는 사람이 있습니다.","s":2940.3,"e":2946.619,"p":true,"h":false},{"t":"이 글은 첫 번째 입장에서 읽습니다.","s":2947.5,"e":2950.103,"p":false,"h":false},{"t":"앞에서 본 이유들 때문입니다.","s":2950.416,"e":2952.602,"p":false,"h":false},{"t":"기적은 사도들과 연결되어 나타났고, 목적은 말씀의 증언이었고, 일반 신자가 행하는 표준 방식으로 기록되지 않았으며, 사도 시대에도 모든 병이 즉시 낫지는 않았습니다.","s":2953.26,"e":2965.762,"p":false,"h":false},{"t":"그러나 이 입장에서도 분명히 해야 할 것이 있습니다.","s":2966.4,"e":2969.995,"p":false,"h":false},{"t":"하나님이 오늘 병을 고치시고 기적을 행하실 수 있다는 것을 부정하는 것이 아닙니다.","s":2970.612,"e":2975.821,"p":false,"h":false},{"t":"하나님은 언제나 전능하십니다.","s":2976.444,"e":2978.692,"p":false,"h":false},{"t":"야고보서는 병든 사람이 있으면 교회의 장로들을 청하여 기름을 바르며 기도하라고 하고, 믿음의 기도는 병든 자를 구원하리라고 합니다(약 5:14-15).","s":2979.036,"e":2990.882,"p":false,"h":false},{"t":"하나님은 기도에 응답하여 병을 고치십니다.","s":2991.42,"e":2994.612,"p":false,"h":false},{"t":"다만 이것이 사도 시대의 표적이 오늘 신자의 표준이라는 뜻은 아닙니다.","s":2995.164,"e":3000.246,"p":true,"h":false},{"t":"기적을 판단하는 기준","s":3000.78,"e":3002.548,"p":true,"h":false},{"t":"기적을 어떻게 분별해야 하는가 하는 물음도 남습니다.","s":3003.156,"e":3006.559,"p":false,"h":false},{"t":"성경은 기적이 일어났다는 사실만으로 그 일이 하나님에게서 났다고 보지 않습니다.","s":3007.188,"e":3012.573,"p":false,"h":false},{"t":"신명기는 선지자가 표적과 기사를 보이면서 다른 신들을 따르자고 하면 그 말을 듣지 말라고 합니다(신 13:1-3).","s":3013.2,"e":3022.478,"p":false,"h":false},{"t":"예수께서도 그날에 많은 사람이 주여 주여 우리가 주의 이름으로 예언하고 귀신을 쫓아내고 많은 권능을 행하지 않았습니까 하더라도, 나는 너희를 모른다고 말씀하실 것이라고 하셨습니다(마 7:22-23).","s":3023.028,"e":3037.861,"p":true,"h":false},{"t":"기적은 말씀의 증거가 될 수 있어도 말씀 위에 서는 권위가 될 수 없습니다.","s":3038.616,"e":3043.551,"p":false,"h":false},{"t":"어떤 일이 기적처럼 보인다고 해서 그 말하는 사람의 가르침이 옳은 것이 되지 않습니다.","s":3044.16,"e":3050.027,"p":false,"h":false},{"t":"판단은 언제나 성경이 가르친 복음과 일치하는가에 있습니다.","s":3050.676,"e":3054.78,"p":true,"h":false},{"t":"고통 가운데 있는 신자에게","s":3055.68,"e":3057.912,"p":true,"h":false},{"t":"이 글을 읽는 사람 가운데는 병 때문에 간절히 기도해 왔으나 낫지 않은 사람이 있을 것입니다.","s":3058.344,"e":3064.601,"p":false,"h":false},{"t":"그리고 누군가에게서 믿음이 부족해서 낫지 않는다는 말을 들었을 수도 있습니다.","s":3065.22,"e":3070.412,"p":true,"h":false},{"t":"사도행전은 그 말을 뒷받침하지 않습니다.","s":3071.304,"e":3074.195,"p":false,"h":false},{"t":"바울의 가시가 낫지 않은 것은 믿음이 부족해서가 아니었고, 드로비모가 병든 채 남은 것도 그러했습니다.","s":3074.796,"e":3081.602,"p":false,"h":false},{"t":"주님은 바울에게 내 은혜가 네게 족하다고 하셨고, 약한 데서 능력이 온전해진다고 하셨습니다(고후 12:9).","s":3082.248,"e":3090.918,"p":false,"h":false},{"t":"병이 낫는 것도 은혜이고, 낫지 않는 가운데서 붙들림을 받는 것도 은혜입니다.","s":3091.5,"e":3097.178,"p":false,"h":false},{"t":"신자의 믿음은 병이 낫는다는 약속을 붙드는 것이 아니라, 병 가운데서도 나를 붙드시는 그리스도를 붙드는 것입니다.","s":3097.8,"e":3105.568,"p":true,"h":false},{"t":"표적을 구하는 마음이 어디서 오는지도 살필 필요가 있습니다.","s":3106.476,"e":3110.417,"p":false,"h":false},{"t":"주님은 악하고 음란한 세대가 표적을 구한다고 하셨습니다(마 12:39).","s":3111.012,"e":3117.023,"p":false,"h":false},{"t":"우리가 정말 구해야 할 것은 표적이 아니라 표적이 가리키는 분입니다.","s":3117.528,"e":3122.26,"p":false,"h":false},{"t":"사도행전의 모든 기적은 한 곳을 향했습니다.","s":3122.928,"e":3125.982,"p":false,"h":false},{"t":"부활하신 예수께서 살아 계시고 다스리신다는 사실입니다.","s":3126.528,"e":3130.45,"p":false,"h":false},{"t":"기적을 보든 보지 못하든, 그 사실이 신자의 소망입니다.","s":3131.1,"e":3135.355,"p":true,"h":false}]},{"title":"16. 재판받는 바울과 활짝 열린 결말은 무엇을 말하는가: 사도행전 마지막 여덟 장","audio":"book_2610272355_2.mp3","start":3136.248,"end":3881.592,"dur":745.3,"segs":[{"t":"16.","s":3136.248,"e":3136.875,"p":false,"h":false},{"t":"재판받는 바울과 활짝 열린 결말은 무엇을 말하는가: 사도행전 마지막 여덟 장","s":3138.156,"e":3144.359,"p":true,"h":false},{"t":"본문: 사도행전 21장 27절-28장 31절 (함께 읽을 본문: 행 9:15-16, 행 23:11, 행 27:23-24, 빌 1:12-14, 엡 6:19-20, 딤후 4:6-8)","s":3145.248,"e":3169.144,"p":true,"h":false},{"t":"사도행전을 끝까지 읽은 독자는 이상한 사실에 놀랍니다.","s":3169.62,"e":3173.675,"p":false,"h":false},{"t":"책의 마지막 여덟 장이 대부분 바울이 체포되고 재판받고 갇혀 있는 이야기라는 것입니다.","s":3174.3,"e":3180.172,"p":false,"h":false},{"t":"스물여덟 장 가운데 거의 사분의 일입니다.","s":3180.852,"e":3183.87,"p":true,"h":false},{"t":"복음이 땅끝으로 퍼져 나가는 이야기를 기대한 독자는 이 부분에서 당황하기 쉽습니다.","s":3184.704,"e":3190.16,"p":false,"h":false},{"t":"전도 여행도 없고, 교회 개척도 거의 없습니다.","s":3190.788,"e":3194.671,"p":false,"h":false},{"t":"대신 법정과 감옥과 폭풍과 배가 나옵니다.","s":3195.324,"e":3198.643,"p":false,"h":false},{"t":"그리고 책은 결론도 없이 끝납니다.","s":3199.284,"e":3201.936,"p":false,"h":false},{"t":"바울의 재판이 어떻게 되었는지 알려 주지 않습니다.","s":3202.488,"e":3206.032,"p":true,"h":false},{"t":"이 글에서는 누가가 왜 이 이야기를 이토록 길게 기록했는지, 그리고 왜 이런 모양으로 책을 닫았는지를 살펴봅니다.","s":3206.916,"e":3215.271,"p":false,"h":false},{"t":"이 마지막 부분을 이해하면 사도행전 전체가 다시 읽힙니다.","s":3215.916,"e":3220.258,"p":true,"h":false},{"t":"체포에서 호송까지","s":3221.172,"e":3222.818,"p":true,"h":false},{"t":"사건의 흐름을 먼저 간단히 따라가 보겠습니다.","s":3223.62,"e":3226.677,"p":false,"h":false},{"t":"바울은 예루살렘에 올라가 성전에서 아시아에서 온 유대인들에게 붙잡히고, 소동 가운데 로마 천부장에게 구출되어 병영으로 끌려갑니다(행 21:27-36).","s":3226.968,"e":3239.513,"p":false,"h":false},{"t":"군중 앞에서 자기가 어떻게 주님을 만났는지를 변호하지만 이방인에게 보냄을 받았다는 말에 군중이 다시 격분합니다(행 22장).","s":3240.108,"e":3249.649,"p":false,"h":false},{"t":"공회 앞에서는 바리새인과 사두개인의 분열이 일어나 소동이 또 번집니다(행 23장).","s":3250.296,"e":3257.486,"p":true,"h":false},{"t":"그날 밤에 주님이 바울 곁에 서서 말씀하십니다.","s":3258.072,"e":3261.312,"p":false,"h":false},{"t":"담대하라 네가 예루살렘에서 나에 대하여 증언한 것 같이 로마에서도 증언해야 하리라(행 23:11).","s":3261.924,"e":3269.747,"p":false,"h":false},{"t":"이 한 마디가 이 장면들 전체를 이끄는 열쇠입니다.","s":3270.348,"e":3274.104,"p":false,"h":false},{"t":"바울이 겪는 모든 일은 이 약속을 향해 가고 있었습니다.","s":3274.416,"e":3278.169,"p":true,"h":false},{"t":"사십여 명이 바울을 죽이기로 맹세하는 음모가 드러나고, 바울은 가이사랴로 호송되어 총독 벨릭스 앞에 섭니다(행 24장).","s":3279.096,"e":3288.747,"p":false,"h":false},{"t":"벨릭스는 결정을 미루고 이 년 동안 바울을 붙잡아 둡니다.","s":3289.032,"e":3293.148,"p":false,"h":false},{"t":"새 총독 베스도가 오자 바울은 가이사에게 상소합니다(행 25:11).","s":3293.784,"e":3299.864,"p":false,"h":false},{"t":"그 사이에 아그립바 왕이 와서 바울의 말을 듣는 자리에 앉습니다(행 26장).","s":3300.372,"e":3306.661,"p":false,"h":false},{"t":"그리고 바울은 죄수가 되어 배에 실려 로마로 향합니다.","s":3307.284,"e":3310.829,"p":true,"h":false},{"t":"세 번의 변호가 말해 주는 것","s":3311.748,"e":3313.694,"p":true,"h":false},{"t":"바울의 변호는 세 번 길게 기록됩니다.","s":3314.448,"e":3317.27,"p":false,"h":false},{"t":"군중 앞의 변호(행 22장), 총독 벨릭스 앞의 변호(행 24장), 그리고 아그립바 왕 앞의 변호(행 26장)입니다.","s":3317.904,"e":3330.941,"p":false,"h":false},{"t":"각각 다른 청중에게 다른 방식으로 말하지만 중심은 하나입니다.","s":3331.584,"e":3335.853,"p":false,"h":false},{"t":"부활에 대한 소망 때문에 내가 심문을 받는다는 것입니다(행 23:6, 24:21, 26:6-8).","s":3336.516,"e":3346.542,"p":true,"h":false},{"t":"그리고 로마 관리들의 판단은 한결같았습니다.","s":3347.244,"e":3350.461,"p":false,"h":false},{"t":"천부장은 이 사람이 죽거나 결박당할 만한 죄를 범하지 않았다고 했습니다(행 23:29).","s":3351.096,"e":3358.499,"p":false,"h":false},{"t":"베스도도 죽을 죄를 지은 것이 없다고 했습니다(행 25:25).","s":3358.98,"e":3364.425,"p":false,"h":false},{"t":"아그립바 왕은 이 사람이 가이사에게 상소하지 아니하였더라면 놓일 수 있었을 것이라고 했습니다(행 26:32).","s":3364.884,"e":3373.662,"p":true,"h":false},{"t":"누가가 이 판결들을 기록하는 이유는 분명합니다.","s":3374.532,"e":3377.965,"p":false,"h":false},{"t":"복음은 로마 법에 위배되는 반란이 아니라는 것입니다.","s":3378.492,"e":3382.072,"p":false,"h":false},{"t":"교회가 로마 제국 안에서 정당하게 존재할 수 있다는 변증이기도 합니다.","s":3382.74,"e":3387.355,"p":false,"h":false},{"t":"그러나 이 점이 이 이야기의 전부는 아닙니다.","s":3387.996,"e":3391.301,"p":false,"h":false},{"t":"더 깊은 의미가 있습니다.","s":3391.596,"e":3393.626,"p":true,"h":false},{"t":"주님이 하신 약속의 성취","s":3394.548,"e":3396.459,"p":true,"h":false},{"t":"바울이 처음 부르심을 받았을 때 주님은 아나니아에게 이렇게 말씀하셨습니다.","s":3397.068,"e":3401.81,"p":false,"h":false},{"t":"이 사람은 내 이름을 이방인과 임금들과 이스라엘 자손 앞에서 전하기 위하여 택한 나의 그릇이다(행 9:15).","s":3402.396,"e":3411.205,"p":false,"h":false},{"t":"임금들 앞에서 전한다는 말씀이 여기서 이루어집니다.","s":3411.72,"e":3415.379,"p":false,"h":false},{"t":"벨릭스와 베스도, 그리고 아그립바 왕 앞에서 바울은 하나님의 복음을 증언합니다.","s":3416.04,"e":3421.645,"p":false,"h":false},{"t":"그리고 가이사 앞에 설 것이라는 약속(행 27:24)이 배 위에서 한 번 더 확인됩니다.","s":3422.268,"e":3430.344,"p":true,"h":false},{"t":"또 주님은 이렇게 말씀하셨습니다.","s":3431.232,"e":3433.749,"p":false,"h":false},{"t":"그가 내 이름을 위하여 얼마나 많은 고난을 받아야 할 것을 내가 그에게 보이리라(행 9:16).","s":3434.364,"e":3441.618,"p":false,"h":false},{"t":"감옥과 재판과 쇠사슬은 이 약속의 성취입니다.","s":3442.248,"e":3445.925,"p":false,"h":false},{"t":"바울에게 일어난 일은 하나님의 계획이 중단된 것이 아니라 계획 그대로 진행되는 것이었습니다.","s":3446.568,"e":3452.602,"p":false,"h":false},{"t":"그는 자유롭게 전도 여행을 다니던 때에도, 쇠사슬에 매인 채로 호송되던 때에도 주님의 그릇이었습니다.","s":3453.228,"e":3460.351,"p":true,"h":false},{"t":"폭풍 속의 약속","s":3461.256,"e":3462.729,"p":true,"h":false},{"t":"27장은 이야기 전체에서 가장 극적인 장면입니다.","s":3463.236,"e":3467.147,"p":false,"h":false},{"t":"로마로 가는 배가 유라굴로라는 광풍을 만나 여러 날 해도 별도 보이지 않고 풍랑이 심해서 구원의 여망까지 없어졌다고 합니다(행 27:20).","s":3467.772,"e":3478.737,"p":false,"h":false},{"t":"모두가 절망한 그 순간에 바울이 일어나 말합니다.","s":3479.364,"e":3482.747,"p":false,"h":false},{"t":"하나님의 사자가 어젯밤에 내 곁에 서서 말하기를 바울아 무서워하지 말라 네가 가이사 앞에 서야 하겠고 하나님이 너와 함께 항해하는 자들을 다 네게 주셨다고 하셨다는 것입니다(행 27:23-24).","s":3483.396,"e":3497.913,"p":true,"h":false},{"t":"여기서 눈에 띄는 것은 죄수가 배의 모든 사람을 안심시키는 위치에 서 있다는 점입니다.","s":3498.768,"e":3504.376,"p":false,"h":false},{"t":"이 배의 지휘자는 선장이고 백부장이지만, 실제로 배를 이끄는 이는 하나님의 약속을 받은 죄수입니다.","s":3505.032,"e":3511.867,"p":false,"h":false},{"t":"그리고 결과는 약속대로입니다.","s":3512.52,"e":3514.848,"p":false,"h":false},{"t":"배는 파선하여 부서졌으나 배에 탄 이백칠십육 명이 모두 구원을 얻습니다(행 27:37, 44).","s":3515.436,"e":3524.343,"p":true,"h":false},{"t":"누가는 이 장에서 구원받는다는 말을 여러 번 되풀이합니다.","s":3525.048,"e":3529.057,"p":false,"h":false},{"t":"구원의 여망이 없어졌다는 말로 시작해서(행 27:20), 이 사람들이 배에 있지 아니하면 너희가 구원을 얻지 못하리라는 말을 거쳐(행 27:31), 모두 구원을 받았다는 말로 끝납니다.","s":3529.692,"e":3545.544,"p":false,"h":false},{"t":"육체의 생명을 구원받는 이야기이지만 누가가 같은 말을 이렇게 반복하는 데는 의도가 있어 보입니다.","s":3546.18,"e":3552.802,"p":false,"h":false},{"t":"하나님의 약속은 폭풍과 난파를 지나서도 취소되지 않는다는 것을 보여 주는 이야기이기 때문입니다.","s":3553.452,"e":3559.744,"p":true,"h":false},{"t":"몰타에서는 바울이 독사에게 물렸는데도 해를 입지 않아서 섬 사람들이 그를 신이라고 했다고 합니다(행 28:3-6).","s":3560.616,"e":3569.855,"p":false,"h":false},{"t":"이어서 바울이 섬의 우두머리 보블리오의 아버지를 비롯해 병든 사람들을 고치는 장면이 나오는데(행 28:7-9), 갇힌 죄수의 몸으로도 복음의 길이 열리는 모습을 보여 줍니다.","s":3570.48,"e":3583.512,"p":true,"h":false},{"t":"로마에 도착한 죄수","s":3584.412,"e":3586.122,"p":true,"h":false},{"t":"바울이 마침내 로마에 가까이 이르자 그 소식을 들은 로마의 형제들이 압비오 광장과 트레이스 타베르네까지 마중 나옵니다.","s":3586.968,"e":3594.575,"p":false,"h":false},{"t":"바울은 그들을 보고 하나님께 감사하고 담대한 마음을 얻었다고 합니다(행 28:15).","s":3595.212,"e":3602.207,"p":false,"h":false},{"t":"죄수로 호송되어 오면서도 형제들을 만나자 힘을 얻는 바울의 모습이 인간적입니다.","s":3602.7,"e":3608.257,"p":true,"h":false},{"t":"그리고 책은 이렇게 끝납니다.","s":3609.144,"e":3611.31,"p":false,"h":false},{"t":"바울이 만 이태 동안 자기 셋집에 머물면서 자기에게 오는 사람을 다 영접하고 하나님 나라를 전파하며 주 예수 그리스도의 일을 가르치되 담대히 거침없이 하더라(행 28:30-31).","s":3611.88,"e":3626.126,"p":true,"h":false},{"t":"활짝 열린 결말","s":3626.856,"e":3628.392,"p":true,"h":false},{"t":"이 결말은 독자에게 의문을 남깁니다.","s":3629.232,"e":3632.226,"p":false,"h":false},{"t":"바울의 재판은 어떻게 되었습니까.","s":3632.868,"e":3635.211,"p":false,"h":false},{"t":"그는 석방되었습니까, 순교했습니까.","s":3635.784,"e":3638.751,"p":false,"h":false},{"t":"누가는 왜 말하지 않았습니까.","s":3639.312,"e":3641.486,"p":true,"h":false},{"t":"여러 가지 설명이 제시되어 왔습니다.","s":3642.336,"e":3644.781,"p":false,"h":false},{"t":"누가가 이 책을 쓸 때 재판이 아직 끝나지 않았다는 설명이 있고, 누가가 이야기를 계속 이어 갈 세 번째 책을 구상했다는 설명이 있고, 누가가 의도적으로 열린 결말을 택했다는 설명이 있습니다.","s":3645.396,"e":3658.647,"p":false,"h":false},{"t":"본문만으로 확정할 수는 없습니다.","s":3659.292,"e":3661.746,"p":true,"h":false},{"t":"그러나 책의 구조에서 읽을 수 있는 것이 있습니다.","s":3662.604,"e":3665.807,"p":false,"h":false},{"t":"사도행전은 1장 1절에서 예수께서 행하시며 가르치기를 시작하신 일을 쓴 책이라고 했습니다.","s":3666.348,"e":3672.633,"p":false,"h":false},{"t":"시작하신 일이라고 했으니, 그 일이 아직 끝나지 않았다는 뜻입니다.","s":3673.26,"e":3678.125,"p":false,"h":false},{"t":"책의 마지막 단어는 거침없이입니다.","s":3678.732,"e":3681.324,"p":false,"h":false},{"t":"이 단어는 막히지 않고라는 뜻을 가진 말입니다.","s":3681.9,"e":3685.091,"p":false,"h":false},{"t":"바울은 쇠사슬에 매였으나 복음은 매이지 않았다는 것이 마지막 선언입니다.","s":3685.716,"e":3690.556,"p":true,"h":false},{"t":"그래서 이 결말은 바울의 이야기가 끝나지 않았다는 뜻이 아니라, 복음의 이야기가 끝나지 않았다는 뜻으로 읽힙니다.","s":3691.44,"e":3699.046,"p":false,"h":false},{"t":"승천하신 주님이 하늘에서 성령으로 일하시는 이야기는 28장에서 닫히지 않고 독자의 시대로 이어집니다.","s":3699.72,"e":3707.131,"p":true,"h":false},{"t":"바울의 마지막은 훗날 다른 편지에서 짐작할 수 있습니다.","s":3707.928,"e":3711.976,"p":false,"h":false},{"t":"디모데후서에서 바울은 자기가 이미 전제로 부어지고 있고 세상을 떠날 시각이 가까웠다고 말합니다(딤후 4:6).","s":3712.572,"e":3721.427,"p":false,"h":false},{"t":"사도행전은 바울의 죽음을 기록하지 않았습니다.","s":3722.04,"e":3725.309,"p":false,"h":false},{"t":"사도행전의 주인공은 처음부터 바울이 아니었기 때문입니다.","s":3725.892,"e":3730.035,"p":true,"h":false},{"t":"감옥이 사역의 자리가 되다","s":3730.932,"e":3732.885,"p":true,"h":false},{"t":"이 마지막 부분에서 하나 더 덧붙이고 싶은 것이 있습니다.","s":3733.776,"e":3737.619,"p":false,"h":false},{"t":"바울이 로마에 갇혀 있던 시기에 쓴 것으로 전통적으로 알려진 편지들이 있습니다.","s":3738.276,"e":3743.523,"p":false,"h":false},{"t":"빌립보서, 에베소서, 골로새서, 빌레몬서입니다.","s":3744.144,"e":3749.739,"p":false,"h":false},{"t":"신약의 가장 깊은 신학 가운데 일부가 감옥에서 쓰인 것입니다.","s":3750.336,"e":3754.589,"p":true,"h":false},{"t":"빌립보서에서 바울은 이렇게 씁니다.","s":3755.484,"e":3758.077,"p":false,"h":false},{"t":"내게 일어난 일이 도리어 복음 전파에 진전이 된 줄을 너희가 알기를 원하노라(빌 1:12).","s":3758.616,"e":3765.595,"p":false,"h":false},{"t":"감옥에 갇힌 일 때문에 시위대 전체와 다른 모든 사람에게 그리스도를 위하여 매인 것이 알려졌고, 형제 중 다수가 나의 매임을 인하여 주 안에서 신뢰함으로 더욱 담대하게 말씀을 전한다고 합니다(빌 1:13-14).","s":3766.176,"e":3781.917,"p":false,"h":false},{"t":"에베소서에서도 쇠사슬에 매인 사신이 되었으나 담대히 복음의 비밀을 알게 하기를 구한다고 말합니다(엡 6:19-20).","s":3782.412,"e":3791.867,"p":true,"h":false},{"t":"사도행전의 마지막 여덟 장은 한 사람이 갇히는 이야기가 아니라, 갇힌 곳에서도 복음이 힘 있게 일하는 이야기입니다.","s":3792.672,"e":3800.483,"p":false,"h":false},{"t":"하나님은 바울을 로마로 보내는 데 재판을 쓰셨고, 배를 쓰셨고, 폭풍을 쓰셨고, 쇠사슬을 쓰셨습니다.","s":3801.132,"e":3809.111,"p":false,"h":false},{"t":"인간의 눈에 좌절로 보이는 모든 일이 하나님의 손에서는 길이었습니다.","s":3809.664,"e":3814.271,"p":true,"h":false},{"t":"그리스도인이 고난 속에서 읽는 법","s":3815.136,"e":3817.47,"p":true,"h":false},{"t":"이 이야기가 신자에게 주는 위로는 이것입니다.","s":3818.376,"e":3821.655,"p":false,"h":false},{"t":"우리의 삶에도 계획이 어긋나고 길이 막히고 갇힌 것 같은 시기가 옵니다.","s":3822.3,"e":3826.955,"p":false,"h":false},{"t":"그때 신자는 자기가 하나님의 계획 밖에 떨어졌다고 생각하기 쉽습니다.","s":3827.592,"e":3832.404,"p":true,"h":false},{"t":"그러나 바울의 감옥은 계획 밖이 아니었습니다.","s":3833.28,"e":3836.55,"p":false,"h":false},{"t":"감옥은 주님이 약속하신 길 위에 있었습니다.","s":3837.204,"e":3840.532,"p":false,"h":false},{"t":"로마로 가는 길은 쇠사슬과 난파를 통과하는 길이었고, 그것이 땅끝으로 가는 길이었습니다.","s":3841.164,"e":3847.473,"p":false,"h":false},{"t":"이 사실이 알려 주는 것은 하나님이 고난을 좋아하신다는 것이 아니라, 하나님의 약속은 우리가 원하는 길로만 이루어지지 않으며 어떤 길을 지나서도 이루어진다는 것입니다.","s":3848.112,"e":3858.856,"p":true,"h":false},{"t":"그리고 복음은 갇히지 않습니다.","s":3859.704,"e":3862.022,"p":false,"h":false},{"t":"누가의 마지막 단어가 그것을 가르칩니다.","s":3862.584,"e":3865.476,"p":false,"h":false},{"t":"거침없이.","s":3866.112,"e":3867.19,"p":false,"h":false},{"t":"우리가 갇혀도 복음은 갇히지 않고, 우리가 쓰러져도 복음은 쓰러지지 않습니다.","s":3868.02,"e":3873.458,"p":false,"h":false},{"t":"사도행전의 이야기가 우리의 시대로 이어지는 까닭은 이 복음이 사람의 힘으로 서 있지 않기 때문입니다.","s":3874.032,"e":3880.713,"p":true,"h":false}]},{"title":"17. 하나의 줄기로 읽는 사도행전","audio":"book_2610272355_2.mp3","start":3881.592,"end":4343.508,"dur":461.9,"segs":[{"t":"17.","s":3881.592,"e":3882.373,"p":false,"h":false},{"t":"하나의 줄기로 읽는 사도행전","s":3883.5,"e":3885.615,"p":true,"h":false},{"t":"본문: 사도행전 전체 (함께 읽을 본문: 행 1:1-11, 행 6:7, 행 9:31, 행 12:24, 행 16:5, 행 19:20, 행 28:30-31)","s":3886.452,"e":3908.167,"p":true,"h":false},{"t":"지금까지 열여섯 편에서 사도행전의 물음들을 하나씩 따라왔습니다.","s":3908.844,"e":3913.223,"p":false,"h":false},{"t":"마지막으로 한 걸음 물러서서 책 전체를 한 줄기로 읽어 보겠습니다.","s":3913.884,"e":3918.469,"p":false,"h":false},{"t":"물음이 많았지만 이 책은 처음부터 끝까지 하나의 이야기입니다.","s":3919.104,"e":3923.758,"p":true,"h":false},{"t":"책의 목차","s":3924.648,"e":3925.679,"p":true,"h":false},{"t":"사도행전에는 목차가 따로 없는데, 1장 8절이 그 역할을 합니다.","s":3926.556,"e":3931.323,"p":false,"h":false},{"t":"성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라고 승천하시기 직전의 주님이
