<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>사도행전 깊이 들어가기</title>
<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:120px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }
  header h1 { font-size:30px; font-weight:900; line-height:1.4; letter-spacing:-0.01em; }
  header .meta { color:var(--mute); font-size:16px; margin:6px 0 4px; }
  header .rule { height:4px; width:64px; background:var(--acc); border-radius:4px; margin:14px 0 22px; }
  #resume { display:none; background:#EAF3EC; border:2px solid #BFD9C7; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #resume button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  .top { margin:0 0 8px; }
  button.auto { font:inherit; font-weight:900; font-size:19px; height:52px; padding:0 20px; border-radius:14px; cursor:pointer; background:#EEE; color:#555; border:2px solid #CCC; }
  button.auto.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .autohint { font-size:17px; line-height:1.6; margin:6px 0 16px; color:var(--mute); }
  .autohint.off { color:#9a4a00; font-weight:700; }
  #note { display:none; background:#FFF3DC; border:2px solid #F0D49A; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #note button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  details#lst { background:#fff; border:2px solid #DCE6DF; border-radius:14px; padding:10px 16px; margin-bottom:20px; }
  details#lst summary { cursor:pointer; font-weight:900; font-size:18px; color:var(--acc); }
  #toc { margin:10px 0 4px 22px; font-size:19px; }
  #toc li { margin:6px 0; }
  #toc a { color:var(--ink); text-decoration:none; }
  #toc .d { color:var(--mute); font-size:15px; margin-left:6px; }
  section.trk { margin-top:34px; padding-top:6px; border-top:3px solid #DCE6DF; scroll-margin-top:12px; }
  section.trk:first-child { margin-top:0; border-top:0; }
  h2.tt { font-size:calc(var(--fs) + 8px); font-weight:900; margin:.6em 0 .6em; line-height:1.45; }
  #text p { font-size:var(--fs); margin-bottom:1.1em; }
  #text h3.hd { font-size:calc(var(--fs) + 4px); font-weight:900; margin:1.6em 0 .6em; color:var(--acc); line-height:1.5; }
  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .now { text-align:center; font-size:14px; opacity:.9; padding:6px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  .bar button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  .bar button:active { transform:scale(.96); }
  .bar button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  .bar button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  @media (max-width:640px) { header h1 { font-size:25px; } .bar button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>

<script>
(function () {
  const TITLE = "사도행전 깊이 들어가기", TRACKS = [{"title":"1. 나라의 회복을 묻는 제자들에게 왜 때를 말씀하지 않으시는가: 승천과 사도행전의 첫 물음","audio":"book_2610272355_1.mp3","start":0,"end":820.404,"dur":820.4,"segs":[{"t":"1.","s":0,"e":0.558,"p":false,"h":false},{"t":"나라의 회복을 묻는 제자들에게 왜 때를 말씀하지 않으시는가: 승천과 사도행전의 첫 물음","s":1.908,"e":8.505,"p":true,"h":false},{"t":"본문: 사도행전 1장 1-11절 (함께 읽을 본문: 눅 24:44-53, 단 7:13-14, 시 110:1, 행 2:29-36, 행 3:19-21, 행 15:13-18)","s":9.36,"e":31.735,"p":true,"h":false},{"t":"사도행전은 질문으로 시작합니다.","s":32.22,"e":34.663,"p":true,"h":false},{"t":"부활하신 주님이 사십 일 동안 제자들에게 하나님 나라의 일을 말씀하셨습니다.","s":35.532,"e":40.575,"p":false,"h":false},{"t":"그리고 마지막 날, 제자들이 묻습니다.","s":41.22,"e":44.241,"p":false,"h":false},{"t":"주님, 바로 이때에 이스라엘 나라를 다시 세우시는 것입니까.","s":44.856,"e":49.193,"p":true,"h":false},{"t":"이 질문은 엉뚱해 보입니다.","s":50.076,"e":52.082,"p":false,"h":false},{"t":"사십 일이나 배우고도 아직 그 말을 하느냐고 답답해하기 쉽습니다.","s":52.704,"e":57.166,"p":false,"h":false},{"t":"그런데 주님의 대답은 더 뜻밖입니다.","s":57.78,"e":60.486,"p":false,"h":false},{"t":"주님은 질문을 꾸짖지도 않으시고, 그렇다 아니다 하고 답하지도 않으십니다.","s":61.092,"e":66.32,"p":false,"h":false},{"t":"때는 너희가 알 바가 아니라고 하시고, 곧바로 말씀을 돌려 성령과 증인과 땅끝을 말씀하십니다.","s":66.96,"e":73.728,"p":true,"h":false},{"t":"이 글에서는 이 대답이 무엇을 뜻하는지, 그리고 곧이어 일어나는 승천이 이 질문과 어떻게 이어지는지를 살펴봅니다.","s":74.628,"e":83.011,"p":false,"h":false},{"t":"이 물음 하나를 붙잡으면 사도행전 스물여덟 장이 그 대답으로 읽히기 시작합니다.","s":83.628,"e":89.284,"p":true,"h":false},{"t":"사도행전의 주어는 누구인가","s":90.144,"e":92.262,"p":true,"h":false},{"t":"누가는 책을 시작하면서 자신이 먼저 쓴 책, 곧 누가복음을 돌아봅니다.","s":93.168,"e":98.859,"p":false,"h":false},{"t":"그 책에는 예수께서 행하시며 가르치시기를 시작하신 모든 일을 적었다고 말합니다(행 1:1).","s":99.432,"e":106.885,"p":false,"h":false},{"t":"여기서 시작하셨다는 말이 중요합니다.","s":107.352,"e":109.948,"p":true,"h":false},{"t":"누가복음이 예수께서 시작하신 일이라면, 사도행전은 그 일의 계속입니다.","s":110.844,"e":116.13,"p":false,"h":false},{"t":"주님은 승천하셨지만 일을 그치신 것이 아닙니다.","s":116.784,"e":120.266,"p":false,"h":false},{"t":"하늘에서, 성령으로, 사도들을 통해 그 일을 이어 가십니다.","s":120.888,"e":125.709,"p":true,"h":false},{"t":"그래서 이 책은 흔히 사도들의 행적이라고 불리지만, 책의 주어는 끝까지 주님이십니다.","s":126.576,"e":132.593,"p":false,"h":false},{"t":"오순절에 성령을 부어 주시는 분도 승천하신 주님이시고(행 2:33), 다메섹 길에서 사울을 붙드시는 분도 그분이십니다.","s":133.2,"e":142.661,"p":false,"h":false},{"t":"사도들은 주님이 일하시는 통로이지 이야기의 주인공이 아닙니다.","s":143.28,"e":147.399,"p":false,"h":false},{"t":"이 점을 놓치면 사도행전은 위대한 사람들의 활약담으로 읽혀 버립니다.","s":147.924,"e":152.766,"p":true,"h":false},{"t":"제자들은 무엇을 물었는가","s":153.648,"e":155.738,"p":true,"h":false},{"t":"제자들의 질문은 근거 없이 나온 것이 아닙니다.","s":156.636,"e":159.83,"p":false,"h":false},{"t":"구약은 하나님이 흩어진 백성을 다시 모으시고 그들을 회복시키시겠다고 거듭 약속합니다.","s":160.416,"e":166.562,"p":false,"h":false},{"t":"에스겔은 하나님이 자기 영을 백성 속에 두시고 새 마음을 주셔서 그들이 다시 자기 땅에서 살게 하시겠다고 말합니다(겔 36:24-28).","s":167.22,"e":177.858,"p":false,"h":false},{"t":"부활하신 주님을 직접 본 제자들이 이제 그 약속이 이루어질 때가 왔다고 생각한 것은 성경에 충실한 기대였습니다.","s":178.308,"e":185.813,"p":true,"h":false},{"t":"다만 그 기대 안에는 아직 풀리지 않은 것이 있었습니다.","s":186.696,"e":190.619,"p":false,"h":false},{"t":"제자들은 사십 일 동안 하나님 나라에 관한 말씀을 들었는데도(행 1:3), 그 나라를 이스라엘이라는 한 민족의 일로 생각하고 있었습니다.","s":191.268,"e":201.303,"p":false,"h":false},{"t":"그 나라가 어떤 나라이고 누구에게 열리는지는 오순절 이후에야 분명해집니다.","s":201.96,"e":207.438,"p":true,"h":false},{"t":"여기서 주님의 대답을 눈여겨봐야 합니다.","s":208.296,"e":211.005,"p":false,"h":false},{"t":"주님은 나라가 회복되지 않는다고 하지 않으십니다.","s":211.608,"e":214.862,"p":false,"h":false},{"t":"다만 때를 묻는 자리에서 제자들을 다른 곳으로 돌려세우십니다.","s":215.532,"e":219.777,"p":true,"h":false},{"t":"대답은 한 줄로 이어진다","s":220.68,"e":222.63,"p":true,"h":false},{"t":"주님의 대답은 두 절 안에 들어 있습니다(행 1:7-8).","s":223.524,"e":228.94,"p":false,"h":false},{"t":"주님은 먼저 때와 시기를 아버지께 돌리십니다.","s":229.356,"e":232.625,"p":false,"h":false},{"t":"그것은 아버지께서 자기 권한으로 정하신 것이니 너희가 알 바가 아니라는 말씀입니다.","s":233.244,"e":238.913,"p":false,"h":false},{"t":"주님은 일찍이 그 날과 그 때는 아들도 모르고 오직 아버지만 아신다고 하셨습니다(마 24:36).","s":239.544,"e":247.643,"p":false,"h":false},{"t":"때를 모르는 것은 제자들이 부족해서가 아니라 하나님이 하나님이시기 때문입니다.","s":247.932,"e":252.874,"p":false,"h":false},{"t":"시간표는 아버지의 손에 있습니다.","s":253.476,"e":255.911,"p":true,"h":false},{"t":"그런데 말씀은 거기서 끝나지 않고 곧장 성령으로 이어집니다.","s":256.68,"e":261.095,"p":false,"h":false},{"t":"알 수 없는 것 대신 받게 될 것을 말씀하시는 것입니다.","s":261.72,"e":265.312,"p":false,"h":false},{"t":"성령이 너희에게 임하시면 너희가 권능을 받는다고 하십니다.","s":266.004,"e":270.285,"p":false,"h":false},{"t":"하나님 나라는 날짜를 아는 사람들 가운데서 나타나는 것이 아니라 성령을 받은 사람들 가운데서 나타납니다.","s":270.936,"e":277.929,"p":false,"h":false},{"t":"앞에서 본 에스겔의 약속을 떠올려 보면, 하나님이 회복의 핵심으로 약속하신 것이 바로 자기 영을 부어 주시는 일이었습니다.","s":278.568,"e":286.59,"p":false,"h":false},{"t":"그러니 주님은 질문을 피하신 것이 아니라 회복의 한가운데로 제자들을 데려가신 것입니다.","s":287.28,"e":293.152,"p":true,"h":false},{"t":"그리고 그 성령이 오시면 너희가 예루살렘과 온 유대와 사마리아와 땅끝까지 내 증인이 되리라고 하십니다.","s":294.048,"e":301.139,"p":false,"h":false},{"t":"이때 질문의 지평이 달라집니다.","s":301.788,"e":304.219,"p":false,"h":false},{"t":"제자들은 이스라엘 한 나라를 물었는데 주님은 땅끝을 말씀하십니다.","s":304.848,"e":309.666,"p":true,"h":false},{"t":"여기 나오는 땅끝이라는 말은 이사야 49장 6절에서 온 말입니다.","s":310.536,"e":315.254,"p":false,"h":false},{"t":"하나님이 종을 이방의 빛으로 삼아 구원이 땅끝까지 이르게 하시겠다고 하신 바로 그 말씀입니다.","s":315.9,"e":321.965,"p":false,"h":false},{"t":"이사야서를 깊이 읽어 본 사람은 여기서 이미 아는 목소리를 듣게 됩니다.","s":322.56,"e":327.526,"p":false,"h":false},{"t":"바울도 훗날 이 말씀을 끌어와서 자기가 이방인에게로 향하는 근거로 삼습니다(행 13:47).","s":328.176,"e":335.833,"p":false,"h":false},{"t":"이스라엘의 회복은 열방의 구원을 통해 이루어진다는 것이 이사야 이래의 약속이었고, 주님은 제자들의 질문을 바로 그 약속의 자리로 옮겨 놓으신 것입니다.","s":336.348,"e":346.654,"p":true,"h":false},{"t":"증인이 되라는 명령이 아니라 증인이 되리라는 약속","s":347.58,"e":351.073,"p":true,"h":false},{"t":"8절은 흔히 땅끝까지 증인이 되라는 명령으로 읽힙니다.","s":351.864,"e":355.599,"p":false,"h":false},{"t":"그런데 본문의 문장은 명령이 아니라 미래를 말하는 문장입니다.","s":356.184,"e":360.536,"p":false,"h":false},{"t":"성령이 임하시면 너희가 증인이 되리라는 것입니다.","s":361.08,"e":364.664,"p":true,"h":false},{"t":"작은 차이처럼 보이지만 뜻은 크게 다릅니다.","s":365.508,"e":368.71,"p":false,"h":false},{"t":"명령이라면 증인이 되는 일은 제자들이 짊어질 과제입니다.","s":369.252,"e":373.197,"p":false,"h":false},{"t":"약속이라면 증인이 되는 일은 성령이 하시는 일의 열매입니다.","s":373.824,"e":377.927,"p":false,"h":false},{"t":"제자들이 결심해서 증인이 되는 것이 아니라, 성령이 임하시면 증인이 되고 마는 것입니다.","s":378.54,"e":384.596,"p":true,"h":false},{"t":"사도행전은 실제로 그렇게 흘러갑니다.","s":385.488,"e":388.248,"p":false,"h":false},{"t":"베드로는 오순절 전에 여종 앞에서도 주님을 모른다고 하던 사람이었습니다.","s":388.872,"e":393.698,"p":false,"h":false},{"t":"그런데 성령이 임하자 같은 사람이 예루살렘의 수많은 사람 앞에서 입을 엽니다.","s":394.344,"e":399.313,"p":false,"h":false},{"t":"그를 바꾼 것은 의지의 다짐이 아니라 임하신 성령이었습니다.","s":399.996,"e":404.277,"p":true,"h":false},{"t":"이 순서는 사도행전을 읽는 내내 기억해야 합니다.","s":405.216,"e":408.648,"p":false,"h":false},{"t":"먼저 주님이 약속하시고, 성령이 임하시고, 그 결과로 증인이 생깁니다.","s":409.284,"e":414.986,"p":false,"h":false},{"t":"은혜가 먼저 오고 순종은 그 뒤를 따릅니다.","s":415.62,"e":418.688,"p":true,"h":false},{"t":"승천은 떠나심이 아니라 즉위이다","s":419.544,"e":421.951,"p":true,"h":false},{"t":"이제 승천을 보겠습니다.","s":422.82,"e":424.739,"p":false,"h":false},{"t":"구름이 주님을 가려서 제자들의 눈에서 보이지 않게 됩니다(행 1:9).","s":425.268,"e":431.051,"p":true,"h":false},{"t":"우리는 승천을 주님이 떠나시는 장면으로 받아들이기 쉽습니다.","s":431.784,"e":435.837,"p":false,"h":false},{"t":"그러나 성경은 이 장면을 즉위로 읽습니다.","s":436.32,"e":439.342,"p":true,"h":false},{"t":"구약에서 구름은 하나님의 영광이 임하시는 자리입니다.","s":439.92,"e":443.726,"p":false,"h":false},{"t":"그리고 다니엘 7장은 인자 같은 이가 하늘 구름을 타고 옛적부터 계신 분 앞에 나아가 영원한 권세를 받는 장면을 보여 줍니다.","s":444.384,"e":452.353,"p":false,"h":false},{"t":"모든 백성과 나라와 언어가 다른 사람들이 그를 섬기게 되었다고 합니다(단 7:13-14).","s":453.024,"e":460.491,"p":false,"h":false},{"t":"구름에 싸여 올라가시는 예수님을 본 제자들은 다니엘이 환상으로 본 그 장면을 눈앞에서 본 것입니다.","s":461.016,"e":467.6,"p":true,"h":false},{"t":"베드로는 오순절에 이 뜻을 분명히 풀어 줍니다.","s":468.504,"e":471.794,"p":false,"h":false},{"t":"다윗은 하늘에 올라가지 않았습니다.","s":472.392,"e":474.864,"p":false,"h":false},{"t":"그러나 다윗이 노래한, 여호와께서 내 주에게 내 우편에 앉으라 하신 그 주님이 바로 이 예수라고 합니다(행 2:34-35, 시 110:1).","s":475.524,"e":487.553,"p":false,"h":false},{"t":"하나님이 그분을 오른편으로 높이시고, 약속하신 성령을 아버지께 받아 부어 주셨다고 합니다(행 2:33).","s":488.124,"e":496.457,"p":false,"h":false},{"t":"승천은 왕이 보좌에 오르신 사건이고, 오순절은 그 왕이 보내 주신 선물입니다.","s":496.944,"e":502.646,"p":true,"h":false},{"t":"또 하나 놓치지 말아야 할 것이 있습니다.","s":503.532,"e":506.139,"p":false,"h":false},{"t":"올라가신 분은 부활하신 몸 그대로 올라가셨습니다.","s":506.736,"e":510.276,"p":false,"h":false},{"t":"주님은 사람의 몸을 입으신 채 지금 하늘에 계십니다.","s":510.912,"e":514.798,"p":false,"h":false},{"t":"하이델베르크 요리문답은 이것을 승천의 위로로 말합니다.","s":515.412,"e":519.352,"p":false,"h":false},{"t":"우리의 육신을 입으신 머리가 하늘에 계시니, 지체인 우리를 자기에게로 이끄실 확실한 보증이 된다는 것입니다.","s":519.912,"e":527.143,"p":false,"h":false},{"t":"그리고 그분이 하늘에서 우리를 위해 아버지 앞에서 변호하십니다.","s":527.796,"e":532.24,"p":false,"h":false},{"t":"히브리서도 같은 말을 합니다(히 4:14, 7:25).","s":532.836,"e":538.52,"p":false,"h":false},{"t":"승천하신 주님은 멀리 떠나신 분이 아니라, 하늘에서 지금도 우리를 위해 일하시는 분입니다.","s":539.064,"e":545.231,"p":true,"h":false},{"t":"이 질문은 사도행전 전체에서 답을 얻는다","s":546.084,"e":549.317,"p":true,"h":false},{"t":"1장 6절의 질문은 그 자리에서 풀리지 않고 책 전체를 지나며 답을 얻습니다.","s":550.224,"e":555.87,"p":true,"h":false},{"t":"베드로는 성전에서 설교하면서, 하늘이 예수님을 받아 두어야 하는 때가 있다고 말합니다.","s":556.74,"e":562.462,"p":false,"h":false},{"t":"하나님이 거룩한 선지자들을 통해 말씀하신 만물을 회복하실 때까지라는 것입니다(행 3:21).","s":563.076,"e":570.322,"p":false,"h":false},{"t":"여기서 쓰인 회복이라는 말은 1장 6절의 회복과 같은 뿌리를 가진 말입니다.","s":570.78,"e":576.083,"p":false,"h":false},{"t":"제자들은 이스라엘의 회복을 물었는데, 베드로는 만물의 회복을 말합니다.","s":576.72,"e":581.808,"p":false,"h":false},{"t":"질문이 훨씬 커져 있습니다.","s":582.444,"e":584.392,"p":true,"h":false},{"t":"15장 예루살렘 회의에서는 야고보가 아모스의 말씀을 끌어옵니다.","s":585.288,"e":589.903,"p":false,"h":false},{"t":"하나님이 무너진 다윗의 장막을 다시 세우실 것인데, 그것은 이방인 가운데 남은 사람들이 주를 찾게 하시려는 것이라고 합니다(행 15:16-17).","s":590.544,"e":601.61,"p":false,"h":false},{"t":"다윗의 나라가 회복되는 모습이 이방인이 구원받는 모습으로 일어나고 있다는 선언입니다.","s":602.1,"e":607.747,"p":false,"h":false},{"t":"1장에서 제자들이 물은 회복이 15장에서 이방인의 입교로 설명되는 것입니다.","s":608.4,"e":613.628,"p":true,"h":false},{"t":"그리고 책의 마지막 장면에서 바울은 로마의 셋집에 갇혀서도 하나님 나라를 전하고 가르칩니다(행 28:30-31).","s":614.52,"e":624.24,"p":false,"h":false},{"t":"땅끝의 문턱에서 책이 끝나는데, 마지막 문장의 주제가 하나님 나라입니다.","s":624.528,"e":629.783,"p":false,"h":false},{"t":"책은 1장에서 시작한 주제로 끝납니다.","s":630.432,"e":633.326,"p":true,"h":false},{"t":"읽는 입장이 갈리는 지점","s":634.176,"e":636.314,"p":true,"h":false},{"t":"이 본문을 두고 교회 안에서는 해석이 갈립니다.","s":637.092,"e":640.314,"p":true,"h":false},{"t":"한 입장은 주님이 제자들의 질문을 정정하지 않으셨다는 점에 주목합니다.","s":641.196,"e":645.964,"p":false,"h":false},{"t":"그래서 이스라엘 민족의 나라가 장차 이 땅에서 따로 회복된다는 약속이 여전히 유효하다고 읽습니다.","s":646.488,"e":652.831,"p":true,"h":false},{"t":"다른 입장은 주님이 질문을 부인하지는 않으셨지만 대답 속에서 질문의 틀을 바꾸셨고, 사도행전이 그 회복을 교회 안에서 이방인과 함께 이루어지는 일로 설명한다고 읽습니다.","s":653.688,"e":665.308,"p":false,"h":false},{"t":"개혁파 전통은 대체로 이 입장에 서 있습니다.","s":665.856,"e":669.159,"p":false,"h":false},{"t":"다만 개혁파 안에서도 로마서 11장의 온 이스라엘의 구원을 어떻게 읽느냐에 따라 이스라엘 민족의 장래에 거는 기대가 서로 다릅니다.","s":669.816,"e":678.867,"p":true,"h":false},{"t":"이 글은 뒤의 입장에서 읽습니다.","s":679.752,"e":682.162,"p":false,"h":false},{"t":"이유는 앞에서 본 것처럼 사도행전 자신이 1장 6절의 질문을 3장과 15장에서 그렇게 풀어 가기 때문입니다.","s":682.776,"e":690.44,"p":false,"h":false},{"t":"그러나 1장 6절 한 구절만으로는 이 논쟁이 끝나지 않는다는 점은 정직하게 말해 두어야 합니다.","s":691.02,"e":697.727,"p":true,"h":false},{"t":"때를 알려는 마음에 대하여","s":698.616,"e":700.577,"p":true,"h":false},{"t":"주님이 때는 알 바가 아니라고 하신 말씀은 오늘의 교회에도 그대로 닿아 있습니다.","s":701.46,"e":707.054,"p":true,"h":false},{"t":"한국 교회는 재림의 날짜를 정해서 외치는 사람들 때문에 여러 번 큰 상처를 입었습니다.","s":707.868,"e":713.965,"p":false,"h":false},{"t":"그런데 이런 날짜 계산은 계산이 틀렸다는 데서 끝나는 문제가 아닙니다.","s":714.6,"e":719.357,"p":false,"h":false},{"t":"주님이 아버지께 속한다고 하신 것을 사람이 손에 쥐려는 일입니다.","s":720,"e":724.335,"p":false,"h":false},{"t":"때를 알아야 안심하겠다는 마음은 믿음이 아니라 불안입니다.","s":724.932,"e":729.064,"p":true,"h":false},{"t":"그리고 그 마음은 이 장면의 제자들에게도 있었습니다.","s":729.972,"e":733.8,"p":false,"h":false},{"t":"주님은 그 마음을 꾸짖지 않으시고 성령을 주겠다고 하십니다.","s":734.436,"e":738.567,"p":false,"h":false},{"t":"불안을 채워 주는 것은 시간표가 아니라 성령이라는 말씀입니다.","s":739.224,"e":743.512,"p":true,"h":false},{"t":"하늘을 쳐다보는 사람들","s":744.444,"e":746.358,"p":true,"h":false},{"t":"끝으로 두 사람이 나타납니다.","s":747.144,"e":749.272,"p":false,"h":false},{"t":"흰 옷을 입은 두 사람이 제자들에게 말합니다.","s":749.88,"e":752.883,"p":false,"h":false},{"t":"어찌하여 서서 하늘만 쳐다보고 있느냐.","s":753.48,"e":755.986,"p":false,"h":false},{"t":"너희가 하늘로 올라가시는 것을 본 그대로 이 예수께서 오실 것이다(행 1:10-11).","s":756.612,"e":763.777,"p":true,"h":false},{"t":"이 말을 꾸지람으로만 들으면 하늘 쳐다보지 말고 부지런히 일하라는 교훈이 됩니다.","s":764.604,"e":770.072,"p":false,"h":false},{"t":"그러나 이 말의 무게는 뒷부분에 있습니다.","s":770.652,"e":773.617,"p":false,"h":false},{"t":"이 예수께서 오시리라는 약속입니다.","s":774.252,"e":776.999,"p":false,"h":false},{"t":"올라가신 모습 그대로, 같은 분이 다시 오십니다.","s":777.6,"e":781.397,"p":true,"h":false},{"t":"그러니 승천은 이별이 아니라 다시 만나기로 약속된 헤어짐입니다.","s":782.244,"e":786.959,"p":false,"h":false},{"t":"그리고 증인의 시대는 바로 그 사이에 놓인 시간입니다.","s":787.608,"e":791.436,"p":true,"h":false},{"t":"누가는 앞선 책에서, 제자들이 주님이 올라가시는 것을 보고 큰 기쁨으로 예루살렘에 돌아갔다고 적었습니다(눅 24:52).","s":792.288,"e":802.248,"p":false,"h":false},{"t":"왕이 보좌에 오르셨고, 그 왕이 다시 오실 것이며, 그 사이에 성령이 오시기 때문입니다.","s":802.764,"e":809.455,"p":true,"h":false},{"t":"사도행전 1장 6절의 질문에 대한 대답은 때가 아니라 그분입니다.","s":810.36,"e":814.729,"p":false,"h":false},{"t":"이 책을 읽는 내내 우리는 시간표가 아니라 왕을 보게 됩니다.","s":815.328,"e":819.556,"p":true,"h":false}]},{"title":"2. 오순절 성령 강림은 왜 되풀이되지 않는 사건인가: 새 시대의 개막과 성령 체험의 자리","audio":"book_2610272355_1.mp3","start":820.404,"end":1417.5,"dur":597.1,"segs":[{"t":"2.","s":820.404,"e":820.712,"p":false,"h":false},{"t":"오순절 성령 강림은 왜 되풀이되지 않는 사건인가: 새 시대의 개막과 성령 체험의 자리","s":821.016,"e":827.694,"p":true,"h":false},{"t":"본문: 사도행전 2장 1-41절 (함께 읽을 본문: 욜 2:28-32, 요 7:37-39, 요 14:16-18, 요 16:7, 눅 24:49, 고전 12:13, 엡 2:19-22)","s":828.612,"e":852.958,"p":true,"h":false},{"t":"오순절 이야기는 교회가 가장 사랑하는 장면이면서, 가장 많이 오해하는 장면입니다.","s":853.632,"e":859.663,"p":true,"h":false},{"t":"바람 소리가 나고, 불의 혀 같은 것이 나타나고, 사람들이 알지 못하던 말로 하나님의 큰일을 말합니다.","s":860.544,"e":867.754,"p":false,"h":false},{"t":"이 장면을 읽은 많은 성도가 이렇게 묻습니다.","s":868.392,"e":871.6,"p":false,"h":false},{"t":"그때 있었던 일이 왜 오늘 우리에게는 없습니까.","s":872.244,"e":875.475,"p":false,"h":false},{"t":"혹은 이렇게 생각합니다.","s":876.096,"e":877.95,"p":false,"h":false},{"t":"그런 일이 있어야 비로소 성령을 받은 것이 아닙니까.","s":878.544,"e":882.005,"p":true,"h":false},{"t":"이 글에서는 오순절이 어떤 사건이었는지, 그리고 이 사건 가운데 되풀이되지 않는 것과 오늘도 모든 신자에게 일어나는 것이 무엇인지를 구별해서 살펴봅니다.","s":882.792,"e":893.97,"p":false,"h":false},{"t":"이 구별을 놓치면 오순절은 신자를 위로하기보다 신자를 불안하게 만드는 장면이 됩니다.","s":894.564,"e":900.567,"p":true,"h":false},{"t":"오순절은 어떤 날이었는가","s":901.44,"e":903.528,"p":true,"h":false},{"t":"오순절은 유월절에서 오십 일째 되는 날이었습니다.","s":904.392,"e":907.974,"p":false,"h":false},{"t":"구약에서는 맥추절, 또는 칠칠절이라고 부르는 절기로, 첫 곡식을 하나님께 드리며 추수를 감사하는 날이었습니다(레 23:15-21).","s":908.64,"e":920.343,"p":false,"h":false},{"t":"그래서 예루살렘에는 온 세계에 흩어져 살던 유대인들이 순례하러 모여 있었습니다.","s":920.88,"e":926.183,"p":false,"h":false},{"t":"누가가 늘어놓는 지명들이 열다섯 가지에 이르는 것은 그 때문입니다(행 2:9-11).","s":926.82,"e":934.033,"p":true,"h":false},{"t":"주님은 승천하시기 전에 제자들에게 예루살렘을 떠나지 말고 아버지께서 약속하신 것을 기다리라고 하셨습니다(행 1:4).","s":934.884,"e":943.912,"p":false,"h":false},{"t":"그 약속은 하루아침에 생긴 것이 아닙니다.","s":944.424,"e":947.355,"p":false,"h":false},{"t":"요엘은 하나님이 모든 육체에 영을 부어 주시는 날이 오리라고 했고(욜 2:28), 에스겔은 하나님이 자기 영을 백성 속에 두시겠다고 했습니다.","s":947.88,"e":958.034,"p":false,"h":false},{"t":"주님도 십자가를 앞두고 보혜사를 보내시겠다고 거듭 말씀하셨습니다(요 14:16-18, 16:7).","s":958.716,"e":968.217,"p":true,"h":false},{"t":"그런데 요한복음 7장에는 중요한 설명이 하나 붙어 있습니다.","s":968.832,"e":972.837,"p":false,"h":false},{"t":"예수께서 아직 영광을 얻지 못하셨으므로 성령이 아직 오시지 않았다는 것입니다(요 7:39).","s":973.44,"e":981.16,"p":false,"h":false},{"t":"성령은 그냥 오시는 것이 아니라 영광을 얻으신 그리스도가 보내시는 분이라는 말씀입니다.","s":981.648,"e":987.514,"p":false,"h":false},{"t":"십자가와 부활과 승천이 끝난 다음에야 성령이 오십니다.","s":988.164,"e":991.968,"p":false,"h":false},{"t":"그러니 오순절은 하나님이 별안간 새 일을 하시는 날이 아니라, 앞선 구속의 사건들이 하나로 이어져서 닿은 자리입니다.","s":992.592,"e":1000.536,"p":true,"h":false},{"t":"바람과 불과 말","s":1001.376,"e":1002.906,"p":true,"h":false},{"t":"본문이 기록한 징표는 셋입니다.","s":1003.788,"e":1006.278,"p":false,"h":false},{"t":"거센 바람 같은 소리, 갈라지는 불의 혀 같은 것, 그리고 다른 언어로 말하는 일입니다(행 2:2-4).","s":1006.812,"e":1015.764,"p":true,"h":false},{"t":"구약에서 바람과 불은 하나님이 임하실 때 나타나는 모습입니다.","s":1016.532,"e":1020.775,"p":false,"h":false},{"t":"시내산에서도 불과 소리가 있었고(출 19:16-18), 성막과 성전에는 영광의 구름이 가득했습니다.","s":1021.428,"e":1030.083,"p":false,"h":false},{"t":"누가는 바로 그 하나님이 이제 한 건물이 아니라 사람들 위에 임하신다는 것을 그림으로 보여 줍니다.","s":1030.716,"e":1036.888,"p":false,"h":false},{"t":"불의 혀가 각 사람 위에 앉았다고 합니다.","s":1037.484,"e":1040.341,"p":false,"h":false},{"t":"하나님의 임재가 성전에서 사람에게로 옮겨 온 것입니다.","s":1041.012,"e":1044.729,"p":true,"h":false},{"t":"말하는 일은 더 눈여겨볼 만합니다.","s":1045.584,"e":1048.151,"p":false,"h":false},{"t":"본문은 각 사람이 자기가 태어난 지방의 말로 듣는다고 합니다(행 2:6-8).","s":1048.788,"e":1055.377,"p":false,"h":false},{"t":"이것은 무슨 알 수 없는 소리가 아니라 사람들이 알아듣는 실제 언어였습니다.","s":1055.7,"e":1060.653,"p":false,"h":false},{"t":"게다가 그 내용은 자기 자랑이 아니라 하나님의 큰일이었습니다(행 2:11).","s":1061.316,"e":1067.416,"p":false,"h":false},{"t":"일부 해석자들은 이 장면을 창세기 11장의 바벨과 대비해서 읽습니다.","s":1068.048,"e":1072.983,"p":false,"h":false},{"t":"바벨에서는 교만 때문에 말이 갈라져 사람들이 흩어졌는데, 오순절에는 말이 갈라진 채로 복음이 모든 민족에게 들립니다.","s":1073.592,"e":1081.589,"p":false,"h":false},{"t":"누가가 이 대비를 직접 말하지는 않으므로 확정할 수는 없지만, 오순절의 방향이 모든 민족을 향한다는 점은 분명합니다.","s":1082.232,"e":1090.391,"p":true,"h":false},{"t":"베드로의 첫 설교가 그것을 확인해 줍니다.","s":1091.304,"e":1094.164,"p":false,"h":false},{"t":"베드로는 술에 취했다는 조롱에 답하면서 요엘의 예언이 이루어진 것이라고 말합니다.","s":1094.688,"e":1099.904,"p":false,"h":false},{"t":"그리고 그 일을 일으키신 분이 하나님 오른편에 높이 올리신 예수라고 선포합니다(행 2:33).","s":1100.448,"e":1108.042,"p":false,"h":false},{"t":"징표는 그 자체가 목적이 아니었습니다.","s":1108.512,"e":1111.45,"p":false,"h":false},{"t":"징표는 예수가 주와 그리스도이심을 가리키는 손가락이었습니다.","s":1112.04,"e":1115.96,"p":false,"h":false},{"t":"성령은 스스로를 높이지 않으시고 그리스도를 증언하시는 분입니다(요 15:26, 16:14).","s":1116.576,"e":1125.084,"p":true,"h":false},{"t":"되풀이되지 않는 것","s":1125.54,"e":1126.98,"p":true,"h":false},{"t":"오순절은 구속사에서 한 번 일어난 사건입니다.","s":1127.808,"e":1131.206,"p":false,"h":false},{"t":"그리스도께서 이루신 구원 위에서, 성령께서 새 시대를 여시며 교회를 세우신 날입니다.","s":1131.84,"e":1138.046,"p":false,"h":false},{"t":"이 날을 기점으로 하나님의 백성은 더 이상 한 민족의 울타리 안에 있지 않고, 모든 민족에게서 모인 사람들이 한 몸이 됩니다.","s":1138.68,"e":1147.24,"p":true,"h":false},{"t":"이 사건은 그리스도의 십자가와 부활이 되풀이되지 않는 것과 같은 방식으로 되풀이되지 않습니다.","s":1148.076,"e":1154.332,"p":false,"h":false},{"t":"누가도 바람과 불이 오순절마다 반복되었다고 기록하지 않습니다.","s":1154.952,"e":1159.419,"p":false,"h":false},{"t":"오순절을 날마다 다시 겪어야 하는 사건으로 만들면, 이미 이루어진 일을 다시 이루어야 할 숙제로 바꾸는 셈입니다.","s":1160.028,"e":1167.622,"p":true,"h":false},{"t":"물론 사도행전에는 비슷한 일이 몇 번 더 일어납니다.","s":1168.524,"e":1172.195,"p":false,"h":false},{"t":"사마리아에서, 고넬료의 집에서, 에베소에서 성령이 임하시는 장면이 이어집니다.","s":1172.844,"e":1179.209,"p":false,"h":false},{"t":"그러나 그것들도 우리 각자의 체험을 위한 모범이 아니라, 복음이 새 경계를 넘을 때마다 하나님이 같은 성령을 주셨다는 증거였습니다.","s":1179.828,"e":1188.5,"p":false,"h":false},{"t":"이 점은 다음 글에서 따로 살펴봅니다.","s":1189.152,"e":1191.728,"p":true,"h":false},{"t":"오늘도 모든 신자에게 일어나는 것","s":1192.536,"e":1194.989,"p":true,"h":false},{"t":"그렇다면 오순절의 열매 가운데 오늘 우리에게도 해당하는 것은 무엇입니까.","s":1195.776,"e":1201.094,"p":true,"h":false},{"t":"성령이 믿는 사람 안에 거하신다는 사실입니다.","s":1201.968,"e":1205.04,"p":false,"h":false},{"t":"바울은 그리스도의 영이 없는 사람은 그리스도의 사람이 아니라고 말합니다(롬 8:9).","s":1205.64,"e":1212.274,"p":false,"h":false},{"t":"또 우리가 유대인이든 헬라인이든 종이든 자유인이든 다 한 성령으로 세례를 받아 한 몸이 되었다고 말합니다(고전 12:13).","s":1212.876,"e":1222.275,"p":false,"h":false},{"t":"고린도교회는 문제가 많은 교회였지만 바울은 그들에게 성령을 받았느냐고 묻지 않고, 이미 성령으로 세례를 받았다고 말합니다.","s":1222.74,"e":1231.467,"p":false,"h":false},{"t":"성령을 받은 사실은 특별한 순간의 체험이 아니라 그리스도께 속한 모든 사람의 자리였습니다.","s":1232.064,"e":1238.486,"p":true,"h":false},{"t":"베드로의 설교가 끝났을 때 사람들은 마음이 찔려 무엇을 해야 하느냐고 묻습니다.","s":1239.372,"e":1244.507,"p":false,"h":false},{"t":"베드로의 대답은 회개하고 세례를 받으라는 것이고, 그러면 성령의 선물을 받으리라는 것입니다.","s":1245.132,"e":1251.286,"p":false,"h":false},{"t":"그리고 이 약속은 너희와 너희 자녀와 먼 데 있는 모든 사람에게 하신 것이라고 말합니다(행 2:38-39).","s":1251.936,"e":1260.81,"p":false,"h":false},{"t":"성령의 선물은 소수의 특별한 사람의 것이 아니라, 하나님이 부르시는 모든 사람의 것이라는 선언입니다.","s":1261.44,"e":1268.237,"p":true,"h":false},{"t":"그날 삼천 명가량이 더해졌다고 합니다(행 2:41).","s":1269.108,"e":1274.156,"p":false,"h":false},{"t":"이들에게 바람이 불었다거나 불의 혀가 앉았다는 이야기는 없습니다.","s":1274.724,"e":1279.23,"p":false,"h":false},{"t":"그들은 말씀을 받았고, 마음이 찔렸고, 세례를 받았습니다.","s":1279.836,"e":1284.676,"p":false,"h":false},{"t":"이것이 교회가 시작된 방식이었습니다.","s":1285.272,"e":1287.98,"p":true,"h":false},{"t":"읽는 입장이 갈리는 지점","s":1288.872,"e":1291.01,"p":true,"h":false},{"t":"이 문제를 두고 교회 안에서 입장이 갈립니다.","s":1291.788,"e":1295.098,"p":true,"h":false},{"t":"오순절 운동과 은사주의 계열은 성령 세례를 중생과 구별되는 별도의 체험으로 이해하는 경향이 있습니다.","s":1295.964,"e":1302.895,"p":false,"h":false},{"t":"믿은 다음에 성령 세례를 받아야 능력을 얻는다는 생각입니다.","s":1303.56,"e":1307.531,"p":false,"h":false},{"t":"개혁파 전통은 대체로 성령 세례를 그리스도께 연합되는 중생의 사건과 함께 일어나는 것으로 봅니다.","s":1308.204,"e":1314.764,"p":false,"h":false},{"t":"다만 개혁파 안에도 이와 다르게 가르친 사람이 있습니다.","s":1315.404,"e":1319.435,"p":false,"h":false},{"t":"20세기 영국의 목사 마틴 로이드존스가 그런 경우입니다.","s":1320.048,"e":1324.037,"p":false,"h":false},{"t":"그는 성령 세례를 중생 이후에 주어지는 별도의 경험으로 가르쳤습니다.","s":1324.62,"e":1329.506,"p":true,"h":false},{"t":"이 글은 앞에서 본 이유로 앞의 구별을 따릅니다.","s":1330.38,"e":1333.983,"p":false,"h":false},{"t":"바울이 신자 모두에게 이미 한 성령으로 세례를 받았다고 말하고 있고, 성령이 없으면 그리스도의 사람이 아니라고 말하기 때문입니다.","s":1334.592,"e":1342.91,"p":false,"h":false},{"t":"그러나 이것은 성령의 충만함을 사모하는 일을 헛되다고 하는 말이 아닙니다.","s":1343.52,"e":1348.264,"p":false,"h":false},{"t":"바울은 에베소 성도들에게 성령의 충만을 받으라고 권합니다(엡 5:18).","s":1348.884,"e":1355.051,"p":false,"h":false},{"t":"성령이 계시지 않아서 구하는 것이 아니라, 이미 계신 성령께서 더 깊이 다스리시기를 구하는 것입니다.","s":1355.508,"e":1362.677,"p":true,"h":false},{"t":"체험의 규격이 되지 않는 오순절","s":1363.572,"e":1365.942,"p":true,"h":false},{"t":"오순절을 오늘의 규격으로 삼으면 두 가지 일이 일어납니다.","s":1366.668,"e":1370.623,"p":true,"h":false},{"t":"바람과 불과 방언을 겪지 못한 신자는 자기에게 무언가 모자란다고 느끼게 됩니다.","s":1371.492,"e":1376.936,"p":false,"h":false},{"t":"반대로 그런 체험을 한 신자는 자기가 더 높은 단계에 있다고 생각하게 됩니다.","s":1377.54,"e":1382.732,"p":false,"h":false},{"t":"둘 다 은혜를 체험의 크기로 재는 일입니다.","s":1383.408,"e":1386.316,"p":false,"h":false},{"t":"그러나 본문에서 사람들을 움직인 것은 체험이 아니라 선포된 그리스도였습니다.","s":1386.972,"e":1392.282,"p":true,"h":false},{"t":"오순절이 주는 위로는 이것입니다.","s":1393.164,"e":1395.59,"p":false,"h":false},{"t":"교회는 우리가 만든 것이 아니라 승천하신 왕이 보내신 성령으로 세워졌습니다.","s":1396.224,"e":1401.543,"p":false,"h":false},{"t":"그리고 그 성령은 오늘도 말씀이 선포될 때 사람의 마음을 찔러 그리스도께로 이끄십니다.","s":1402.2,"e":1408.367,"p":false,"h":false},{"t":"우리가 할 일은 그날의 불을 다시 지피려는 것이 아니라, 그날 증언된 분을 믿고 그분 안에서 쉬는 것입니다.","s":1408.968,"e":1416.612,"p":true,"h":false}]},{"title":"3. 사마리아와 고넬료와 에베소의 제자들은 왜 성령 받는 순서가 제각각인가: 구원의 순서표가 아니라 복음이 경계를 넘는 길","audio":"book_2610272355_1.mp3","start":1417.5,"end":1934.82,"dur":517.3,"segs":[{"t":"3.","s":1417.5,"e":1418.112,"p":false,"h":false},{"t":"사마리아와 고넬료와 에베소의 제자들은 왜 성령 받는 순서가 제각각인가: 구원의 순서표가 아니라 복음이 경계를 넘는 길","s":1419.408,"e":1427.998,"p":true,"h":false},{"t":"본문: 사도행전 8장 4-25절, 10장 44-48절, 19장 1-7절 (함께 읽을 본문: 행 2:38-39, 행 11:15-18, 롬 8:9, 고전 12:13, 엡 1:13-14)","s":1428.876,"e":1452.821,"p":true,"h":false},{"t":"사도행전을 처음 읽는 사람은 곧 혼란에 빠집니다.","s":1453.536,"e":1457.026,"p":false,"h":false},{"t":"성령을 받는 순서가 장마다 다르기 때문입니다.","s":1457.64,"e":1461.056,"p":true,"h":false},{"t":"오순절에는 회개하고 세례를 받으면 성령을 받는다고 했습니다(행 2:38).","s":1461.96,"e":1468.367,"p":false,"h":false},{"t":"그런데 사마리아에서는 사람들이 믿고 세례를 받았는데도 성령은 아직 임하지 않았다고 합니다.","s":1468.836,"e":1475.408,"p":false,"h":false},{"t":"고넬료의 집에서는 반대로 세례 전에, 심지어 설교가 끝나기도 전에 성령이 임하십니다.","s":1476.072,"e":1481.89,"p":false,"h":false},{"t":"에베소에서는 이미 제자라고 불리던 사람들이 성령이 계신다는 말조차 들어 보지 못했다고 합니다.","s":1482.516,"e":1488.769,"p":true,"h":false},{"t":"이래서야 어떤 순서가 맞는지 알 수 없다는 생각이 들 수밖에 없습니다.","s":1489.644,"e":1494.724,"p":false,"h":false},{"t":"이 글에서는 이 세 장면이 구원의 순서를 가르치려는 것이 아니라 전혀 다른 것을 말하고 있다는 점을 살펴봅니다.","s":1495.368,"e":1502.441,"p":true,"h":false},{"t":"사마리아에서 일어난 일","s":1503.324,"e":1505.073,"p":true,"h":false},{"t":"스데반의 순교로 흩어진 사람들 가운데 빌립이 사마리아 성으로 내려가 그리스도를 전합니다(행 8:5).","s":1505.952,"e":1513.707,"p":false,"h":false},{"t":"사람들이 빌립의 말을 믿고 세례를 받고 큰 기쁨이 그 성에 가득했습니다(행 8:8, 12).","s":1514.196,"e":1522.488,"p":false,"h":false},{"t":"그런데 예루살렘의 사도들이 이 소식을 듣고 베드로와 요한을 보냅니다.","s":1523.016,"e":1528.085,"p":false,"h":false},{"t":"두 사람이 내려가서 기도하고 안수하자 그제야 사마리아 사람들이 성령을 받습니다(행 8:14-17).","s":1528.704,"e":1536.971,"p":true,"h":false},{"t":"사마리아를 이해하려면 유대인과 사마리아인 사이의 오래된 적대를 알아야 합니다.","s":1537.74,"e":1542.957,"p":false,"h":false},{"t":"두 민족은 신앙의 뿌리를 나누면서도 수백 년 동안 갈라서 있었습니다.","s":1543.608,"e":1548.551,"p":false,"h":false},{"t":"요한복음 4장은 유대인이 사마리아인과 상종하지 않는다고 말합니다.","s":1549.224,"e":1553.94,"p":false,"h":false},{"t":"이 갈라짐이 풀리지 않은 채로 사마리아 교회가 따로 생겼다면 교회는 둘로 쪼개졌을 것입니다.","s":1554.588,"e":1560.932,"p":true,"h":false},{"t":"그래서 하나님은 사도들이 직접 내려와서 같은 성령이 같은 방식으로 사마리아 사람들에게 임하시는 것을 보게 하십니다.","s":1561.824,"e":1569.634,"p":false,"h":false},{"t":"예루살렘 교회가 이 일을 눈으로 보고 사마리아 사람들도 같은 교회의 지체임을 인정하게 된 것입니다.","s":1570.248,"e":1576.908,"p":false,"h":false},{"t":"사마리아에서 성령이 늦게 임하신 까닭은 사마리아 사람들이 모자랐기 때문이 아니라, 두 갈래로 갈라져 있던 하나님의 백성이 한 몸임을 사도들의 손으로 확인시키시려는 것이었다고 보는 것이 자연스럽습니다.","s":1577.592,"e":1590.563,"p":true,"h":false},{"t":"고넬료의 집에서 일어난 일","s":1591.452,"e":1593.452,"p":true,"h":false},{"t":"고넬료의 집에서는 순서가 정반대입니다.","s":1594.332,"e":1597.391,"p":false,"h":false},{"t":"베드로가 아직 말씀을 하고 있을 때 성령이 말씀을 듣는 모든 사람에게 내려오십니다(행 10:44).","s":1598.004,"e":1605.686,"p":false,"h":false},{"t":"베드로와 함께 간 유대인 신자들이 놀랍니다.","s":1606.248,"e":1609.343,"p":false,"h":false},{"t":"이방인에게도 성령이 부어졌기 때문입니다(행 10:45).","s":1609.992,"e":1615.024,"p":true,"h":false},{"t":"이 장면에서 성령은 사도의 안수를 기다리지도 않으셨고 세례를 기다리지도 않으셨습니다.","s":1615.86,"e":1621.707,"p":false,"h":false},{"t":"베드로는 나중에 예루살렘에서 이 일을 설명하며, 성령이 처음에 우리에게 내리신 것과 같이 그들에게도 내리셨다고 말합니다(행 11:15-17).","s":1622.376,"e":1633.618,"p":false,"h":false},{"t":"그리고 그가 한 말은 이것입니다.","s":1634.184,"e":1636.48,"p":false,"h":false},{"t":"하나님이 그들에게도 우리와 같은 선물을 주셨는데 내가 누구이기에 하나님을 막을 수 있겠습니까.","s":1636.776,"e":1642.816,"p":true,"h":false},{"t":"여기서도 순서는 요점이 아닙니다.","s":1643.688,"e":1646.204,"p":false,"h":false},{"t":"이방인이 하나님의 백성에 들어올 수 있는지를 사람이 판단하기 전에 하나님이 먼저 판정을 내리셨다는 것이 요점입니다.","s":1646.82,"e":1654.117,"p":false,"h":false},{"t":"교회가 문을 열기 전에 성령이 먼저 문을 여신 것입니다.","s":1654.74,"e":1658.482,"p":true,"h":false},{"t":"에베소의 제자들","s":1659.42,"e":1660.859,"p":true,"h":false},{"t":"에베소에서 바울은 제자라고 불리는 열두 사람쯤을 만납니다.","s":1661.472,"e":1665.563,"p":false,"h":false},{"t":"바울의 첫 질문이 흥미롭습니다.","s":1666.224,"e":1668.503,"p":false,"h":false},{"t":"믿을 때에 성령을 받았느냐는 것입니다(행 19:2).","s":1669.068,"e":1673.808,"p":false,"h":false},{"t":"이 질문은 정상적인 신자라면 믿을 때 성령을 받았으리라는 것을 전제합니다.","s":1674.36,"e":1679.816,"p":true,"h":false},{"t":"그런데 그들은 성령이 계시다는 말도 듣지 못했다고 대답합니다.","s":1680.732,"e":1685.123,"p":false,"h":false},{"t":"알고 보니 그들은 요한의 세례만 받은 사람들이었습니다.","s":1685.628,"e":1689.246,"p":false,"h":false},{"t":"바울은 요한이 회개의 세례를 베풀면서 자기 뒤에 오시는 분을 믿으라고 했다고 설명해 줍니다.","s":1689.84,"e":1695.583,"p":false,"h":false},{"t":"그들이 예수의 이름으로 세례를 받고 바울이 안수하자 성령이 임하시고 방언과 예언을 합니다(행 19:3-6).","s":1696.212,"e":1705.343,"p":true,"h":false},{"t":"이들은 구약에서 신약으로 넘어가는 문턱에 서 있던 사람들입니다.","s":1706.148,"e":1710.489,"p":false,"h":false},{"t":"세례 요한이 가리킨 분을 아직 모르는 채 요한의 가르침 안에서 멈춰 있었습니다.","s":1711.152,"e":1715.98,"p":false,"h":false},{"t":"누가가 이 이야기를 기록한 것은 그리스도의 완성된 사역을 아는 신앙과, 그 이전 단계에 머문 신앙이 구별된다는 것을 보여 주기 위해서입니다.","s":1716.588,"e":1725.957,"p":false,"h":false},{"t":"그러므로 이 장면 역시 오늘의 신자들에게 성령을 두 단계로 받는다는 교훈을 주려는 것이 아닙니다.","s":1726.596,"e":1733.439,"p":true,"h":false},{"t":"세 장면에 흐르는 하나의 줄기","s":1734.3,"e":1736.572,"p":true,"h":false},{"t":"세 장면을 나란히 놓고 보면 공통점이 보입니다.","s":1737.432,"e":1740.783,"p":false,"h":false},{"t":"오순절의 유대인, 사마리아 사람들, 이방인 고넬료, 그리고 요한의 제자들입니다.","s":1741.356,"e":1748.321,"p":false,"h":false},{"t":"복음이 새 경계를 넘을 때마다 같은 성령이 같은 방식으로 임하셨다는 이야기입니다.","s":1748.952,"e":1754.395,"p":false,"h":false},{"t":"그것도 사도들이 현장에 있거나 증인이 있는 자리에서 임하셨습니다.","s":1755.036,"e":1759.677,"p":false,"h":false},{"t":"사도행전 1장 8절에서 약속된 예루살렘과 유대와 사마리아와 땅끝으로 가는 길이 이렇게 열린 것입니다.","s":1759.968,"e":1766.848,"p":true,"h":false},{"t":"그래서 이 이야기는 이렇게 읽어야 합니다.","s":1767.744,"e":1770.797,"p":false,"h":false},{"t":"어떤 순서로 성령을 받는지에 대한 규칙이 아니라, 누구에게도 이 은혜가 막혀 있지 않다는 것을 하나님이 하나씩 확인해 가신 과정입니다.","s":1771.416,"e":1779.988,"p":true,"h":false},{"t":"시몬이라는 사마리아의 마술사","s":1780.884,"e":1783.212,"p":true,"h":false},{"t":"사마리아 이야기에는 또 하나의 인물이 있습니다.","s":1784.016,"e":1787.249,"p":false,"h":false},{"t":"마술로 사람들을 놀라게 하던 시몬입니다.","s":1787.868,"e":1790.687,"p":false,"h":false},{"t":"그도 믿고 세례를 받았다고 기록됩니다(행 8:13).","s":1791.324,"e":1796.416,"p":false,"h":false},{"t":"그런데 사도들이 안수하여 성령이 임하시는 것을 보자 돈을 내밀며 이 권능을 자기에게도 달라고 합니다.","s":1797.012,"e":1803.799,"p":true,"h":false},{"t":"베드로의 대답은 매섭습니다.","s":1804.68,"e":1806.771,"p":false,"h":false},{"t":"네 은을 가지고 망하라, 네가 하나님의 선물을 돈으로 사려고 생각하였으니(행 8:20).","s":1807.416,"e":1814.346,"p":false,"h":false},{"t":"그리고 네 마음이 하나님 앞에 바르지 못하다고 합니다.","s":1814.904,"e":1818.284,"p":true,"h":false},{"t":"이 장면은 중요한 사실을 일깨웁니다.","s":1819.152,"e":1821.887,"p":false,"h":false},{"t":"세례를 받았다는 표시가 곧 성령을 받았다는 증명은 아닙니다.","s":1822.536,"e":1826.955,"p":false,"h":false},{"t":"성령은 사고팔 수 있는 능력이 아니라 하나님이 은혜로 주시는 선물입니다.","s":1827.54,"e":1832.555,"p":false,"h":false},{"t":"시몬은 성령을 자기 영향력을 키울 도구로 보았습니다.","s":1833.12,"e":1836.654,"p":false,"h":false},{"t":"성령을 체험의 표적이나 능력의 수단으로 보는 마음은 언제나 이 시몬의 자리와 가깝습니다.","s":1837.296,"e":1843.229,"p":false,"h":false},{"t":"본문은 이 대목에서 말을 아끼지 않습니다.","s":1843.884,"e":1847.062,"p":true,"h":false},{"t":"읽는 입장이 갈리는 지점","s":1847.952,"e":1850.09,"p":true,"h":false},{"t":"사마리아의 일을 두고 해석이 갈립니다.","s":1850.868,"e":1853.408,"p":false,"h":false},{"t":"빌립의 전도로 믿은 사마리아 사람들이 성령 없이 신자로 지냈다고 보는 입장이 있고, 이들의 믿음이 아직 온전하지 않았다고 보는 입장이 있고, 사마리아라는 특수한 경계에서 일어난 구속사적 예외로 보는 입장이 있습니다.","s":1854.072,"e":1868.826,"p":false,"h":false},{"t":"어느 쪽이든 오늘의 신자에게 같은 순서가 요구된다고 읽기는 어렵습니다.","s":1869.408,"e":1874.368,"p":true,"h":false},{"t":"이 글이 서는 자리는 마지막 입장에 가깝습니다.","s":1875.24,"e":1878.491,"p":false,"h":false},{"t":"신자에게 성령이 어떻게 주어지는지는 서신서가 명확하게 말하기 때문입니다.","s":1879.056,"e":1884.246,"p":false,"h":false},{"t":"성령이 계시지 않으면 그리스도의 사람이 아니고(롬 8:9), 말씀을 듣고 믿을 때 약속의 성령으로 인치심을 받습니다(엡 1:13).","s":1884.816,"e":1896.401,"p":false,"h":false},{"t":"사도행전의 장면들은 이 기준을 흔들지 않고, 복음이 어떤 길로 퍼져 나갔는지를 보여 줍니다.","s":1896.948,"e":1903.531,"p":true,"h":false},{"t":"그리스도 안에서 쉬는 것","s":1904.4,"e":1906.154,"p":true,"h":false},{"t":"이 본문을 읽고 불안해질 필요는 없습니다.","s":1906.956,"e":1910.073,"p":false,"h":false},{"t":"내가 성령을 어떤 순서로, 어떤 징표와 함께 받았는지를 따질 이유가 없습니다.","s":1910.7,"e":1916.301,"p":true,"h":false},{"t":"복음을 듣고 그리스도를 믿는 사람은 성령이 그 안에 계십니다.","s":1917.216,"e":1921.753,"p":false,"h":false},{"t":"그것이 믿음의 사실이고, 사도행전의 세 장면은 그 사실이 모든 민족에게 열려 있음을 보여 줍니다.","s":1922.04,"e":1928.708,"p":false,"h":false},{"t":"성령은 우리가 붙잡는 체험이 아니라 우리를 붙잡으시는 분입니다.","s":1929.384,"e":1933.941,"p":true,"h":false}]},{"title":"4. 십자가를 하나님의 정하신 뜻이면서 사람의 죄로 함께 말하는 설교는 어떻게 가능한가","audio":"book_2610272355_1.mp3","start":1934.82,"end":2414.484,"dur":479.7,"segs":[{"t":"4.","s":1934.82,"e":1935.395,"p":false,"h":false},{"t":"십자가를 하나님의 정하신 뜻이면서 사람의 죄로 함께 말하는 설교는 어떻게 가능한가","s":1936.728,"e":1942.436,"p":true,"h":false},{"t":"본문: 사도행전 2장 22-24절, 36-37절, 3장 13-19절, 4장 24-28절 (함께 읽을 본문: 창 50:20, 시 2:1-2, 사 53:10, 눅 22:22, 약 1:13)","s":1943.316,"e":1967.315,"p":true,"h":false},{"t":"사도행전의 초기 설교들에는 이상하게 보이는 공통점이 있습니다.","s":1968.048,"e":1972.404,"p":false,"h":false},{"t":"한 문장 안에서 두 가지를 동시에 말한다는 점입니다.","s":1973.052,"e":1976.707,"p":true,"h":false},{"t":"예수께서 죽으신 것은 하나님이 정하신 계획과 미리 아신 대로였다고 합니다.","s":1977.588,"e":1982.932,"p":false,"h":false},{"t":"그런데 바로 이어서, 그 일을 너희가 법 없는 사람들의 손을 빌려 십자가에 못 박아 죽였다고 합니다(행 2:23).","s":1983.564,"e":1992.63,"p":false,"h":false},{"t":"하나님의 계획이라면서 사람의 죄라고 하고, 사람의 죄라면서 하나님의 계획이라고 합니다.","s":1993.212,"e":1999.065,"p":true,"h":false},{"t":"이 글에서는 이 두 말이 왜 충돌하지 않는지, 그리고 이 설교가 사람들에게 어떻게 작용했는지를 살펴봅니다.","s":1999.98,"e":2007.587,"p":false,"h":false},{"t":"이 물음은 신학의 오랜 난제이지만, 사도들은 이것을 난제로 다루지 않고 설교의 뼈대로 삼았다는 점이 놀랍습니다.","s":2008.224,"e":2016.189,"p":true,"h":false},{"t":"세 번 반복되는 같은 구조","s":2017.08,"e":2019.118,"p":true,"h":false},{"t":"이 구조는 한 번 나오고 끝나지 않습니다.","s":2019.852,"e":2022.783,"p":false,"h":false},{"t":"오순절에 베드로가 한 설교에서 나오고(행 2:23), 성전 솔로몬 행각에서 한 설교에서 다시 나옵니다.","s":2023.38,"e":2031.658,"p":false,"h":false},{"t":"너희가 생명의 주를 죽였으나 하나님이 죽은 자 가운데서 살리셨다고 하면서, 그 일을 하나님이 모든 선지자의 입을 통해 미리 알리신 것을 이루신 것이라고 말합니다(행 3:15, 18).","s":2032.308,"e":2046.247,"p":false,"h":false},{"t":"그리고 교회가 박해를 당하고 올리는 기도에서도 세 번째로 나옵니다.","s":2046.672,"e":2051.05,"p":false,"h":false},{"t":"헤롯과 본디오 빌라도가 이방인들과 이스라엘 백성과 함께 예수를 대적하여 모였으나, 그것은 주의 권능과 뜻으로 미리 작정하신 일을 이루려는 것이었다고 고백합니다(행 4:27-28).","s":2051.676,"e":2065.91,"p":true,"h":false},{"t":"앞의 두 번은 대중을 향한 선포이고, 마지막은 신자들이 하나님께 드리는 기도입니다.","s":2066.652,"e":2072.509,"p":false,"h":false},{"t":"청중에게 선포할 때도, 하나님 앞에 엎드려 기도할 때도 같은 말이 나옵니다.","s":2073.168,"e":2078.248,"p":false,"h":false},{"t":"그러므로 이것은 설교자의 수사가 아니라 초대교회가 십자가를 이해한 방식이었습니다.","s":2078.892,"e":2084.677,"p":false,"h":false},{"t":"교회는 십자가를 사람의 비극으로도, 하나님의 계획으로만도 읽지 않았습니다.","s":2085.336,"e":2090.617,"p":false,"h":false},{"t":"두 가지를 함께 붙들었습니다.","s":2091.24,"e":2093.358,"p":true,"h":false},{"t":"요셉 이야기가 보여 준 방식","s":2094.156,"e":2096.315,"p":true,"h":false},{"t":"이 구조는 성경에 처음 나오는 방식이 아닙니다.","s":2097.072,"e":2100.367,"p":false,"h":false},{"t":"가장 선명한 앞선 예가 요셉입니다.","s":2100.888,"e":2103.409,"p":true,"h":false},{"t":"요셉의 형들은 시기하여 동생을 구덩이에 던지고 노예로 팔았습니다.","s":2104.236,"e":2109.116,"p":false,"h":false},{"t":"그것은 명백한 죄였습니다.","s":2109.78,"e":2111.939,"p":false,"h":false},{"t":"그런데 훗날 요셉은 형들에게 말합니다.","s":2112.552,"e":2115.294,"p":false,"h":false},{"t":"형들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사 오늘과 같이 많은 백성의 생명을 구원하게 하셨다고 합니다(창 50:20).","s":2115.828,"e":2125.409,"p":false,"h":false},{"t":"같은 사건을 두고 형들의 악이라고 하고 하나님의 선이라고 합니다.","s":2125.98,"e":2130.076,"p":false,"h":false},{"t":"형들은 책임을 면하지 않고, 하나님은 죄의 책임을 지지 않으십니다.","s":2130.732,"e":2135.549,"p":true,"h":false},{"t":"앗수르를 막대기로 쓰시는 하나님을 이사야서에서 보셨다면 같은 구조를 아실 것입니다.","s":2136.42,"e":2142.099,"p":false,"h":false},{"t":"하나님이 앗수르를 도구로 쓰셨으나 앗수르는 자기 교만의 책임을 졌습니다.","s":2142.72,"e":2147.498,"p":false,"h":false},{"t":"십자가는 이 구조가 가장 깊고 선명하게 드러난 자리입니다.","s":2148.12,"e":2152.427,"p":true,"h":false},{"t":"죄의 조성자가 되시지 않는 하나님","s":2153.304,"e":2155.828,"p":true,"h":false},{"t":"여기서 바로 나오는 질문이 있습니다.","s":2156.724,"e":2159.284,"p":false,"h":false},{"t":"하나님이 미리 정하셨다면 하나님이 죄를 만드신 것 아닙니까.","s":2159.892,"e":2163.829,"p":true,"h":false},{"t":"성경은 이 질문에 두 가지를 동시에 말합니다.","s":2164.716,"e":2167.944,"p":false,"h":false},{"t":"하나님은 모든 일을 다스리신다는 것, 그리고 하나님은 악을 행하시지도 않고 사람을 악으로 시험하지도 않으신다는 것입니다(약 1:13).","s":2168.568,"e":2178.673,"p":false,"h":false},{"t":"개혁파 신앙고백은 이 둘을 함께 붙듭니다.","s":2179.188,"e":2182.446,"p":false,"h":false},{"t":"하나님이 모든 일을 영원 전부터 작정하셨으나 죄의 조성자가 되지 않으시며, 피조물의 의지에 폭력을 가하지도 않으신다고 고백합니다.","s":2183.076,"e":2191.805,"p":false,"h":false},{"t":"가롯 유다도, 빌라도도, 군중도 자기 뜻대로 움직였고 자기 죄를 지었습니다.","s":2192.364,"e":2198.494,"p":false,"h":false},{"t":"그러나 그들의 죄는 하나님의 손 밖으로 벗어나지 못했습니다.","s":2199.132,"e":2203.272,"p":true,"h":false},{"t":"이것이 완전히 설명되었다고 말하면 정직하지 못합니다.","s":2204.028,"e":2207.75,"p":false,"h":false},{"t":"이 자리는 설명이 끝나는 곳이 아니라 신비가 시작되는 곳입니다.","s":2208.348,"e":2212.615,"p":false,"h":false},{"t":"다만 사도들이 이 두 말을 서로 모순으로 여기지 않았고, 그래서 설교에서도 기도에서도 한꺼번에 말했다는 사실은 분명합니다.","s":2213.244,"e":2221.834,"p":true,"h":false},{"t":"이 설교는 어떻게 작용했는가","s":2222.676,"e":2224.92,"p":true,"h":false},{"t":"이 설교의 효과가 흥미롭습니다.","s":2225.808,"e":2228.153,"p":false,"h":false},{"t":"베드로는 하나님의 정하신 계획을 말한 다음, 너희가 십자가에 못 박은 이 예수를 하나님이 주와 그리스도가 되게 하셨다고 선언합니다(행 2:36).","s":2228.796,"e":2239.658,"p":false,"h":false},{"t":"듣는 사람들은 마음이 찔렸다고 합니다(행 2:37).","s":2240.208,"e":2245.235,"p":true,"h":false},{"t":"만일 설교가 하나님의 계획만 강조했다면 청중은 우리 책임이 아니라고 안심했을 것입니다.","s":2245.932,"e":2251.977,"p":false,"h":false},{"t":"만일 사람의 죄만 강조했다면 절망했을 것입니다.","s":2252.592,"e":2256.12,"p":false,"h":false},{"t":"하나님의 계획과 사람의 죄가 함께 선포되었기 때문에 두 가지가 동시에 일어납니다.","s":2256.732,"e":2262.213,"p":false,"h":false},{"t":"내 죄를 피할 수 없고, 동시에 그 죄조차 하나님이 구원의 길로 삼으셨다는 소식을 듣게 됩니다.","s":2262.852,"e":2269.411,"p":true,"h":false},{"t":"베드로가 성전에서 한 설교가 이 점을 더 분명히 보여 줍니다.","s":2270.304,"e":2274.46,"p":false,"h":false},{"t":"베드로는 청중이 예수를 넘겨주고 부인한 것을 숨김없이 말합니다.","s":2275.056,"e":2279.599,"p":false,"h":false},{"t":"그러고는 형제들아 나는 너희가 알지 못하고 그리한 줄을 안다고 말합니다(행 3:17).","s":2280.24,"e":2287.232,"p":false,"h":false},{"t":"그리고 곧바로 회개하고 돌이켜 죄 없이 함을 받으라고 청합니다.","s":2287.764,"e":2291.879,"p":false,"h":false},{"t":"책임을 추궁한 끝에 초청이 이어집니다.","s":2292.444,"e":2295.25,"p":false,"h":false},{"t":"죄를 숨기지 않는 설교만이 값없는 용서를 제대로 선포할 수 있습니다.","s":2295.72,"e":2300.029,"p":true,"h":false},{"t":"반유대주의로 읽어서는 안 되는 이유","s":2300.868,"e":2303.463,"p":true,"h":false},{"t":"이 본문은 역사 속에서 심하게 오용되었습니다.","s":2304.036,"e":2307.355,"p":false,"h":false},{"t":"유대인이 예수를 죽였다는 증거로 쓰여 유대인 박해의 구실이 되었습니다.","s":2307.996,"e":2312.688,"p":false,"h":false},{"t":"이것은 본문을 심각하게 잘못 읽은 것입니다.","s":2313.324,"e":2316.577,"p":true,"h":false},{"t":"먼저 베드로와 설교를 듣던 청중은 모두 유대인이었고, 설교자 자신이 유대인이었습니다.","s":2317.464,"e":2323.658,"p":false,"h":false},{"t":"그리고 4장 27절은 예수를 대적한 이들이 헤롯과 빌라도, 이방인들과 이스라엘 백성이라고 말합니다.","s":2324.304,"e":2331.694,"p":false,"h":false},{"t":"이방 권력과 유대 지도자와 군중이 함께 있었습니다.","s":2332.332,"e":2336.064,"p":false,"h":false},{"t":"더 근본적으로, 시편 2편과 이사야 53장에 따르면 이 죽음은 모든 사람의 죄를 위한 것이었습니다.","s":2336.724,"e":2344.181,"p":false,"h":false},{"t":"십자가 앞에 선 사람은 누구도 구경꾼이 될 수 없습니다.","s":2344.86,"e":2348.607,"p":false,"h":false},{"t":"성경이 책임을 묻는 대상은 어느 한 민족이 아니라 하나님을 떠난 모든 사람입니다.","s":2349.216,"e":2354.488,"p":true,"h":false},{"t":"그러므로 이 본문을 읽는 신자가 할 일은 누군가에게 손가락질하는 것이 아니라, 자기 자신이 이 십자가 앞에서 법 없는 사람들의 자리에 서 있었음을 인정하는 것입니다.","s":2355.408,"e":2366.338,"p":true,"h":false},{"t":"은혜가 가장 큰 죄 위에 서 있다","s":2367.216,"e":2369.696,"p":true,"h":false},{"t":"이 본문이 주는 가장 큰 위로는 이것입니다.","s":2370.528,"e":2373.7,"p":false,"h":false},{"t":"인류가 저지른 가장 큰 죄, 곧 하나님의 아들을 죽인 죄가 바로 구원이 이루어진 자리가 되었습니다.","s":2374.308,"e":2381.277,"p":false,"h":false},{"t":"하나님은 사람의 가장 악한 행위마저 구원의 계획 속에 두셨습니다.","s":2381.94,"e":2386.332,"p":true,"h":false},{"t":"그렇다면 우리의 죄는 어떻겠습니까.","s":2387.16,"e":2389.865,"p":false,"h":false},{"t":"어떤 죄도 하나님의 계획 밖에서 일어나지 않고, 그리스도의 십자가보다 더 큰 죄는 없습니다.","s":2390.436,"e":2396.879,"p":false,"h":false},{"t":"이 믿음이 사도들이 담대히 설교하고 기도한 뿌리였습니다.","s":2397.528,"e":2401.395,"p":false,"h":false},{"t":"하나님이 정하셨다는 말은 그들에게 숙명론이 아니라 안식이었고, 사람이 죽였다는 말은 책임 회피를 막는 거울이었습니다.","s":2402.028,"e":2409.708,"p":false,"h":false},{"t":"두 가지가 함께 있을 때 복음이 복음으로 들립니다.","s":2410.344,"e":2413.626,"p":true,"h":false}]},{"title":"5. 초대교회의 재산 공유는 따라야 할 본인가: 아나니아와 삽비라가 죽은 까닭","audio":"book_2610272355_1.mp3","start":2414.484,"end":2924.388,"dur":509.9,"segs":[{"t":"5.","s":2414.484,"e":2414.921,"p":false,"h":false},{"t":"초대교회의 재산 공유는 따라야 할 본인가: 아나니아와 삽비라가 죽은 까닭","s":2416.392,"e":2421.834,"p":true,"h":false},{"t":"본문: 사도행전 2장 42-47절, 4장 32절-5장 11절 (함께 읽을 본문: 행 6:1-6, 행 11:27-30, 롬 15:25-27, 고후 8:1-15, 수 7장, 레 10:1-3)","s":2422.764,"e":2446.641,"p":true,"h":false},{"t":"예루살렘 교회의 모습은 오래도록 교회의 이상으로 읽혀 왔습니다.","s":2447.28,"e":2451.849,"p":false,"h":false},{"t":"믿는 사람들이 모든 물건을 서로 통용하고, 재산과 소유를 팔아 각 사람의 필요를 따라 나누어 주었다고 합니다(행 2:44-45).","s":2452.5,"e":2462.887,"p":false,"h":false},{"t":"아무도 가난한 사람이 없었다고 합니다(행 4:34).","s":2463.228,"e":2467.961,"p":true,"h":false},{"t":"이 장면을 읽은 사람들은 두 갈래로 나뉘었습니다.","s":2468.844,"e":2472.354,"p":false,"h":false},{"t":"한쪽은 교회가 이렇게 살아야 한다고 하고, 다른 쪽은 시대가 달랐다고 합니다.","s":2473.02,"e":2478.451,"p":false,"h":false},{"t":"그런데 이 아름다운 장면 바로 뒤에, 끔찍한 사건이 따라옵니다.","s":2479.104,"e":2483.807,"p":false,"h":false},{"t":"땅을 팔아 헌금한 부부가 같은 날 죽습니다.","s":2484.396,"e":2487.318,"p":true,"h":false},{"t":"이 글에서는 재산 공유가 오늘의 교회가 따라야 할 규범인지, 그리고 아나니아와 삽비라는 왜 그렇게 되었는지를 함께 살펴봅니다.","s":2488.14,"e":2496.975,"p":false,"h":false},{"t":"두 물음은 한 이야기 안에서 서로를 풀어 줍니다.","s":2497.608,"e":2500.818,"p":true,"h":false},{"t":"기록된 일과 명령된 일","s":2501.712,"e":2503.736,"p":true,"h":false},{"t":"먼저 구별해야 할 것이 있습니다.","s":2504.592,"e":2506.912,"p":false,"h":false},{"t":"성경에 기록되어 있다는 것과 성경이 명령한다는 것은 다릅니다.","s":2507.544,"e":2512.138,"p":false,"h":false},{"t":"사도행전의 이야기가 하나님이 하신 일과 교회가 한 일을 기록한 것이라면, 그것이 모든 교회가 따라야 할 규정인지는 따로 물어야 합니다.","s":2512.476,"e":2521.157,"p":true,"h":false},{"t":"본문을 자세히 보면 재산 공유는 명령이 아니라 자발적인 행동이었습니다.","s":2522.016,"e":2526.972,"p":false,"h":false},{"t":"누가는 믿는 무리가 자기 재산을 자기 것이라 주장하지 않고 통용했다고 쓰면서(행 4:32), 그 까닭을 사도들이 큰 권능으로 주 예수의 부활을 증언했고 무리가 큰 은혜를 받았기 때문이라고 설명합니다(행 4:33).","s":2527.632,"e":2545.103,"p":false,"h":false},{"t":"누구도 법으로 강제하지 않았고, 은혜가 마음을 열어 놓았을 뿐입니다.","s":2545.38,"e":2550.259,"p":true,"h":false},{"t":"게다가 이 일은 오래가지 않았습니다.","s":2551.14,"e":2553.857,"p":false,"h":false},{"t":"곧 6장에 가면 교회 안에서 구제의 불평이 생기고, 이후 예루살렘 교회는 다른 지역 교회의 도움을 받아야 할 만큼 가난해집니다(행 11:27-30, 롬 15:25-26).","s":2554.452,"e":2569.612,"p":false,"h":false},{"t":"재산 공유가 교회의 항구적인 제도가 되지 못했다는 뜻입니다.","s":2570.256,"e":2574.341,"p":false,"h":false},{"t":"신약 서신서 어디에도 모든 교회가 재산을 공유하라는 명령은 없습니다.","s":2574.972,"e":2579.788,"p":false,"h":false},{"t":"오히려 바울은 각 사람이 마음에 정한 대로 즐거이 내라고 권합니다(고후 9:7).","s":2580.336,"e":2587.088,"p":true,"h":false},{"t":"그렇다면 이 장면은 아무 의미가 없습니까.","s":2587.608,"e":2590.661,"p":false,"h":false},{"t":"그렇지 않습니다.","s":2591.244,"e":2592.613,"p":false,"h":false},{"t":"이것은 성령이 임하신 공동체에서 나타난 열매였습니다.","s":2593.26,"e":2597.245,"p":false,"h":false},{"t":"구제를 의무로 정한 것이 아니라 은혜를 받은 마음이 자연스럽게 일으킨 결과였습니다.","s":2597.868,"e":2603.31,"p":false,"h":false},{"t":"우리가 배울 점은 제도를 복제하는 것이 아니라, 은혜가 재물에 대한 마음을 이렇게 바꾼다는 사실입니다.","s":2603.988,"e":2610.756,"p":true,"h":false},{"t":"바나바의 이름","s":2611.656,"e":2612.952,"p":true,"h":false},{"t":"누가는 구체적인 사람 하나를 소개합니다.","s":2613.816,"e":2616.766,"p":false,"h":false},{"t":"구브로 태생의 레위 사람 요셉이 밭을 팔아 그 값을 사도들의 발 앞에 놓았고, 사도들은 그를 위로의 아들이라는 뜻의 바나바라고 불렀다고 합니다(행 4:36-37).","s":2617.416,"e":2629.904,"p":true,"h":false},{"t":"바나바 이야기는 칭찬받을 만한 한 인물을 소개하는 것으로 끝나지 않습니다.","s":2630.7,"e":2635.368,"p":false,"h":false},{"t":"곧바로 이어지는 아나니아와 삽비라 이야기와 짝을 이루고 있습니다.","s":2635.992,"e":2640.496,"p":false,"h":false},{"t":"한쪽은 땅을 팔아 가져왔고, 다른 쪽도 땅을 팔아 가져왔습니다.","s":2641.176,"e":2645.807,"p":false,"h":false},{"t":"겉으로는 같은 행동입니다.","s":2646.432,"e":2648.537,"p":false,"h":false},{"t":"그런데 하나는 칭찬을 받고 하나는 죽습니다.","s":2649.096,"e":2651.955,"p":false,"h":false},{"t":"차이는 어디에 있었습니까.","s":2652.588,"e":2654.529,"p":true,"h":false},{"t":"아나니아와 삽비라의 죄","s":2655.396,"e":2657.155,"p":true,"h":false},{"t":"아나니아와 삽비라 부부는 소유를 팔았으나 그 값의 얼마를 감추어 두고 일부만 가져와서 사도들의 발 앞에 놓았습니다(행 5:1-2).","s":2657.664,"e":2668.358,"p":false,"h":false},{"t":"문제는 감춘 데 있지 않았습니다.","s":2668.932,"e":2671.401,"p":false,"h":false},{"t":"베드로의 말을 들어 보십시오.","s":2672.064,"e":2674.012,"p":true,"h":false},{"t":"땅이 그대로 있을 때에는 네 것이 아니었느냐, 판 후에도 네 마음대로 할 수 있지 아니하였느냐(행 5:4).","s":2674.764,"e":2682.705,"p":false,"h":false},{"t":"처음부터 전부를 내라는 요구는 없었습니다.","s":2683.224,"e":2686.302,"p":false,"h":false},{"t":"그렇다면 죄는 소유를 다 드리지 않은 데 있는 것이 아닙니다.","s":2686.968,"e":2690.962,"p":false,"h":false},{"t":"베드로가 지적한 죄는 거짓말이었습니다.","s":2691.504,"e":2694.175,"p":false,"h":false},{"t":"일부만 드리고 전부를 드린 것처럼 보이려 했습니다.","s":2694.708,"e":2698.252,"p":false,"h":false},{"t":"사람에게서 헌신적인 신자라는 평판을 얻으려 했고, 그 일을 위해 하나님 앞에서 거짓을 꾸몄습니다.","s":2698.812,"e":2705.684,"p":true,"h":false},{"t":"그래서 베드로는 이 일을 이렇게 규정합니다.","s":2706.588,"e":2709.707,"p":false,"h":false},{"t":"사탄이 네 마음에 가득하여 네가 성령을 속였다(행 5:3).","s":2710.26,"e":2715.912,"p":false,"h":false},{"t":"너는 사람에게 거짓말한 것이 아니고 하나님께 한 것이다(행 5:4).","s":2716.488,"e":2721.949,"p":false,"h":false},{"t":"은혜에 감격하여 드린 바나바의 헌금과 달리, 아나니아와 삽비라는 은혜의 모양을 빌려 자기를 높이려 했습니다.","s":2722.5,"e":2729.717,"p":false,"h":false},{"t":"헌금의 액수가 아니라 마음의 방향이 달랐습니다.","s":2730.348,"e":2733.759,"p":true,"h":false},{"t":"이 죄가 이렇게 무겁게 다루어진 이유","s":2734.668,"e":2737.293,"p":true,"h":false},{"t":"이 이야기를 읽으면 누구나 불편함을 느낍니다.","s":2738.196,"e":2741.474,"p":false,"h":false},{"t":"거짓말 한 번에 죽음이라니 너무 가혹하다는 생각이 듭니다.","s":2742.12,"e":2746.004,"p":false,"h":false},{"t":"본문의 날을 무디게 해서는 안 됩니다.","s":2746.62,"e":2749.19,"p":false,"h":false},{"t":"하나님은 정말 이들을 치셨고, 누가는 그 일을 아무 변명 없이 기록합니다.","s":2749.788,"e":2755.143,"p":false,"h":false},{"t":"그러면서도 누가는 이 사건을 이해할 만한 단서를 남겨 놓았습니다.","s":2755.764,"e":2760.435,"p":true,"h":false},{"t":"이 일은 교회가 막 시작된 때에 일어났습니다.","s":2761.308,"e":2764.55,"p":false,"h":false},{"t":"성경에는 이런 방식으로 하나님이 새 시작의 자리에서 거룩의 기준을 분명히 세우신 예가 있습니다.","s":2765.16,"e":2771.42,"p":false,"h":false},{"t":"광야에서 성막이 막 세워지고 제사가 시작되었을 때 나답과 아비후가 다른 불을 드리다가 죽었습니다.","s":2772.036,"e":2778.971,"p":false,"h":false},{"t":"하나님은 나를 가까이하는 자 중에서 내가 거룩함을 나타내겠다고 하셨습니다(레 10:3).","s":2779.668,"e":2786.732,"p":false,"h":false},{"t":"가나안 정복이 시작되었을 때에는 아간이 바친 물건을 훔쳐 죽었습니다(수 7장).","s":2787.192,"e":2793.695,"p":false,"h":false},{"t":"새 공동체의 시작에서 하나님은 자신의 거룩하심을 몸으로 보이십니다.","s":2794.32,"e":2799.024,"p":true,"h":false},{"t":"교회에도 같은 일이 일어난 것입니다.","s":2799.936,"e":2802.551,"p":false,"h":false},{"t":"하나님이 성령으로 세우신 공동체 안에서 성령을 속이는 일은 가볍게 넘어갈 일이 아니었습니다.","s":2803.104,"e":2809.145,"p":false,"h":false},{"t":"이 일 뒤에 온 교회와 이 일을 듣는 사람들이 크게 두려워했다고 합니다(행 5:11).","s":2809.764,"e":2816.666,"p":false,"h":false},{"t":"누가가 교회라는 말을 분명하게 쓰는 첫 자리가 바로 이 대목이라는 것도 의미심장합니다.","s":2817.252,"e":2823.584,"p":false,"h":false},{"t":"교회는 하나님이 두려운 분임을 아는 사람들의 모임으로 세상에 나타났습니다.","s":2824.236,"e":2829.021,"p":true,"h":false},{"t":"다만 한 가지는 정직하게 말해야 합니다.","s":2829.888,"e":2832.694,"p":false,"h":false},{"t":"이 부부가 영원한 구원에서 제외되었는지 성경은 말하지 않습니다.","s":2833.308,"e":2838.038,"p":false,"h":false},{"t":"본문이 말하는 것은 하나님이 그들을 이 땅에서 치셨다는 사실까지입니다.","s":2838.672,"e":2843.606,"p":false,"h":false},{"t":"그 너머를 우리가 단정할 수는 없습니다.","s":2844.252,"e":2847.156,"p":true,"h":false},{"t":"오늘 교회가 읽어야 할 것","s":2847.96,"e":2849.905,"p":true,"h":false},{"t":"이 본문은 흔히 두 가지로 오용됩니다.","s":2850.768,"e":2853.639,"p":true,"h":false},{"t":"하나는 재산 공유를 신자의 의무로 만드는 것입니다.","s":2854.512,"e":2858.08,"p":false,"h":false},{"t":"앞에서 본 대로 베드로가 땅이 네 것이 아니었느냐고 물은 말이 이를 막고 있습니다.","s":2858.688,"e":2863.773,"p":false,"h":false},{"t":"소유의 처분은 자유로운 응답이어야 했습니다.","s":2864.376,"e":2867.456,"p":true,"h":false},{"t":"다른 하나는 이 이야기를 헌금을 강요하는 도구로 쓰는 것입니다.","s":2868.3,"e":2872.405,"p":false,"h":false},{"t":"하나님께 약속한 것을 다 드리지 않으면 벌을 받는다는 식의 설교입니다.","s":2872.98,"e":2877.811,"p":false,"h":false},{"t":"이것도 본문과 맞지 않습니다.","s":2878.452,"e":2880.648,"p":false,"h":false},{"t":"아나니아와 삽비라의 죄는 적게 드린 데 있지 않고 속인 데 있었습니다.","s":2881.26,"e":2885.929,"p":true,"h":false},{"t":"본문이 우리에게 묻는 것은 이것입니다.","s":2886.804,"e":2889.567,"p":false,"h":false},{"t":"내가 하나님께 드리는 것이 은혜에 감격한 마음에서 나왔는가, 아니면 남에게 보이려는 마음에서 나왔는가.","s":2890.188,"e":2897.429,"p":false,"h":false},{"t":"하나님은 마음을 보시기 때문에, 아무도 모르게 드린 작은 것이 사람들 앞에 크게 드린 것보다 귀할 수 있습니다.","s":2898.072,"e":2905.144,"p":true,"h":false},{"t":"그리고 한 가지를 더 말해야 합니다.","s":2906.028,"e":2908.468,"p":false,"h":false},{"t":"이 두 사람은 은혜를 이용했지만, 이 사건의 중심에는 여전히 부활하신 주님이 성령으로 자기 교회를 지키신다는 사실이 있습니다.","s":2909.052,"e":2917.418,"p":false,"h":false},{"t":"그 주님의 임재가 위로이면서 두려움이라는 것을 교회는 이 사건 이후 배웠습니다.","s":2918.052,"e":2923.492,"p":true,"h":false}]},{"title":"6. 스데반은 왜 변론 대신 구약 역사를 길게 말하다가 순교하는가","audio":"book_2610272355_1.mp3","start":2924.388,"end":3507.012,"dur":582.6,"segs":[{"t":"6.","s":2924.388,"e":2924.977,"p":false,"h":false},{"t":"스데반은 왜 변론 대신 구약 역사를 길게 말하다가 순교하는가","s":2926.296,"e":2930.615,"p":true,"h":false},{"t":"본문: 사도행전 6장 8절-8장 3절 (함께 읽을 본문: 창 12:1-3, 출 2:11-15, 출 3:1-10, 렘 7:1-15, 사 66:1-2, 눅 23:34, 눅 23:46)","s":2931.516,"e":2954.851,"p":true,"h":false},{"t":"사도행전에서 가장 긴 설교는 스데반의 설교입니다.","s":2955.492,"e":2959.06,"p":false,"h":false},{"t":"그런데 이 설교는 읽기가 가장 어렵습니다.","s":2959.668,"e":2962.896,"p":true,"h":false},{"t":"스데반은 성전과 율법을 모독했다는 고발을 받고 법정에 섭니다.","s":2963.772,"e":2968.454,"p":false,"h":false},{"t":"사람들은 그가 변론하리라고 기대했을 것입니다.","s":2969.064,"e":2972.433,"p":false,"h":false},{"t":"그런데 스데반은 아브라함부터 시작해서 요셉, 모세, 성막, 솔로몬의 성전까지 이스라엘의 역사를 훑어 갑니다.","s":2972.736,"e":2981.991,"p":false,"h":false},{"t":"고발과는 상관이 없어 보이는 이야기가 오십 절 가까이 이어집니다.","s":2982.636,"e":2987.393,"p":false,"h":false},{"t":"그러다 갑자기 말투가 바뀌어서 너희는 목이 곧은 사람들이라고 선언합니다.","s":2988.072,"e":2993.079,"p":false,"h":false},{"t":"그리고 돌에 맞아 죽습니다.","s":2993.724,"e":2995.746,"p":true,"h":false},{"t":"이 글에서는 이 긴 역사 요약이 사실은 정교하게 짜인 응답이라는 것을 살펴봅니다.","s":2996.604,"e":3002.36,"p":false,"h":false},{"t":"스데반은 변론한 것이 아니라 고발을 뒤집어 고발자를 법정의 피고석에 세웠습니다.","s":3003.012,"e":3008.33,"p":true,"h":false},{"t":"무엇을 고발당했는가","s":3009.204,"e":3011.029,"p":true,"h":false},{"t":"스데반은 은혜와 권능이 충만하여 백성 가운데서 큰 기사와 표적을 행하던 사람이었습니다(행 6:8).","s":3011.904,"e":3020.093,"p":false,"h":false},{"t":"그가 말하는 것을 반박할 수 없게 된 사람들이 거짓 증인을 세워 고발합니다.","s":3020.652,"e":3025.669,"p":false,"h":false},{"t":"이 사람이 이 거룩한 곳과 율법을 거슬러 말하고, 나사렛 예수가 이 곳을 헐고 모세가 전한 규례를 고치리라고 말하는 것을 들었다는 것입니다(행 6:13-14).","s":3026.232,"e":3038.579,"p":true,"h":false},{"t":"고발의 핵심은 성전과 율법입니다.","s":3039.156,"e":3041.788,"p":false,"h":false},{"t":"성전은 하나님이 계신 곳이고, 율법은 하나님이 주신 길이라고 믿던 사람들에게 이 둘을 건드리는 일은 곧 하나님을 모독하는 일이었습니다.","s":3042.432,"e":3051.904,"p":false,"h":false},{"t":"대제사장이 이 말이 사실이냐고 묻습니다.","s":3052.512,"e":3055.432,"p":false,"h":false},{"t":"스데반의 설교는 이 질문에 대한 대답입니다.","s":3056.04,"e":3059.196,"p":true,"h":false},{"t":"하나님은 항상 땅 밖에서 먼저 일하셨다","s":3060.072,"e":3062.988,"p":true,"h":false},{"t":"스데반은 아브라함에서 시작합니다.","s":3063.564,"e":3066.048,"p":false,"h":false},{"t":"영광의 하나님이 메소포타미아에 있던 아브라함에게 나타나셨다고 합니다(행 7:2).","s":3066.696,"e":3073.001,"p":false,"h":false},{"t":"하란에서 가나안으로 부르실 때 하나님은 그에게 이 땅에서 발 디딜 한 뼘도 유업으로 주지 않으셨다고 합니다(행 7:5).","s":3073.608,"e":3082.286,"p":false,"h":false},{"t":"성전이 있는 이 땅이 아니라 이방 땅에서 하나님이 약속을 주셨다는 것입니다.","s":3082.824,"e":3088.016,"p":true,"h":false},{"t":"요셉도 그렇습니다.","s":3088.908,"e":3090.528,"p":false,"h":false},{"t":"형제들의 시기를 받아 애굽에 팔렸으나 하나님이 그와 함께 계셨습니다(행 7:9).","s":3091.176,"e":3097.673,"p":false,"h":false},{"t":"하나님의 구원은 애굽에서 일어났습니다.","s":3098.268,"e":3100.986,"p":false,"h":false},{"t":"모세는 더욱 그렇습니다.","s":3101.292,"e":3103.282,"p":false,"h":false},{"t":"하나님은 이스라엘 땅이 아니라 미디안 광야, 불타는 떨기나무 앞에서 모세를 부르십니다.","s":3103.884,"e":3110.007,"p":false,"h":false},{"t":"그리고 모세가 서 있던 곳이 거룩한 땅이라고 말씀하십니다(행 7:33).","s":3110.616,"e":3116.836,"p":false,"h":false},{"t":"땅이 거룩해서 하나님이 오신 것이 아니라 하나님이 오셔서 땅이 거룩해졌습니다.","s":3117.384,"e":3122.676,"p":true,"h":false},{"t":"스데반의 논지는 이렇게 쌓입니다.","s":3123.576,"e":3126.004,"p":false,"h":false},{"t":"하나님은 성전이라는 한 장소에 매여 계시지 않았고, 이스라엘의 역사에서 결정적인 순간마다 이스라엘 땅 바깥에서 일하셨다는 것입니다.","s":3126.6,"e":3135.722,"p":false,"h":false},{"t":"성전을 하나님과 동일시하는 사람들에게 이것은 가장 근본적인 반박입니다.","s":3136.356,"e":3141.466,"p":true,"h":false},{"t":"보내신 이를 배척하는 백성","s":3142.368,"e":3144.529,"p":true,"h":false},{"t":"스데반이 역사를 따라가며 반복해서 드러내는 패턴이 하나 더 있습니다.","s":3145.392,"e":3150.014,"p":false,"h":false},{"t":"하나님이 구원자를 보내시면 백성이 그를 배척한다는 것입니다.","s":3150.648,"e":3155.004,"p":true,"h":false},{"t":"요셉은 형제들이 팔았습니다.","s":3155.544,"e":3157.681,"p":false,"h":false},{"t":"모세는 처음에 이스라엘 동족에게 배척당했습니다.","s":3158.28,"e":3161.622,"p":false,"h":false},{"t":"누가 너를 우리의 관리와 재판장으로 세웠느냐는 말을 들었습니다(행 7:27).","s":3162.24,"e":3168.807,"p":false,"h":false},{"t":"그런데 스데반은 그 모세를 하나님이 바로 관리와 구원자로 세워 보내셨다고 말합니다(행 7:35).","s":3169.332,"e":3177.227,"p":false,"h":false},{"t":"백성이 거절한 사람을 하나님이 도리어 높이 세우신 것입니다.","s":3177.756,"e":3181.723,"p":false,"h":false},{"t":"이스라엘은 모세가 시내산에 올라간 사이에 금송아지를 만들었습니다(행 7:39-41).","s":3182.328,"e":3189.998,"p":true,"h":false},{"t":"이 패턴이 쌓인 뒤에 스데반의 결론이 나옵니다.","s":3190.716,"e":3194.026,"p":false,"h":false},{"t":"너희 조상들이 선지자들 중에 누구를 박해하지 아니하였느냐.","s":3194.676,"e":3198.354,"p":false,"h":false},{"t":"의인이 오실 것을 예고한 사람들까지 죽였고, 너희는 이제 그 의인을 배반하고 살해한 자가 되었다는 것입니다(행 7:52).","s":3198.996,"e":3208.854,"p":false,"h":false},{"t":"스데반은 처음부터 이것을 말하려고 역사를 훑었던 것입니다.","s":3209.436,"e":3213.803,"p":true,"h":false},{"t":"성전에 대한 마지막 말","s":3214.62,"e":3216.438,"p":true,"h":false},{"t":"그 사이에 성전에 대한 말이 나옵니다.","s":3217.392,"e":3219.898,"p":false,"h":false},{"t":"하나님의 성막은 광야에서 이동하는 천막이었고, 다윗이 성전을 짓고자 했으나 솔로몬이 지었다고 합니다.","s":3220.524,"e":3227.491,"p":false,"h":false},{"t":"그리고 이어 이렇게 말합니다.","s":3228.12,"e":3230.198,"p":false,"h":false},{"t":"지극히 높으신 이는 손으로 지은 곳에 계시지 않는다(행 7:48).","s":3230.82,"e":3236.704,"p":true,"h":false},{"t":"그는 이사야 66장을 인용합니다.","s":3237.372,"e":3240.287,"p":false,"h":false},{"t":"하늘은 내 보좌요 땅은 내 발등상이니 너희가 나를 위하여 무슨 집을 짓겠으며 나의 안식할 처소가 어디냐(사 66:1-2).","s":3240.864,"e":3250.63,"p":false,"h":false},{"t":"하나님은 성전을 반대하신 것이 아니라 성전에 갇히지 않으신다는 말입니다.","s":3251.16,"e":3256.089,"p":false,"h":false},{"t":"성전은 하나님을 모시는 상자가 아니라 하나님이 임재하시는 자리를 가리키는 표지였습니다.","s":3256.74,"e":3262.695,"p":false,"h":false},{"t":"예레미야도 성전이라는 말만 외치며 안심하는 백성을 향해 같은 말을 한 적이 있습니다(렘 7:4).","s":3263.328,"e":3270.708,"p":true,"h":false},{"t":"그러므로 스데반이 성전을 모독했다는 고발은 정확하지 않았습니다.","s":3271.572,"e":3275.977,"p":false,"h":false},{"t":"그는 성전을 하나님으로 착각하는 마음을 꾸짖은 것이고, 그 착각이 예수를 거절하게 만든 뿌리라고 지적했습니다.","s":3276.504,"e":3283.847,"p":false,"h":false},{"t":"예수께서 성전을 헐고 사흘 만에 다시 지으리라고 하신 말씀은 자기 몸을 가리킨 것이었습니다(요 2:19-21).","s":3284.496,"e":3293.541,"p":false,"h":false},{"t":"참된 성전은 이제 건물이 아니라 그리스도이신데, 건물에 붙들린 사람들은 그분을 알아보지 못했습니다.","s":3294,"e":3301.168,"p":true,"h":false},{"t":"설교가 멈춘 자리","s":3302.028,"e":3303.575,"p":true,"h":false},{"t":"스데반이 말을 마쳤을 때 사람들은 이를 갈았습니다.","s":3304.44,"e":3308.259,"p":false,"h":false},{"t":"그때 스데반은 성령이 충만하여 하늘을 바라보고 하나님의 영광과 하나님 우편에 서신 예수를 봅니다(행 7:55).","s":3308.904,"e":3317.626,"p":false,"h":false},{"t":"그리고 하늘이 열리고 인자가 하나님 우편에 서 계신 것이 보인다고 말합니다(행 7:56).","s":3318.156,"e":3325.325,"p":true,"h":false},{"t":"이 장면에서 눈여겨볼 점이 있습니다.","s":3326.148,"e":3328.678,"p":false,"h":false},{"t":"신약은 승천하신 예수께서 하나님 우편에 앉아 계시다고 자주 말하는데, 여기서는 서 계십니다.","s":3329.244,"e":3335.887,"p":false,"h":false},{"t":"이 차이를 두고 해석이 여럿 있습니다.","s":3336.552,"e":3339.046,"p":false,"h":false},{"t":"순교하는 증인을 맞이하러 일어나신 것이라고 보기도 하고, 법정에서 자기 증인을 변호하기 위해 서신 것이라고 보기도 합니다.","s":3339.684,"e":3347.602,"p":false,"h":false},{"t":"본문이 이유를 말하지 않으므로 하나만 단정하기는 어렵습니다.","s":3348.216,"e":3352.285,"p":false,"h":false},{"t":"다만 분명한 것은 땅의 법정에서 스데반이 고발당하는 그 시각에 하늘의 법정에서 인자가 그의 편에 서 계셨다는 점입니다.","s":3352.932,"e":3361.05,"p":true,"h":false},{"t":"그리고 스데반의 마지막 말은 우연이라고 하기에는 너무나 예수의 십자가 위의 말씀과 닮았습니다.","s":3361.86,"e":3368.333,"p":false,"h":false},{"t":"주 예수여 내 영혼을 받으시옵소서.","s":3368.952,"e":3371.488,"p":false,"h":false},{"t":"주여 이 죄를 그들에게 돌리지 마옵소서(행 7:59-60).","s":3372.084,"e":3378.116,"p":false,"h":false},{"t":"이것은 누가복음의 십자가 장면에서 이미 한 번 들은 말입니다(눅 23:34, 46).","s":3378.672,"e":3386.697,"p":false,"h":false},{"t":"스데반은 죽음 앞에서 자기 주님을 그대로 닮은 모습으로 죽었습니다.","s":3387.204,"e":3391.764,"p":true,"h":false},{"t":"한 사람의 죽음이 열어 놓은 길","s":3392.64,"e":3394.891,"p":true,"h":false},{"t":"본문은 스데반의 죽음에 관해 이런 말로 끝납니다.","s":3395.7,"e":3399.221,"p":false,"h":false},{"t":"사울은 그의 죽임 당함을 마땅히 여기니라(행 8:1).","s":3399.84,"e":3404.731,"p":false,"h":false},{"t":"증인들이 옷을 벗어 사울이라는 청년의 발 앞에 두었다는 말이 앞에 나옵니다(행 7:58).","s":3405.276,"e":3412.442,"p":false,"h":false},{"t":"이 청년이 훗날 사도 바울이 됩니다.","s":3412.944,"e":3415.41,"p":true,"h":false},{"t":"그리고 바로 그날 예루살렘 교회에 큰 박해가 일어나 사도들 외에는 모두 유대와 사마리아로 흩어졌습니다(행 8:1).","s":3416.292,"e":3425.307,"p":false,"h":false},{"t":"그러나 흩어진 사람들이 두루 다니며 복음의 말씀을 전했다고 합니다(행 8:4).","s":3425.616,"e":3432.069,"p":false,"h":false},{"t":"주님이 승천하시며 약속하신 유대와 사마리아로 가는 길이, 한 사람의 죽음과 큰 박해를 통해 열린 것입니다.","s":3432.672,"e":3440.265,"p":true,"h":false},{"t":"박해는 교회를 멈추게 하려고 일어났으나, 하나님은 그것을 흩으시는 데 쓰셨습니다.","s":3441.168,"e":3446.81,"p":false,"h":false},{"t":"인간의 악이 하나님의 계획 안으로 들어와 복음의 길이 되는 이 구조를 우리는 앞에서 보았습니다.","s":3447.432,"e":3453.711,"p":false,"h":false},{"t":"스데반은 자기가 죽는 것으로 이 구조를 몸으로 보여 주었습니다.","s":3454.344,"e":3458.686,"p":true,"h":false},{"t":"스데반이 우리에게 가르치는 것","s":3459.528,"e":3461.75,"p":true,"h":false},{"t":"이 본문은 신자에게 순교하라는 요구가 아닙니다.","s":3462.444,"e":3465.682,"p":false,"h":false},{"t":"본문은 하나님이 어떤 분이신지를 말하고 있습니다.","s":3466.296,"e":3469.652,"p":false,"h":false},{"t":"하나님은 성전과 땅과 제도에 갇히지 않으시는 분이고, 사람이 배척한 자를 도리어 높이시는 분이며, 자기 증인을 하늘에서 지켜보시는 분입니다.","s":3470.292,"e":3479.873,"p":true,"h":false},{"t":"우리는 스데반의 설교를 읽으면서 자기 안의 성전을 점검하게 됩니다.","s":3480.696,"e":3485.333,"p":false,"h":false},{"t":"내가 하나님이라고 믿으며 붙들고 있는 것이 사실은 하나님을 가리키는 표지일 뿐이 아닌지, 그 표지에 매여 하나님이 보내신 분을 알아보지 못하는 것은 아닌지를 묻게 됩니다.","s":3485.988,"e":3497.097,"p":false,"h":false},{"t":"이 물음 앞에서 스데반이 본 것을 우리도 믿음으로 봅니다.","s":3497.688,"e":3501.679,"p":false,"h":false},{"t":"하늘이 열려 있고, 인자가 하나님 우편에 계십니다.","s":3502.296,"e":3506.113,"p":true,"h":false}]},{"title":"7. 사울은 왜 택함받았는가: 다메섹 길에서 세 번 되풀이되는 회심 이야기","audio":"book_2610272355_1.mp3","start":3507.012,"end":4065.516,"dur":558.5,"segs":[{"t":"7.","s":3507.012,"e":3507.683,"p":false,"h":false},{"t":"사울은 왜 택함받았는가: 다메섹 길에서 세 번 되풀이되는 회심 이야기","s":3508.92,"e":3514.204,"p":true,"h":false},{"t":"본문: 사도행전 9장 1-31절 (함께 읽을 본문: 행 22:3-21, 행 26:9-23, 갈 1:11-24, 빌 3:4-9, 딤전 1:12-16, 고전 15:8-10, 행 16:14)","s":3515.076,"e":3540.279,"p":true,"h":false},{"t":"사도행전은 같은 이야기를 거의 되풀이하지 않는 책입니다.","s":3540.96,"e":3544.791,"p":false,"h":false},{"t":"사건 하나에 한 번만 지면을 쓰는 것이 이 책의 방식입니다.","s":3545.388,"e":3549.344,"p":false,"h":false},{"t":"그런데 다메섹 길의 사건만은 세 번 나옵니다.","s":3549.672,"e":3552.8,"p":false,"h":false},{"t":"9장에서 한 번, 22장에서 바울이 예루살렘 군중 앞에서 말하며 한 번, 26장에서 아그립바 왕 앞에서 말하며 한 번입니다.","s":3553.38,"e":3562.571,"p":true,"h":false},{"t":"이것은 누가가 이 사건을 얼마나 중요하게 여겼는지 보여 줍니다.","s":3563.496,"e":3567.801,"p":false,"h":false},{"t":"그리고 이 이야기가 던지는 물음은 간단하지 않습니다.","s":3568.428,"e":3572.248,"p":false,"h":false},{"t":"하나님은 왜 하필 사울을 택하셨습니까.","s":3572.892,"e":3575.641,"p":false,"h":false},{"t":"교회를 가장 맹렬하게 박해하던 사람을 왜 택하셨습니까.","s":3576.24,"e":3579.959,"p":true,"h":false},{"t":"교회를 멸하려던 사람","s":3580.812,"e":3582.5,"p":true,"h":false},{"t":"사울이 어떤 사람이었는지부터 보아야 합니다.","s":3583.368,"e":3586.396,"p":false,"h":false},{"t":"그는 스데반을 죽이는 일에 찬성했고(행 8:1), 교회를 잔멸하며 집마다 들어가 남녀를 끌어다가 옥에 넘겼습니다(행 8:3).","s":3587.04,"e":3598.043,"p":false,"h":false},{"t":"9장은 그가 여전히 주의 제자들에 대하여 위협과 살기가 등등하여 다메섹의 회당들에게 가는 길이었다고 시작합니다(행 9:1-2).","s":3598.524,"e":3608.543,"p":true,"h":false},{"t":"바울 자신이 훗날 이 시절을 어떻게 말했는지도 중요합니다.","s":3609.288,"e":3613.273,"p":false,"h":false},{"t":"디모데에게 쓴 편지에서 그는 전에는 비방자요 박해자요 폭행자였다고 말합니다(딤전 1:13).","s":3613.896,"e":3621.711,"p":false,"h":false},{"t":"그리고 죄인 중에 내가 괴수라고 합니다(딤전 1:15).","s":3622.176,"e":3627.196,"p":false,"h":false},{"t":"겸손한 말투로 한 과장이 아니라 그의 진심이었습니다.","s":3627.792,"e":3631.836,"p":false,"h":false},{"t":"그는 교회의 박해자였음을 평생 잊지 못했습니다(고전 15:9).","s":3632.472,"e":3638.226,"p":true,"h":false},{"t":"이런 사람이 어떻게 택함받는 자가 되었는가.","s":3639.096,"e":3642.196,"p":false,"h":false},{"t":"이 물음이 이 본문의 핵심입니다.","s":3642.732,"e":3645.132,"p":true,"h":false},{"t":"길에서 붙드신 분","s":3645.972,"e":3647.528,"p":true,"h":false},{"t":"다메섹 가까이 이르렀을 때 하늘에서 빛이 둘러 비추고, 사울이 땅에 엎드러집니다.","s":3648.312,"e":3654.23,"p":false,"h":false},{"t":"그리고 음성이 들립니다.","s":3654.864,"e":3656.694,"p":false,"h":false},{"t":"사울아 사울아 네가 어찌하여 나를 박해하느냐(행 9:3-4).","s":3656.988,"e":3662.668,"p":true,"h":false},{"t":"사울은 묻습니다.","s":3663.504,"e":3664.911,"p":false,"h":false},{"t":"주여 누구십니까.","s":3665.556,"e":3666.97,"p":false,"h":false},{"t":"대답은 이렇습니다.","s":3667.572,"e":3669.139,"p":false,"h":false},{"t":"나는 네가 박해하는 예수라(행 9:5).","s":3669.768,"e":3673.763,"p":false,"h":false},{"t":"이 대답에 주목해야 합니다.","s":3674.34,"e":3676.257,"p":false,"h":false},{"t":"사울은 교회를 박해하고 있었는데 주님은 나를 박해한다고 하십니다.","s":3676.896,"e":3681.775,"p":false,"h":false},{"t":"교회를 건드리는 일이 곧 그리스도를 건드리는 일이라는 것입니다.","s":3682.368,"e":3686.749,"p":false,"h":false},{"t":"그리스도와 교회는 그만큼 하나입니다.","s":3687.372,"e":3690.175,"p":true,"h":false},{"t":"여기서 사울의 상태를 다시 보십시오.","s":3690.684,"e":3693.334,"p":false,"h":false},{"t":"사울은 회개하고 있지 않았고, 하나님을 찾고 있지도 않았고, 예수를 알고 싶어 하지도 않았습니다.","s":3693.888,"e":3700.489,"p":false,"h":false},{"t":"그는 박해 여행길 한가운데에 있었습니다.","s":3701.124,"e":3704.218,"p":false,"h":false},{"t":"주도권은 처음부터 끝까지 주님에게 있었습니다.","s":3704.832,"e":3708.226,"p":false,"h":false},{"t":"세 번째 기록인 26장에서는 주님이 이렇게 덧붙이십니다.","s":3708.828,"e":3713.159,"p":false,"h":false},{"t":"가시채를 뒤로 차는 것이 네게 어려우니라(행 26:14).","s":3713.724,"e":3719.002,"p":false,"h":false},{"t":"날카로운 막대기를 걷어차는 소에게 하는 말입니다.","s":3719.556,"e":3722.85,"p":false,"h":false},{"t":"사울은 주님을 거스르고 있었지만, 그것은 자기 힘으로 하는 일이 아니라 주님이 이미 그를 붙들고 계셨다는 뜻으로 읽을 수 있습니다.","s":3723.156,"e":3731.641,"p":true,"h":false},{"t":"바울의 증언이 보여 주는 것","s":3732.48,"e":3734.361,"p":true,"h":false},{"t":"바울은 나중에 갈라디아 교회에 보낸 편지에서 이 사건을 이렇게 풀어 줍니다.","s":3735.072,"e":3740.102,"p":false,"h":false},{"t":"모태로부터 나를 택정하시고 은혜로 나를 부르신 이가 그의 아들을 내 안에 나타내시기를 기뻐하셨을 때(갈 1:15-16).","s":3740.76,"e":3750.491,"p":false,"h":false},{"t":"바울이 말하는 순서를 보십시오.","s":3751.056,"e":3753.203,"p":false,"h":false},{"t":"하나님이 택하셨고, 은혜로 부르셨고, 아들을 나타내시기를 기뻐하셨습니다.","s":3753.792,"e":3759.459,"p":false,"h":false},{"t":"이 모든 문장의 주어는 하나님입니다.","s":3760.092,"e":3762.739,"p":false,"h":false},{"t":"바울은 자기 결단이나 깨달음을 한 번도 앞세우지 않습니다.","s":3763.26,"e":3767.213,"p":true,"h":false},{"t":"디모데전서에서는 더 나아가 하나님이 왜 그렇게 하셨는지 이유를 말합니다.","s":3768.048,"e":3773.189,"p":false,"h":false},{"t":"내가 긍휼을 입은 까닭은 예수 그리스도께서 먼저 내게 일체 오래 참으심을 보이사 장차 주를 믿어 영생 얻는 자들에게 본을 삼으려 하심이라(딤전 1:16).","s":3773.844,"e":3785.186,"p":false,"h":false},{"t":"하나님은 가장 큰 박해자를 구원하심으로써 어떤 죄인도 구원받을 수 있음을 보이셨습니다.","s":3785.76,"e":3791.79,"p":true,"h":false},{"t":"그러므로 사울이 택함받은 이유는 사울에게 있지 않고 하나님께 있습니다.","s":3792.6,"e":3797.605,"p":false,"h":false},{"t":"사울이 열심이 있어서도 아니고, 훗날 사도로서 큰 일을 할 것이어서도 아닙니다.","s":3798.252,"e":3803.905,"p":false,"h":false},{"t":"하나님은 그의 열심이 잘못된 방향이었다는 것을 아시면서도 그를 택하셨고, 그 택함이 사울의 인생을 뒤집어 놓았습니다.","s":3804.588,"e":3812.73,"p":false,"h":false},{"t":"이것이 은혜입니다.","s":3813.408,"e":3814.915,"p":true,"h":false},{"t":"택하심은 사명이고 고난이다","s":3815.82,"e":3817.908,"p":true,"h":false},{"t":"주님은 다메섹의 제자 아나니아에게 나타나 사울에게 안수하라고 하십니다.","s":3818.772,"e":3823.44,"p":false,"h":false},{"t":"아나니아가 망설입니다.","s":3824.1,"e":3825.89,"p":false,"h":false},{"t":"그가 예루살렘에서 성도들에게 얼마나 많은 해를 끼쳤는지 들었다고 합니다(행 9:13).","s":3826.548,"e":3833.445,"p":false,"h":false},{"t":"주님은 이렇게 대답하십니다.","s":3833.928,"e":3836.118,"p":false,"h":false},{"t":"가라 이 사람은 내 이름을 이방인과 임금들과 이스라엘 자손 앞에서 전하기 위하여 택한 나의 그릇이라(행 9:15).","s":3836.736,"e":3845.857,"p":true,"h":false},{"t":"그 다음 말씀이 중요합니다.","s":3846.42,"e":3848.423,"p":false,"h":false},{"t":"그가 내 이름을 위하여 얼마나 많은 고난을 받아야 할 것을 내가 그에게 보이리라(행 9:16).","s":3849.012,"e":3856.266,"p":false,"h":false},{"t":"택하심은 영광의 자리로 부르는 것이기 전에 고난의 자리로 부르는 것이었습니다.","s":3856.896,"e":3862.038,"p":false,"h":false},{"t":"사도행전의 후반부는 이 약속이 어떻게 이루어졌는지를 보여 줍니다.","s":3862.692,"e":3867.371,"p":false,"h":false},{"t":"바울은 매를 맞고, 감옥에 갇히고, 난파하고, 끝내 로마의 쇠사슬에 매입니다.","s":3867.984,"e":3874.585,"p":false,"h":false},{"t":"그러나 그것은 주님이 미리 보여 주신 길이었습니다.","s":3875.148,"e":3878.717,"p":true,"h":false},{"t":"그리고 한 가지 놓칠 수 없는 장면이 있습니다.","s":3879.576,"e":3882.669,"p":false,"h":false},{"t":"아나니아가 사울에게 와서 형제 사울아 하고 부릅니다(행 9:17).","s":3882.96,"e":3888.482,"p":false,"h":false},{"t":"불과 며칠 전까지 교회를 짓밟던 사람을 교회가 형제라고 부릅니다.","s":3889.08,"e":3893.707,"p":false,"h":false},{"t":"하나님의 은혜는 교회에게도 가장 어려운 일을 요구했습니다.","s":3894.372,"e":3898.432,"p":false,"h":false},{"t":"박해자를 형제로 맞아들이는 일입니다.","s":3899.088,"e":3901.666,"p":true,"h":false},{"t":"세 번 되풀이되는 이유","s":3902.58,"e":3904.219,"p":true,"h":false},{"t":"그렇다면 누가는 왜 이 이야기를 세 번이나 기록했습니까.","s":3905.064,"e":3909.097,"p":false,"h":false},{"t":"세 기록을 비교하면 강조점이 조금씩 다른 것을 발견합니다.","s":3909.744,"e":3914.057,"p":true,"h":false},{"t":"9장은 이 사건이 어떻게 일어났는지를 사실대로 전합니다.","s":3914.856,"e":3919.038,"p":false,"h":false},{"t":"22장에서 바울은 예루살렘의 유대인 군중 앞에서 말합니다.","s":3919.68,"e":3923.986,"p":false,"h":false},{"t":"그래서 자신이 가말리엘의 문하에서 율법을 철저히 배운 사람이고 하나님께 열심이 있었다는 점을 강조하고, 아나니아를 율법에 따라 경건하고 모든 유대인에게 칭찬받는 사람으로 소개합니다(행 22:3, 12).","s":3924.612,"e":3940.446,"p":false,"h":false},{"t":"청중이 유대인이기 때문입니다.","s":3940.884,"e":3943.1,"p":false,"h":false},{"t":"26장에서는 아그립바 왕 앞에서 말하면서 아나니아를 생략하고, 주님이 직접 자신을 사명으로 부르셨다는 점을 앞에 놓습니다(행 26:16-18).","s":3943.728,"e":3955.434,"p":true,"h":false},{"t":"같은 사건을 청중에 따라 다른 면으로 비추어 말하는 것입니다.","s":3956.148,"e":3960.392,"p":false,"h":false},{"t":"사건의 사실은 하나도 바뀌지 않았습니다.","s":3960.9,"e":3963.757,"p":false,"h":false},{"t":"이것은 전도자가 복음의 핵심을 바꾸지 않으면서도 듣는 사람의 자리에 맞게 말할 수 있다는 것을 보여 주기도 합니다.","s":3964.356,"e":3971.26,"p":false,"h":false},{"t":"그러나 누가가 세 번 기록한 가장 큰 이유는 이 사건이 사도행전 전체의 방향을 바꾸는 전환점이었기 때문일 것입니다.","s":3971.916,"e":3979.706,"p":false,"h":false},{"t":"이방인에게 복음을 들고 갈 사람이 이 사건에서 시작됩니다.","s":3980.34,"e":3984.443,"p":true,"h":false},{"t":"오늘 신자가 이 본문에서 얻는 것","s":3985.308,"e":3987.754,"p":true,"h":false},{"t":"이 본문을 읽고 바울과 같은 극적인 회심 체험이 있어야 참된 신앙이라고 생각하면 곤란합니다.","s":3988.548,"e":3995.033,"p":false,"h":false},{"t":"사도행전 안에서도 회심의 모습은 서로 다릅니다.","s":3995.676,"e":3999.117,"p":false,"h":false},{"t":"빌립보의 루디아에 대해서는 주께서 그 마음을 열어 바울의 말을 따르게 하셨다고만 기록합니다(행 16:14).","s":3999.672,"e":4007.791,"p":false,"h":false},{"t":"빛도 음성도 땅에 엎드러짐도 없었습니다.","s":4008.312,"e":4011.453,"p":false,"h":false},{"t":"바울의 회심이 특별한 것은 그의 사명이 특별했기 때문이지, 모든 회심의 규격이기 때문이 아닙니다.","s":4011.768,"e":4018.709,"p":true,"h":false},{"t":"회심의 방식은 다양해도 회심의 주체는 같습니다.","s":4019.58,"e":4023.027,"p":false,"h":false},{"t":"사울을 붙드신 분이 루디아의 마음을 여신 분이고, 지금 우리의 마음을 여신 분입니다.","s":4023.648,"e":4029.401,"p":false,"h":false},{"t":"내가 어떻게 믿게 되었는지를 곰곰이 생각해 보면 그 근원에는 언제나 내가 하나님을 찾기 전에 하나님이 나를 찾으셨다는 사실이 있습니다.","s":4030.056,"e":4038.491,"p":true,"h":false},{"t":"바울은 자기를 사도 중에 가장 작은 자라고 하면서 이렇게 말합니다.","s":4039.308,"e":4043.565,"p":false,"h":false},{"t":"내가 사도 중에 가장 작은 자라 하나님의 교회를 박해하였으므로 사도라 칭함을 받기에 합당하지 못한 자로라.","s":4044.204,"e":4050.995,"p":false,"h":false},{"t":"그러나 내가 나 된 것은 하나님의 은혜로 된 것이니(고전 15:9-10).","s":4051.62,"e":4057.968,"p":false,"h":false},{"t":"교회를 박해한 자가 사도가 된 것이 은혜라면, 신자의 모든 자리는 같은 은혜 위에 서 있습니다.","s":4058.46,"e":4064.615,"p":true,"h":false}]},{"title":"8. 고넬료 사건에서 베드로에게는 왜 환상이 세 번이나 필요했는가: 이방인에게 열린 문","audio":"book_2610272355_1.mp3","start":4065.516,"end":4672.584,"dur":607.1,"segs":[{"t":"8.","s":4065.516,"e":4066.083,"p":false,"h":false},{"t":"고넬료 사건에서 베드로에게는 왜 환상이 세 번이나 필요했는가: 이방인에게 열린 문","s":4067.424,"e":4073.685,"p":true,"h":false},{"t":"본문: 사도행전 10장 1절-11장 18절 (함께 읽을 본문: 창 12:3, 레 11:1-8, 사 56:3-8, 행 15:7-11, 갈 2:11-14, 엡 2:11-22)","s":4074.156,"e":4095.959,"p":true,"h":false},{"t":"사도행전에서 이방인이 처음으로 복음을 듣고 성령을 받는 이야기는 놀랄 만큼 길게 기록되어 있습니다.","s":4096.764,"e":4103.631,"p":false,"h":false},{"t":"10장과 11장에 걸쳐 같은 사건이 거의 두 번 되풀이됩니다.","s":4104.216,"e":4108.306,"p":false,"h":false},{"t":"그만큼 이 사건이 교회 역사의 분수령이었다는 뜻입니다.","s":4108.932,"e":4112.866,"p":true,"h":false},{"t":"그런데 이야기를 읽다 보면 이상한 점이 하나 눈에 띕니다.","s":4113.756,"e":4117.754,"p":false,"h":false},{"t":"하나님이 베드로에게 같은 환상을 세 번이나 보이십니다.","s":4118.4,"e":4122.067,"p":false,"h":false},{"t":"하나님이 한 번 말씀하시면 충분할 것 같은데 왜 세 번이었을까요.","s":4122.612,"e":4127.324,"p":false,"h":false},{"t":"이 글에서는 이 반복이 말해 주는 것을 따라가면서, 이방인에게 문이 열리는 일이 얼마나 깊은 장벽을 넘는 일이었는지를 살펴봅니다.","s":4127.976,"e":4136.856,"p":true,"h":false},{"t":"두 사람을 동시에 준비하시는 하나님","s":4137.732,"e":4140.278,"p":true,"h":false},{"t":"이야기는 두 사람으로 시작합니다.","s":4141.116,"e":4143.61,"p":false,"h":false},{"t":"가이사랴의 고넬료는 이달리야 부대의 백부장입니다.","s":4144.248,"e":4147.836,"p":false,"h":false},{"t":"로마 군인이고 이방인입니다.","s":4148.496,"e":4150.603,"p":false,"h":false},{"t":"그런데 본문은 그가 경건하여 온 집안과 함께 하나님을 경외하고, 백성을 많이 구제하며 항상 하나님께 기도하는 사람이라고 소개합니다(행 10:2).","s":4151.232,"e":4162.339,"p":false,"h":false},{"t":"어느 날 오후 세 시쯤 그는 환상 중에 천사를 보고, 욥바에 있는 시몬 베드로를 청하라는 말을 듣습니다.","s":4162.932,"e":4169.831,"p":true,"h":false},{"t":"이어서 베드로의 이야기가 나옵니다.","s":4170.708,"e":4173.16,"p":false,"h":false},{"t":"욥바 피장 시몬의 집 지붕에서 기도하던 베드로는 배가 고팠고, 환상 중에 하늘이 열리며 큰 보자기 같은 그릇이 내려오는 것을 봅니다.","s":4173.84,"e":4183.007,"p":false,"h":false},{"t":"그 안에는 네 발 가진 짐승과 기는 것과 새가 가득합니다.","s":4183.308,"e":4187.575,"p":false,"h":false},{"t":"그리고 음성이 말합니다.","s":4188.168,"e":4189.984,"p":false,"h":false},{"t":"베드로야 일어나 잡아먹으라(행 10:13).","s":4190.58,"e":4194.8,"p":true,"h":false},{"t":"여기서 하나님이 한 사람이 아니라 두 사람을 동시에 움직이고 계신 것을 볼 수 있습니다.","s":4195.62,"e":4201.248,"p":false,"h":false},{"t":"고넬료는 사람을 보내고, 베드로는 그 사람들이 도착하기 직전에 환상을 받습니다.","s":4201.884,"e":4207.665,"p":false,"h":false},{"t":"두 사람이 서로를 알지 못하는 상태에서 하나님이 양쪽을 한꺼번에 준비하셨습니다.","s":4208.328,"e":4213.634,"p":false,"h":false},{"t":"이방인 선교는 베드로가 계획해서 시작한 일이 아니라, 하나님이 양쪽 문을 동시에 여신 일이었습니다.","s":4214.268,"e":4220.871,"p":true,"h":false},{"t":"베드로의 거부","s":4221.756,"e":4222.971,"p":true,"h":false},{"t":"베드로의 반응이 중요합니다.","s":4223.808,"e":4225.73,"p":false,"h":false},{"t":"주여 그럴 수 없나이다.","s":4226.328,"e":4228.088,"p":false,"h":false},{"t":"속되거나 깨끗하지 아니한 것을 내가 결코 먹지 아니하였나이다(행 10:14).","s":4228.668,"e":4235.075,"p":false,"h":false},{"t":"베드로는 평생 율법이 정한 대로 깨끗한 음식만 먹어 온 사람입니다.","s":4235.616,"e":4240.197,"p":false,"h":false},{"t":"레위기 11장이 정한 구분은 하나님이 주신 것이었습니다.","s":4240.728,"e":4244.649,"p":false,"h":false},{"t":"그는 이 구분을 지키는 것이 하나님께 충성하는 길이라고 믿었습니다.","s":4245.3,"e":4250.027,"p":true,"h":false},{"t":"그 거부는 단순한 식습관의 문제가 아니었습니다.","s":4250.88,"e":4254.349,"p":false,"h":false},{"t":"이방인과 함께 먹는 일은 유대인에게 부정해지는 일이었고, 이방인의 집에 들어가는 것조차 불법으로 여겨졌습니다(행 10:28).","s":4254.984,"e":4264.728,"p":false,"h":false},{"t":"음식의 구분은 사람의 구분과 맞닿아 있었습니다.","s":4265.244,"e":4268.764,"p":false,"h":false},{"t":"깨끗한 짐승과 부정한 짐승이 있듯이 선택된 백성과 이방인이 있다는 오래된 생각이 그 밑에 놓여 있었습니다.","s":4269.312,"e":4276.739,"p":true,"h":false},{"t":"주님이 이 환상에서 하려고 하신 일은 음식 규정을 바꾸는 것이 아니었습니다.","s":4277.268,"e":4282.322,"p":false,"h":false},{"t":"베드로가 나중에 이 환상을 해석한 말에서 그것이 드러납니다.","s":4282.956,"e":4286.966,"p":false,"h":false},{"t":"하나님이 내게 보이시기를 어떤 사람도 속되다 하거나 깨끗하지 않다 하지 말라 하셨으니(행 10:28).","s":4287.528,"e":4295.045,"p":false,"h":false},{"t":"환상의 목적은 사람에 대한 마음을 고치는 것이었습니다.","s":4295.556,"e":4299.312,"p":true,"h":false},{"t":"세 번이 필요했던 까닭","s":4299.912,"e":4301.685,"p":true,"h":false},{"t":"음성은 이렇게 말합니다.","s":4302.576,"e":4304.481,"p":false,"h":false},{"t":"하나님이 깨끗하게 하신 것을 네가 속되다 하지 말라.","s":4304.808,"e":4308.213,"p":false,"h":false},{"t":"그리고 이런 일이 세 번 있었다고 합니다(행 10:15-16).","s":4308.876,"e":4314.615,"p":false,"h":false},{"t":"왜 세 번이었는지 본문은 설명하지 않습니다.","s":4315.212,"e":4318.284,"p":false,"h":false},{"t":"몇 가지 가능성을 생각해 볼 수는 있습니다.","s":4318.92,"e":4321.86,"p":true,"h":false},{"t":"하나는 이 일이 확실한 사실임을 강조하는 방식이라는 해석입니다.","s":4322.7,"e":4326.872,"p":false,"h":false},{"t":"성경에서 같은 일이 세 번 일어나면 그 일이 확정되었다는 뜻으로 읽는 경우가 많습니다.","s":4327.524,"e":4333.271,"p":false,"h":false},{"t":"또 하나는 베드로의 완고함이 그만큼 깊었다는 해석입니다.","s":4333.896,"e":4338.032,"p":false,"h":false},{"t":"한 번 보았다고 풀릴 편견이 아니었습니다.","s":4338.648,"e":4341.604,"p":false,"h":false},{"t":"몇 해에 걸쳐 몸에 밴 믿음이 한순간에 뒤집히지는 않습니다.","s":4342.14,"e":4346.099,"p":true,"h":false},{"t":"주님의 세 번 물음에 세 번 부인했던 베드로와 연결해서 읽는 해석도 있지만, 본문이 이 연결을 직접 말하지 않으므로 단정하기는 어렵습니다.","s":4346.964,"e":4355.995,"p":false,"h":false},{"t":"다만 분명한 것은 하나님이 베드로가 이해할 때까지 기다려 주셨다는 점입니다.","s":4356.612,"e":4361.955,"p":false,"h":false},{"t":"하나님은 편견을 가진 사람을 윽박지르지 않고, 그가 깨달을 때까지 반복해서 가르치십니다.","s":4362.552,"e":4368.919,"p":true,"h":false},{"t":"경건한 사람이 구원받는가","s":4369.788,"e":4371.831,"p":true,"h":false},{"t":"이방인 고넬료는 본문에서 매우 좋은 모습으로 그려집니다.","s":4372.704,"e":4376.683,"p":false,"h":false},{"t":"그의 기도와 구제가 하나님 앞에 상달되어 기억하신 바가 되었다고 합니다(행 10:4).","s":4377.276,"e":4383.729,"p":false,"h":false},{"t":"그렇다면 고넬료는 복음 없이도 이미 구원받은 사람이었습니까.","s":4384.332,"e":4388.642,"p":true,"h":false},{"t":"본문은 그렇게 말하지 않습니다.","s":4389.48,"e":4391.783,"p":false,"h":false},{"t":"천사가 고넬료에게 베드로를 청하라고 한 이유를 베드로는 나중에 이렇게 전합니다.","s":4392.396,"e":4397.425,"p":false,"h":false},{"t":"그가 네게 구원받을 말씀을 이르리라(행 11:14).","s":4398.012,"e":4402.781,"p":false,"h":false},{"t":"경건하고 구제하는 사람이라도 구원받을 말씀을 들어야 했습니다.","s":4403.34,"e":4407.69,"p":false,"h":false},{"t":"로마서가 말하는 대로 믿음은 들음에서 나고 들음은 그리스도의 말씀으로 말미암는 것입니다(롬 10:17).","s":4408.308,"e":4416.35,"p":true,"h":false},{"t":"고넬료의 경건은 구원의 근거가 아니라, 하나님이 이미 그에게 일하고 계셨다는 흔적이었습니다.","s":4417.092,"e":4423.422,"p":false,"h":false},{"t":"하나님이 그를 복음에 이르게 하시려고 먼저 그의 마음을 준비하신 것입니다.","s":4424.076,"e":4428.869,"p":false,"h":false},{"t":"이것을 구원받으려면 경건하게 살아야 한다는 뜻으로 읽으면 본문을 뒤집는 것입니다.","s":4429.368,"e":4434.772,"p":true,"h":false},{"t":"베드로의 설교가 잘못 읽히는 대목","s":4435.632,"e":4438.126,"p":true,"h":false},{"t":"베드로는 고넬료의 집에서 설교를 시작하며 이렇게 말합니다.","s":4438.872,"e":4443.028,"p":false,"h":false},{"t":"하나님은 사람의 외모를 취하지 아니하시고 각 나라 중에서 그를 경외하며 의를 행하는 사람은 다 받으시는 줄 진실로 깨달았도다(행 10:34-35).","s":4443.66,"e":4455.97,"p":false,"h":false},{"t":"이 구절은 종종 어떤 종교를 믿든 진실하게 살면 하나님이 받으신다는 증거로 인용됩니다.","s":4456.548,"e":4462.715,"p":true,"h":false},{"t":"그러나 문맥이 그 해석을 막고 있습니다.","s":4463.64,"e":4466.359,"p":false,"h":false},{"t":"베드로가 깨달았다고 한 것은 하나님이 유대인이라는 신분을 이유로 사람을 편애하지 않으신다는 사실입니다.","s":4466.988,"e":4473.779,"p":false,"h":false},{"t":"이어지는 설교의 중심은 예수 그리스도이고, 결론은 이것입니다.","s":4474.332,"e":4479.248,"p":false,"h":false},{"t":"그를 믿는 사람마다 그의 이름을 힘입어 죄 사함을 받는다(행 10:43).","s":4479.912,"e":4486.089,"p":false,"h":false},{"t":"문은 모든 민족에게 열렸지만 그 문은 그리스도 한 분입니다.","s":4486.284,"e":4490.702,"p":false,"h":false},{"t":"외모를 취하지 않으신다는 말은 구원의 길이 여럿이라는 말이 아니라, 한 길이 모든 민족에게 열려 있다는 말입니다.","s":4491.36,"e":4498.778,"p":true,"h":false},{"t":"말씀이 끝나기도 전에","s":4499.604,"e":4501.222,"p":true,"h":false},{"t":"베드로가 이 말을 하고 있을 때 성령이 말씀 듣는 모든 사람에게 내려오십니다(행 10:44).","s":4502.052,"e":4509.333,"p":false,"h":false},{"t":"베드로가 초청의 말을 하려고 준비하고 있었는지 알 수 없지만, 본문은 설교가 끝나기도 전이었다고 기록합니다.","s":4509.9,"e":4517.16,"p":false,"h":false},{"t":"하나님이 사람이 마무리하기를 기다리지 않으신 것입니다.","s":4517.784,"e":4521.251,"p":true,"h":false},{"t":"함께 간 할례받은 신자들이 놀랍니다(행 10:45).","s":4522.104,"e":4526.887,"p":false,"h":false},{"t":"그들은 이방인이 은혜를 받는 것을 상상하지 못했습니다.","s":4527.432,"e":4531.129,"p":false,"h":false},{"t":"베드로는 곧 결론을 내립니다.","s":4531.752,"e":4533.96,"p":false,"h":false},{"t":"이 사람들이 우리와 같이 성령을 받았으니 누가 물로 세례 받음을 금하겠느냐(행 10:47).","s":4534.596,"e":4542.099,"p":false,"h":false},{"t":"하나님이 먼저 결정을 내리셨고 교회는 그것을 따랐습니다.","s":4542.552,"e":4546.68,"p":true,"h":false},{"t":"예루살렘 교회의 반응","s":4547.556,"e":4549.31,"p":true,"h":false},{"t":"그러나 이 일이 곧바로 모든 사람의 동의를 얻은 것은 아닙니다.","s":4550.148,"e":4554.538,"p":false,"h":false},{"t":"베드로가 예루살렘에 올라오자 할례자들이 비난합니다.","s":4555.116,"e":4558.474,"p":false,"h":false},{"t":"당신이 무할례자의 집에 들어가 함께 먹었다고 합니다(행 11:3).","s":4559.112,"e":4564.725,"p":false,"h":false},{"t":"문제는 이방인이 구원받은 것보다 베드로가 그들과 함께 식사한 것이었습니다.","s":4565.232,"e":4570.324,"p":true,"h":false},{"t":"베드로는 처음부터 차례로 설명합니다.","s":4571.208,"e":4573.932,"p":false,"h":false},{"t":"환상을 말하고, 성령이 내리신 것을 말합니다.","s":4574.52,"e":4577.973,"p":false,"h":false},{"t":"그리고 말합니다.","s":4578.588,"e":4579.925,"p":false,"h":false},{"t":"내가 누구관대 하나님을 능히 막겠느냐(행 11:17).","s":4580.532,"e":4585.417,"p":false,"h":false},{"t":"그러자 사람들이 잠잠하고 하나님께 영광을 돌리며 이르되 그러면 하나님이 이방인에게도 생명 얻는 회개를 주셨도다 합니다(행 11:18).","s":4585.896,"e":4595.897,"p":true,"h":false},{"t":"하나님의 일이 분명히 드러났을 때 교회가 승복했다는 점이 소중합니다.","s":4596.408,"e":4600.988,"p":false,"h":false},{"t":"그러나 이 일로 모든 문제가 끝난 것은 아닙니다.","s":4601.592,"e":4605.145,"p":false,"h":false},{"t":"바울은 훗날 안디옥에서 베드로가 이방인과 식사를 하다가 유대에서 온 사람들이 오자 물러섰다고 증언합니다(갈 2:11-14).","s":4605.696,"e":4615.701,"p":false,"h":false},{"t":"환상을 보고 설교하고 성령이 내리는 것을 직접 본 베드로도 다시 흔들렸습니다.","s":4616.28,"e":4621.622,"p":false,"h":false},{"t":"이것이 사람입니다.","s":4622.22,"e":4623.752,"p":false,"h":false},{"t":"은혜는 한 번 깨달은 사람을 영원히 완성된 사람으로 만들지 않고, 그 사람을 끝까지 붙드시는 주님께 의지하게 합니다.","s":4624.38,"e":4632.798,"p":true,"h":false},{"t":"우리 안의 정
