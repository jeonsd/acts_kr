<head>

<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:120px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }
  header h1 { font-size:30px; font-weight:900; line-height:1.4; letter-spacing:-0.01em; }
  header .meta { color:var(--mute); font-size:16px; margin:6px 0 4px; }
  header .rule { height:4px; width:64px; background:var(--acc); border-radius:4px; margin:14px 0 22px; }
  #resume { display:none; background:#EAF3EC; border:2px solid #BFD9C7; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #resume button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  .top { margin:0 0 8px; }
  button.auto { font:inherit; font-weight:900; font-size:19px; height:52px; padding:0 20px; border-radius:14px; cursor:pointer; background:#EEE; color:#555; border:2px solid #CCC; }
  button.auto.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .autohint { font-size:17px; line-height:1.6; margin:6px 0 16px; color:var(--mute); }
  .autohint.off { color:#9a4a00; font-weight:700; }
  #note { display:none; background:#FFF3DC; border:2px solid #F0D49A; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #note button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  details#lst { background:#fff; border:2px solid #DCE6DF; border-radius:14px; padding:10px 16px; margin-bottom:20px; }
  details#lst summary { cursor:pointer; font-weight:900; font-size:18px; color:var(--acc); }
  #toc { margin:10px 0 4px 22px; font-size:19px; }
  #toc li { margin:6px 0; }
  #toc a { color:var(--ink); text-decoration:none; }
  #toc .d { color:var(--mute); font-size:15px; margin-left:6px; }
  section.trk { margin-top:34px; padding-top:6px; border-top:3px solid #DCE6DF; scroll-margin-top:12px; }
  section.trk:first-child { margin-top:0; border-top:0; }
  h2.tt { font-size:calc(var(--fs) + 8px); font-weight:900; margin:.6em 0 .6em; line-height:1.45; }
  #text p { font-size:var(--fs); margin-bottom:1.1em; }
  #text h3.hd { font-size:calc(var(--fs) + 4px); font-weight:900; margin:1.6em 0 .6em; color:var(--acc); line-height:1.5; }
  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .now { text-align:center; font-size:14px; opacity:.9; padding:6px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  .bar button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  .bar button:active { transform:scale(.96); }
  .bar button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  .bar button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  @media (max-width:640px) { header h1 { font-size:25px; } .bar button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>

<script>
(function () {
  const TITLE = "낭독 목록", TRACKS = [{"title":"사도행전_01장","audio":"doc01_2610231348.mp3","dur":209.1,"segs":[{"t":"사도행전 1장","s":0,"e":1.598,"p":true,"h":false},{"t":"전체 흐름","s":2.268,"e":3.3,"p":true,"h":false},{"t":"누가는 사도행전을 시작하면서 앞서 쓴 복음서를 \"예수께서 행하시고 가르치시기를 시작하신 모든 것\"이라고 부릅니다(1:1).","s":4.176,"e":13.696,"p":false,"h":false},{"t":"그렇다면 이 책은 그 \"계속\"입니다.","s":13.932,"e":17.151,"p":false,"h":false},{"t":"예수님이 하늘로 올라가신 뒤에도 일을 멈추지 않으신다는 뜻이고, 이 한마디가 사도행전을 읽는 열쇠입니다.","s":17.352,"e":24.948,"p":true,"h":false},{"t":"부활하신 예수님은 사십 일 동안 제자들에게 나타나 하나님 나라를 말씀하시고, 예루살렘을 떠나지 말고 아버지의 약속을 기다리라고 하십니다.","s":25.74,"e":35.201,"p":false,"h":false},{"t":"\"너희는 몇 날 안에 성령으로 세례를 받을 것이다\"(1:3-5).","s":35.532,"e":40.704,"p":false,"h":false},{"t":"그런데 제자들의 질문은 여전히 \"주님, 이때에 이스라엘 나라를 회복하시겠습니까\"였습니다(1:6).","s":40.896,"e":48.778,"p":false,"h":false},{"t":"아직도 정치적인 나라를 생각하고 있었습니다.","s":48.996,"e":52.042,"p":false,"h":false},{"t":"예수님은 그 질문에 직접 답하지 않으시고, 때는 아버지께서 정하신다고만 하십니다.","s":52.236,"e":58.166,"p":false,"h":false},{"t":"그러고는 약속을 주십니다.","s":58.356,"e":60.39,"p":false,"h":false},{"t":"\"성령이 너희에게 임하시면 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 내 증인이 될 것이다\"(1:7-8).","s":60.624,"e":69.772,"p":false,"h":false},{"t":"사도행전 전체의 지도가 이 한 절에 들어 있습니다.","s":69.984,"e":73.468,"p":true,"h":false},{"t":"말씀을 마치신 예수님은 제자들이 보는 앞에서 올려지시고 구름에 가려 보이지 않게 됩니다.","s":74.124,"e":80.16,"p":false,"h":false},{"t":"흰옷 입은 두 사람이 \"하늘로 올라가신 이 예수는 가신 그대로 다시 오실 것이다\"라고 알려 줍니다(1:9-11).","s":80.496,"e":89.701,"p":false,"h":false},{"t":"제자들은 예루살렘으로 돌아와 다락방에서 여인들과 예수님의 형제들과 함께 마음을 같이하여 기도에 힘썼습니다(1:12-14).","s":89.928,"e":99.626,"p":true,"h":false},{"t":"그 무렵 백이십 명쯤 모인 자리에서 베드로가 일어나, 예수님을 배반하고 죽은 유다의 빈자리를 채워야 한다고 말합니다.","s":100.296,"e":108.293,"p":false,"h":false},{"t":"조건은 예수님의 처음부터 끝까지 함께하며 부활을 증언할 수 있는 사람입니다(1:15-22).","s":108.648,"e":116.095,"p":false,"h":false},{"t":"사람들은 \"모든 사람의 마음을 아시는 주님, 택하신 사람을 보여 주십시오\" 하고 기도한 뒤 제비를 뽑았고, 맛디아가 열한 사도에 더해집니다(1:23-26).","s":116.316,"e":128.976,"p":true,"h":false},{"t":"이 장에서 제자들이 하는 일은 기다리고 기도하는 것이 전부입니다.","s":129.636,"e":133.984,"p":false,"h":false},{"t":"교회는 아직 시작되지 않았습니다.","s":134.208,"e":136.581,"p":false,"h":false},{"t":"시작하실 분은 사람이 아니라 성령이십니다.","s":136.8,"e":139.934,"p":true,"h":false},{"t":"구절 풀이","s":140.58,"e":141.627,"p":true,"h":false},{"t":"1절의 \"예수께서 시작하신 모든 것\"이라는 표현은, 사도행전이 사도들의 이야기이기 전에 올라가신 그리스도의 이야기라는 뜻입니다.","s":142.488,"e":151.776,"p":false,"h":false},{"t":"사도들의 이름이 나와도, 일을 주도하시는 분은 늘 주님이십니다.","s":152.136,"e":156.76,"p":true,"h":false},{"t":"6절에서 8절은 제자들의 질문과 예수님의 대답이 어긋나 있습니다.","s":157.428,"e":162.214,"p":false,"h":false},{"t":"제자들은 \"나라가 언제 회복됩니까\"를 물었고, 예수님은 \"너희가 증인이 될 것이다\"라고 답하십니다.","s":162.432,"e":170.155,"p":false,"h":false},{"t":"우리가 궁금한 것과 주님이 맡기시는 일이 다를 때가 많다는 것을, 제자들의 모습에서도 볼 수 있습니다.","s":170.352,"e":177.178,"p":false,"h":false},{"t":"그리고 그 일은 제자들의 힘이 아니라 성령이 임하실 때 가능해집니다.","s":177.516,"e":182.175,"p":true,"h":false},{"t":"21절에서 26절의 맛디아 선출은, 제자들이 자기 판단으로 끝내지 않고 주님께 맡기며 기도했다는 점이 중요합니다.","s":182.844,"e":191.073,"p":false,"h":false},{"t":"제비뽑기가 교회가 따라야 할 방법이라는 말은 아닙니다.","s":191.412,"e":195.241,"p":false,"h":false},{"t":"성령이 임하신 뒤의 교회는 제비가 아니라 성령의 인도 아래 일꾼을 세워 갑니다.","s":195.444,"e":200.819,"p":false,"h":false},{"t":"열두 번째 사도가 맛디아인지 훗날의 바울인지는 견해가 갈리지만, 본문은 그 문제를 따지지 않습니다.","s":201.024,"e":208.28,"p":true,"h":false}]},{"title":"사도행전_02장","audio":"doc02_2610231348.mp3","dur":185.8,"segs":[{"t":"사도행전 2장","s":0,"e":1.498,"p":true,"h":false},{"t":"전체 흐름","s":2.16,"e":3.192,"p":true,"h":false},{"t":"오순절 날, 제자들이 한곳에 모여 있을 때 갑자기 하늘에서 세찬 바람 같은 소리가 나더니 불꽃 같은 혀들이 갈라져 각 사람 위에 내려앉았습니다.","s":4.068,"e":13.852,"p":false,"h":false},{"t":"그들은 성령으로 충만하여 다른 나라 말들로 말하기 시작합니다(2:1-4).","s":14.184,"e":20.533,"p":false,"h":false},{"t":"마침 명절을 지키러 세계 곳곳에서 온 유대인들이 이 소리를 듣고 모여들었는데, 자기 고향 말로 하나님의 큰일을 말하는 것을 듣고 놀랍니다.","s":20.772,"e":30.263,"p":false,"h":false},{"t":"어떤 사람들은 \"새 술에 취했다\"고 비웃습니다(2:5-13).","s":30.6,"e":36.646,"p":true,"h":false},{"t":"이때 베드로가 열한 사도와 함께 일어섭니다.","s":37.332,"e":40.466,"p":false,"h":false},{"t":"석 달 전만 해도 예수님을 모른다고 했던 그 베드로입니다.","s":40.68,"e":44.697,"p":false,"h":false},{"t":"그는 \"아침 아홉 시에 술 취할 사람이 어디 있습니까\" 하고 웃음을 막고, 이것은 요엘 선지자가 말한 일이라고 설명합니다(2:14-21).","s":44.892,"e":55.902,"p":false,"h":false},{"t":"그리고 핵심을 말합니다.","s":56.124,"e":57.971,"p":false,"h":false},{"t":"여러분이 십자가에 못 박은 나사렛 예수를 하나님이 살리셨고, 그분이 하나님 오른편에 높이 올려져서 약속하신 성령을 부어 주셨습니다.","s":58.176,"e":67.2,"p":false,"h":false},{"t":"여러분이 지금 보고 듣는 것이 바로 그것입니다(2:22-33).","s":67.536,"e":73.27,"p":false,"h":false},{"t":"하나님이 이 예수를 주와 그리스도로 삼으셨다는 것이 결론입니다(2:36).","s":73.476,"e":79.561,"p":true,"h":false},{"t":"사람들은 마음이 찔려 \"우리가 어찌할까요\" 하고 묻습니다.","s":80.244,"e":84.625,"p":false,"h":false},{"t":"베드로는 회개하고 예수 그리스도의 이름으로 세례를 받으라고 답하며, 이 약속이 여러분과 자녀와 먼 데 있는 모든 사람에게 주어진다고 말합니다(2:37-39).","s":84.816,"e":96.848,"p":false,"h":false},{"t":"그날 삼천 명쯤이 더해졌습니다(2:41).","s":97.056,"e":101.125,"p":true,"h":false},{"t":"교회의 모습이 이어서 그려집니다.","s":101.808,"e":104.275,"p":false,"h":false},{"t":"그들은 사도의 가르침을 받고, 서로 교제하고, 빵을 떼고, 기도에 힘썼습니다.","s":104.508,"e":110.879,"p":false,"h":false},{"t":"가진 것을 서로 나누었고, 날마다 성전에서 모이고 집에서 음식을 나누며 하나님을 찬양했습니다(2:42-47).","s":111.096,"e":120.409,"p":false,"h":false},{"t":"이 장의 마지막 문장이 제일 중요합니다.","s":120.636,"e":123.583,"p":false,"h":false},{"t":"\"주께서 구원받는 사람을 날마다 더하게 하셨다\"(2:47).","s":123.804,"e":129.048,"p":false,"h":false},{"t":"더하신 분은 사도들이 아니라 주님입니다.","s":129.24,"e":132.138,"p":true,"h":false},{"t":"구절 풀이","s":132.804,"e":133.851,"p":true,"h":false},{"t":"2장 4절에서 11절의 \"다른 말\"은 알아들을 수 있는 실제 외국어였다고 읽는 것이 일반적입니다.","s":134.712,"e":141.473,"p":false,"h":false},{"t":"바벨탑에서 흩어졌던 말들이 이제 하나님의 큰일을 알리는 데 쓰인다고 보는 사람이 많습니다.","s":141.84,"e":147.857,"p":false,"h":false},{"t":"방언이 오늘 교회의 표준이냐는 문제는 갈리는 주제이고, 이 본문은 그 논쟁보다 복음이 모든 나라 말로 퍼지기 시작했다는 데 초점이 있습니다.","s":148.212,"e":157.934,"p":true,"h":false},{"t":"2장 33절은 이 장의 열쇠입니다.","s":158.724,"e":161.638,"p":false,"h":false},{"t":"성령을 부으신 분이 승천하신 예수님이라는 말입니다.","s":161.856,"e":165.503,"p":false,"h":false},{"t":"오순절은 하늘로 올라가신 그리스도가 교회에 보내신 첫 선물입니다.","s":165.708,"e":170.5,"p":true,"h":false},{"t":"2장 44절과 45절의 재산 나눔은 누 ":"하나님이 자기 종을 먼저 여러분에게 보내 악에서 돌아서게 하여 복 주신다는 것입니다(3:24-26).","s":104.976,"e":112.828,"p":true,"h":false},{"t":"구절 풀이","s":113.508,"e":114.555,"p":true,"h":false},{"t":"3장 12절에서 16절은 이 장의 중심입니다.","s":115.416,"e":118.939,"p":false,"h":false},{"t":"걷게 하신 분이 예수님이고, 사도들은 그 이름을 전하는 사람일 뿐이라고 베드로가 분명히 말합니다.","s":119.16,"e":126.007,"p":false,"h":false},{"t":"사도의 능력을 높이는 본문이 아니라 사도가 자기를 낮추는 본문입니다.","s":126.36,"e":131.241,"p":true,"h":false},{"t":"3장 19절에서 21절의 \"새롭게 되는 날\"과 \"만물이 회복될 때\"는 마지막 날의 완성을 가리킵니다.","s":131.904,"e":139.565,"p":false,"h":false},{"t":"그 시기를 두고 의견이 다양하지만, 본문의 초점은 지금 회개하고 돌이키라는 초대에 있습니다.","s":139.932,"e":146.316,"p":true,"h":false}]},{"title":"사도행전_04장","audio":"doc04_2610231348.mp3","dur":205.8,"segs":[{"t":"사도행전 4장","s":0,"e":1.536,"p":true,"h":false},{"t":"전체 흐름","s":2.16,"e":3.192,"p":true,"h":false},{"t":"베드로와 요한이 사람들에게 말하고 있을 때 제사장들과 성전 경비대장과 사두개인들이 찾아와 붙잡아 갑니다.","s":4.068,"e":11.527,"p":false,"h":false},{"t":"예수의 이름으로 죽은 자가 부활한다고 전하는 것이 못마땅했기 때문입니다.","s":11.844,"e":16.903,"p":false,"h":false},{"t":"그런데 이미 그 말씀을 들은 사람들 가운데 믿는 사람이 늘어 남자만 오천 명쯤 되었습니다(4:1-4).","s":17.1,"e":25.245,"p":true,"h":false},{"t":"다음 날 의회에서 \"무슨 힘으로, 누구의 이름으로 이런 일을 했느냐\"고 묻자, 베드로가 성령으로 충만하여 대답합니다.","s":25.92,"e":34.726,"p":false,"h":false},{"t":"당신들이 십자가에 못 박았고 하나님이 살리신 나사렛 예수의 이름으로 이 사람이 건강하게 섰다고 합니다.","s":34.92,"e":41.892,"p":false,"h":false},{"t":"이분이 \"건축자들이 버린 돌이 모퉁이의 머릿돌이 되었다\"는 그 돌이고, 하늘 아래 우리가 구원받을 다른 이름은 없다고 말합니다(4:8-12).","s":42.264,"e":53.333,"p":false,"h":false},{"t":"의회 사람들은 배우지 못한 평범한 사람들이 담대하게 말하는 것을 보고 놀라, 이 사람들이 예수와 함께 있던 사람임을 알아봅니다.","s":53.568,"e":62.404,"p":false,"h":false},{"t":"게다가 고침받은 사람이 옆에 서 있으니 반박할 말도 없었습니다(4:13-14).","s":62.784,"e":69.354,"p":true,"h":false},{"t":"그들은 앞으로 그 이름으로 말하지 말라고 위협하고 풀어 줍니다.","s":70.02,"e":74.432,"p":false,"h":false},{"t":"베드로와 요한은 \"하나님 앞에서 여러분의 말을 듣는 것과 하나님의 말씀을 듣는 것 중에 어느 쪽이 옳은지 판단해 보십시오.","s":74.664,"e":82.574,"p":false,"h":false},{"t":"우리는 보고 들은 것을 말하지 않을 수 없습니다\" 하고 답합니다(4:19-20).","s":82.764,"e":89.162,"p":true,"h":false},{"t":"풀려난 두 사람이 동료들에게 가서 이야기를 전하자 교회는 한마음으로 하나님께 기도합니다.","s":89.82,"e":95.743,"p":false,"h":false},{"t":"그 기도가 인상적입니다.","s":96.084,"e":98.213,"p":false,"h":false},{"t":"헤롯과 빌라도와 사람들이 예수를 죽인 것조차 \"하나님의 손과 뜻이 미리 정하신 일을 행한 것\"이라고 하고(4:27-28), 위협을 거두어 달라고 구하지 않고 말씀을 담대히 전하게 해 달라고 구합니다(4:29).","s":98.424,"e":114.818,"p":false,"h":false},{"t":"기도를 마치자 모인 곳이 흔들리고 모두 성령으로 충만하여 하나님의 말씀을 담대히 전합니다(4:31).","s":115.056,"e":122.892,"p":true,"h":false},{"t":"장 끝에는 믿는 무리가 마음과 뜻이 하나가 되어 가난한 사람이 없도록 서로 나누었다는 이야기, 그리고 구브로 사람 요셉, 곧 \"위로의 아들\"이라 불리는 바나바가 밭을 팔아 사도들 발 앞에 놓았다는 이야기가 이어집니다(4:32-37).","s":123.588,"e":141.05,"p":false,"h":false},{"t":"이 이야기는 곧 이어질 5장과 짝을 이룹니다.","s":141.264,"e":144.848,"p":true,"h":false},{"t":"구절 풀이","s":145.512,"e":146.559,"p":true,"h":false},{"t":"4장 12절은 \"다른 이름이 없다\"는 말씀입니다.","s":147.42,"e":151.501,"p":false,"h":false},{"t":"설교자가 지나치게 강하게 말하는 것이 아니라, 고침받은 사람이 서 있는 자리에서 사도들이 구원의 근거가 누구에게 있는지를 분명히 밝힌 것입니다.","s":151.704,"e":161.526,"p":true,"h":false},{"t":"4장 13절의 \"예수와 함께 있던 사람\"은 사도들의 학력이나 재능이 아니라 예수님과 함께한 삶이 그들을 담대하게 만들었다는 뜻입니다.","s":162.324,"e":171.785,"p":false,"h":false},{"t":"용기는 타고난 것이 아니라 성령이 주시는 것이라는 흐름과 맞닿아 있습니다.","s":172.116,"e":176.963,"p":true,"h":false},{"t":"4장 24절에서 30절의 기도는 이 장의 마음입니다.","s":177.588,"e":181.635,"p":false,"h":false},{"t":"박해를 하나님의 계획 밖의 사고로 보지 않고, 주권자이신 분의 손 안에 있는 일로 받아들입니다.","s":181.836,"e":188.22,"p":false,"h":false},{"t":"그래서 위협 앞에서 안전이 아니라 담대함을 구합니다.","s":188.568,"e":192.343,"p":true,"h":false},{"t":"4장 36절과 37절의 바나바는 5장에서 아나니아와 마주 서는 사람입니다.","s":192.996,"e":198.669,"p":false,"h":false},{"t":"바나바는 아낌없이 드렸습니다.","s":199.044,"e":201.442,"p":false,"h":false},{"t":"이 대조를 기억하고 5장을 읽으시면 좋습니다.","s":201.672,"e":205.096,"p":true,"h":false}]},{"title":"사도행전_05장","audio":"doc05_2610231348.mp3","dur":360.8,"segs":[{"t":"사도행전 5장","s":0,"e":1.561,"p":true,"h":false},{"t":"전체 흐름","s":2.232,"e":3.264,"p":true,"h":false},{"t":"4장 끝에서 바나바가 밭을 팔아 값을 사도들 발 앞에 놓았습니다.","s":4.14,"e":8.888,"p":false,"h":false},{"t":"아낌없이 드린 사람입니다.","s":9.108,"e":11.218,"p":false,"h":false},{"t":"5장은 곧바로 \"그런데\"로 시작합니다.","s":11.448,"e":14.732,"p":false,"h":false},{"t":"아나니아와 그의 아내 삽비라도 재산을 팔았습니다.","s":14.94,"e":18.626,"p":false,"h":false},{"t":"그러나 값의 일부를 따로 빼돌리고, 나머지를 마치 전부인 것처럼 사도들 발 앞에 놓았습니다(5:1-2).","s":18.828,"e":27.188,"p":true,"h":false},{"t":"베드로가 말합니다.","s":27.864,"e":29.425,"p":false,"h":false},{"t":"\"어찌하여 사탄이 네 마음에 가득하여 성령을 속이고 땅값 얼마를 감추었느냐.","s":29.772,"e":35.319,"p":false,"h":false},{"t":"그 땅은 팔기 전에도 네 것이었고, 판 뒤에도 네 마음대로 할 수 있지 않았느냐.","s":35.532,"e":41.416,"p":false,"h":false},{"t":"네가 속인 것은 사람이 아니라 하나님이다\"(5:3-4).","s":41.616,"e":46.45,"p":false,"h":false},{"t":"아나니아는 그 자리에서 쓰러져 숨졌고, 몇 시간 뒤 삽비라도 같은 일을 당합니다.","s":46.656,"e":52.53,"p":false,"h":false},{"t":"교회와 이 일을 듣는 모든 사람이 크게 두려워했습니다(5:5-11).","s":52.704,"e":58.324,"p":true,"h":false},{"t":"이 사건을 읽을 때 아나니아 한 사람의 이야기로만 읽으면 안 됩니다.","s":59.004,"e":63.642,"p":false,"h":false},{"t":"이 일은 예루살렘 교회가 막 태어난 때에 일어났습니다.","s":63.864,"e":67.798,"p":false,"h":false},{"t":"교회는 성령이 부어져 시작된 지 얼마 되지 않았고, 바나바처럼 아낌없이 서로 나누는 사랑이 교회를 지탱하던 때였습니다.","s":68.004,"e":76.31,"p":false,"h":false},{"t":"그 한가운데에서 사랑이 아닌 위선이 들어와 교회를 안에서부터 흔들려 했습니다.","s":76.644,"e":81.98,"p":false,"h":false},{"t":"그래서 하나님이 직접 개입하셔서 교회의 거룩을 지키셨습니다.","s":82.332,"e":86.699,"p":false,"h":false},{"t":"베드로가 죽음을 선고한 것이 아니라, 하나님이 교회를 지키신 일입니다.","s":87.048,"e":92.048,"p":false,"h":false},{"t":"구약에도 하나님이 새 시작의 거룩을 분명히 지키신 장면이 있습니다.","s":92.268,"e":96.872,"p":false,"h":false},{"t":"가나안 정복이 막 시작될 때의 아간(여호수아 7장)이 그렇고, 성막 예배가 막 시작될 때의 나답과 아비후(레위기 10장)가 그렇습니다.","s":97.236,"e":108.595,"p":false,"h":false},{"t":"그렇다고 이것이 아나니아 부부의 영원한 운명을 말하는 것은 아닙니다.","s":108.936,"e":113.597,"p":false,"h":false},{"t":"본문은 그 점에 대해 침묵하며, 우리가 단정할 일도 아닙니다.","s":113.796,"e":118.205,"p":true,"h":false},{"t":"그러면 아나니아의 잘못은 무엇이었을까요.","s":118.872,"e":121.897,"p":false,"h":false},{"t":"바나바는 아낌없이 드렸고, 아나니아는 아까웠습니다.","s":122.112,"e":126.221,"p":false,"h":false},{"t":"그런데 그 아까운 마음을 숨기고 아낌없이 드린 사람처럼 보이고 싶었습니다.","s":126.432,"e":131.741,"p":false,"h":false},{"t":"이것이 속임이고, 성령을 속였다는 말의 뜻입니다.","s":132.12,"e":135.881,"p":false,"h":false},{"t":"베드로가 \"네 마음대로 할 수 있지 않았느냐\"고 말한 것은 \"속일 바에는 차라리 드리지 말지\"라는 뜻이 아닙니다.","s":136.08,"e":144.078,"p":false,"h":false},{"t":"아무도 강요하지 않았는데 스스로 꾸며 낸 것이 문제였다는 뜻입니다.","s":144.288,"e":148.905,"p":false,"h":false},{"t":"이 본문이 가르치는 것은 헌금을 하지 말라는 것이 아닙니다.","s":149.112,"e":153.166,"p":false,"h":false},{"t":"사랑은 아끼지 않는다는 것입니다.","s":153.396,"e":155.927,"p":false,"h":false},{"t":"아브라함은 독자 이삭을 아끼지 않았고(창세기 22:12), 하나님은 자기 아들을 아끼지 않으시고 우리를 위해 내주셨습니다(로마서 8:32).","s":156.132,"e":167.284,"p":false,"h":false},{"t":"아까워하지 않는 것은 사랑의 모습입니다.","s":167.508,"e":170.474,"p":false,"h":false},{"t":"처음부터 사랑이 아닌 마음으로 시작한 헌금이 위선이 되었고, 그 위선이 거짓말로 드러난 것입니다.","s":170.712,"e":177.771,"p":true,"h":false},{"t":"그 뒤에도 하나님은 교회를 지키십니다.","s":178.56,"e":181.421,"p":false,"h":false},{"t":"사도들을 통해 표적이 많이 일어나고 믿는 사람들이 주께 더해집니다(5:12-16).","s":181.62,"e":188.322,"p":false,"h":false},{"t":"대제사장과 사두개인들이 시기하여 사도들을 감옥에 가두지만, 밤에 주의 사자가 감옥 문을 열고 \"가서 성전에서 이 생명의 말씀을 백성에게 다 전하라\"고 말합니다(5:17-20).","s":188.532,"e":202.232,"p":false,"h":false},{"t":"이튿날 의회가 사도들을 끌어오려고 보냈더니 감옥은 굳게 잠겨 있는데 안에는 아무도 없었고, 사도들은 성전에서 가르치고 있었습니다(5:21-25).","s":202.464,"e":213.866,"p":true,"h":false},{"t":"다시 불려 간 사도들은 \"사람보다 하나님께 순종하는 것이 마땅합니다\"라고 답합니다.","s":214.524,"e":220.671,"p":false,"h":false},{"t":"예수님을 하나님이 살리셨고, 이 일의 증인은 우리와, 하나님이 순종하는 사람들에게 주신 성령이라고 합니다(5:29-32).","s":220.86,"e":230.98,"p":false,"h":false},{"t":"화가 난 의회가 사도들을 죽이려 할 때 가말리엘이 일어나, 이 일이 사람에게서 났으면 무너질 것이고 하나님께로서 났으면 막을 수 없다고 말합니다(5:33-39).","s":231.192,"e":243.519,"p":false,"h":false},{"t":"사도들은 매를 맞고 풀려나지만, 예수의 이름을 위해 모욕받는 것을 기뻐하며 나옵니다.","s":243.756,"e":250.006,"p":false,"h":false},{"t":"그들은 날마다 성전과 집에서 가르치기를 쉬지 않았습니다(5:40-42).","s":250.2,"e":256.572,"p":true,"h":false},{"t":"구절 풀이","s":257.256,"e":258.303,"p":true,"h":false},{"t":"5장 1절에서 11절은 아나니아 한 사람의 이야기로만 읽지 않는 것이 중요합니다.","s":259.164,"e":264.625,"p":false,"h":false},{"t":"헌금을 잘못 드려서 저주받아 지옥에 간 사람 이야기로 읽으면 본문이 말하는 바와 어긋나고, 헌금에 거부감까지 생깁니다.","s":264.816,"e":273.027,"p":false,"h":false},{"t":"이 일은 예루살렘 교회가 막 세워질 때 교회를 안에서 흔드는 위선을 하나님이 직접 막으신 일입니다.","s":273.384,"e":280.051,"p":false,"h":false},{"t":"아나니아 부부의 영원한 운명은 본문이 말하지 않습니다.","s":280.404,"e":284.183,"p":true,"h":false},{"t":"5장 4절의 \"네 마음대로 할 수 있지 않았느냐\"는 속일 바에는 차라리 드리지 말라는 말이 아닙니다.","s":284.832,"e":291.605,"p":false,"h":false},{"t":"이 말은 헌금이 자발적이었음을 일깨우는 말이고, 그래서 문제가 전적으로 마음에 있었다는 뜻입니다.","s":291.816,"e":298.797,"p":false,"h":false},{"t":"바나바는 아낌없이 드렸고, 아나니아는 아까워하면서 아낌없는 척했습니다.","s":299.16,"e":304.698,"p":false,"h":false},{"t":"이 본문은 헌금을 하지 말라는 가르침이 아니라, 사랑으로 아낌없이 드리는 교회의 모습을 보여 줍니다.","s":304.884,"e":311.909,"p":true,"h":false},{"t":"5장 3절과 4절의 \"성령을 속였다\", \"하나님을 속였다\"는 이 일이 교회를 인도하시는 분 앞에서 일어난 일임을 알려 줍니다.","s":312.552,"e":321.611,"p":false,"h":false},{"t":"사도들의 권위를 지킨 사건이 아닙니다.","s":321.984,"e":324.815,"p":true,"h":false},{"t":"5장 29절은 사도들이 고집이 세서가 아니라, 주님이 맡기신 일을 사람의 금지 때문에 멈출 수 없어서 한 말입니다.","s":325.476,"e":333.56,"p":false,"h":false},{"t":"그리고 그 순종 앞에서 감옥 문을 여신 분도, 의회 안에 가말리엘을 세워 두신 분도 하나님이십니다.","s":333.9,"e":340.898,"p":true,"h":false},{"t":"5장 38절과 39절의 가말리엘의 말은 지혜로운 조언처럼 들리지만 일반 원칙으로 삼으면 곤란합니다.","s":341.712,"e":349.309,"p":false,"h":false},{"t":"성공하면 하나님의 일이고 실패하면 아니라는 기준은 성경이 가르치지 않습니다.","s":349.668,"e":355.027,"p":false,"h":false},{"t":"누가는 그의 말을 기록할 뿐, 영원한 법칙으로 세우지 않습니다.","s":355.248,"e":360.132,"p":true,"h":false}]},{"title":"사도행전_06장","audio":"doc06_2610231348.mp3","dur":181.5,"segs":[{"t":"사도행전 6장","s":0,"e":1.649,"p":true,"h":false},{"t":"전체 흐름","s":2.304,"e":3.336,"p":true,"h":false},{"t":"제자의 수가 늘어나던 때, 교회 안에서 불평이 터져 나옵니다.","s":4.212,"e":8.612,"p":false,"h":false},{"t":"헬라어를 쓰는 유대인 신자들이 히브리어를 쓰는 신자들에게, 날마다 하는 구제에서 우리 과부들이 빠진다고 불평한 것입니다(6:1).","s":8.82,"e":18.43,"p":false,"h":false},{"t":"교회가 커지면서 처음으로 생긴 갈등입니다.","s":18.648,"e":21.97,"p":true,"h":false},{"t":"열두 사도는 제자들을 모아 말합니다.","s":22.608,"e":25.43,"p":false,"h":false},{"t":"\"우리가 하나님의 말씀을 제쳐 놓고 음식 나르는 일을 하는 것은 옳지 않습니다.","s":25.632,"e":30.813,"p":false,"h":false},{"t":"성령과 지혜가 충만하다고 인정받는 사람 일곱을 뽑으십시오.","s":31.032,"e":35.411,"p":false,"h":false},{"t":"우리는 기도와 말씀 전하는 일에 힘쓰겠습니다\"(6:2-4).","s":35.604,"e":40.664,"p":false,"h":false},{"t":"모두가 이 말을 기뻐하여 스데반, 빌립 등 일곱 사람을 뽑고, 사도들은 그들에게 안수하며 기도합니다(6:5-6).","s":40.896,"e":50.501,"p":false,"h":false},{"t":"뽑힌 일곱 사람의 이름이 모두 헬라식 이름이라는 점도 눈에 띕니다.","s":50.724,"e":55.408,"p":false,"h":false},{"t":"불평한 쪽의 사람들이 오히려 구제를 맡은 셈입니다.","s":55.62,"e":59.318,"p":true,"h":false},{"t":"그리고 이 이야기의 결론은 한 문장으로 나옵니다.","s":59.976,"e":63.512,"p":false,"h":false},{"t":"\"하나님의 말씀이 점점 왕성하여 예루살렘에서 제자의 수가 심히 많아지고, 허다한 제사장의 무리도 이 믿음에 복종하니라\"(6:7).","s":63.72,"e":73.324,"p":false,"h":false},{"t":"갈등을 푼 비결이 따로 소개되지는 않습니다.","s":73.512,"e":76.634,"p":false,"h":false},{"t":"말씀이 자라는 것이 결론이고, 자라게 하신 분은 주님이십니다.","s":76.86,"e":81.271,"p":true,"h":false},{"t":"뽑힌 일곱 가운데 스데반은 은혜와 능력이 충만하여 백성 중에 큰 기사와 표적을 행했습니다(6:8).","s":81.936,"e":89.571,"p":false,"h":false},{"t":"그러자 여러 회당 사람들이 일어나 그와 논쟁하지만, 그가 말하는 지혜와 성령을 당해 낼 수 없었습니다.","s":89.784,"e":96.938,"p":false,"h":false},{"t":"그래서 사람들을 꾀어 거짓 증인을 세우고, 그를 붙잡아 공회로 끌고 갑니다.","s":97.308,"e":102.662,"p":false,"h":false},{"t":"공회 사람들은 스데반의 얼굴이 천사의 얼굴처럼 보이는 것을 보았습니다(6:9-15).","s":102.852,"e":109.797,"p":true,"h":false},{"t":"구절 풀이","s":110.484,"e":111.531,"p":true,"h":false},{"t":"6장 2절에서 4절은 일곱 사람을 뽑은 이유가 사도들이 편하려는 것이 아니라 말씀과 기도의 자리를 지키려는 것임을 보여 줍니다.","s":112.392,"e":120.664,"p":false,"h":false},{"t":"구제는 하찮은 일이어서 맡긴 것이 아니라, 성령과 지혜가 충만한 사람이 맡아야 할 중요한 일이었습니다.","s":120.996,"e":127.944,"p":false,"h":false},{"t":"이 일곱 사람을 \"집사\"라고 부르는 것은 후대의 전통이고, 본문이 이 직분을 오늘의 집사 제도의 시작으로 못 박고 있는지는 해석이 갈립니다.","s":128.304,"e":137.916,"p":false,"h":false},{"t":"이 본문에서 갈등 해결 방법을 이끌어 내려 하기보다, 교회가 말씀을 중심에 두려 했다는 점에 눈을 두는 것이 무난합니다.","s":138.276,"e":146.387,"p":true,"h":false},{"t":"6장 7절이 이 장의 결론입니다.","s":147.204,"e":149.865,"p":false,"h":false},{"t":"사람의 문제가 풀린 이야기로 끝나지 않고, 말씀이 자라는 이야기로 끝납니다.","s":150.084,"e":155.518,"p":false,"h":false},{"t":"사도행전에서 이런 문장이 반복됩니다(12:24, 19:20).","s":155.736,"e":162.08,"p":false,"h":false},{"t":"교회를 자라게 하시는 분은 주님이라는 줄기가 여기서도 이어집니다.","s":162.288,"e":166.761,"p":true,"h":false},{"t":"6장 15절의 \"천사의 얼굴\"은 스데반이 특별한 사람이어서가 아니라, 재판받는 자리에서 하나님이 함께하심이 드러난 모습으로 읽는 것이 좋습니다.","s":167.436,"e":177.629,"p":false,"h":false},{"t":"그의 장면은 곧 7장으로 이어집니다.","s":177.984,"e":180.818,"p":true,"h":false}]},{"title":"사도행전_07장","audio":"doc07_2610231348.mp3","dur":218.4,"segs":[{"t":"사도행전 7장","s":0,"e":1.661,"p":true,"h":false},{"t":"전체 흐름","s":2.304,"e":3.336,"p":true,"h":false},{"t":"대제사장이 묻습니다.","s":4.212,"e":5.981,"p":false,"h":false},{"t":"\"이 말이 사실이냐.\"","s":6.192,"e":7.803,"p":false,"h":false},{"t":"스데반은 변명하지 않고 이스라엘의 긴 역사를 말하기 시작합니다.","s":8.1,"e":12.673,"p":false,"h":false},{"t":"영광의 하나님이 메소포타미아에서 아브라함에게 나타나셨고(7:2), 하나님은 요셉과 함께하셔서 그를 애굽에서 높이셨으며(7:9-10), 모세를 보내어 백성을 건져 내셨습니다(7:20-36).","s":12.888,"e":29.385,"p":false,"h":false},{"t":"이 이야기에서 되풀이되는 모습이 있습니다.","s":29.592,"e":32.615,"p":false,"h":false},{"t":"하나님이 사람을 보내 구원하시는데, 백성은 처음에 그 사람을 거절합니다.","s":32.832,"e":38.206,"p":false,"h":false},{"t":"요셉도 형제들에게 팔렸고, 모세도 \"누가 너를 우리 관리자로 세웠느냐\" 하는 말을 들었습니다(7:9, 7:27, 7:35).","s":38.412,"e":49.647,"p":true,"h":false},{"t":"스데반은 이어서 성막과 성전 이야기를 합니다.","s":50.328,"e":53.701,"p":false,"h":false},{"t":"솔로몬이 성전을 지었지만, \"지극히 높으신 이는 손으로 지은 곳에 계시지 않는다\"고 하며 이사야 66장을 인용합니다.","s":53.892,"e":62.439,"p":false,"h":false},{"t":"\"하늘은 내 보좌요 땅은 내 발등상이다.","s":62.784,"e":65.893,"p":false,"h":false},{"t":"너희가 나를 위하여 무슨 집을 지으며 내가 쉴 곳이 어디냐\"(7:48-50).","s":66.096,"e":72.673,"p":false,"h":false},{"t":"하나님을 한 장소에 가두려는 마음을 짚은 것입니다.","s":72.9,"e":76.461,"p":true,"h":false},{"t":"그러고는 설교의 끝이 날카로워집니다.","s":77.112,"e":79.958,"p":false,"h":false},{"t":"\"목이 곧고 마음과 귀가 할례받지 못한 사람들이여, 너희는 항상 성령을 거스르는도다.","s":80.172,"e":86.469,"p":false,"h":false},{"t":"너희 조상이 선지자를 박해했고, 의로운 이가 오실 것을 예고한 사람들을 죽였으며, 이제는 너희가 그분을 배반하고 죽였다\"(7:51-53).","s":86.688,"e":98.086,"p":false,"h":false},{"t":"사람들은 이를 갈며 분노했습니다(7:54).","s":98.28,"e":102.493,"p":true,"h":false},{"t":"그러나 스데반은 성령이 충만하여 하늘을 바라보고, 하나님의 영광과 하나님 오른편에 서신 예수를 봅니다.","s":103.14,"e":110.351,"p":false,"h":false},{"t":"\"하늘이 열리고 인자가 하나님 우편에 서 있는 것이 보입니다\"(7:55-56).","s":110.556,"e":117.091,"p":false,"h":false},{"t":"사람들이 귀를 막고 달려들어 그를 성 밖으로 끌어내 돌로 칩니다.","s":117.324,"e":121.893,"p":false,"h":false},{"t":"스데반은 기도합니다.","s":122.076,"e":123.857,"p":false,"h":false},{"t":"\"주 예수여, 내 영혼을 받으시옵소서.\"","s":124.092,"e":127.264,"p":false,"h":false},{"t":"그리고 무릎을 꿇고 크게 외칩니다.","s":127.44,"e":130.159,"p":false,"h":false},{"t":"\"주여, 이 죄를 그들에게 돌리지 마옵소서\"(7:59-60).","s":130.392,"e":136.086,"p":false,"h":false},{"t":"이 말을 하고 그는 잠들었습니다.","s":136.296,"e":138.807,"p":false,"h":false},{"t":"증인들은 옷을 사울이라는 청년의 발 앞에 두었습니다(7:58).","s":138.996,"e":144.402,"p":true,"h":false},{"t":"구절 풀이","s":145.044,"e":146.091,"p":true,"h":false},{"t":"7장 48절에서 50절은 이사야와 이어지는 본문입니다.","s":146.952,"e":151.536,"p":false,"h":false},{"t":"스데반이 인용한 이사야 66장 1절과 2절은 이사야서의 마지막 장입니다.","s":151.74,"e":157.251,"p":false,"h":false},{"t":"성전이 중요하지 않다는 말이 아니라, 하나님이 성전에 갇혀 계신 분이 아니라는 말입니다.","s":157.608,"e":163.656,"p":true,"h":false},{"t":"7장 51절에서 53절의 표현은 거칠지만, 스데반이 화가 나서 퍼부은 말이 아니라 선지자들이 해 온 말을 이어받은 것입니다.","s":164.34,"e":173.245,"p":false,"h":false},{"t":"성령을 거스른다는 말은 이 책 전체의 줄기를 다시 일깨웁니다.","s":173.592,"e":178.026,"p":false,"h":false},{"t":"일하시는 분은 성령이고, 사람의 일은 순종하거나 거스르거나 둘 중 하나입니다.","s":178.236,"e":183.865,"p":true,"h":false},{"t":"7장 55절과 56절에서 예수님이 \"서 계신\" 것은 의미를 두고 해석이 갈립니다.","s":184.5,"e":191.001,"p":false,"h":false},{"t":"다른 곳에서는 하나님 우편에 \"앉으신\" 것으로 말하기 때문입니다.","s":191.34,"e":196.137,"p":false,"h":false},{"t":"순교하는 증인을 맞이하려고 일어서신 것으로 보는 견해가 널리 알려져 있으나 본문이 직접 설명하지는 않습니다.","s":196.344,"e":203.641,"p":true,"h":false},{"t":"7장 60절의 기도는 예수님이 십자가에서 하신 기도와 닮았습니다.","s":204.444,"e":209.223,"p":false,"h":false},{"t":"스데반이 자기 힘으로 용서한 것이 아니라, 성령이 충만한 사람 안에서 그리스도의 마음이 이어진 것으로 읽을 수 있습니다.","s":209.592,"e":217.614,"p":true,"h":false}]},{"title":"사도행전_08장","audio":"doc08_2610231348.mp3","dur":241.9,"segs":[{"t":"사도행전 8장","s":0,"e":1.599,"p":true,"h":false},{"t":"전체 흐름","s":2.268,"e":3.3,"p":true,"h":false},{"t":"스데반이 죽은 날, 예루살렘 교회에 큰 박해가 일어납니다.","s":4.176,"e":8.643,"p":false,"h":false},{"t":"사도들 외에는 모두 유대와 사마리아 여러 곳으로 흩어졌습니다.","s":8.856,"e":13.311,"p":false,"h":false},{"t":"사울은 집집마다 들어가 남자와 여자를 끌어다 감옥에 넣으며 교회를 잔멸합니다(8:1-3).","s":13.536,"e":20.858,"p":false,"h":false},{"t":"그런데 흩어진 사람들은 가는 곳마다 복음의 말씀을 전했습니다(8:4).","s":21.06,"e":26.81,"p":false,"h":false},{"t":"박해는 교회를 없애지 못하고 오히려 널리 퍼뜨렸습니다.","s":27.036,"e":31.299,"p":false,"h":false},{"t":"1장 8절의 \"유대와 사마리아\"가 이렇게 열리기 시작합니다.","s":31.5,"e":36.274,"p":true,"h":false},{"t":"빌립이 사마리아 성으로 내려가 그리스도를 전합니다.","s":36.936,"e":40.485,"p":false,"h":false},{"t":"더러운 귀신이 나가고 중풍병자와 걷지 못하는 사람이 고침을 받자, 그 성에 큰 기쁨이 있었습니다(8:5-8).","s":40.68,"e":49.54,"p":false,"h":false},{"t":"전부터 마술로 사람들을 놀라게 하던 시몬도 믿고 세례를 받습니다(8:9-13).","s":49.752,"e":56.516,"p":true,"h":false},{"t":"예루살렘의 사도들이 사마리아가 말씀을 받았다는 소식을 듣고 베드로와 요한을 보냅니다.","s":57.204,"e":63.297,"p":false,"h":false},{"t":"이들이 와서 기도하자, 그들이 성령을 받습니다(8:14-17).","s":63.648,"e":69.479,"p":false,"h":false},{"t":"이것을 본 시몬이 돈을 주며 이 권능을 자기에게도 달라고 합니다.","s":69.696,"e":74.151,"p":false,"h":false},{"t":"베드로는 \"네 돈과 함께 망할 것이다.","s":74.376,"e":77.389,"p":false,"h":false},{"t":"하나님의 선물을 돈으로 살 수 있다고 생각했기 때문이다.","s":77.58,"e":81.277,"p":false,"h":false},{"t":"이 일에 네가 참여할 자리가 없다\"고 책망합니다(8:18-24).","s":81.504,"e":87.685,"p":true,"h":false},{"t":"이야기는 다시 빌립에게 돌아옵니다.","s":88.344,"e":91.03,"p":false,"h":false},{"t":"주의 사자가 \"일어나 남쪽으로 가라\" 하자 빌립은 광야 길로 나가고, 마침 에티오피아 여왕의 모든 재산을 맡은 내시를 만납니다.","s":91.224,"e":100.342,"p":false,"h":false},{"t":"그는 예루살렘에 예배하러 갔다가 돌아가는 길에 수레에서 이사야서를 읽고 있었습니다.","s":100.692,"e":106.267,"p":false,"h":false},{"t":"성령이 빌립에게 \"이 수레로 가까이 가서 붙으라\"고 하십니다(8:26-29).","s":106.452,"e":113.322,"p":false,"h":false},{"t":"내시가 읽던 구절은 이사야 53장이었습니다.","s":113.544,"e":117.217,"p":false,"h":false},{"t":"\"그가 양처럼 도살장에 끌려가시며 털 깎는 사람 앞에 잠잠한 어린 양같이 그 입을 열지 않으셨도다\"(8:32-33).","s":117.432,"e":126.752,"p":false,"h":false},{"t":"내시는 묻습니다.","s":126.972,"e":128.453,"p":false,"h":false},{"t":"\"선지자가 누구를 가리켜 말하는 것입니까.\"","s":128.88,"e":131.709,"p":false,"h":false},{"t":"빌립은 이 성경에서 시작하여 예수를 전합니다(8:34-35).","s":131.904,"e":137.731,"p":false,"h":false},{"t":"물 있는 곳에 이르자 내시가 말합니다.","s":137.952,"e":140.75,"p":false,"h":false},{"t":"\"내가 세례를 받는 데 무슨 거리낌이 있습니까.\"","s":140.976,"e":144.06,"p":false,"h":false},{"t":"빌립이 세례를 베풀고, 물에서 올라오자 주의 영이 빌립을 이끌어 가셨습니다.","s":144.252,"e":149.821,"p":false,"h":false},{"t":"내시는 기뻐하며 자기 길을 갔고, 빌립은 아소도에서 나타나 여러 성을 다니며 복음을 전합니다(8:36-40).","s":150.012,"e":158.863,"p":true,"h":false},{"t":"구절 풀이","s":159.552,"e":160.599,"p":true,"h":false},{"t":"8장 14절에서 17절은 이 장에서 가장 논쟁이 되는 본문입니다.","s":161.46,"e":166.264,"p":false,"h":false},{"t":"사마리아 사람들이 믿고 세례를 받았는데도 성령이 곧바로 임하지 않고 사도들이 와서야 임했다는 점 때문입니다.","s":166.464,"e":173.968,"p":false,"h":false},{"t":"이것을 모든 신자가 따라야 할 순서로 읽는 입장도 있고, 개혁신학은 대개 이를 사마리아에 복음이 처음 열릴 때 일어난 이행기의 사건으로 읽습니다.","s":174.312,"e":184.052,"p":false,"h":false},{"t":"유대인과 사마리아인이 오랜 적대를 넘어 한 교회가 되는 일을, 예루살렘 사도들이 직접 확인하는 자리였다는 뜻입니다.","s":184.392,"e":192.246,"p":false,"h":false},{"t":"이것을 오늘 교회의 표준으로 삼는지는 갈리는 주제이므로 단정하지 않습니다.","s":192.6,"e":197.672,"p":true,"h":false},{"t":"8장 20절에서 23절의 시몬의 이야기는 하나님의 선물이 돈으로 살 수 있는 것이 아님을 보여 줍니다.","s":198.324,"e":205.173,"p":false,"h":false},{"t":"구원도 성령도 은혜로 주어지는 것이어서, 사람이 흥정하거나 소유할 수 없습니다.","s":205.524,"e":211.308,"p":true,"h":false},{"t":"8장 26절에서 35절에서 눈에 띄는 것은 이 만남을 계획하고 이끄시는 분이 누구냐 하는 점입니다.","s":211.968,"e":218.829,"p":false,"h":false},{"t":"주의 사자, 성령, 이사야서가 이어지며 빌립을 그 수레 곁으로 이끕니다.","s":219.168,"e":225.002,"p":false,"h":false},{"t":"빌립은 이 만남을 스스로 만들지 않았습니다.","s":225.216,"e":228.395,"p":false,"h":false},{"t":"이 내시는 이사야 56장 3절에서 5절이 말하던 사람의 모습과 이어집니다.","s":228.6,"e":234.354,"p":false,"h":false},{"t":"그 약속이 이 장면에서 이루어졌다고 읽는 해석이 많지만, 본문이 직접 연결하지는 않습니다.","s":234.576,"e":241.127,"p":true,"h":false}]},{"title":"사도행전_09장","audio":"doc09_2610231348.mp3","dur":253.1,"segs":[{"t":"사도행전 9장","s":0,"e":1.574,"p":true,"h":false},{"t":"전체 흐름","s":2.232,"e":3.264,"p":true,"h":false},{"t":"사울은 여전히 주의 제자들을 위협하며 살기가 등등합니다.","s":4.14,"e":8.412,"p":false,"h":false},{"t":"그는 대제사장에게 다메섹 여러 회당에 보내는 공문을 받아, 이 도를 따르는 사람을 보면 남녀를 가리지 않고 결박하여 예루살렘으로 끌고 올 계획이었습니다(9:1-2).","s":8.64,"e":21.074,"p":true,"h":false},{"t":"그런데 다메섹에 가까이 이르렀을 때, 갑자기 하늘에서 빛이 그를 둘러 비춥니다.","s":21.78,"e":27.541,"p":false,"h":false},{"t":"그는 땅에 엎드러져 소리를 듣습니다.","s":27.756,"e":30.329,"p":false,"h":false},{"t":"\"사울아, 사울아, 네가 어찌하여 나를 박해하느냐.\"","s":30.528,"e":34.858,"p":false,"h":false},{"t":"그가 묻습니다.","s":35.064,"e":36.398,"p":false,"h":false},{"t":"\"주여, 누구십니까.\"","s":36.972,"e":38.831,"p":false,"h":false},{"t":"대답이 옵니다.","s":39.06,"e":40.505,"p":false,"h":false},{"t":"\"나는 네가 박해하는 예수다\"(9:3-5).","s":40.968,"e":44.866,"p":false,"h":false},{"t":"이 한마디가 중요합니다.","s":45.072,"e":47.106,"p":false,"h":false},{"t":"사울이 박해한 것은 교회였는데, 주님은 \"나를 박해하느냐\"고 하십니다.","s":47.34,"e":52.962,"p":false,"h":false},{"t":"교회를 해치는 것이 곧 그리스도를 해치는 것입니다.","s":53.172,"e":56.656,"p":false,"h":false},{"t":"일어난 사울은 눈은 떴으나 아무것도 보지 못했고, 사흘 동안 보지도 먹지도 마시지도 못했습니다(9:8-9).","s":56.88,"e":65.352,"p":true,"h":false},{"t":"다메섹에 아나니아라는 제자가 있었습니다.","s":66.024,"e":68.933,"p":false,"h":false},{"t":"주님이 환상 중에 그를 부르시자, 아나니아는 사울이 한 일을 들어 알고 있다며 망설입니다.","s":69.156,"e":75.192,"p":false,"h":false},{"t":"주님은 말씀하십니다.","s":75.384,"e":77.165,"p":false,"h":false},{"t":"\"가라.","s":77.4,"e":78.045,"p":false,"h":false},{"t":"이 사람은 내 이름을 이방인과 임금들과 이스라엘 자손 앞에 전하기 위하여 내가 택한 그릇이다.","s":78.264,"e":84.81,"p":false,"h":false},{"t":"내 이름을 위하여 얼마나 고난을 받아야 할지 내가 그에게 보이겠다\"(9:10-16).","s":85.032,"e":91.847,"p":false,"h":false},{"t":"아나니아가 가서 사울에게 안수하며 \"형제 사울아\" 하고 부릅니다.","s":92.052,"e":96.686,"p":false,"h":false},{"t":"곧 사울의 눈에서 비늘 같은 것이 벗겨지고, 그는 보게 되어 일어나 세례를 받습니다(9:17-19).","s":96.876,"e":104.614,"p":true,"h":false},{"t":"사울은 곧 회당에서 \"그분이 하나님의 아들이시다\"라고 전합니다.","s":105.3,"e":110.084,"p":false,"h":false},{"t":"듣는 사람들은 놀라워하지만, 유대인들이 그를 죽이려고 모의하자 제자들이 밤에 그를 광주리에 담아 성벽으로 달아 내립니다(9:20-25).","s":110.304,"e":120.951,"p":false,"h":false},{"t":"예루살렘에서는 제자들이 그를 두려워했으나 바나바가 사울을 데리고 사도들에게 가서 그가 주를 본 일과 담대히 전한 일을 이야기해 줍니다.","s":121.176,"e":130.305,"p":false,"h":false},{"t":"형제들은 그를 가이사랴를 거쳐 다소로 보냅니다(9:26-30).","s":130.644,"e":136.468,"p":true,"h":false},{"t":"그 뒤로 교회는 유대와 갈릴리와 사마리아 온 지역에서 평안하여 든든히 서 가고, 주를 두려워하며 성령의 위로로 행하여 수가 더해졌습니다(9:31).","s":137.124,"e":147.923,"p":true,"h":false},{"t":"이야기는 베드로에게로 이어집니다.","s":148.608,"e":151.269,"p":false,"h":false},{"t":"베드로가 룻다에서 중풍으로 팔 년을 누워 있던 애니아를 고치고, 욥바에서는 선행으로 이름난 다비다가 죽자 기도하여 다시 살립니다.","s":151.488,"e":160.327,"p":false,"h":false},{"t":"그 일로 많은 사람이 주를 믿었고, 베드로는 욥바에서 시몬이라는 무두장이의 집에 여러 날 머뭅니다(9:32-43).","s":160.668,"e":169.976,"p":false,"h":false},{"t":"이 마지막 한 줄이 다음 장의 문을 열 준비가 됩니다.","s":170.208,"e":173.856,"p":true,"h":false},{"t":"구절 풀이","s":174.528,"e":175.575,"p":true,"h":false},{"t":"9장 4절과 5절의 \"나를 박해하느냐\"는 이 책에서 교회와 그리스도가 하나라는 것을 가장 짧게 보여 주는 말씀입니다.","s":176.436,"e":184.672,"p":false,"h":false},{"t":"사울은 사람들을 잡으러 가던 길이었지만, 실제로 부딪힌 상대는 살아 계신 주님이었습니다.","s":185.04,"e":191.662,"p":false,"h":false},{"t":"이 일은 사울의 결단이 아니라 주님이 먼저 찾아오신 사건입니다.","s":192.024,"e":196.558,"p":true,"h":false},{"t":"9장 15절과 16절에서 주님이 사울을 두고 \"내가 택한 그릇\"이라고 하십니다.","s":197.244,"e":203.119,"p":false,"h":false},{"t":"사울이 스스로 돌이킨 것이 아니라 택함을 받은 것이고, 앞으로 받을 고난까지 미리 말씀하십니다.","s":203.328,"e":210.022,"p":false,"h":false},{"t":"선택과 고난이 함께 나옵니다.","s":210.204,"e":212.633,"p":true,"h":false},{"t":"9장 10절에서 17절의 아나니아는 5장의 아나니아와 이름이 같지만 다른 사람입니다.","s":213.3,"e":219.063,"p":false,"h":false},{"t":"이 아나니아는 무서워서 망설이는 모습도 솔직하게 보여 줍니다.","s":219.276,"e":223.773,"p":false,"h":false},{"t":"그러나 주님이 말씀하시자 가서 \"형제 사울아\"라고 부릅니다.","s":223.992,"e":228.471,"p":false,"h":false},{"t":"박해자를 형제로 맞이하는 일이 이미 주님이 하신 일을 따르는 모습입니다.","s":228.672,"e":233.358,"p":true,"h":false},{"t":"9장 31절은 이 구간의 쉼표입니다.","s":234.036,"e":237.065,"p":false,"h":false},{"t":"박해가 지나간 자리에서 교회가 평안을 얻고 자라는 일 역시 \"성령의 위로\"로 설명됩니다.","s":237.276,"e":243.75,"p":false,"h":false},{"t":"사울이 회심한 이후 박해가 줄어든 것을 사람의 사정으로만 보지 않고 주님이 교회를 돌보신 일로 읽는 것이 본문에 맞습니다.","s":244.08,"e":252.281,"p":true,"h":false}]},{"title":"사도행전_10장","audio":"doc10_2610231348.mp3","dur":265.2,"segs":[{"t":"사도행전 10장","s":0,"e":1.574,"p":true,"h":false},{"t":"전체 흐름","s":2.232,"e":3.264,"p":true,"h":false},{"t":"가이사랴에 고넬료라는 로마 군대의 백부장이 살았습니다.","s":4.14,"e":8.032,"p":false,"h":false},{"t":"그는 경건하여 온 집안과 함께 하나님을 경외하고, 백성을 많이 구제하며 항상 하나님께 기도하는 사람이었습니다(10:1-2).","s":8.244,"e":17.959,"p":false,"h":false},{"t":"어느 날 오후 세 시쯤 환상 중에 하나님의 천사가 와서 \"고넬료야\" 하고 부릅니다.","s":18.18,"e":23.927,"p":false,"h":false},{"t":"천사는 그의 기도와 구제가 하나님 앞에 상달되어 기억되었다고 하며, 욥바에서 베드로라는 사람을 데려오라고 합니다(10:3-6).","s":24.3,"e":34.227,"p":false,"h":false},{"t":"고넬료는 사람 셋을 보냅니다.","s":34.452,"e":36.76,"p":true,"h":false},{"t":"다음 날 낮 열두 시쯤 베드로가 욥바의 지붕에서 기도하다 시장기가 들었습니다.","s":37.404,"e":42.74,"p":false,"h":false},{"t":"그때 하늘이 열리고 큰 보자기 같은 그릇이 내려오는데, 그 안에는 온갖 네발 가진 짐승과 기는 것과 공중의 새가 가득했습니다.","s":43.092,"e":52.121,"p":false,"h":false},{"t":"소리가 들립니다.","s":52.452,"e":53.932,"p":false,"h":false},{"t":"\"베드로야, 일어나 잡아먹어라.\"","s":54.36,"e":57.004,"p":false,"h":false},{"t":"베드로가 대답합니다.","s":57.204,"e":58.976,"p":false,"h":false},{"t":"\"주여, 그럴 수 없습니다.","s":59.184,"e":61.356,"p":false,"h":false},{"t":"나는 속되거나 깨끗하지 않은 것을 먹은 적이 없습니다.\"","s":61.596,"e":65.344,"p":false,"h":false},{"t":"그러자 소리가 두 번째로 말합니다.","s":65.556,"e":68.142,"p":false,"h":false},{"t":"\"하나님이 깨끗하게 하신 것을 네가 속되다 하지 말라.\"","s":68.364,"e":72.029,"p":false,"h":false},{"t":"이런 일이 세 번 있었습니다(10:9-16).","s":72.252,"e":76.358,"p":true,"h":false},{"t":"베드로가 환상의 뜻을 생각하고 있을 때 성령이 말씀하십니다.","s":77.04,"e":81.324,"p":false,"h":false},{"t":"\"보라, 세 사람이 너를 찾고 있다.","s":81.54,"e":84.238,"p":false,"h":false},{"t":"일어나 내려가 의심하지 말고 그들과 함께 가라.","s":84.528,"e":88.043,"p":false,"h":false},{"t":"내가 그들을 보냈다\"(10:19-20).","s":88.236,"e":92.283,"p":false,"h":false},{"t":"베드로는 따라가서 고넬료의 집에 이릅니다.","s":92.484,"e":95.518,"p":false,"h":false},{"t":"고넬료는 친척과 가까운 친구들을 불러 모아 기다리고 있었습니다.","s":95.724,"e":100.096,"p":false,"h":false},{"t":"베드로가 말합니다.","s":100.296,"e":101.857,"p":false,"h":false},{"t":"\"유대 사람이 이방 사람과 교제하는 것이 불법인 줄 여러분이 압니다.","s":102.204,"e":106.805,"p":false,"h":false},{"t":"그러나 하나님이 내게 보여 주셨습니다.","s":107.028,"e":109.826,"p":false,"h":false},{"t":"어떤 사람도 속되다 깨끗하지 않다 하지 말라고 하셨습니다\"(10:28).","s":110.052,"e":115.845,"p":false,"h":false},{"t":"그리고 이렇게 고백합니다.","s":116.064,"e":118.124,"p":false,"h":false},{"t":"\"내가 참으로 깨달으니 하나님은 사람을 외모로 취하지 않으시고, 각 나라 중에서 그분을 경외하며 의를 행하는 사람은 다 받으십니다\"(10:34-35).","s":118.332,"e":129.38,"p":true,"h":false},{"t":"베드로는 예수님의 생애, 십자가, 부활을 증언합니다.","s":130.068,"e":134.479,"p":false,"h":false},{"t":"그가 말을 마치기도 전에 성령이 말씀을 듣는 모든 사람에게 내리셨습니다.","s":134.676,"e":139.643,"p":false,"h":false},{"t":"베드로와 함께 온 할례받은 신자들은 이방인에게도 성령 선물이 부어진 것을 보고 놀랍니다.","s":139.86,"e":145.969,"p":false,"h":false},{"t":"그들이 방언으로 말하며 하나님을 높이는 소리를 들었기 때문입니다(10:44-46).","s":146.304,"e":153.225,"p":false,"h":false},{"t":"베드로가 말합니다.","s":153.432,"e":154.993,"p":false,"h":false},{"t":"\"이 사람들이 우리와 같이 성령을 받았으니 누가 물로 세례 주는 것을 막겠습니까.\"","s":155.34,"e":160.855,"p":false,"h":false},{"t":"그리고 예수 그리스도의 이름으로 세례를 받게 하고, 며칠 더 머물기를 청하는 말을 듣습니다(10:47-48).","s":161.064,"e":170.011,"p":true,"h":false},{"t":"구절 풀이","s":170.676,"e":171.723,"p":true,"h":false},{"t":"10장 전체를 이끄시는 분을 따라가 보면, 천사가 고넬료를 부르고, 환상이 베드로를 흔들고, 성령이 \"내가 그들을 보냈다\"고 말씀하십니다.","s":172.584,"e":183.145,"p":false,"h":false},{"t":"베드로나 고넬료가 계획한 일이 아니라, 하나님이 두 사람을 서로 보내셔서 이루신 일입니다.","s":183.348,"e":189.652,"p":false,"h":false},{"t":"오래 이어져 온 유대인과 이방인 사이의 벽이 사람의 토론으로 허물어진 것이 아니라, 하나님이 직접 하신 일로 허물어졌습니다.","s":190.008,"e":198.255,"p":true,"h":false},{"t":"10장 14절의 베드로의 거절은 눈여겨볼 만합니다.","s":199.044,"e":202.803,"p":false,"h":false},{"t":"그는 \"주여\" 하면서 \"그럴 수 없습니다\"라고 말합니다.","s":203.004,"e":207.388,"p":false,"h":false},{"t":"평생 지켜 온 신념이 하나님의 새 일 앞에서도 얼마나 단단히 굳어 있었는지 보여 줍니다.","s":207.576,"e":213.543,"p":false,"h":false},{"t":"사도라고 해서 모든 것을 미리 아는 사람이 아니었다는 점도 드러납니다.","s":213.876,"e":218.623,"p":true,"h":false},{"t":"10장 28절과 34절, 35절은 이방인에게 문이 열린 일을 놀라워한 유대인들의 마음을 보여 줍니다.","s":219.276,"e":226.848,"p":false,"h":false},{"t":"이사야 56장 6절에서 8절이나 49장 6절처럼, 성경은 이미 이방인을 향한 구원을 말해 왔지만 그 뜻을 몸으로 받아들이는 일은 이렇게 어려웠습니다.","s":227.196,"e":238.18,"p":true,"h":false},{"t":"10장 44절에서 48절에서는 말씀이 전해지는 중에 성령이 임하시고, 그 뒤에 세례가 베풀어집니다.","s":238.968,"e":246.641,"p":false,"h":false},{"t":"2장과 8장에서의 순서와 다릅니다.","s":246.996,"e":249.718,"p":false,"h":false},{"t":"이것은 성령이 오시는 방식에 고정된 공식이 없고, 하나님이 때와 방법을 주권적으로 정하신다는 것을 보여 줍니다.","s":249.948,"e":257.984,"p":false,"h":false},{"t":"이방인에게 문이 열리는 이 순간을 하나님이 직접 확인해 주신 것으로 읽는 견해가 많습니다.","s":258.336,"e":264.372,"p":true,"h":false}]},{"title":"사도행전_11장","audio":"doc11_2610231348.mp3","dur":202.8,"segs":[{"t":"사도행전 11장","s":0,"e":1.784,"p":true,"h":false},{"t":"전체 흐름","s":2.412,"e":3.444,"p":true,"h":false},{"t":"베드로가 예루살렘으로 돌아오자 할례받은 신자들이 따집니다.","s":4.32,"e":8.369,"p":false,"h":false},{"t":"\"당신이 할례받지 않은 사람들의 집에 들어가서 함께 먹었다면서요\"(11:1-3).","s":8.568,"e":15.11,"p":false,"h":false},{"t":"이방인이 복음을 받은 것을 기뻐하기 전에, 먼저 걸린 것은 규칙이었습니다.","s":15.336,"e":20.76,"p":false,"h":false},{"t":"베드로는 변명하지 않고 있었던 일을 차례대로 이야기합니다.","s":20.952,"e":25.088,"p":false,"h":false},{"t":"지붕 위에서 본 환상, 성령께서 \"의심하지 말고 가라\"고 하신 일, 가이사랴에서 천사를 본 고넬료의 이야기를 하고, 이렇게 말합니다.","s":25.308,"e":35.656,"p":false,"h":false},{"t":"내가 말을 시작하자 성령이 처음 우리에게 내리신 것처럼 그들에게도 내리셨습니다.","s":35.856,"e":41.44,"p":false,"h":false},{"t":"그때 \"요한은 물로 세례를 주었으나 너희는 성령으로 세례를 받으리라\"는 주님의 말씀이 생각났습니다.","s":41.796,"e":48.957,"p":false,"h":false},{"t":"\"하나님이 우리에게 주신 것과 같은 선물을 그들에게도 주셨는데, 내가 누구이기에 하나님을 막을 수 있겠습니까\"(11:4-17).","s":49.32,"e":59.139,"p":true,"h":false},{"t":"이 말을 들은 사람들은 잠잠해졌고, 하나님을 영화롭게 하며 말합니다.","s":59.796,"e":64.932,"p":false,"h":false},{"t":"\"그렇다면 하나님이 이방인에게도 생명을 얻는 회개를 주셨구나\"(11:18).","s":65.124,"e":71.048,"p":false,"h":false},{"t":"토론으로 이긴 것이 아니라, 하나님이 하신 일 앞에서 입을 다물었습니다.","s":71.28,"e":76.416,"p":true,"h":false},{"t":"한편 스데반 때문에 흩어진 사람들은 베니게와 구브로와 안디옥까지 가서 말씀을 전했습니다.","s":77.076,"e":83.269,"p":false,"h":false},{"t":"처음에는 유대인에게만 전했지만, 구브로와 구레네 출신 몇 사람이 안디옥에서 헬라인에게도 주 예수를 전했습니다.","s":83.628,"e":91.508,"p":false,"h":false},{"t":"\"주의 손이 그들과 함께하시니 수많은 사람이 믿고 주께 돌아왔다\"(11:19-21).","s":91.836,"e":98.919,"p":false,"h":false},{"t":"이 소식을 들은 예루살렘 교회가 바나바를 보냅니다.","s":99.144,"e":102.866,"p":false,"h":false},{"t":"바나바는 와서 하나님의 은혜가 나타난 것을 보고 기뻐하며 모두에게 굳건한 마음으로 주께 붙어 있으라고 권했습니다.","s":103.068,"e":110.585,"p":false,"h":false},{"t":"그는 착한 사람이요 성령과 믿음이 충만한 사람이라고 소개됩니다(11:22-24).","s":110.916,"e":118.185,"p":false,"h":false},{"t":"바나바는 사울을 찾으러 다소에 가서 그를 안디옥으로 데려왔고, 두 사람은 일 년 동안 교회에서 많은 사람을 가르쳤습니다.","s":118.404,"e":126.633,"p":false,"h":false},{"t":"제자들이 \"그리스도인\"이라는 이름으로 불리기 시작한 곳이 안디옥입니다(11:25-26).","s":126.972,"e":134.844,"p":true,"h":false},{"t":"그 무렵 선지자 아가보가 큰 흉년이 들 것을 예언하자, 안디옥의 제자들은 각자 형편대로 유대에 사는 형제들에게 구제금을 보내기로 하고, 바나바와 사울 편으로 전합니다(11:27-30).","s":135.54,"e":149.928,"p":true,"h":false},{"t":"구절 풀이","s":150.588,"e":151.635,"p":true,"h":false},{"t":"11장 17절과 18절이 이 장의 열쇠입니다.","s":152.496,"e":156.259,"p":false,"h":false},{"t":"예루살렘 교회가 이방인의 구원을 받아들이는 근거는 베드로의 설득 기술이 아니라 \"하나님이 이미 주셨다\"는 사실입니다.","s":156.456,"e":164.773,"p":false,"h":false},{"t":"이 문제를 푸신 분은 사람이 아니라 하나님이십니다.","s":165.132,"e":168.754,"p":true,"h":false},{"t":"11장 20절과 21절은 사도들이 계획한 것이 아니라는 점이 재미있습니다.","s":169.416,"e":175.015,"p":false,"h":false},{"t":"이름도 남지 않은 구브로와 구레네 출신 몇 사람이 길을 열었습니다.","s":175.356,"e":179.911,"p":false,"h":false},{"t":"그리고 \"주의 손이 함께하셨다\"는 것이 열매의 이유로 설명됩니다.","s":180.108,"e":185.43,"p":true,"h":false},{"t":"11장 26절의 \"그리스도인\"이라는 이름은 처음에는 교회 밖 사람들이 붙인 이름이라는 견해가 있지만, 본문은 누가 붙였는지 직접 말하지 않습니다.","s":186.084,"e":196.781,"p":false,"h":false},{"t":"어쨌든 이 이름이 가장 이방인이 많은 도시에서 나왔다는 점이 눈에 띕니다.","s":197.136,"e":202.183,"p":true,"h":false}]},{"title":"사도행전_12장","audio":"doc12_2610231348.mp3","dur":230.2,"segs":[{"t":"사도행전 12장","s":0,"e":1.686,"p":true,"h":false},{"t":"전체 흐름","s":2.34,"e":3.372,"p":true,"h":false},{"t":"이 무렵 헤롯 왕이 교회를 괴롭히기 시작합니다.","s":4.248,"e":7.671,"p":false,"h":false},{"t":"그는 요한의 형제 야고보를 칼로 죽입니다(12:1-2).","s":7.884,"e":12.956,"p":false,"h":false},{"t":"그것이 유대인들에게 환영받는 것을 보고 베드로까지 잡아 감옥에 넣습니다.","s":13.176,"e":18.427,"p":false,"h":false},{"t":"군인 네 명씩 네 조가 지켰고, 유월절이 끝나면 백성 앞에 끌어낼 계획이었습니다(12:3-4).","s":18.648,"e":26.693,"p":false,"h":false},{"t":"그 시간에 교회는 베드로를 위해 간절히 기도하고 있었습니다(12:5).","s":26.928,"e":32.37,"p":true,"h":false},{"t":"헤롯이 끌어내려던 바로 전날 밤, 베드로는 두 군인 사이에서 쇠사슬에 매인 채 자고 있었습니다.","s":33.012,"e":39.814,"p":false,"h":false},{"t":"주의 천사가 나타나 빛이 비치는데, 베드로를 깨우며 \"빨리 일어나라\" 하자 쇠사슬이 손에서 벗겨집니다.","s":40.176,"e":47.735,"p":false,"h":false},{"t":"허리띠를 매고 신을 신고 따라오라고 하여, 베드로는 천사를 따라 첫째 파수와 둘째 파수를 지나고, 성으로 통하는 쇠문 앞에 이릅니다.","s":48.096,"e":57.338,"p":false,"h":false},{"t":"문이 저절로 열렸습니다(12:6-10).","s":57.528,"e":61.5,"p":false,"h":false},{"t":"천사가 사라지고 나서야 베드로는 정신이 들어 말합니다.","s":61.704,"e":65.626,"p":false,"h":false},{"t":"\"이제야 참으로 알겠다.","s":65.808,"e":67.701,"p":false,"h":false},{"t":"주께서 천사를 보내어 나를 헤롯의 손에서 건지셨구나\"(12:11).","s":67.968,"e":73.378,"p":true,"h":false},{"t":"그는 마가라는 요한의 어머니 마리아의 집으로 갑니다.","s":74.052,"e":77.513,"p":false,"h":false},{"t":"거기에는 많은 사람이 모여 기도하고 있었습니다.","s":77.724,"e":81.022,"p":false,"h":false},{"t":"문을 두드리니 로데라는 여종이 나와 베드로의 목소리를 알아듣고는, 기쁜 나머지 문을 열 생각도 못 하고 안으로 달려가 \"베드로가 문 밖에 서 있어요\" 하고 알립니다.","s":81.252,"e":92.173,"p":false,"h":false},{"t":"사람들은 \"네가 미쳤구나\" 하다가 끝내 말하자 \"그의 천사겠지\" 합니다.","s":92.484,"e":98.17,"p":false,"h":false},{"t":"베드로가 계속 문을 두드리고 있었고, 마침내 문을 열어 그를 보고 다들 놀랍니다(12:12-16).","s":98.388,"e":106.31,"p":false,"h":false},{"t":"그를 위해 간절히 기도하던 사람들이 정작 기도의 응답이 문 앞에 서 있자 믿지 못한 것입니다.","s":106.524,"e":112.608,"p":false,"h":false},{"t":"베드로는 조용히 하라고 손짓하고, 주께서 어떻게 감옥에서 이끌어 내셨는지 말한 뒤 다른 곳으로 떠납니다(12:17).","s":112.968,"e":122.004,"p":false,"h":false},{"t":"아침이 되자 군인들 사이에 큰 소동이 일어났고, 헤롯은 파수꾼들을 처형합니다(12:18-19).","s":122.22,"e":130.283,"p":true,"h":false},{"t":"얼마 후 헤롯이 가이사랴에서 왕복을 입고 연설하자 백성이 \"이것은 신의 소리요 사람의 소리가 아니다\" 하고 외칩니다.","s":130.968,"e":139.054,"p":false,"h":false},{"t":"그가 하나님께 영광을 돌리지 않았기 때문에 주의 사자가 곧바로 그를 쳤고, 그는 벌레에 먹혀 죽습니다(12:20-23).","s":139.392,"e":149.259,"p":false,"h":false},{"t":"그리고 이 장의 결론이 나옵니다.","s":149.472,"e":151.944,"p":false,"h":false},{"t":"\"하나님의 말씀이 흥왕하여 더하더라\"(12:24).","s":152.172,"e":156.372,"p":true,"h":false},{"t":"구절 풀이","s":157.032,"e":158.079,"p":true,"h":false},{"t":"12장 2절과 3절, 그리고 6절에서 11절은 나란히 읽어야 합니다.","s":158.94,"e":164.249,"p":false,"h":false},{"t":"야고보는 죽었고 베드로는 풀려났습니다.","s":164.448,"e":167.559,"p":false,"h":false},{"t":"본문은 왜 한 사람은 죽고 한 사람은 살았는지 설명하지 않습니다.","s":167.76,"e":172.314,"p":false,"h":false},{"t":"교회가 모두 기도했는데도 결과가 달랐다는 것은, 하나님의 일하심이 사람의 기도 기술이나 공식으로 풀리지 않는다는 것을 말해 줍니다.","s":172.512,"e":181.486,"p":false,"h":false},{"t":"이것을 설명해 보려고 하기보다, 야고보를 데려가신 분도 베드로를 건지신 분도 같은 주님이시라고 읽는 것이 본문에 맞습니다.","s":181.836,"e":190.208,"p":true,"h":false},{"t":"12장 12절에서 16절의 로데 이야기는 읽는 사람을 웃게 합니다.","s":191.016,"e":195.76,"p":false,"h":false},{"t":"기도하던 사람들이 응답을 믿지 못했다는 부분은 교회의 믿음이 대단해서 일이 일어난 것이 아님을 보여 줍니다.","s":195.984,"e":202.981,"p":false,"h":false},{"t":"건지신 분은 천사를 보내신 주님이시고, 기도하는 사람의 믿음의 크기가 일을 일으킨 것이 아닙니다.","s":203.328,"e":210.187,"p":false,"h":false},{"t":"그래도 그 교회는 기도하고 있었다는 점도 함께 기억할 만합니다.","s":210.384,"e":214.956,"p":true,"h":false},{"t":"12장 23절과 24절은 대조가 분명합니다.","s":215.604,"e":219.61,"p":false,"h":false},{"t":"사람이 신처럼 높임을 받다가 쓰러지고, 하나님의 말씀은 더 퍼져 나갑니다.","s":219.816,"e":225.14,"p":false,"h":false},{"t":"6장 7절과 같은 문장이 박해 가운데서 다시 나옵니다.","s":225.324,"e":229.578,"p":true,"h":false}]},{"title":"사도행전_13장","audio":"doc13_2610231348.mp3","dur":257.5,"segs":[{"t":"사도행전 13장","s":0,"e":1.79,"p":true,"h":false},{"t":"전체 흐름","s":2.448,"e":3.48,"p":true,"h":false},{"t":"안디옥 교회에는 바나바, 니게르라 하는 시므온, 구레네 사람 루기오, 마나엔, 사울 같은 선지자와 교사들이 있었습니다.","s":4.356,"e":13.51,"p":false,"h":false},{"t":"그들이 주를 섬겨 금식하고 있을 때 성령이 말씀하십니다.","s":13.716,"e":17.775,"p":false,"h":false},{"t":"\"내가 불러 시키려는 일을 위하여 바나바와 사울을 따로 세우라\"(13:1-2).","s":18,"e":24.185,"p":false,"h":false},{"t":"교회는 금식하고 기도하고 안수한 뒤 그들을 보냅니다.","s":24.408,"e":28.204,"p":false,"h":false},{"t":"본문은 그들이 \"성령의 보내심을 받아\" 떠났다고 말합니다(13:3-4).","s":28.404,"e":34.692,"p":false,"h":false},{"t":"첫 선교 여행은 교회가 세운 계획이기 전에 성령이 하신 일입니다.","s":34.92,"e":39.449,"p":true,"h":false},{"t":"두 사람은 구브로에 가서 말씀을 전하고, 바보에서 총독 서기오 바울을 만납니다.","s":40.104,"e":45.978,"p":false,"h":false},{"t":"그 곁에 있던 마술사 엘루마가 총독이 믿지 않게 하려고 방해하자, 이때 \"바울이라고도 하는 사울\"이 성령 충만하여 그를 꾸짖습니다.","s":46.188,"e":55.407,"p":false,"h":false},{"t":"엘루마는 잠시 앞을 못 보게 됩니다.","s":55.764,"e":58.335,"p":false,"h":false},{"t":"총독은 그 일을 보고 주의 가르침에 놀라 믿었습니다(13:6-12).","s":58.536,"e":64.687,"p":false,"h":false},{"t":"그 뒤에 구브로를 떠나 버가에 이르렀을 때, 요한이 그들을 떠나 예루살렘으로 돌아갑니다(13:13).","s":64.908,"e":72.715,"p":true,"h":false},{"t":"비시디아 안디옥의 회당에서 바울이 설교합니다.","s":73.368,"e":76.815,"p":false,"h":false},{"t":"이스라엘의 역사를 말하고 다윗의 자손에서 구주 예수가 나셨다고 합니다.","s":77.004,"e":81.942,"p":false,"h":false},{"t":"그분을 사람들이 죽였으나 하나님이 살리셨고, 이것이 하나님이 조상들에게 하신 약속의 성취이며, 모세의 율법으로는 의롭다 함을 받을 수 없던 모든 것에서 믿는 사람마다 의롭다 함을 얻는다고 선포합니다(13:16-39).","s":82.152,"e":98.815,"p":false,"h":false},{"t":"시편을 인용하는 중에 이사야서도 나옵니다.","s":99.036,"e":102.095,"p":false,"h":false},{"t":"\"내가 다윗의 거룩하고 확실한 은혜를 너희에게 주리라\"(13:34).","s":102.312,"e":107.784,"p":false,"h":false},{"t":"이는 이사야 55장 3절의 말씀입니다.","s":108,"e":111.273,"p":true,"h":false},{"t":"다음 안식일에 온 성의 사람이 거의 다 모이자 유대인들이 시기하여 바울의 말을 반박합니다.","s":111.924,"e":118.096,"p":false,"h":false},{"t":"바울과 바나바는 담대히 말합니다.","s":118.44,"e":121.087,"p":false,"h":false},{"t":"하나님의 말씀을 먼저 여러분에게 전해야 했지만 여러분이 물리치니 우리는 이방인에게로 돌아섭니다.","s":121.284,"e":127.543,"p":false,"h":false},{"t":"\"주께서 이같이 우리에게 명하시기를 '내가 너를 이방의 빛으로 세웠으니 너로 땅끝까지 구원하게 하리라' 하셨느니라\"(13:44-47).","s":127.764,"e":138.627,"p":false,"h":false},{"t":"이것은 이사야 49장 6절의 말씀입니다.","s":138.852,"e":142.249,"p":false,"h":false},{"t":"이방인들은 이 말을 듣고 기뻐하며 하나님의 말씀을 영화롭게 했고, \"영생을 주시기로 작정된 사람은 다 믿었다\"고 기록됩니다(13:48).","s":142.452,"e":153.509,"p":false,"h":false},{"t":"주의 말씀이 그 지방에 두루 퍼졌습니다(13:49).","s":153.72,"e":158.526,"p":true,"h":false},{"t":"그러나 유대인들이 경건한 귀부인들과 시내의 유력자들을 선동하여 두 사람을 쫓아냅니다.","s":159.192,"e":165.39,"p":false,"h":false},{"t":"그들은 발의 먼지를 떨어 버리고 이고니온으로 갑니다.","s":165.744,"e":169.298,"p":false,"h":false},{"t":"그런데 제자들은 \"기쁨과 성령이 충만하였다\"고 합니다(13:50-52).","s":169.524,"e":176.858,"p":true,"h":false},{"t":"구절 풀이","s":177.552,"e":178.599,"p":true,"h":false},{"t":"13장 2절에서 4절이 선교 이야기의 방향을 정해 줍니다.","s":179.46,"e":183.652,"p":false,"h":false},{"t":"말씀하신 분도, 부르신 분도, 보내신 분도 성령이시고, 교회는 따로 세우고 안수하여 보내는 순종의 역할을 합니다.","s":183.852,"e":192.286,"p":false,"h":false},{"t":"선교를 사람의 계획과 열정으로 설명하려는 읽기를 막아 줍니다.","s":192.492,"e":196.859,"p":true,"h":false},{"t":"13장 34절과 47절은 이사야와 만나는 자리입니다.","s":197.532,"e":202.099,"p":false,"h":false},{"t":"바울은 이방인 선교를 자기 생각이 아니라 이사야 49장 6절의 \"이방의 빛\" 말씀에 기대어 설명합니다.","s":202.32,"e":209.843,"p":false,"h":false},{"t":"특히 47절에서는 주께서 \"우리에게 명하셨다\"고 하여, 이 말씀을 자기들에게 주신 사명으로 받아들입니다.","s":210.204,"e":218.396,"p":false,"h":false},{"t":"이사야 49장을 이미 읽으신 분께는 반가운 연결입니다.","s":218.772,"e":223.044,"p":true,"h":false},{"t":"13장 48절의 \"작정된 자\"는 해석이 갈리는 표현입니다.","s":223.704,"e":228.634,"p":false,"h":false},{"t":"개혁신학은 하나님의 택하심으로 읽어 왔고, 믿음이 사람의 공로가 아니라 하나님이 여신 문이라는 흐름과 맞습니다.","s":228.852,"e":236.657,"p":false,"h":false},{"t":"다른 입장에서는 달리 해석하기도 합니다.","s":237.024,"e":240.021,"p":false,"h":false},{"t":"본문은 이 구절 하나로 논쟁을 끝내려 하기보다, 이방인이 기뻐하며 말씀을 받았다는 이야기의 맥락 안에 있습니다.","s":240.228,"e":247.916,"p":true,"h":false},{"t":"13장 13절의 요한이 돌아간 일은 본문이 이유를 말하지 않습니다.","s":248.724,"e":253.608,"p":false,"h":false},{"t":"이 일이 15장의 갈라섬으로 이어집니다.","s":253.8,"e":256.861,"p":true,"h":false}]},{"title":"사도행전_14장","audio":"doc14_2610231348.mp3","dur":219.5,"segs":[{"t":"사도행전 14장","s":0,"e":1.724,"p":true,"h":false},{"t":"전체 흐름","s":2.376,"e":3.408,"p":true,"h":false},{"t":"이고니온에서 바울과 바나바는 회당에서 말씀을 전해 유대인과 헬라인의 큰 무리가 믿게 됩니다.","s":4.284,"e":10.511,"p":false,"h":false},{"t":"믿지 않는 유대인들이 이방인들을 선동하여 형제들을 악하게 대하게 하지만, 두 사람은 오래 머물며 주를 힘입어 담대히 말했고, 주는 그들의 손으로 표적과 기사를 행하게 하셔서 은혜의 말씀을 증언하셨습니다.","s":10.872,"e":24.369,"p":false,"h":false},{"t":"성은 둘로 나뉘었고, 돌로 치려는 음모가 일어나자 두 사람은 루가오니아의 루스드라와 더베로 피합니다(14:1-7).","s":24.696,"e":33.806,"p":true,"h":false},{"t":"루스드라에서 바울이 설교하는데, 나면서부터 걷지 못하던 사람이 듣고 있었습니다.","s":34.452,"e":40.127,"p":false,"h":false},{"t":"바울이 그에게 구원받을 믿음이 있는 것을 보고 큰 소리로 \"네 발로 똑바로 일어서라\" 하자 그가 뛰어 걷습니다(14:8-10).","s":40.464,"e":50.02,"p":false,"h":false},{"t":"무리는 루가오니아 말로 \"신들이 사람의 모습으로 우리에게 내려오셨다\" 하며 바나바를 제우스라 하고 바울을 헤르메스라 불렀습니다.","s":50.256,"e":59.177,"p":false,"h":false},{"t":"제우스 신전의 제사장이 소와 화환을 가지고 와서 제사를 드리려 합니다(14:11-13).","s":59.544,"e":66.779,"p":false,"h":false},{"t":"두 사도는 옷을 찢고 무리 가운데로 뛰어들어 외칩니다.","s":66.996,"e":70.907,"p":false,"h":false},{"t":"\"여러분, 어찌하여 이런 일을 합니까.","s":71.136,"e":74.103,"p":false,"h":false},{"t":"우리도 여러분과 같은 사람입니다.","s":74.304,"e":76.801,"p":false,"h":false},{"t":"우리가 복음을 전하는 것은 여러분이 이 헛된 일을 버리고 하늘과 땅과 바다와 그 가운데 있는 모든 것을 지으신 살아 계신 하나님께로 돌아오게 하려는 것입니다\"(14:14-15).","s":77.004,"e":89.299,"p":false,"h":false},{"t":"그들은 이 말로도 사람들이 제사하려는 것을 간신히 말렸습니다(14:18).","s":89.532,"e":95.634,"p":true,"h":false},{"t":"그런데 얼마 뒤 안디옥과 이고니온에서 유대인들이 와서 무리를 설득하자 바울은 돌에 맞고 죽은 줄 알고 성 밖으로 끌려갑니다.","s":96.3,"e":104.922,"p":false,"h":false},{"t":"제자들이 둘러서자 바울은 일어나 성으로 들어갔고 다음 날 더베로 갑니다(14:19-20).","s":105.264,"e":112.696,"p":false,"h":false},{"t":"그들은 더베에서 복음을 전해 많은 제자를 얻은 뒤, 다시 루스드라와 이고니온과 안디옥으로 돌아가 제자들의 마음을 굳게 하고 믿음에 머물라고 권했습니다.","s":112.932,"e":123.345,"p":false,"h":false},{"t":"\"우리가 많은 환난을 겪고 하나님 나라에 들어가야 한다\"고 말했고, 교회마다 장로를 세워 금식하며 기도하고 그들을 주께 맡겼습니다(14:21-23).","s":123.66,"e":135.295,"p":false,"h":false},{"t":"안디옥으로 돌아온 두 사람은 교회를 모아 하나님이 자기들과 함께하여 행하신 모든 일과, 이방인에게 믿음의 문을 여신 것을 보고합니다(14:26-27).","s":135.504,"e":147.259,"p":true,"h":false},{"t":"구절 풀이","s":147.924,"e":148.971,"p":true,"h":false},{"t":"14장 11절에서 15절은 이 책에서 가장 재미있는 장면 중 하나입니다.","s":149.832,"e":155.157,"p":false,"h":false},{"t":"기적을 보고 사람들이 사도들을 신으로 떠받들려 하자, 사도들이 옷을 찢으며 말립니다.","s":155.52,"e":161.343,"p":false,"h":false},{"t":"3장 12절의 베드로처럼, 사도는 자신을 높이려는 사람들 앞에서 자기를 낮춥니다.","s":161.568,"e":167.577,"p":false,"h":false},{"t":"사도들의 우월성이 아니라 살아 계신 하나님이 중심이라는 것이 이 본문의 방향입니다.","s":167.94,"e":173.788,"p":true,"h":false},{"t":"14장 15절에서 17절은 복음을 처음 듣는 이방인을 향한 설교입니다.","s":174.6,"e":179.67,"p":false,"h":false},{"t":"구약을 모르는 사람들 앞에서 바울은 창조에서 시작합니다.","s":180.036,"e":184.12,"p":false,"h":false},{"t":"하나님이 비와 결실의 계절을 주셔서 스스로를 증거하지 않으신 적이 없다는 말입니다.","s":184.32,"e":190.108,"p":true,"h":false},{"t":"14장 22절의 \"많은 환난을 지나 하나님 나라에 들어간다\"는 말은 신앙생활이 잘되면 형통하다는 식의 이해를 바로잡아 줍니다.","s":190.908,"e":199.717,"p":false,"h":false},{"t":"돌에 맞고 일어난 바울이 한 말이어서 더욱 무게가 있습니다.","s":200.088,"e":204.011,"p":true,"h":false},{"t":"14장 23절의 장로를 세운 일은 교회 직분의 시작을 이야기할 때 인용되곤 합니다.","s":204.66,"e":210.594,"p":false,"h":false},{"t":"본문은 교회마다 장로를 세웠다고만 하고, 방식은 상세히 말하지 않으므로 지나치게 제도를 끌어내지는 않겠습니다.","s":210.816,"e":218.645,"p":true,"h":false}]},{"title":"사도행전_15장","audio":"doc15_2610231348.mp3","dur":307,"segs":[{"t":"사도행전 15장","s":0,"e":1.711,"p":true,"h":false},{"t":"전체 흐름","s":2.34,"e":3.372,"p":true,"h":false},{"t":"유대에서 내려온 어떤 사람들이 안디옥의 형제들에게 가르칩니다.","s":4.248,"e":8.596,"p":false,"h":false},{"t":"\"너희가 모세의 법대로 할례를 받지 아니하면 구원을 받을 수 없다\"(15:1).","s":8.82,"e":14.775,"p":false,"h":false},{"t":"바울과 바나바가 그들과 적지 않은 다툼과 변론을 하자, 교회는 이 문제를 의논하러 바울과 바나바 등을 예루살렘의 사도와 장로들에게 보내기로 합니다(15:2).","s":15.012,"e":26.48,"p":false,"h":false},{"t":"가는 길에 이방인이 돌아온 일을 말하자 모든 형제가 크게 기뻐했습니다(15:3).","s":26.676,"e":32.878,"p":true,"h":false},{"t":"예루살렘에서 바울 일행이 하나님이 함께하여 행하신 일을 이야기하자 바리새파 중에서 믿게 된 사람들이 일어납니다.","s":33.552,"e":41.22,"p":false,"h":false},{"t":"\"이방인에게 할례를 행하고 모세의 율법을 지키게 해야 합니다\"(15:4-5).","s":41.58,"e":47.698,"p":false,"h":false},{"t":"사도와 장로들이 이 문제를 의논하려고 모였고, 많은 변론이 있은 뒤 베드로가 일어나 말합니다.","s":47.916,"e":54.697,"p":false,"h":false},{"t":"하나님이 오래전에 내 입으로 이방인이 복음의 말씀을 듣고 믿게 하셨고, 마음을 아시는 하나님이 우리에게처럼 그들에게도 성령을 주셔서 증언하셨으며, 그들의 마음을 믿음으로 깨끗하게 하셔서 우리와 그들 사이에 차별을 두지 않으셨다는 것입니다.","s":54.9,"e":71.048,"p":false,"h":false},{"t":"그런데 어찌하여 우리 조상도 우리도 메지 못하던 멍에를 제자들의 목에 두어 하나님을 시험하느냐고 묻습니다.","s":71.388,"e":78.48,"p":false,"h":false},{"t":"그리고 결론을 내립니다.","s":78.804,"e":80.735,"p":false,"h":false},{"t":"\"우리가 주 예수의 은혜로 구원받는 줄을 믿는 것같이 그들도 그렇게 믿습니다\"(15:7-11).","s":80.964,"e":88.411,"p":true,"h":false},{"t":"모인 무리가 잠잠해지고, 바나바와 바울이 하나님이 이방인 가운데서 행하신 표적과 기사를 이야기합니다(15:12).","s":89.064,"e":97.796,"p":false,"h":false},{"t":"그다음 야고보가 말합니다.","s":98.028,"e":100.027,"p":false,"h":false},{"t":"시므온이 이방인 가운데서 하나님이 자기 이름을 위한 백성을 취하시려고 처음 돌보신 일을 말했는데, \"선지자들의 말씀이 이와 일치한다\"고 하며 아모스 9장의 말씀을 인용합니다.","s":100.26,"e":112.135,"p":false,"h":false},{"t":"하나님이 무너진 다윗의 장막을 다시 세우시고, 그 남은 사람들과 내 이름으로 불리는 모든 이방인이 주를 찾게 하리라는 말씀입니다(15:13-18).","s":112.464,"e":123.883,"p":false,"h":false},{"t":"그래서 이방인 가운데서 하나님께 돌아오는 사람들을 괴롭게 하지 말고, 다만 우상의 더러운 것과 음행과 목매어 죽인 것과 피를 멀리하도록 편지하자고 결론을 냅니다(15:19-21).","s":124.092,"e":137.592,"p":true,"h":false},{"t":"이렇게 결정하여 유다와 실라를 바울과 바나바에게 딸려 보내는데, 편지에는 이런 말이 있습니다.","s":138.24,"e":144.839,"p":false,"h":false},{"t":"\"성령과 우리는 이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 않는 것이 옳다고 하였노니\"(15:22-29).","s":145.044,"e":153.983,"p":false,"h":false},{"t":"안디옥 교회는 편지를 읽고 그 위로하는 말에 기뻐했습니다(15:30-31).","s":154.224,"e":160.771,"p":true,"h":false},{"t":"그 후 바울이 바나바에게 \"지난번 전도한 모든 성으로 다시 가서 형제들을 돌아보자\"고 하는데, 바나바는 마가라는 요한을 데려가자고 하고 바울은 그가 함께 가지 않았다고 반대합니다.","s":161.46,"e":173.533,"p":false,"h":false},{"t":"심하게 다투어 둘이 갈라서서, 바나바는 마가를 데리고 구브로로 가고 바울은 실라를 택하여 형제들의 부탁을 받고 떠납니다.","s":173.88,"e":182.191,"p":false,"h":false},{"t":"바울은 수리아와 길리기아를 다니며 교회들을 굳게 합니다(15:36-41).","s":182.52,"e":189.108,"p":true,"h":false},{"t":"구절 풀이","s":189.756,"e":190.803,"p":true,"h":false},{"t":"15장은 \"하나님은 이 문제를 어떻게 타결하시는가\"의 대표 본문입니다.","s":191.664,"e":197.298,"p":false,"h":false},{"t":"회의의 흐름을 보면, 사람의 의견을 절충해서 결론을 낸 것이 아닙니다.","s":197.532,"e":202.597,"p":false,"h":false},{"t":"첫째로 하나님이 이미 하신 일을 증언합니다.","s":202.824,"e":205.891,"p":false,"h":false},{"t":"베드로와 바울, 바나바가 그렇습니다.","s":206.1,"e":209.124,"p":false,"h":false},{"t":"둘째로 성경 말씀이 그것과 일치함을 확인합니다.","s":209.34,"e":213.02,"p":false,"h":false},{"t":"야고보의 아모스 인용이 그렇습니다.","s":213.228,"e":215.876,"p":false,"h":false},{"t":"그러고 나서 결론에 이릅니다.","s":216.108,"e":218.304,"p":false,"h":false},{"t":"결정을 내린 교회는 그것을 \"성령과 우리\"의 결정이라고 말합니다.","s":218.52,"e":223.629,"p":false,"h":false},{"t":"하나님이 먼저 일하시고 교회가 그것에 순종하는 순서입니다.","s":223.848,"e":227.952,"p":true,"h":false},{"t":"15장 8절에서 11절에서 베드로는 구원이 이방인에게나 유대인에게나 똑같이 \"주 예수의 은혜\"로 온다고 말합니다.","s":228.6,"e":236.947,"p":false,"h":false},{"t":"율법을 지켜야 구원받는다는 주장에 대한 사도의 대답이 은혜입니다.","s":237.276,"e":241.96,"p":false,"h":false},{"t":"갈라디아서에서 바울이 길게 다룬 주제의 핵심이 이 짧은 한 문장 안에 있습니다.","s":242.172,"e":247.544,"p":true,"h":false},{"t":"15장 20절과 29절의 네 가지 금지 조항은 해석이 갈립니다.","s":248.328,"e":253.291,"p":false,"h":false},{"t":"유대인과 이방인 신자가 함께 식탁에서 교제하도록 한 배려로 보는 입장이 널리 알려져 있고, 이것을 어느 정도 오래 적용되는 규정으로 볼지는 견해가 다릅니다.","s":253.476,"e":264.173,"p":false,"h":false},{"t":"본문의 중심은 이 조항들이 아니라, 이방인에게 구원의 조건을 더하지 않는다는 결정에 있습니다.","s":264.528,"e":271.162,"p":true,"h":false},{"t":"15장 36절에서 41절의 바울과 바나바의 갈라섬은 읽는 사람을 불편하게 합니다.","s":271.98,"e":278.302,"p":false,"h":false},{"t":"본문은 누가 옳았는지 판정하지 않고, \"심히 다투어\" 갈라섰다고 사실대로 적습니다.","s":278.64,"e":284.99,"p":false,"h":false},{"t":"여기서 사람 사이의 갈등을 푸는 방법을 이끌어 내기보다, 사도들도 연약한 사람이었다는 점과 그럼에도 하나님이 두 팀을 통해 일을 이어 가셨다는 점에 눈을 두는 것이 본문에 가깝습니다.","s":285.192,"e":297.361,"p":false,"h":false},{"t":"훗날 바울이 마가를 가리켜 \"나에게 유익하다\"고 말하는 구절이 디모데후서에 있어서, 이 일이 끝이 아니었음을 보여 줍니다.","s":297.72,"e":306.239,"p":true,"h":false}]},{"title":"사도행전_16장","audio":"doc16_2610231348.mp3","dur":346,"segs":[{"t":"사도행전 16장","s":0,"e":1.799,"p":true,"h":false},{"t":"전체 흐름","s":2.448,"e":3.48,"p":true,"h":false},{"t":"바울은 더베와 루스드라에서 디모데라는 제자를 만납니다.","s":4.356,"e":8.303,"p":false,"h":false},{"t":"어머니는 믿는 유대 여인이고 아버지는 헬라인인 젊은이였고, 형제들 사이에서 칭찬을 받고 있었습니다.","s":8.496,"e":15.645,"p":false,"h":false},{"t":"바울은 그를 데려가고 싶어서, 그 지방 유대인들 때문에 그에게 할례를 받게 합니다(16:1-3).","s":15.984,"e":24.142,"p":false,"h":false},{"t":"그들은 여러 성을 다니며 예루살렘 회의에서 정한 것을 전했고, 교회들은 믿음이 더 굳어지고 수가 날마다 늘었습니다(16:4-5).","s":24.336,"e":34.356,"p":true,"h":false},{"t":"그다음이 이 장의 핵심입니다.","s":35.028,"e":37.226,"p":false,"h":false},{"t":"바울 일행은 아시아로 가서 말씀을 전하려 했으나 \"성령이 막으셨다\"고 합니다.","s":37.44,"e":43.069,"p":false,"h":false},{"t":"비두니아로 가려고 했을 때는 \"예수의 영이 허락하지 않으셨다\"고 합니다(16:6-7).","s":43.272,"e":50.642,"p":false,"h":false},{"t":"두 번 막히고 갈 곳이 없어진 그들은 드로아에 이릅니다.","s":50.868,"e":54.716,"p":false,"h":false},{"t":"그 밤에 바울은 환상을 봅니다.","s":54.936,"e":57.271,"p":false,"h":false},{"t":"마게도냐 사람 하나가 서서 \"건너와서 우리를 도우소서\" 하고 간청합니다.","s":57.492,"e":62.726,"p":false,"h":false},{"t":"바울은 곧 마게도냐로 가기로 하는데, 하나님이 자기들을 불러 복음을 전하게 하신다고 확신했기 때문입니다(16:8-10).","s":62.928,"e":72.198,"p":true,"h":false},{"t":"빌립보에서 안식일에 기도처로 나간 바울은 두아디라 출신의 자주 장사 루디아를 만납니다.","s":72.864,"e":78.993,"p":false,"h":false},{"t":"하나님을 경외하는 이 여인이 바울의 말을 듣는데, 본문은 이렇게 적습니다.","s":79.344,"e":84.636,"p":false,"h":false},{"t":"\"주께서 그 마음을 열어 바울의 말을 따르게 하셨다\"(16:11-14).","s":84.852,"e":90.712,"p":false,"h":false},{"t":"루디아와 그 집이 세례를 받고, 그는 자기 집에 와 머물기를 청합니다(16:15).","s":90.936,"e":97.747,"p":true,"h":false},{"t":"그런데 점치는 귀신 들린 여종이 따라다니며 소리칩니다.","s":98.424,"e":102.448,"p":false,"h":false},{"t":"바울이 여러 날 참다가 그 귀신을 예수의 이름으로 쫓아내자, 이 종으로 돈을 벌던 주인들이 바울과 실라를 붙잡아 관리들 앞에 끌고 갑니다.","s":102.636,"e":112.158,"p":false,"h":false},{"t":"두 사람은 매를 많이 맞고 깊은 옥에 갇혀 발에 차꼬가 채워집니다(16:16-24).","s":112.5,"e":119.497,"p":false,"h":false},{"t":"그런데 한밤중에 바울과 실라가 기도하며 하나님을 찬송하고 죄수들이 듣고 있었습니다.","s":119.736,"e":125.59,"p":false,"h":false},{"t":"갑자기 큰 지진이 나서 옥문이 열리고 모든 사람의 착고가 풀렸습니다(16:25-26).","s":125.964,"e":133.484,"p":true,"h":false},{"t":"잠에서 깬 간수는 죄수들이 달아난 줄 알고 칼을 빼어 자결하려 합니다.","s":134.172,"e":138.983,"p":false,"h":false},{"t":"바울이 크게 소리칩니다.","s":139.176,"e":141.063,"p":false,"h":false},{"t":"\"네 몸을 상하지 말라.","s":141.3,"e":143.067,"p":false,"h":false},{"t":"우리가 다 여기 있다.\"","s":143.28,"e":144.962,"p":false,"h":false},{"t":"간수는 등불을 달라 하여 뛰어 들어와 바울과 실라 앞에 엎드려 말합니다.","s":145.26,"e":150.171,"p":false,"h":false},{"t":"\"선생님들, 내가 어떻게 해야 구원을 받겠습니까.\"","s":150.372,"e":154.401,"p":false,"h":false},{"t":"그들이 대답합니다.","s":154.584,"e":156.17,"p":false,"h":false},{"t":"\"주 예수를 믿으십시오.","s":156.492,"e":158.328,"p":false,"h":false},{"t":"그러면 당신과 당신의 집이 구원을 받을 것입니다\"(16:27-31).","s":158.544,"e":164.939,"p":false,"h":false},{"t":"그 밤에 간수는 두 사람의 상처를 씻어 주고, 자기와 온 가족이 세례를 받은 뒤 그들을 집으로 데려가 음식을 차립니다.","s":165.168,"e":173.362,"p":false,"h":false},{"t":"그는 온 가족과 함께 하나님을 믿고 크게 기뻐했습니다(16:32-34).","s":173.7,"e":180.323,"p":true,"h":false},{"t":"날이 밝자 관리들이 두 사람을 놓아주라고 보냈습니다.","s":181.008,"e":184.705,"p":false,"h":false},{"t":"그러자 바울이 말합니다.","s":184.932,"e":186.805,"p":false,"h":false},{"t":"우리는 로마 시민인데 재판도 없이 때리고 가두었으니 그들이 직접 와서 우리를 데리고 나가라고 합니다.","s":187.02,"e":193.819,"p":false,"h":false},{"t":"이 말을 들은 관리들이 두려워하며 와서 사과하고 그들을 데리고 나가 성을 떠나기를 청합니다(16:35-39).","s":194.184,"e":202.907,"p":false,"h":false},{"t":"두 사람은 루디아의 집에 들러 형제들을 위로하고 떠납니다(16:40).","s":203.148,"e":208.779,"p":true,"h":false},{"t":"구절 풀이","s":209.448,"e":210.495,"p":true,"h":false},{"t":"16장 6절에서 10절은 사도행전이 성령행전이라는 별명을 얻은 이유를 가장 잘 보여 줍니다.","s":211.356,"e":217.915,"p":false,"h":false},{"t":"바울은 선교 전략가로 움직이지 않습니다.","s":218.268,"e":221.274,"p":false,"h":false},{"t":"가려던 길은 막히고, 성령은 \"예수의 영\"으로도 불립니다.","s":221.472,"e":226.369,"p":false,"h":false},{"t":"승천하신 예수님이 성령으로 지금 길을 정하고 계신다는 뜻입니다.","s":226.584,"e":231.164,"p":false,"h":false},{"t":"막힌 길과 환상이 이어진 끝에 \"하나님이 부르신다\"는 확신에 이르는 순서가 중요합니다.","s":231.372,"e":237.651,"p":false,"h":false},{"t":"선교는 사람의 열심이 아니라 성령의 인도로 시작됩니다.","s":237.996,"e":242.082,"p":true,"h":false},{"t":"16장 14절의 \"주께서 마음을 여셨다\"는 구원의 문을 여는 분이 누구인지를 한 문장으로 말합니다.","s":242.748,"e":250.133,"p":false,"h":false},{"t":"루디아가 믿음을 결심한 것이 아니라 주께서 마음을 여셨고, 그래서 그가 따르게 되었다는 흐름입니다.","s":250.488,"e":257.234,"p":false,"h":false},{"t":"말씀을 전하는 사람은 바울이지만, 마음을 여는 분은 주님이십니다.","s":257.58,"e":262.389,"p":true,"h":false},{"t":"16장 25절과 26절의 찬송은 매 맞고 갇힌 사람들이 한 것입니다.","s":263.052,"e":268.656,"p":false,"h":false},{"t":"고난 가운데서도 찬송하는 모습이 놀랍지만, 이 이야기의 중심은 그 찬송이 감동을 주었다는 데 있지 않고, 옥문을 여시는 분이 누구인가에 있습니다.","s":269.028,"e":279.412,"p":false,"h":false},{"t":"죄수들이 모두 그 자리에 있었다는 점도 눈에 띕니다.","s":279.756,"e":283.36,"p":true,"h":false},{"t":"16장 31절의 \"당신과 당신의 집이 구원받는다\"는 해석이 갈리는 본문입니다.","s":284.004,"e":290.487,"p":false,"h":false},{"t":"가족 전체가 자동으로 구원받는다는 뜻으로 읽는 입장도 있고, 32절에서 말씀이 온 집안에 전해졌고 34절에서 \"온 집이 하나님을 믿었다\"고 하므로 각 사람이 믿었다고 읽는 입장도 있습니다.","s":290.844,"e":304.598,"p":false,"h":false},{"t":"가정 세례를 어떻게 이해할지에 따라 의견이 나뉘므로 한쪽으로 단정하지 않습니다.","s":304.92,"e":310.426,"p":false,"h":false},{"t":"분명한 것은 이 구원의 길이 \"주 예수를 믿는 것\"이라는 점입니다.","s":310.644,"e":315.632,"p":true,"h":false},{"t":"16장 37절에서 바울이 로마 시민권을 밝힌 일을, 새로 생긴 교회를 보호하기 위한 행동으로 읽는 견해가 많습니다.","s":316.296,"e":324.705,"p":false,"h":false},{"t":"본문은 이유를 직접 설명하지 않으니 단정하지 않겠습니다.","s":325.044,"e":328.88,"p":false,"h":false},{"t":"그리고 16장 3절의 디모데 할례는 15장에서 \"구원의 조건으로 할례를 요구하지 않는다\"고 결정한 것과 모순되는 것처럼 보이지만, 구원의 조건이 아니라 유대인에게 전도하는 데 걸림이 되지 않게 하려는 것이었다고 읽는 것이 일반적입니다.","s":329.112,"e":345.196,"p":true,"h":false}]},{"title":"사도행전_17장","audio":"doc17_2610231348.mp3","dur":318.5,"segs":[{"t":"사도행전 17장","s":0,"e":1.849,"p":true,"h":false},{"t":"전체 흐름","s":2.484,"e":3.516,"p":true,"h":false},{"t":"바울 일행은 데살로니가에서 회당에 들어가 세 안식일 동안 성경을 가지고 논증합니다.","s":4.392,"e":10.196,"p":false,"h":false},{"t":"그리스도가 고난을 받고 죽은 자 가운데서 살아나셔야 했다는 것, 그리고 \"내가 너희에게 전하는 이 예수가 그리스도\"라는 것입니다.","s":10.548,"e":19.544,"p":false,"h":false},{"t":"유대인 몇 사람과 경건한 헬라인의 큰 무리와 귀부인들이 믿고 따랐습니다(17:1-4).","s":19.908,"e":27.016,"p":false,"h":false},{"t":"그러나 시기한 유대인들이 불량배를 모아 소동을 일으키고 야손의 집을 습격합니다.","s":27.252,"e":32.738,"p":false,"h":false},{"t":"그들은 이렇게 외칩니다.","s":32.94,"e":34.914,"p":false,"h":false},{"t":"\"천하를 어지럽게 하던 이 사람들이 여기도 이르렀다.","s":35.136,"e":38.599,"p":false,"h":false},{"t":"이들은 가이사의 명령을 어기고 다른 임금 예수가 있다 한다\"(17:5-7).","s":38.844,"e":45.425,"p":false,"h":false},{"t":"형제들은 밤에 바울과 실라를 베뢰아로 보냅니다(17:10).","s":45.648,"e":50.636,"p":true,"h":false},{"t":"베뢰아의 유대인들은 데살로니가 사람들보다 더 너그러워서 말씀을 간절한 마음으로 받고, 이것이 그러한가 하여 날마다 성경을 상고했습니다.","s":51.3,"e":60.933,"p":false,"h":false},{"t":"그래서 믿는 사람이 많았습니다(17:11-12).","s":61.272,"e":65.935,"p":false,"h":false},{"t":"그러나 데살로니가의 유대인들이 따라와 소동을 일으키자 형제들이 바울을 바닷가로 보냅니다(17:13-15).","s":66.132,"e":74.629,"p":true,"h":false},{"t":"바울은 아덴에서 두 사람을 기다리다 온 성에 우상이 가득한 것을 보고 격분합니다(17:16).","s":75.312,"e":82.259,"p":false,"h":false},{"t":"회당과 장터에서 날마다 사람들과 변론하자, 에피쿠로스와 스토아 철학자들이 그와 논쟁하며 \"이 말쟁이가 무슨 말을 하려는가\" 하고 비웃습니다.","s":82.476,"e":92.637,"p":false,"h":false},{"t":"그들은 그를 아레오바고 법정으로 데려가 새로운 가르침이 무엇인지 말해 달라고 청합니다(17:17-21).","s":92.988,"e":101.446,"p":true,"h":false},{"t":"바울이 일어나 말합니다.","s":102.132,"e":104.094,"p":false,"h":false},{"t":"\"아덴 사람들이여, 내가 보니 여러분이 모든 일에 종교심이 많습니다.","s":104.292,"e":109.115,"p":false,"h":false},{"t":"두루 다니며 보니 '알지 못하는 신에게'라고 새긴 제단도 있었습니다.","s":109.332,"e":113.962,"p":false,"h":false},{"t":"그러므로 여러분이 알지 못하고 위하는 그분을 내가 여러분에게 알게 하겠습니다\"(17:22-23).","s":114.156,"e":121.998,"p":false,"h":false},{"t":"그는 세상과 그 가운데 있는 만물을 지으신 하나님은 손으로 지은 신전에 계시지 않으며, 무엇이 부족해서 사람의 손길을 받으시는 분이 아니고, 만민에게 생명과 호흡과 만물을 주시는 분이라고 말합니다.","s":122.22,"e":135.821,"p":false,"h":false},{"t":"한 사람에게서 모든 민족을 만드시고, 그들이 하나님을 찾도록 때와 거처를 정하셨으며, 그분은 우리 각 사람에게서 멀리 계시지 않는다고 합니다.","s":136.152,"e":146.276,"p":false,"h":false},{"t":"\"우리가 그분 안에서 살며 기동하며 존재하기 때문입니다\"(17:24-28).","s":146.484,"e":152.979,"p":false,"h":false},{"t":"그러므로 하나님을 금이나 은이나 돌로 만든 것과 같다고 생각해서는 안 됩니다(17:29).","s":153.216,"e":160.186,"p":true,"h":false},{"t":"그리고 말씀이 결론으로 향합니다.","s":160.848,"e":163.309,"p":false,"h":false},{"t":"하나님이 모르던 시대에는 간과하셨으나 이제는 어디서나 모든 사람에게 회개하라고 명하십니다.","s":163.512,"e":169.653,"p":false,"h":false},{"t":"그분이 한 사람을 세워 천하를 의롭게 심판하시기로 날을 정하셨고, 그 사람을 죽은 자 가운데서 살리셔서 모든 사람에게 믿을 근거를 주셨기 때문입니다(17:30-31).","s":170.028,"e":182.966,"p":false,"h":false},{"t":"부활이라는 말이 나오자 어떤 사람은 조롱하고, 어떤 사람은 \"이 일에 대해 다시 듣겠습니다\" 하고 말했습니다.","s":183.168,"e":190.931,"p":false,"h":false},{"t":"그러나 몇 사람은 바울을 따라 믿었는데, 아레오바고 법정 사람 디오누시오와 다마리라는 여자와 다른 사람들이 있었습니다(17:32-34).","s":191.124,"e":202.047,"p":true,"h":false},{"t":"구절 풀이","s":202.716,"e":203.763,"p":true,"h":false},{"t":"17장 24절에서 29절은 이사야와 이어지는 본문입니다.","s":204.624,"e":209.304,"p":false,"h":false},{"t":"하나님이 손으로 지은 곳에 계시지 않는다는 말은 스데반이 7장에서 인용한 이사야 66장 1절과 2절과 같은 정신이고, 사람이 만든 신은 신이 아니라는 말은 이사야 40장과 44장의 우상 풍자와 이어진다고 읽는 것이 자연스럽습니다.","s":209.52,"e":225.732,"p":false,"h":false},{"t":"바울이 이사야를 직접 인용한 것은 아니지만, 이사야를 읽으신 분께는 반가운 대목입니다.","s":226.044,"e":232.457,"p":true,"h":false},{"t":"17장 22절에서 31절은 구약을 모르는 사람들에게 하는 설교라서, 바울이 성경을 인용하는 대신 창조에서 시작하고 그들의 시인의 말(28절)을 빌려 말합니다.","s":233.136,"e":245.674,"p":false,"h":false},{"t":"하지만 말하는 내용은 처음부터 끝까지 성경적입니다.","s":245.988,"e":249.86,"p":false,"h":false},{"t":"창조, 우상 금지, 회개, 심판, 부활로 이어지는 순서입니다.","s":250.092,"e":256.098,"p":false,"h":false},{"t":"이 설교를 복음을 포장하는 기술로 읽을 수도 있으나, 본문이 보여 주는 것은 기술이 아니라 구원의 소식을 전하는 사람이 어느 곳에서든 같은 복음을 전한다는 점입니다.","s":256.32,"e":267.256,"p":true,"h":false},{"t":"17장 32절에서 34절의 결과는 결코 대성공이 아닙니다.","s":268.056,"e":273.2,"p":false,"h":false},{"t":"대부분은 비웃거나 미루었고, 몇 사람만이 믿었습니다.","s":273.384,"e":277.656,"p":false,"h":false},{"t":"그런데 누가는 그 믿은 사람들의 이름까지 남깁니다.","s":277.848,"e":281.745,"p":false,"h":false},{"t":"많은 사람이 믿었다는 소식만 기록되는 것이 아니라 적은 수도 소중하게 기록됩니다.","s":281.952,"e":287.427,"p":false,"h":false},{"t":"이 설교가 실패였는지 성공이었는지는 해석이 갈리지만, 본문은 평가하지 않고 사실대로 적습니다.","s":287.784,"e":295.043,"p":true,"h":false},{"t":"17장 11절의 베뢰아 사람들은 말씀을 받아들이되 성경에 비추어 확인했습니다.","s":295.848,"e":301.421,"p":false,"h":false},{"t":"사도의 말도 성경으로 확인하는 사람들을 누가는 \"더 너그럽다\"고 칭찬합니다.","s":301.788,"e":307.522,"p":false,"h":false},{"t":"성경이 사도의 가르침보다 앞서는 기준이라는 뜻이 아니라, 사도가 가르친 것이 구약 성경과 일치한다는 점을 확인하려는 태도로 읽는 것이 좋습니다.","s":307.728,"e":317.712,"p":true,"h":false}]},{"title":"사도행전_18장","audio":"doc18_2610231348.mp3","dur":248.5,"segs":[{"t":"사도행전 18장","s":0,"e":1.774,"p":true,"h":false},{"t":"전체 흐름","s":2.412,"e":3.444,"p":true,"h":false},{"t":"바울은 아덴을 떠나 고린도로 갑니다.","s":4.32,"e":6.931,"p":false,"h":false},{"t":"거기서 본도 출신 유대인 아굴라와 그의 아내 브리스길라를 만납니다.","s":7.164,"e":12.187,"p":false,"h":false},{"t":"글라우디오 황제가 모든 유대인에게 로마를 떠나라는 명령을 내려 이탈리아에서 막 온 사람들이었습니다.","s":12.384,"e":19.176,"p":false,"h":false},{"t":"바울은 그들과 같은 천막 만드는 일을 하며 함께 지냈고, 안식일마다 회당에서 유대인과 헬라인을 설득했습니다(18:1-4).","s":19.512,"e":29.479,"p":false,"h":false},{"t":"실라와 디모데가 마게도냐에서 내려오자 바울은 말씀 전하는 일에 전념하며 예수가 그리스도임을 증언합니다.","s":29.7,"e":36.723,"p":false,"h":false},{"t":"유대인들이 반대하고 비방하자 바울은 옷을 털며 말합니다.","s":37.08,"e":41.316,"p":false,"h":false},{"t":"\"너희 피가 너희 머리로 돌아갈 것이다.","s":41.544,"e":44.253,"p":false,"h":false},{"t":"나는 깨끗하다.","s":44.46,"e":45.839,"p":false,"h":false},{"t":"이제부터 이방인에게로 가겠다\"(18:5-6).","s":46.368,"e":50.928,"p":false,"h":false},{"t":"그는 하나님을 경외하는 디도 유스도의 집으로 옮기는데, 그 집은 회당 바로 옆이었습니다.","s":51.156,"e":57.405,"p":false,"h":false},{"t":"회당장 그리스보와 그의 온 집이 주를 믿었고, 고린도 사람 중에도 많은 사람이 듣고 믿어 세례를 받았습니다(18:7-8).","s":57.6,"e":67.505,"p":true,"h":false},{"t":"이 장의 중심은 그다음 밤의 일입니다.","s":68.148,"e":70.959,"p":false,"h":false},{"t":"주께서 밤에 환상 가운데 바울에게 말씀하십니다.","s":71.172,"e":74.701,"p":false,"h":false},{"t":"\"두려워하지 말고 말하며 잠잠하지 말라.","s":74.916,"e":77.616,"p":false,"h":false},{"t":"내가 너와 함께하므로 아무도 너를 해치지 못할 것이다.","s":77.832,"e":81.681,"p":false,"h":false},{"t":"이 성 안에 내 백성이 많다\"(18:9-10).","s":81.9,"e":86.098,"p":false,"h":false},{"t":"바울은 일 년 반을 거기 머물며 하나님의 말씀을 가르쳤습니다(18:11).","s":86.292,"e":92.177,"p":false,"h":false},{"t":"그 사이 유대인들이 총독 갈리오 앞에 바울을 고소하지만 갈리오는 율법 문제이니 너희끼리 해결하라며 재판을 거부합니다(18:12-17).","s":92.376,"e":102.846,"p":true,"h":false},{"t":"바울은 더 머문 뒤 에베소를 거쳐 가이사랴와 예루살렘을 방문하고 안디옥으로 돌아갔다가, 다시 여러 지방을 다니며 제자들의 믿음을 굳게 합니다(18:18-23).","s":103.5,"e":115.963,"p":true,"h":false},{"t":"그때 아볼로라는 알렉산드리아 출신 유대인이 에베소에 옵니다.","s":116.64,"e":121.101,"p":false,"h":false},{"t":"그는 학식이 있고 성경에 능한 사람으로, 주의 도를 배워 열정으로 말하고 예수에 관한 것을 정확히 가르쳤으나 요한의 세례만 알고 있었습니다.","s":121.32,"e":130.643,"p":false,"h":false},{"t":"그가 회당에서 담대히 말하는 것을 들은 브리스길라와 아굴라가 그를 데려다가 하나님의 도를 더 정확하게 풀어 주었습니다(18:24-26).","s":130.968,"e":141.654,"p":false,"h":false},{"t":"그가 아가야로 건너가려 하자 형제들은 격려하고 제자들에게 영접하라고 편지했습니다.","s":141.876,"e":147.523,"p":false,"h":false},{"t":"그는 거기 가서 은혜로 믿게 된 사람들에게 큰 도움이 되었는데, 성경으로 예수가 그리스도이심을 증명하며 공중 앞에서 유대인들을 힘 있게 논박했습니다(18:27-28).","s":147.744,"e":160.736,"p":true,"h":false},{"t":"구절 풀이","s":161.424,"e":162.471,"p":true,"h":false},{"t":"18장 9절과 10절은 이 장의 마음입니다.","s":163.332,"e":166.643,"p":false,"h":false},{"t":"고린도에서 반대에 부딪힌 바울에게 주님이 직접 말씀하십니다.","s":166.86,"e":171.167,"p":false,"h":false},{"t":"\"내가 너와 함께한다\"는 약속과 함께 \"이 성 안에 내 백성이 많다\"는 말씀이 들어 있습니다.","s":171.36,"e":178.083,"p":false,"h":false},{"t":"아직 믿지 않는 고린도 사람들도 주님이 이미 \"내 백성\"이라 부르신다는 뜻으로 읽는 해석이 많고, 개혁신학은 이것을 하나님의 택하심으로 이해해 왔습니다.","s":178.272,"e":188.956,"p":false,"h":false},{"t":"그래서 바울이 두려움 없이 말할 수 있었습니다.","s":189.288,"e":192.4,"p":false,"h":false},{"t":"전도의 열매는 바울의 설득력이 아니라 주님의 백성이 이미 있다는 데 근거합니다.","s":192.6,"e":198.063,"p":true,"h":false},{"t":"18장 24절에서 26절의 아볼로 이야기는 재미있습니다.","s":198.72,"e":203.417,"p":false,"h":false},{"t":"성경에 능하고 열정이 있는 사람도 배울 것이 있었다는 이야기입니다.","s":203.616,"e":208.229,"p":false,"h":false},{"t":"그런데 그를 바로잡은 사람은 이름난 사도가 아니라 천막 만드는 평신도 부부입니다.","s":208.44,"e":214.038,"p":false,"h":false},{"t":"아볼로는 부끄러워하지 않고 가르침을 받았고, 이후 더 쓰임받게 됩니다.","s":214.236,"e":219.522,"p":false,"h":false},{"t":"이 일을 사람 사이의 관계를 푸는 방법으로 읽기보다, 하나님이 사람들을 서로 통해 그분의 일을 이어 가신다는 이야기로 읽는 것이 본문에 가깝습니다.","s":219.708,"e":229.633,"p":true,"h":false},{"t":"18장 27절의 \"은혜로 믿게 된 사람들\"이라는 짧은 표현은 믿음이 사람의 공로가 아니라 은혜로 말미암는다는 것을 조용히 보여 줍니다.","s":230.436,"e":239.855,"p":true,"h":false},{"t":"18장 18절에서 서원을 한 사람이 바울인지 아굴라인지는 본문이 분명하게 말하지 않아 해석이 갈립니다.","s":240.66,"e":247.736,"p":true,"h":false}]},{"title":"사도행전_19장","audio":"doc19_2610231348.mp3","dur":343.3,"segs":[{"t":"사도행전 19장","s":0,"e":1.661,"p":true,"h":false},{"t":"전체 흐름","s":2.304,"e":3.336,"p":true,"h":false},{"t":"아볼로가 고린도에 있는 동안 바울은 에베소에 이릅니다.","s":4.212,"e":8.223,"p":false,"h":false},{"t":"거기서 제자 몇 사람을 만나 묻습니다.","s":8.424,"e":11.11,"p":false,"h":false},{"t":"\"믿을 때에 성령을 받았습니까.\"","s":11.34,"e":13.544,"p":false,"h":false},{"t":"그들은 \"성령이 계신지도 듣지 못했습니다\" 하고 대답합니다.","s":13.752,"e":18.423,"p":false,"h":false},{"t":"\"그러면 무슨 세례를 받았습니까.\"","s":18.612,"e":20.931,"p":false,"h":false},{"t":"\"요한의 세례입니다.\"","s":21.132,"e":22.726,"p":false,"h":false},{"t":"바울은 요한이 회개의 세례를 베풀면서 자기 뒤에 오시는 이, 곧 예수를 믿으라고 했다고 설명합니다(19:1-4).","s":23.04,"e":32.161,"p":false,"h":false},{"t":"그들은 주 예수의 이름으로 세례를 받았고, 바울이 안수하자 성령이 그들에게 임하여 방언도 하고 예언도 합니다.","s":32.364,"e":39.961,"p":false,"h":false},{"t":"모두 열두 사람쯤이었습니다(19:5-7).","s":40.14,"e":44.525,"p":true,"h":false},{"t":"바울은 회당에서 석 달 동안 담대히 말했습니다.","s":45.18,"e":48.615,"p":false,"h":false},{"t":"그러나 몇 사람이 마음이 굳어 이 도를 비방하자 제자들을 따로 세워 두란노 서원에서 날마다 강론합니다.","s":48.816,"e":55.688,"p":false,"h":false},{"t":"이것이 두 해 동안 계속되어 아시아에 사는 유대인과 헬라인이 모두 주의 말씀을 들었습니다(19:8-10).","s":56.052,"e":64.149,"p":false,"h":false},{"t":"하나님은 바울의 손으로 놀라운 능력을 행하셔서 그의 몸에서 손수건이나 앞치마를 가져다 병자에게 얹으면 병이 떠나고 악귀가 나갔습니다(19:11-12).","s":64.368,"e":75.645,"p":true,"h":false},{"t":"그런데 순회하며 귀신을 쫓는 유대인들이 바울이 전하는 예수의 이름을 흉내 내어 악귀 들린 사람에게 \"바울이 전하는 예수의 이름으로 너희에게 명한다\" 하고 말합니다.","s":76.32,"e":87.146,"p":false,"h":false},{"t":"스게와라는 유대 제사장의 일곱 아들이 그랬는데, 악귀가 대답합니다.","s":87.48,"e":92.689,"p":false,"h":false},{"t":"\"예수도 알고 바울도 안다.","s":92.88,"e":94.931,"p":false,"h":false},{"t":"그러나 너희는 누구냐.\"","s":95.148,"e":97.004,"p":false,"h":false},{"t":"악귀 들린 사람이 그들에게 뛰어올라 눌러 이겼고, 그들은 벗은 몸으로 상처를 입고 그 집에서 도망했습니다(19:13-16).","s":97.236,"e":107.052,"p":false,"h":false},{"t":"이 일이 알려지자 에베소 사람들이 두려워하며 주 예수의 이름을 크게 높였습니다.","s":107.28,"e":112.789,"p":false,"h":false},{"t":"믿은 사람 중 많은 이가 와서 자기 행위를 자백하고 밝혔으며, 마술을 하던 많은 사람이 책을 모아 불살랐는데 그 값이 은 오만 개나 되었습니다(19:17-19).","s":113.148,"e":125.298,"p":false,"h":false},{"t":"그리고 이 단락의 결론이 나옵니다.","s":125.496,"e":128.109,"p":false,"h":false},{"t":"\"이와 같이 주의 말씀이 힘 있게 흥왕하여 세력을 얻었다\"(19:20).","s":128.34,"e":133.932,"p":true,"h":false},{"t":"바울은 이후 예루살렘을 거쳐 로마를 보아야 한다고 마음먹습니다(19:21).","s":134.604,"e":140.875,"p":false,"h":false},{"t":"그런데 그 무렵 이 도로 말미암아 적지 않은 소동이 일어납니다.","s":141.084,"e":145.506,"p":false,"h":false},{"t":"은장색 데메드리오가 은으로 아데미의 신당 모형을 만들어 직공들에게 적잖은 수입을 주었는데, 바울이 \"손으로 만든 것은 신이 아니다\"라고 하며 많은 사람을 돌아서게 하여 이 일이 위태로워진다고 말합니다(19:23-27).","s":145.728,"e":161.995,"p":false,"h":false},{"t":"사람들이 분노하여 \"에베소 사람의 아데미는 위대하다\" 하고 외치며 성 안에 혼란이 가득하고, 바울의 동행 가이오와 아리스다고를 붙잡아 연극장으로 몰려갑니다(19:28-29).","s":162.216,"e":176.006,"p":false,"h":false},{"t":"바울이 무리 앞에 나가려 했으나 제자들이 말리고 아시아 관리들도 말립니다.","s":176.22,"e":181.237,"p":false,"h":false},{"t":"모인 사람들 대부분은 왜 모였는지도 몰랐고, 두 시간쯤 같은 소리를 외칩니다(19:30-34).","s":181.44,"e":189.773,"p":false,"h":false},{"t":"서기장이 무리를 진정시키며 이 사람들은 신전을 도둑질하거나 우리 여신을 모독한 일이 없다고 하고, 문제가 있으면 법정에서 해결하라고 말한 뒤 모임을 해산시킵니다(19:35-41).","s":190.008,"e":203.893,"p":true,"h":false},{"t":"구절 풀이","s":204.588,"e":205.635,"p":true,"h":false},{"t":"19장 1절에서 7절은 해석이 갈리는 대표적인 본문입니다.","s":206.496,"e":210.968,"p":false,"h":false},{"t":"어떤 사람들은 믿은 뒤에 성령을 따로 받는 두 번째 경험이 있다고 이해합니다.","s":211.176,"e":216.673,"p":false,"h":false},{"t":"개혁신학은 대개 이 열두 사람이 아직 예수님의 십자가와 부활 이후의 복음을 듣지 못한 요한의 제자들이었고, 성령의 때가 이제 도달한 구원 역사의 전환점에 서 있었다고 읽습니다.","s":216.9,"e":228.834,"p":false,"h":false},{"t":"2장, 8장, 10장, 19장은 각각 유대인, 사마리아인, 이방인, 요한의 제자들에게 성령이 임하신 이야기이고, 복음이 어떻게 확장되는가를 보여 주는 단계적 사건이라는 읽기입니다.","s":229.176,"e":243.947,"p":false,"h":false},{"t":"이것을 오늘 교회의 표준 순서로 삼을 것인지는 교회마다 입장이 다르므로 한쪽으로 단정하지 않습니다.","s":244.26,"e":251.002,"p":true,"h":false},{"t":"19장 11절과 12절의 손수건과 앞치마 이야기는 \"누가 이런 일을 따라 하자\"는 말이 아니라, 하나님이 이 일을 \"비범하게\" 하셨다는 것을 강조하기 위한 설명입니다.","s":251.784,"e":263.492,"p":false,"h":false},{"t":"본문도 능력을 행하신 분이 하나님이시라고 말합니다.","s":263.844,"e":267.461,"p":true,"h":false},{"t":"19장 13절에서 16절은 읽기 재미있고 의미도 분명합니다.","s":268.128,"e":272.924,"p":false,"h":false},{"t":"예수의 이름은 마술의 주문이 아닙니다.","s":273.276,"e":276.195,"p":false,"h":false},{"t":"이름을 이용하려 한 사람들은 오히려 낭패를 당했고, 이 사건을 통해 많은 사람이 예수의 이름을 두려워하고 높이게 됩니다.","s":276.408,"e":284.444,"p":false,"h":false},{"t":"능력은 이름을 사용하는 기술에 있는 것이 아니라 그 이름의 주인이신 예수님께 있습니다.","s":284.796,"e":290.569,"p":true,"h":false},{"t":"19장 19절의 은 오만은 많은 값이라는 뜻입니다.","s":291.384,"e":295.156,"p":false,"h":false},{"t":"정확히 얼마인지에 대해서는 학자들 사이에 논의가 있습니다.","s":295.344,"e":299.441,"p":false,"h":false},{"t":"중요한 것은 믿음을 가진 사람들이 값을 아끼지 않고 마술책을 불살랐다는 점입니다.","s":299.664,"e":305.587,"p":false,"h":false},{"t":"5장의 아나니아와 달리, 여기서는 아끼지 않고 내놓는 사람들이 나옵니다.","s":305.964,"e":311.323,"p":true,"h":false},{"t":"19장 20절은 6장 7절, 12장 24절에 이어 세 번째로 나오는 \"말씀이 흥왕한다\"는 문장입니다.","s":311.976,"e":320.502,"p":false,"h":false},{"t":"이 책이 교회의 성장을 설명하는 방식이 반복해서 확인됩니다.","s":320.868,"e":325.202,"p":true,"h":false},{"t":"19장 26절과 27절의 데메드리오의 말은 흥미롭습니다.","s":325.872,"e":330.577,"p":false,"h":false},{"t":"우상을 만드는 사람이 오히려 복음의 힘을 가장 정확히 알아보았습니다.","s":330.804,"e":335.558,"p":false,"h":false},{"t":"이사야서가 우상을 향해 말한 것을 그대로 이어받는 상황이 에베소의 상점가에서 벌어지고 있습니다.","s":335.916,"e":342.457,"p":true,"h":false}]},{"title":"사도행전_20장","audio":"doc20_2610231348.mp3","dur":374,"segs":[{"t":"사도행전 20장","s":0,"e":1.752,"p":true,"h":false},{"t":"전체 흐름","s":2.412,"e":3.444,"p":true,"h":false},{"t":"소동이 가라앉자 바울은 제자들을 불러 권면하고 작별한 뒤 마게도냐로 떠납니다.","s":4.32,"e":9.846,"p":false,"h":false},{"t":"그 지방을 다니며 많은 말로 제자들을 권면하고 헬라에 이르러 석 달을 머뭅니다.","s":10.044,"e":15.403,"p":false,"h":false},{"t":"바울이 배를 타고 수리아로 가려는데 유대인들이 음모를 꾸미자 마게도냐를 거쳐 돌아가기로 합니다(20:1-3).","s":15.624,"e":23.87,"p":false,"h":false},{"t":"그의 일행은 소바더, 아리스다고, 세군도, 가이오, 디모데, 두기고, 드로비모였고, 이들이 먼저 가서 드로아에서 기다렸습니다(20:4-6).","s":24.084,"e":37.043,"p":true,"h":false},{"t":"드로아에서 안식 후 첫날, 제자들이 떡을 떼려고 모였을 때 바울은 이튿날 떠날 예정이어서 말씀을 강론하다 밤중까지 이야기를 계속했습니다(20:7).","s":37.728,"e":48.65,"p":false,"h":false},{"t":"다락방에는 등불이 많이 켜져 있었는데, 유두고라는 청년이 창에 걸터앉아 있다가 바울의 말이 길어지자 깊이 졸다가 삼층에서 떨어졌습니다.","s":48.852,"e":58.336,"p":false,"h":false},{"t":"일으켜 보니 죽어 있었습니다(20:8-9).","s":58.68,"e":62.74,"p":false,"h":false},{"t":"바울이 내려가 그 위에 엎드려 안고 말합니다.","s":62.928,"e":66.212,"p":false,"h":false},{"t":"\"소동하지 말라.","s":66.42,"e":67.84,"p":false,"h":false},{"t":"생명이 그에게 있다.\"","s":68.328,"e":69.962,"p":false,"h":false},{"t":"그는 올라가 떡을 떼어 먹고 날이 새도록 오래 이야기한 뒤 떠났고, 사람들은 산 청년을 데리고 와서 크게 위로를 받았습니다(20:10-12).","s":70.236,"e":80.858,"p":true,"h":false},{"t":"바울은 에베소를 지나치기로 합니다.","s":81.54,"e":84.112,"p":false,"h":false},{"t":"오순절까지 예루살렘에 이르기 위해서입니다(20:16).","s":84.312,"e":89.277,"p":false,"h":false},{"t":"그러나 밀레도에서 에베소 교회의 장로들을 청해 작별 설교를 합니다.","s":89.496,"e":94.171,"p":false,"h":false},{"t":"그는 자신이 어떻게 겸손과 눈물로 주를 섬겼는지, 유익한 것은 공중 앞에서나 집집마다 꺼리지 않고 전했고, 유대인과 헬라인에게 하나님께 대한 회개와 우리 주 예수께 대한 믿음을 증언했음을 말합니다(20:17-21).","s":94.356,"e":110.816,"p":false,"h":false},{"t":"그리고 이어서 말합니다.","s":111.06,"e":112.969,"p":false,"h":false},{"t":"\"이제 나는 성령에 매여 예루살렘으로 가는데, 거기서 무슨 일을 당할지 알지 못합니다.","s":113.184,"e":119.109
