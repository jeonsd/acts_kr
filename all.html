,"p":false,"h":false},{"t":"다만 성령이 각 성에서 결박과 환난이 나를 기다린다고 증언하십니다.","s":119.304,"e":124.084,"p":false,"h":false},{"t":"그러나 나는 내 생명을 조금도 귀하게 여기지 않습니다.","s":124.308,"e":128.281,"p":false,"h":false},{"t":"나의 달려갈 길과 주 예수께 받은 사명, 곧 하나님의 은혜의 복음을 증언하는 일을 마치려는 것뿐입니다\"(20:22-24).","s":128.484,"e":137.869,"p":true,"h":false},{"t":"그는 장로들에게 당부합니다.","s":138.564,"e":140.781,"p":false,"h":false},{"t":"\"여러분 자신과 온 양 떼를 위하여 조심하십시오.","s":140.976,"e":144.486,"p":false,"h":false},{"t":"성령이 여러분을 양 떼 가운데 감독자로 삼으셔서 하나님의 교회를 보살피게 하셨습니다.","s":144.684,"e":150.652,"p":false,"h":false},{"t":"이 교회는 하나님이 자기 피로 사신 것입니다\"(20:28).","s":151.02,"e":156.144,"p":false,"h":false},{"t":"내가 떠난 뒤에 사나운 이리가 들어와 양 떼를 아끼지 않고, 여러분 중에서도 제자들을 끌어 자기를 따르게 하려고 어그러진 말을 하는 사람이 일어날 것이니 깨어 있으라고 합니다(20:29-31).","s":156.348,"e":169.9,"p":false,"h":false},{"t":"\"이제 내가 여러분을 하나님과 그 은혜의 말씀에 맡깁니다.","s":170.136,"e":174.083,"p":false,"h":false},{"t":"그 말씀이 능히 여러분을 든든히 세우고 거룩해진 모든 사람 가운데서 기업을 얻게 하십니다\"(20:32).","s":174.276,"e":181.997,"p":false,"h":false},{"t":"그는 자신이 아무의 은이나 금이나 의복을 탐내지 않았고, 이 손으로 자기와 일행의 쓸 것을 해결했다고 말하고, 이렇게 일하여 약한 사람들을 돕고 주 예수의 말씀을 기억하라고 합니다.","s":182.232,"e":194.586,"p":false,"h":false},{"t":"\"받는 것보다 주는 것이 복이 있다\"(20:33-35).","s":194.94,"e":200.165,"p":true,"h":false},{"t":"말을 마치고 바울이 무릎을 꿇고 모든 사람과 함께 기도하자, 모두 크게 울며 바울의 목을 안고 입을 맞춥니다.","s":200.844,"e":208.641,"p":false,"h":false},{"t":"다시는 자기 얼굴을 보지 못하리라 한 말 때문에 가장 마음 아파하며 그를 배까지 전송합니다(20:36-38).","s":208.98,"e":217.949,"p":true,"h":false},{"t":"구절 풀이","s":218.628,"e":219.675,"p":true,"h":false},{"t":"20장 22절에서 24절은 이 책의 흐름을 바꾸는 말입니다.","s":220.536,"e":225.115,"p":false,"h":false},{"t":"지금까지 성령은 선교의 길을 열고 인도하셨는데, 이제 성령은 바울을 환난이 기다리는 예루살렘으로 이끄십니다.","s":225.324,"e":233.37,"p":false,"h":false},{"t":"성령의 인도는 언제나 평탄한 길을 뜻하지 않습니다.","s":233.712,"e":237.346,"p":false,"h":false},{"t":"이 말씀은 사도행전 후반부 전체를 읽는 열쇠입니다.","s":237.564,"e":241.586,"p":false,"h":false},{"t":"바울은 이것을 스스로의 결단이 아니라 \"성령에 매여\" 가는 길로 설명합니다.","s":241.812,"e":247.291,"p":true,"h":false},{"t":"20장 28절은 교회를 세우고 감독을 세우시는 분이 누구인지를 분명히 말합니다.","s":247.968,"e":253.767,"p":false,"h":false},{"t":"장로들은 스스로 지도자가 된 사람들이 아니라 \"성령이 감독자로 삼으신\" 사람들이고, 그들이 돌보는 교회는 \"하나님이 자기 피로 사신\" 교회입니다.","s":253.944,"e":264.63,"p":false,"h":false},{"t":"이 표현은 사본과 번역에 따라 \"주의 교회\" 또는 \"자기 아들의 피\"로 읽는 등 차이가 있어 해석이 갈립니다.","s":264.96,"e":272.739,"p":false,"h":false},{"t":"그러나 어느 쪽이든 교회가 사람의 것이 아니라 그리스도의 피값으로 얻으신 것이라는 점은 같습니다.","s":273.096,"e":279.595,"p":false,"h":false},{"t":"이 구절은 장로의 권위를 높이는 구절이 아니라, 장로가 맡은 것이 얼마나 귀한 것인지를 일깨우는 구절로 읽는 것이 좋습니다.","s":279.936,"e":288.883,"p":false,"h":false},{"t":"장로와 감독이 같은 사람들을 가리킨다는 점은 17절과 28절에서 확인되지만, 이 하나의 본문으로 교회 직분 제도를 확정하지는 않겠습니다.","s":289.224,"e":298.986,"p":true,"h":false},{"t":"20장 32절은 바울이 마지막으로 의지하는 것이 사람의 지도력이 아니라 \"하나님과 그 은혜의 말씀\"이라는 것을 보여 줍니다.","s":299.772,"e":308.555,"p":false,"h":false},{"t":"자기를 떠나보내는 교회를 하나님과 말씀에 맡기는 모습입니다.","s":308.916,"e":313.04,"p":true,"h":false},{"t":"20장 35절의 \"받는 것보다 주는 것이 복이 있다\"는 복음서에는 없지만 예수님이 하신 말씀으로 바울이 전하는 유일한 곳입니다.","s":313.704,"e":322.953,"p":false,"h":false},{"t":"5장의 아나니아와 바나바 이야기, 4장의 나눔과 이어서 읽을 수 있는 마음입니다.","s":323.316,"e":329.14,"p":false,"h":false},{"t":"이 말씀을 \"주면 더 받는다\"는 식으로 읽으면 본문과 어긋납니다.","s":329.328,"e":334.387,"p":true,"h":false},{"t":"20장 7절의 \"안식 후 첫날\" 모임은 초대교회의 주일 예배를 보여 준다고 널리 읽습니다.","s":335.052,"e":341.433,"p":false,"h":false},{"t":"다만 본문이 이 모임을 규범으로 명령하지는 않습니다.","s":341.784,"e":345.606,"p":true,"h":false},{"t":"20장 9절에서 12절의 유두고는 \"죽은 것을 일으켰다\"로 읽는 입장과 \"생명이 그에게 있다\"는 바울의 말을 근거로 죽지는 않았다고 보는 입장이 있습니다.","s":346.248,"e":357.374,"p":false,"h":false},{"t":"본문은 \"죽은 것을 일으켜\"라고 적고 있고, 누가는 이 사건을 전하는 데 길게 설명하지 않습니다.","s":357.732,"e":364.828,"p":false,"h":false},{"t":"오래 설교하여 졸게 한 사도의 이야기에 웃음이 나오지만, 그 자리에 하나님의 능력이 있었다는 것이 본문의 방향입니다.","s":365.184,"e":373.163,"p":true,"h":false}]},{"title":"사도행전_21장","audio":"doc21_2610231348.mp3","dur":290.6,"segs":[{"t":"사도행전 21장","s":0,"e":1.911,"p":true,"h":false},{"t":"전체 흐름","s":2.556,"e":3.588,"p":true,"h":false},{"t":"바울 일행은 밀레도를 떠나 배로 두로에 이릅니다.","s":4.464,"e":7.958,"p":false,"h":false},{"t":"거기서 제자들을 찾아 이레를 머무는데, 이 제자들이 성령의 감동으로 바울에게 예루살렘에 올라가지 말라고 합니다(21:1-4).","s":8.172,"e":18.165,"p":false,"h":false},{"t":"일행은 가이사랴에 이르러 일곱 집사 중 한 사람인 전도자 빌립의 집에 머뭅니다.","s":18.396,"e":23.863,"p":false,"h":false},{"t":"그에게는 예언하는 처녀 딸 넷이 있었습니다(21:8-9).","s":24.084,"e":29.521,"p":false,"h":false},{"t":"여러 날 있을 때 선지자 아가보가 내려와서 바울의 허리띠를 가져다 자기 손발을 묶고 말합니다.","s":29.736,"e":35.953,"p":false,"h":false},{"t":"\"성령이 말씀하시기를, 이 띠의 주인을 유대인들이 예루살렘에서 이와 같이 결박하여 이방인의 손에 넘겨줄 것이라 하셨습니다\"(21:10-11).","s":36.288,"e":47.286,"p":false,"h":false},{"t":"이 말을 듣고 사람들이 바울에게 올라가지 말라고 간청합니다.","s":47.52,"e":51.894,"p":false,"h":false},{"t":"바울이 대답합니다.","s":52.092,"e":53.665,"p":false,"h":false},{"t":"\"여러분이 어찌하여 울며 내 마음을 상하게 합니까.","s":54,"e":57.435,"p":false,"h":false},{"t":"나는 주 예수의 이름을 위하여 예루살렘에서 결박당할 뿐 아니라 죽을 것도 각오했습니다.\"","s":57.636,"e":63.711,"p":false,"h":false},{"t":"그가 듣지 않자 사람들은 \"주의 뜻대로 되기를 원합니다\" 하고 그쳤습니다(21:12-14).","s":63.9,"e":71.583,"p":true,"h":false},{"t":"예루살렘에 이르자 형제들이 기쁘게 영접합니다.","s":72.252,"e":75.811,"p":false,"h":false},{"t":"바울이 이방인 가운데서 하나님이 행하신 일을 낱낱이 이야기하자 야고보와 장로들이 하나님께 영광을 돌립니다.","s":76.032,"e":83.229,"p":false,"h":false},{"t":"그러나 그들은 걱정을 말합니다.","s":83.556,"e":85.99,"p":false,"h":false},{"t":"유대에는 믿는 사람이 수만 명이나 되는데 다 율법에 열성적이고, 바울이 이방인 가운데 있는 유대인들에게 모세를 배반하라 가르친다는 소문이 있다는 것입니다.","s":86.184,"e":96.828,"p":false,"h":false},{"t":"그래서 서원한 사람 넷의 결례 비용을 대고 바울도 함께 결례를 하라고 권합니다.","s":97.164,"e":102.748,"p":false,"h":false},{"t":"그러면 소문이 거짓임을 알고 바울도 율법을 지키는 사람임이 드러난다는 것입니다(21:17-24).","s":102.96,"e":111.129,"p":false,"h":false},{"t":"바울은 그대로 하여 이튿날 그들과 함께 성전에 들어갑니다(21:26).","s":111.348,"e":117.533,"p":true,"h":false},{"t":"결례의 칠 일이 거의 끝날 때 아시아에서 온 유대인들이 바울을 보고 무리를 선동하며 소리칩니다.","s":118.188,"e":124.524,"p":false,"h":false},{"t":"\"이 사람이 모든 곳에서 백성과 율법과 이 곳을 비방하며, 또 헬라인을 성전에 데리고 들어와 이 거룩한 곳을 더럽혔다.\"","s":124.848,"e":133.259,"p":false,"h":false},{"t":"전에 에베소 사람 드로비모가 바울과 함께 시내에 있는 것을 본 일이 있어서 바울이 성전에 데리고 들어왔다고 생각한 것입니다(21:27-29).","s":133.488,"e":144.232,"p":false,"h":false},{"t":"온 성이 소동하고 사람들이 바울을 잡아 성전 밖으로 끌어내 문을 닫고 죽이려 할 때, 로마 군대의 천부장에게 소식이 들어갑니다.","s":144.468,"e":153.04,"p":false,"h":false},{"t":"군인들이 달려와 바울을 구하고 쇠사슬 둘로 결박합니다(21:30-33).","s":153.396,"e":160.056,"p":false,"h":false},{"t":"무리가 \"없애 버리자\" 하고 외치는 소란 속에서 바울은 군영으로 끌려가며 천부장에게 백성에게 말할 기회를 청합니다.","s":160.272,"e":168.269,"p":false,"h":false},{"t":"그는 층계 위에 서서 손짓하여 무리를 조용하게 하고 히브리 말로 말하기 시작합니다(21:34-40).","s":168.624,"e":176.876,"p":true,"h":false},{"t":"구절 풀이","s":177.552,"e":178.599,"p":true,"h":false},{"t":"21장 4절과 11절에서 14절은 읽는 사람에게 질문을 던집니다.","s":179.46,"e":184.552,"p":false,"h":false},{"t":"20장 22절에서 바울은 \"성령에 매여\" 예루살렘으로 간다고 했는데, 두로의 제자들은 \"성령의 감동으로\" 가지 말라고 합니다.","s":184.752,"e":194.274,"p":false,"h":false},{"t":"성령이 모순되게 말씀하신 것은 아닙니다.","s":194.472,"e":197.493,"p":false,"h":false},{"t":"성령이 앞으로 있을 환난을 미리 알려 주셨고, 제자들은 그 사실을 듣고 사랑하는 마음에서 말렸다고 읽는 견해가 많습니다.","s":197.712,"e":206.029,"p":false,"h":false},{"t":"본문은 누구의 판단이 맞았는지 따지지 않습니다.","s":206.352,"e":209.724,"p":false,"h":false},{"t":"중요한 것은 바울의 대답입니다.","s":209.916,"e":212.4,"p":false,"h":false},{"t":"그는 고난을 피할 수 없는 운명으로 받아들이지 않고, 주님을 위해 기꺼이 가는 길로 받아들입니다.","s":212.616,"e":219.115,"p":false,"h":false},{"t":"그리고 말리던 사람들의 마지막 말이 \"주의 뜻대로 되기를\"입니다.","s":219.456,"e":224.062,"p":false,"h":false},{"t":"이 길을 이끄시는 분은 처음부터 끝까지 주님이십니다.","s":224.244,"e":228.055,"p":true,"h":false},{"t":"21장 20절에서 26절은 해석이 갈립니다.","s":228.708,"e":232.505,"p":false,"h":false},{"t":"이방인에게는 율법을 요구하지 않는다고 15장에서 결정했는데, 바울이 결례를 하는 것이 일관되지 않아 보인다는 의문입니다.","s":232.704,"e":241.227,"p":false,"h":false},{"t":"바울은 다른 곳에서 유대인에게는 유대인같이 되었다고 말하고, 이것이 복음을 전하는 데 걸림이 되지 않게 하려는 것이었다고 읽는 해석이 일반적입니다.","s":241.596,"e":251.534,"p":false,"h":false},{"t":"반면 이 일이 결과적으로 체포의 빌미가 되었다는 점을 들어 바울의 판단이 아쉬웠다고 보는 견해도 있습니다.","s":251.892,"e":259.126,"p":false,"h":false},{"t":"본문은 이 일을 칭찬하지도 비판하지도 않으므로 한쪽으로 정하지 않겠습니다.","s":259.452,"e":264.544,"p":true,"h":false},{"t":"21장 27절에서 36절의 소동은 오해에서 시작되었습니다.","s":265.212,"e":270.112,"p":false,"h":false},{"t":"바울은 드로비모를 성전에 데리고 들어가지 않았습니다.","s":270.324,"e":273.985,"p":false,"h":false},{"t":"사실이 아닌 소문이 폭력이 되는 모습이고, 로마 군대가 개입하지 않았다면 바울은 죽었을 것입니다.","s":274.212,"e":281.179,"p":false,"h":false},{"t":"바울을 구한 것이 이방인 군대였다는 점은 아가보의 예언(\"이방인의 손에 넘겨준다\")과 이어지는 아이러니입니다.","s":281.556,"e":289.852,"p":true,"h":false}]},{"title":"사도행전_22장","audio":"doc22_2610231348.mp3","dur":281.4,"segs":[{"t":"사도행전 22장","s":0,"e":1.849,"p":true,"h":false},{"t":"전체 흐름","s":2.484,"e":3.516,"p":true,"h":false},{"t":"바울은 히브리 말로 변명합니다.","s":4.392,"e":6.778,"p":false,"h":false},{"t":"무리가 히브리 말을 듣자 더욱 조용해졌습니다(22:1-2).","s":6.984,"e":12.308,"p":false,"h":false},{"t":"그는 자기가 길리기아 다소에서 난 유대인이며, 이 성에서 자라 가말리엘의 발 아래서 율법을 엄격하게 배웠고, 오늘 여기 있는 여러분처럼 하나님께 열성을 가진 사람이었다고 말합니다.","s":12.528,"e":24.789,"p":false,"h":false},{"t":"그리고 이 도를 박해하여 남녀를 결박해 감옥에 넣었다고 합니다.","s":25.128,"e":29.552,"p":false,"h":false},{"t":"대제사장과 장로들이 이를 증언할 수 있다고 합니다(22:3-5).","s":29.772,"e":35.407,"p":true,"h":false},{"t":"이어서 다메섹 도상의 일을 이야기합니다.","s":36.072,"e":39.064,"p":false,"h":false},{"t":"정오쯤 큰 빛이 하늘에서 비치자 땅에 엎드러졌고, \"사울아, 사울아, 어찌하여 나를 박해하느냐\" 하는 음성을 들었습니다.","s":39.276,"e":48.306,"p":false,"h":false},{"t":"\"주여, 누구십니까.\"","s":48.636,"e":50.495,"p":false,"h":false},{"t":"\"나는 네가 박해하는 나사렛 예수다\"(22:6-8).","s":50.724,"e":55.475,"p":false,"h":false},{"t":"함께 있던 사람들은 빛은 보았으나 말씀하시는 이의 소리는 알아듣지 못했습니다(22:9).","s":55.692,"e":62.613,"p":false,"h":false},{"t":"바울이 \"주여, 내가 무엇을 하리이까\" 하고 묻자 주님은 다메섹에 들어가라 하셨고, 거기서 율법을 따라 경건하다는 칭찬을 받는 아나니아가 와서 바울의 눈을 뜨게 했습니다.","s":62.856,"e":74.778,"p":false,"h":false},{"t":"아나니아는 말합니다.","s":75.096,"e":76.782,"p":false,"h":false},{"t":"\"우리 조상의 하나님이 너를 택하여 그분의 뜻을 알게 하시고, 그 의로우신 분을 보게 하시고, 그분의 입에서 나오는 음성을 듣게 하셨다.","s":77.004,"e":86.09,"p":false,"h":false},{"t":"너는 그분을 위하여 모든 사람 앞에서 네가 보고 들은 것의 증인이 될 것이다.","s":86.328,"e":91.477,"p":false,"h":false},{"t":"이제 지체하지 말고 일어나 세례를 받고 그분의 이름을 불러 죄를 씻어라\"(22:10-16).","s":91.692,"e":98.907,"p":true,"h":false},{"t":"그 뒤 예루살렘에 돌아와 성전에서 기도할 때 황홀한 중에 주님을 뵙습니다.","s":99.576,"e":104.624,"p":false,"h":false},{"t":"주님은 \"급히 예루살렘에서 떠나라.","s":104.976,"e":107.916,"p":false,"h":false},{"t":"사람들이 네가 나에 대해 증언하는 것을 받지 않을 것이다\" 하십니다.","s":108.108,"e":112.655,"p":false,"h":false},{"t":"바울이 \"주여, 내가 전에 예수를 믿는 사람들을 가두고 때린 것을 사람들이 압니다\" 하고 대답하자 주님이 다시 말씀하십니다.","s":112.86,"e":121.446,"p":false,"h":false},{"t":"\"가라.","s":121.788,"e":122.433,"p":false,"h":false},{"t":"내가 너를 멀리 이방인에게 보내리라\"(22:17-21).","s":122.652,"e":127.92,"p":true,"h":false},{"t":"무리는 이 말까지 듣고 있다가, \"이방인\"이라는 말이 나오자 소리를 지르며 \"이런 자는 땅에서 없애 버려라.","s":128.592,"e":136.074,"p":false,"h":false},{"t":"살려 둘 수 없다\" 하고 옷을 벗어 던지고 티끌을 공중에 날립니다(22:22-23).","s":136.296,"e":143.744,"p":false,"h":false},{"t":"천부장은 바울을 군영으로 데려가 채찍질하며 심문하라고 합니다.","s":143.964,"e":148.318,"p":false,"h":false},{"t":"군인들이 가죽 끈으로 바울을 매어 놓았을 때 바울이 곁에 서 있는 백부장에게 말합니다.","s":148.536,"e":154.333,"p":false,"h":false},{"t":"\"로마 시민 된 사람을 죄도 정하지 않고 채찍질하는 것이 합당합니까.\"","s":154.512,"e":159.127,"p":false,"h":false},{"t":"백부장이 천부장에게 알리자 천부장이 와서 묻습니다.","s":159.336,"e":163.074,"p":false,"h":false},{"t":"\"네가 로마 시민이냐.\"","s":163.26,"e":164.957,"p":false,"h":false},{"t":"\"그렇습니다.\"","s":165.168,"e":166.238,"p":false,"h":false},{"t":"\"나는 많은 돈으로 이 시민권을 얻었다.\"","s":167.076,"e":169.926,"p":false,"h":false},{"t":"\"나는 나면서부터입니다.\"","s":170.172,"e":172.072,"p":false,"h":false},{"t":"심문하려던 사람들이 곧 물러갔고, 천부장도 그가 로마 시민인 것을 알고 결박한 것 때문에 두려워했습니다(22:24-29).","s":172.296,"e":182.31,"p":false,"h":false},{"t":"이튿날 천부장은 유대인들이 무엇 때문에 바울을 고소하는지 알려고 바울의 결박을 풀고 대제사장들과 온 공회를 소집하여 바울을 데려다 세웁니다(22:30).","s":182.52,"e":194.23,"p":true,"h":false},{"t":"구절 풀이","s":194.904,"e":195.951,"p":true,"h":false},{"t":"22장 6절에서 16절은 9장에서 이미 읽은 다메섹 이야기를 바울의 입으로 다시 듣는 것입니다.","s":196.812,"e":203.616,"p":false,"h":false},{"t":"같은 사건인데 여기서는 청중에 맞추어 이야기합니다.","s":203.976,"e":207.924,"p":false,"h":false},{"t":"유대인 청중 앞이라서 아나니아를 \"율법을 따라 경건한 사람\"이라고 소개하고, 자기도 한때 박해자였음을 숨기지 않습니다.","s":208.152,"e":216.676,"p":false,"h":false},{"t":"바울이 강조하는 것은 자기가 스스로 변한 것이 아니라 주님이 찾아오셨다는 점입니다.","s":216.864,"e":222.525,"p":true,"h":false},{"t":"22장 21절과 22절은 이 변명의 폭발점입니다.","s":223.2,"e":227.717,"p":false,"h":false},{"t":"무리는 바울이 모세를 배반한다는 말도, 환상 이야기도 참고 들었지만, \"이방인\"이라는 한마디에 폭발합니다.","s":227.916,"e":235.915,"p":false,"h":false},{"t":"11장에서 예루살렘 교회가 이방인에게 문이 열린 것을 받아들이는 데도 하나님의 직접적인 개입이 필요했던 것처럼, 이 무리에게도 이 일이 얼마나 받아들이기 어려운 일이었는지 보여 줍니다.","s":236.124,"e":248.764,"p":false,"h":false},{"t":"하나님이 오래전부터 말씀하셨던 이방인 구원(이사야 49장 6절)이 이렇게 큰 충격이 된다는 것이 놀랍습니다.","s":249.084,"e":257.982,"p":true,"h":false},{"t":"22장 25절에서 29절에서 바울은 시민권을 말하고 채찍을 피합니다.","s":258.768,"e":264.229,"p":false,"h":false},{"t":"이것을 위험에서 벗어나려는 요령으로만 읽기보다, 복음이 합법적으로 증언될 길을 하나님이 열어 두셨다고 읽는 견해가 있습니다.","s":264.42,"e":273.106,"p":false,"h":false},{"t":"16장 37절에서도 같은 일이 있었습니다.","s":273.456,"e":276.879,"p":false,"h":false},{"t":"본문은 동기를 설명하지 않으므로 단정하지 않겠습니다.","s":277.092,"e":280.765,"p":true,"h":false}]},{"title":"사도행전_23장","audio":"doc23_2610231348.mp3","dur":295.4,"segs":[{"t":"사도행전 23장","s":0,"e":1.913,"p":true,"h":false},{"t":"전체 흐름","s":2.556,"e":3.588,"p":true,"h":false},{"t":"바울이 공회를 주목하며 말합니다.","s":4.464,"e":6.887,"p":false,"h":false},{"t":"\"형제들이여, 나는 오늘까지 범사에 하나님 앞에서 양심을 따라 살았습니다.\"","s":7.092,"e":12.601,"p":false,"h":false},{"t":"대제사장 아나니아가 곁에 선 사람들에게 바울의 입을 치라고 명합니다.","s":12.816,"e":17.779,"p":false,"h":false},{"t":"바울이 대답합니다.","s":17.964,"e":19.537,"p":false,"h":false},{"t":"\"회칠한 담이여, 하나님이 당신을 치실 것입니다.","s":19.872,"e":23.506,"p":false,"h":false},{"t":"당신은 율법대로 나를 심판한다고 앉아서 율법을 어기고 나를 치라 합니까.\"","s":23.724,"e":29.089,"p":false,"h":false},{"t":"곁에 선 사람들이 \"하나님의 대제사장을 욕하느냐\" 하자 바울은 \"형제들이여, 그가 대제사장인 줄 몰랐습니다.","s":29.304,"e":37.413,"p":false,"h":false},{"t":"기록되기를 '네 백성의 관리를 욕하지 말라' 하였습니다\" 하고 말합니다(23:1-5).","s":37.764,"e":45.194,"p":true,"h":false},{"t":"바울은 공회가 사두개인과 바리새인으로 나뉘어 있음을 알고 외칩니다.","s":45.864,"e":50.75,"p":false,"h":false},{"t":"\"나는 바리새인이요 바리새인의 아들입니다.","s":50.94,"e":54.044,"p":false,"h":false},{"t":"죽은 자의 부활에 대한 소망 때문에 내가 심문을 받습니다.\"","s":54.252,"e":58.238,"p":false,"h":false},{"t":"이 말에 바리새인과 사두개인 사이에 분쟁이 일어나 무리가 갈라졌습니다.","s":58.464,"e":63.412,"p":false,"h":false},{"t":"사두개인은 부활도 천사도 영도 없다 하고 바리새인은 다 있다고 하기 때문입니다.","s":63.612,"e":69.225,"p":false,"h":false},{"t":"소란이 커지자 천부장은 바울이 찢길까 두려워 군인들에게 그를 끌어내 군영으로 데려가게 합니다(23:6-10).","s":69.588,"e":78.005,"p":true,"h":false},{"t":"그 밤에 주께서 바울 곁에 서서 말씀하십니다.","s":78.66,"e":81.944,"p":false,"h":false},{"t":"\"담대하라.","s":82.152,"e":83.163,"p":false,"h":false},{"t":"네가 예루살렘에서 나를 위하여 증언한 것같이 로마에서도 증언해야 한다\"(23:11).","s":84.06,"e":90.777,"p":false,"h":false},{"t":"환난과 결박이 기다린다는 말을 계속 들어 온 바울에게, 처음으로 주님이 직접 하시는 말씀입니다.","s":91.008,"e":97.498,"p":true,"h":false},{"t":"이튿날 유대인 사십여 명이 음모를 꾸밉니다.","s":98.316,"e":101.638,"p":false,"h":false},{"t":"바울을 죽이기 전에는 먹지도 마시지도 않겠다고 맹세하고, 대제사장들과 장로들에게 천부장에게 가서 바울을 다시 심문하는 것처럼 데려오게 하면 도중에 죽이겠다고 합니다(23:12-15).","s":101.844,"e":115.613,"p":false,"h":false},{"t":"그런데 바울의 누이의 아들이 이 음모를 듣고 군영에 들어가 바울에게 알립니다.","s":115.848,"e":121.107,"p":false,"h":false},{"t":"바울은 백부장을 불러 조카를 천부장에게 데려가게 하고, 천부장은 조카의 손을 잡고 따로 가서 이야기를 듣습니다.","s":121.32,"e":129.015,"p":false,"h":false},{"t":"그는 바울을 즉시 가이사랴로 보내기로 하여, 보병 이백 명과 기병 칠십 명과 창병 이백 명을 밤 아홉 시에 준비시킵니다(23:16-24).","s":129.384,"e":140.634,"p":false,"h":false},{"t":"천부장 글라우디오 루시아는 총독 벨릭스에게 편지를 써서 바울이 죽을죄나 결박당할 죄가 없고 유대인의 율법 문제로 고소당한 것일 뿐이라고 알립니다(23:25-30).","s":140.832,"e":153.895,"p":false,"h":false},{"t":"군인들은 밤에 바울을 안디바드리까지 데려갔고, 다음 날 기병만 가이사랴로 갔습니다.","s":154.116,"e":160.327,"p":false,"h":false},{"t":"총독은 바울이 길리기아 사람인 것을 알고 고소하는 사람들이 오면 심문하겠다 하며 헤롯 궁에 지키게 했습니다(23:31-35).","s":160.524,"e":170.51,"p":true,"h":false},{"t":"구절 풀이","s":171.18,"e":172.227,"p":true,"h":false},{"t":"23장 11절이 이 장의 마음이고 구간 전체의 열쇠입니다.","s":173.088,"e":177.642,"p":false,"h":false},{"t":"어둠 속에서 체포된 사람 곁에 주님이 서십니다.","s":178.02,"e":181.525,"p":false,"h":false},{"t":"18장 9절과 10절에서 고린도에서 바울에게 하신 말씀과 같은 모습입니다.","s":181.728,"e":187.262,"p":false,"h":false},{"t":"주님은 바울이 안전하게 풀려날 것을 약속하지 않으십니다.","s":187.632,"e":191.636,"p":false,"h":false},{"t":"약속하시는 것은 \"로마에서도 증언해야 한다\"는 사명입니다.","s":191.844,"e":196.428,"p":false,"h":false},{"t":"바울이 로마로 가는 길은 사도행전 1장 8절의 \"땅끝까지\"로 이어지는 길이고, 이 길을 정하신 분은 주님이십니다.","s":196.632,"e":205.018,"p":false,"h":false},{"t":"9장 15절에서 주님이 사울을 두고 \"임금들 앞에 내 이름을 전하게 하겠다\"고 하신 말씀이 이 장들에서 이루어지기 시작합니다.","s":205.236,"e":213.858,"p":true,"h":false},{"t":"23장 3절에서 5절은 읽는 사람이 당황하게 되는 장면입니다.","s":214.632,"e":219.291,"p":false,"h":false},{"t":"바울이 대제사장에게 \"회칠한 담\"이라고 말했다가 곧 사과하는 것처럼 보이지만, 그가 정말 몰랐는지 아니면 아이러니였는지는 해석이 갈립니다.","s":219.492,"e":229.636,"p":false,"h":false},{"t":"어쨌든 본문은 사도를 완벽한 사람으로 그리지 않습니다.","s":229.968,"e":233.94,"p":false,"h":false},{"t":"이 장면을 사도의 잘못으로 비판하거나 모범으로 삼기보다, 쓰임 받은 사람의 모습 그대로를 기록한 것으로 읽는 것이 무난합니다.","s":234.144,"e":242.878,"p":true,"h":false},{"t":"23장 6절에서 9절의 부활 이야기는 바울이 의도적으로 공회의 분열을 이용했다고 읽는 견해가 많습니다.","s":243.684,"e":250.943,"p":false,"h":false},{"t":"이것이 지혜로운 방법이었는지, 부활의 소망이 본래의 쟁점이었는지에 대한 읽기가 갈립니다.","s":251.28,"e":257.754,"p":false,"h":false},{"t":"24장 15절과 21절에서 바울이 같은 이야기를 다시 하는 것을 보면, 부활이 이 재판의 핵심이었다는 것이 분명합니다.","s":258.12,"e":266.615,"p":true,"h":false},{"t":"23장 12절에서 35절은 숨 가쁜 이야기입니다.","s":267.408,"e":271.45,"p":false,"h":false},{"t":"사십여 명의 암살 음모는 바울의 조카가 우연히 들어서 막혔고, 이방인 천부장이 바울을 보호했습니다.","s":271.656,"e":278.787,"p":false,"h":false},{"t":"이 일에서 사람의 이름이 여럿 나오지만, 바울을 지키신 분은 11절에서 약속하신 주님이시라고 읽는 것이 본문의 흐름에 맞습니다.","s":279.144,"e":287.841,"p":false,"h":false},{"t":"본문이 \"하나님이 조카를 보내셨다\"고 직접 말하지는 않지만, 그렇게 읽을 수 있습니다.","s":288.18,"e":294.741,"p":true,"h":false}]},{"title":"사도행전_24장","audio":"doc24_2610231348.mp3","dur":248.4,"segs":[{"t":"사도행전 24장","s":0,"e":1.864,"p":true,"h":false},{"t":"전체 흐름","s":2.52,"e":3.552,"p":true,"h":false},{"t":"닷새 후 대제사장 아나니아가 장로 몇 사람과 변호사 더둘로를 데리고 가이사랴로 내려와 총독에게 바울을 고발합니다(24:1).","s":4.428,"e":13.763,"p":false,"h":false},{"t":"더둘로는 먼저 총독 벨릭스에게 아첨합니다.","s":13.968,"e":17.322,"p":false,"h":false},{"t":"총독 덕분에 평안을 누린다는 말입니다.","s":17.532,"e":20.241,"p":false,"h":false},{"t":"그리고 바울을 \"전염병 같은 자요 천하의 유대인을 소요하게 하는 자요 나사렛 이단의 우두머리\"라 하고, 성전을 더럽히려 해서 잡았다고 고발합니다.","s":20.448,"e":30.152,"p":false,"h":false},{"t":"다른 유대인들도 그렇다고 맞장구칩니다(24:2-9).","s":30.348,"e":35.522,"p":true,"h":false},{"t":"총독이 말하라고 머리를 끄덕이자 바울이 변명합니다.","s":36.216,"e":39.895,"p":false,"h":false},{"t":"자기가 예루살렘에 올라간 지 열두 날이 못 되며, 성전에서도 회당에서도 시내에서도 사람과 변론하거나 무리를 소동하게 한 일이 없고, 그들이 고발하는 것을 증명할 수 없다고 합니다(24:10-13).","s":40.104,"e":54.677,"p":false,"h":false},{"t":"그리고 중요한 고백을 합니다.","s":54.9,"e":57.042,"p":false,"h":false},{"t":"\"그러나 이것은 시인합니다.","s":57.24,"e":59.387,"p":false,"h":false},{"t":"그들이 이단이라 하는 이 도를 따라 내가 조상의 하나님을 섬기며, 율법과 선지자들의 글에 기록된 모든 것을 믿고, 이 사람들이 가진 것과 같은 소망을 하나님께 두고 있습니다.","s":59.616,"e":71.521,"p":false,"h":false},{"t":"곧 의인과 악인이 부활할 것입니다\"(24:14-15).","s":71.892,"e":76.986,"p":false,"h":false},{"t":"그는 자기도 이 때문에 하나님과 사람 앞에서 항상 양심에 거리낌이 없도록 힘쓴다고 말합니다(24:16).","s":77.22,"e":85.372,"p":false,"h":false},{"t":"여러 해 만에 구제금과 제물을 가지고 왔고, 결례를 하는 중에 성전에서 발견되었으며 무리도 소동도 없었다고 합니다.","s":85.608,"e":93.564,"p":false,"h":false},{"t":"아시아에서 온 유대인들이 고소할 것이 있으면 여기 와서 해야 하며, 여기 있는 사람들은 공회 앞에 섰을 때 무슨 잘못을 보았는지 말하라고 합니다.","s":93.888,"e":103.462,"p":false,"h":false},{"t":"자신은 다만 \"죽은 자의 부활 때문에 오늘 여러분 앞에서 심문받는다\"고 한 말밖에 없다는 것입니다(24:17-21).","s":103.788,"e":113.48,"p":true,"h":false},{"t":"벨릭스는 이 도에 대해 자세히 알았으므로 재판을 연기하고 천부장 루시아가 오면 결정하겠다고 하며, 백부장에게 바울을 지키되 자유를 주고 친구들이 돌보는 것을 막지 말라고 합니다(24:22-23).","s":114.156,"e":129.041,"p":false,"h":false},{"t":"며칠 뒤 벨릭스는 유대 여자인 아내 드루실라와 함께 와서 바울을 불러 그리스도 예수를 믿는 믿음에 대해 듣습니다.","s":129.24,"e":136.588,"p":false,"h":false},{"t":"바울이 의와 절제와 장차 오는 심판을 말하자 벨릭스는 두려워하며 말합니다.","s":136.944,"e":142.142,"p":false,"h":false},{"t":"\"지금은 가라.","s":142.344,"e":143.572,"p":false,"h":false},{"t":"내가 기회를 보아 너를 부르겠다\"(24:24-25).","s":144.252,"e":149.612,"p":false,"h":false},{"t":"그는 바울에게서 돈을 받을 것을 바라고 자주 불러 이야기했습니다(24:26).","s":149.832,"e":156.277,"p":false,"h":false},{"t":"이 년이 지나 보르기오 베스도가 벨릭스의 뒤를 이었으나, 벨릭스는 유대인의 환심을 사려고 바울을 가둔 채로 두었습니다(24:27).","s":156.492,"e":166.752,"p":true,"h":false},{"t":"구절 풀이","s":167.436,"e":168.483,"p":true,"h":false},{"t":"24장 14절에서 16절은 바울이 재판정에서 자기 신앙을 요약한 것입니다.","s":169.344,"e":174.961,"p":false,"h":false},{"t":"이 도를 \"이단\"이라 부르는 사람들 앞에서, 자기가 믿는 것은 율법과 선지자들이 이미 말한 것이고 그 중심이 부활의 소망이라고 말합니다.","s":175.32,"e":185.042,"p":false,"h":false},{"t":"복음이 구약과 단절된 새 종교가 아니라 그 약속의 성취라는 것을 법정에서 분명히 한 것입니다.","s":185.4,"e":192.011,"p":false,"h":false},{"t":"이사야에서 보아 온 흐름이 이 법정까지 이어집니다.","s":192.348,"e":196.036,"p":true,"h":false},{"t":"24장 22절에서 27절의 벨릭스는 바울을 놓아주지도 처벌하지도 않고 이 년을 끌었습니다.","s":196.704,"e":203.395,"p":false,"h":false},{"t":"이 이야기에서 눈에 띄는 것은 그가 \"이 도를 자세히 알았다\"는 점입니다.","s":203.724,"e":209.286,"p":false,"h":false},{"t":"의와 절제와 심판에 대한 말을 듣고는 두려워하면서도, \"지금은 가라\"고 합니다.","s":209.484,"e":215.232,"p":false,"h":false},{"t":"복음을 정확히 들으면서도 돈과 정치 때문에 결단하지 않는 사람의 모습입니다.","s":215.424,"e":220.733,"p":false,"h":false},{"t":"본문은 그가 끝내 믿었는지 말하지 않습니다.","s":220.932,"e":224.143,"p":true,"h":false},{"t":"24장 27절의 이 년은 바울에게 허비된 시간으로 보일 수 있지만, 본문은 평가하지 않습니다.","s":224.82,"e":231.651,"p":false,"h":false},{"t":"이 기간 바울이 어떻게 지냈는지는 기록이 적고, 이 기간이 다음 장의 상소로 이어져 로마로 가는 길이 됩니다.","s":231.984,"e":239.433,"p":false,"h":false},{"t":"사람의 판단으로는 지체이지만, 23장 11절의 약속은 이 시간 속에서도 변하지 않았다고 읽을 수 있습니다.","s":239.796,"e":247.6,"p":true,"h":false}]},{"title":"사도행전_25장","audio":"doc25_2610231348.mp3","dur":288.9,"segs":[{"t":"사도행전 25장","s":0,"e":1.852,"p":true,"h":false},{"t":"전체 흐름","s":2.52,"e":3.552,"p":true,"h":false},{"t":"베스도가 부임하여 삼 일 후에 예루살렘으로 올라가자 대제사장들과 유대인의 유력자들이 바울을 고발하며 호의를 청합니다.","s":4.428,"e":12.813,"p":false,"h":false},{"t":"바울을 예루살렘으로 불러 달라는 것이었는데, 길에서 바울을 죽이려는 음모를 품고 있었습니다(25:1-3).","s":13.14,"e":21.77,"p":false,"h":false},{"t":"베스도는 바울이 가이사랴에 지켜지고 있으며 자신도 곧 그리로 간다고 하고, 그들 중 권력 있는 자들은 함께 내려가 고발하라고 합니다(25:4-5).","s":21.996,"e":33.081,"p":false,"h":false},{"t":"그는 팔 일이나 십 일 후 가이사랴로 내려가 바울을 불러 법정에 앉습니다.","s":33.3,"e":38.248,"p":false,"h":false},{"t":"유대인들은 중대한 죄를 많이 들어 고발하지만 증거를 대지 못합니다.","s":38.448,"e":43.359,"p":false,"h":false},{"t":"바울은 유대인의 율법에도 성전에도 가이사에게도 죄를 범한 일이 없다고 변명합니다(25:6-8).","s":43.56,"e":51.678,"p":true,"h":false},{"t":"베스도가 유대인의 환심을 사려고 바울에게 묻습니다.","s":52.344,"e":56.023,"p":false,"h":false},{"t":"\"네가 예루살렘에 올라가 거기서 이 일로 내 앞에서 재판받기를 원하느냐.\"","s":56.232,"e":61.486,"p":false,"h":false},{"t":"바울이 대답합니다.","s":61.668,"e":63.241,"p":false,"h":false},{"t":"\"나는 가이사의 재판 자리에 서 있습니다.","s":63.576,"e":66.473,"p":false,"h":false},{"t":"여기서 재판을 받는 것이 마땅합니다.","s":66.672,"e":69.399,"p":false,"h":false},{"t":"내가 유대인에게 잘못한 것이 없는 것을 당신도 잘 압니다.","s":69.624,"e":73.747,"p":false,"h":false},{"t":"내가 불의를 행하여 죽을 죄를 지었다면 죽기를 사양하지 않겠습니다.","s":73.98,"e":78.634,"p":false,"h":false},{"t":"그러나 이 사람들이 고발하는 것이 사실이 아니라면 누구도 나를 그들에게 넘겨줄 수 없습니다.","s":78.84,"e":84.896,"p":false,"h":false},{"t":"내가 가이사에게 상소합니다\"(25:9-11).","s":85.248,"e":89.814,"p":false,"h":false},{"t":"베스도는 배석자들과 의논한 후 말합니다.","s":90.036,"e":93.245,"p":false,"h":false},{"t":"\"네가 가이사에게 상소하였으니 가이사에게 가리라\"(25:12).","s":93.456,"e":98.604,"p":true,"h":false},{"t":"며칠 뒤 아그립바 왕과 버니게가 베스도를 방문합니다.","s":99.288,"e":103.301,"p":false,"h":false},{"t":"베스도는 바울의 사건을 왕에게 설명합니다.","s":103.5,"e":106.659,"p":false,"h":false},{"t":"고발하는 사람들이 자신이 생각한 악한 죄는 하나도 내놓지 못했고, 다만 자기들의 종교와 죽은 예수라는 사람, 곧 바울이 살아 있다고 주장하는 사람에 관한 문제로 다투었다는 것입니다.","s":106.884,"e":119.171,"p":false,"h":false},{"t":"자기는 이런 문제를 어떻게 심문할지 몰라 바울에게 예루살렘에서 재판받겠느냐고 물었는데, 바울이 황제의 판결을 받겠다고 상소하여 가이사에게 보낼 때까지 지키라고 명했다고 합니다(25:13-21).","s":119.52,"e":134.555,"p":false,"h":false},{"t":"아그립바가 \"나도 그 사람의 말을 듣고 싶다\" 하자 베스도는 내일 들으라고 합니다(25:22).","s":134.784,"e":142.319,"p":true,"h":false},{"t":"이튿날 아그립바와 버니게가 크게 위엄을 갖추고 와서 천부장들과 시내 높은 사람들과 함께 접견실에 들어가고, 베스도의 명으로 바울이 끌려 나옵니다(25:23).","s":142.992,"e":155.277,"p":false,"h":false},{"t":"베스도는 말합니다.","s":155.484,"e":157.147,"p":false,"h":false},{"t":"\"유대인 온 무리가 이 사람을 살려 두지 못하리라고 외쳤으나, 나는 그에게 죽을죄가 없음을 알았습니다.","s":157.392,"e":164.589,"p":false,"h":false},{"t":"그가 황제에게 상소하여 보내기로 했으나, 황제께 써 보낼 확실한 것이 없습니다.","s":164.916,"e":170.506,"p":false,"h":false},{"t":"그러므로 여러분 앞에, 특히 아그립바 왕 앞에 데려온 것은 심문한 뒤에 쓸 것을 얻기 위해서입니다.","s":170.712,"e":177.486,"p":false,"h":false},{"t":"죄목을 밝히지 않고 죄수를 보내는 것은 무리한 일이라고 생각합니다\"(25:24-27).","s":177.84,"e":185.265,"p":true,"h":false},{"t":"구절 풀이","s":185.94,"e":186.987,"p":true,"h":false},{"t":"25장 10절에서 12절의 상소는 바울이 자기 권리를 사용한 것입니다.","s":187.848,"e":192.803,"p":false,"h":false},{"t":"이 선택이 그를 예루살렘의 암살 음모에서 벗어나게 하고, 23장 11절에서 주님이 말씀하신 \"로마에서 증언하라\"는 길을 열었습니다.","s":192.996,"e":202.616,"p":false,"h":false},{"t":"바울의 상소를 하나님이 이 일에 사용하신 것으로 읽을 수 있지만, 본문이 이 연결을 직접 말하지는 않습니다.","s":202.968,"e":210.252,"p":false,"h":false},{"t":"확실한 것은 바울이 계획대로 움직인 것이 아니라 계속 막히고 갇히는 중에도 주님의 약속이 이루어지는 방향으로 길이 열렸다는 것입니다.","s":210.6,"e":219.798,"p":true,"h":false},{"t":"25장 13절에서 27절은 높은 사람들이 바울을 구경거리처럼 불러내는 장면입니다.","s":220.572,"e":226.964,"p":false,"h":false},{"t":"왕과 총독과 천부장들이 위엄을 갖추고 앉았고, 그 앞에 쇠사슬에 매인 죄수가 섭니다.","s":227.304,"e":233.68,"p":false,"h":false},{"t":"그러나 이 자리가 9장 15절에서 주님이 하신 말씀 \"임금들 앞에 내 이름을 전하게 하겠다\"가 실현되는 무대입니다.","s":233.892,"e":242.146,"p":false,"h":false},{"t":"바울은 권력 앞에서 변명하는 죄수로 서 있지만, 이 자리를 주관하시는 분이 누구인지는 본문이 조용히 보여 줍니다.","s":242.496,"e":250.405,"p":true,"h":false},{"t":"25장 19절의 베스도의 요약이 이 책 전체를 압축합니다.","s":251.208,"e":255.632,"p":false,"h":false},{"t":"로마 관리의 눈에는 \"죽은 예수라는 사람, 바울은 살았다고 주장하는 사람\"에 대한 논쟁입니다.","s":255.852,"e":262.84,"p":false,"h":false},{"t":"복음의 핵심인 부활이 이방인 총독에게는 이렇게 낯선 이야기로 들립니다.","s":263.052,"e":267.931,"p":false,"h":false},{"t":"그러나 그 낯선 이야기가 가이사의 법정까지 가게 된 셈입니다.","s":268.128,"e":272.587,"p":true,"h":false},{"t":"25장 26절의 \"내 주\"는 황제를 가리키는 말로, 베스도는 로마 황제를 주라고 부릅니다.","s":273.24,"e":280.137,"p":false,"h":false},{"t":"이 사건 전체에서 가이사가 주인으로 보이지만, 사도행전은 그 뒤에서 참 주님이 일하고 계시다고 말하고 있습니다.","s":280.332,"e":288.143,"p":true,"h":false}]},{"title":"사도행전_26장","audio":"doc26_2610231348.mp3","dur":372.3,"segs":[{"t":"사도행전 26장","s":0,"e":1.936,"p":true,"h":false},{"t":"전체 흐름","s":2.592,"e":3.624,"p":true,"h":false},{"t":"아그립바 왕이 바울에게 \"네 일을 말해도 좋다\"고 허락하자, 바울은 손을 들어 변명을 시작합니다.","s":4.5,"e":11.684,"p":false,"h":false},{"t":"그는 오래전부터 자기를 아는 유대인들이 자기가 가장 엄격한 바리새파로 살았음을 증언할 수 있다고 하며, 자신이 지금 재판을 받는 것은 하나님이 조상들에게 하신 약속에 대한 소망 때문이라고 말합니다.","s":11.88,"e":25.143,"p":false,"h":false},{"t":"그리고 이렇게 묻습니다.","s":25.488,"e":27.344,"p":false,"h":false},{"t":"\"하나님이 죽은 사람을 살리시는 것을 어찌하여 여러분은 믿을 수 없는 일로 여깁니까\"(26:1-8).","s":27.576,"e":35.221,"p":true,"h":false},{"t":"그는 자신이 한때 나사렛 예수의 이름을 적대해야 한다고 생각했고, 예루살렘에서 많은 성도를 옥에 가두고 죽이는 데 찬성했으며, 회당마다 다니며 그들을 억지로 모독하게 하려 했다고 고백합니다.","s":35.892,"e":48.915,"p":false,"h":false},{"t":"심지어 외국 성들까지 가서 박해했다고 합니다(26:9-11).","s":49.284,"e":54.969,"p":true,"h":false},{"t":"그러고 나서 다메섹 도상의 일을 이야기합니다.","s":55.62,"e":58.904,"p":false,"h":false},{"t":"정오에 해보다 더 밝은 빛이 자기와 일행을 둘러 비추어 모두 땅에 엎드렸고, 히브리 말로 음성이 들렸습니다.","s":59.112,"e":66.621,"p":false,"h":false},{"t":"\"사울아, 사울아, 어찌하여 나를 박해하느냐.","s":66.96,"e":70.877,"p":false,"h":false},{"t":"가시채를 뒤로 차는 것이 네게 어려우니라.\"","s":71.1,"e":74.084,"p":false,"h":false},{"t":"\"주여, 누구십니까.\"","s":74.304,"e":76.163,"p":false,"h":false},{"t":"\"나는 네가 박해하는 예수다\"(26:12-15).","s":76.392,"e":80.98,"p":false,"h":false},{"t":"이어서 주님은 바울에게 사명을 주십니다.","s":81.18,"e":84.239,"p":false,"h":false},{"t":"\"일어나 네 발로 서라.","s":84.456,"e":86.312,"p":false,"h":false},{"t":"내가 네게 나타난 것은 너를 내 종과 네가 본 것과 앞으로 내가 네게 보일 것에 대한 증인으로 세우려는 것이다.","s":86.544,"e":93.867,"p":false,"h":false},{"t":"내가 너를 이 백성과 이방인들에게서 건져 내어 그들에게 보낸다.","s":94.068,"e":98.662,"p":false,"h":false},{"t":"그것은 그들의 눈을 열어 어둠에서 빛으로, 사탄의 권세에서 하나님께로 돌아가게 하고, 나를 믿음으로 죄 사함과 거룩하게 된 사람들 가운데 기업을 얻게 하려는 것이다\"(26:16-18).","s":98.856,"e":112.758,"p":true,"h":false},{"t":"그래서 바울은 \"하늘에서 보이신 것을 거역하지 않고\" 다메섹과 예루살렘과 온 유대 땅과 이방인에게 회개하고 하나님께 돌아와 회개에 합당한 일을 하라고 전했다고 합니다(26:19-20).","s":113.436,"e":127.313,"p":false,"h":false},{"t":"유대인들이 성전에서 자기를 잡아 죽이려 한 것도 이 때문이라고 합니다.","s":127.548,"e":132.274,"p":false,"h":false},{"t":"그리고 말합니다.","s":132.48,"e":133.893,"p":false,"h":false},{"t":"\"내가 하나님의 도움을 받아 오늘까지 서서 작은 사람에게나 큰 사람에게나 증언합니다.","s":134.388,"e":140.22,"p":false,"h":false},{"t":"선지자들과 모세가 장차 될 것이라고 한 것밖에는 말하지 않았습니다.","s":140.436,"e":145.103,"p":false,"h":false},{"t":"곧 그리스도가 고난을 받고, 죽은 자 가운데서 먼저 살아나셔서, 이 백성과 이방인에게 빛을 전하신다는 것입니다\"(26:21-23).","s":145.296,"e":156.309,"p":true,"h":false},{"t":"그가 이렇게 변명하자 베스도가 큰 소리로 말합니다.","s":156.96,"e":160.66,"p":false,"h":false},{"t":"\"바울아, 네가 미쳤다.","s":160.884,"e":163.084,"p":false,"h":false},{"t":"많은 학문이 너를 미치게 한다\"(26:24).","s":163.332,"e":167.539,"p":false,"h":false},{"t":"바울은 대답합니다.","s":167.76,"e":169.433,"p":false,"h":false},{"t":"\"베스도 각하, 나는 미치지 않았습니다.","s":169.668,"e":172.801,"p":false,"h":false},{"t":"참되고 온전한 말을 합니다\"(26:25).","s":173.016,"e":177.154,"p":false,"h":false},{"t":"그러고는 아그립바 왕을 돌아봅니다.","s":177.372,"e":180.006,"p":false,"h":false},{"t":"\"아그립바 왕이여, 선지자들을 믿으십니까.","s":180.216,"e":183.364,"p":false,"h":false},{"t":"믿으시는 줄 압니다\"(26:27).","s":183.564,"e":187.227,"p":false,"h":false},{"t":"아그립바가 대답합니다.","s":187.452,"e":189.361,"p":false,"h":false},{"t":"\"네가 잠깐 말로 나를 그리스도인이 되게 하려 하는구나\"(26:28).","s":189.576,"e":195.182,"p":false,"h":false},{"t":"바울이 말합니다.","s":195.408,"e":196.864,"p":false,"h":false},{"t":"\"말이 짧든 길든, 당신뿐 아니라 오늘 내 말을 듣는 모든 사람이 이 결박 외에는 나와 같이 되기를 하나님께 원합니다\"(26:29).","s":197.316,"e":207.48,"p":false,"h":false},{"t":"왕과 총독이 일어나 물러가며 서로 말합니다.","s":207.72,"e":210.992,"p":false,"h":false},{"t":"\"이 사람은 사형이나 결박을 받을 만한 일을 하지 않았다.\"","s":211.212,"e":215.082,"p":false,"h":false},{"t":"아그립바는 베스도에게 이렇게 말합니다.","s":215.316,"e":218.279,"p":false,"h":false},{"t":"\"이 사람이 가이사에게 상소하지 않았더라면 석방될 수 있었을 것이다\"(26:30-32).","s":218.484,"e":225.742,"p":true,"h":false},{"t":"구절 풀이","s":226.404,"e":227.451,"p":true,"h":false},{"t":"26장 14절의 \"가시채\"는 소를 몰기 위한 막대기입니다.","s":228.312,"e":233.186,"p":false,"h":false},{"t":"가시채를 뒤로 차면 소만 다친다는 속담 같은 말입니다.","s":233.388,"e":237.447,"p":false,"h":false},{"t":"사울이 그리스도를 박해한 것이 그를 해친 것이 아니라 자기를 해치는 일이었다는 뜻으로 읽는 해석이 많습니다.","s":237.672,"e":244.633,"p":false,"h":false},{"t":"이 속담은 9장과 22장에는 없고 이 장에만 나오는데, 청중이 헬라 문화권에 있었기 때문이라고 보는 견해가 있으나, 본문은 이유를 말하지 않습니다.","s":244.98,"e":255.678,"p":true,"h":false},{"t":"26장 16절에서 18절은 바울의 사명을 가장 자세히 말하는 곳입니다.","s":256.464,"e":261.725,"p":false,"h":false},{"t":"눈을 열어 어둠에서 빛으로 돌아가게 한다는 표현은 이사야서와 같은 소리를 냅니다.","s":261.936,"e":267.184,"p":false,"h":false},{"t":"이사야 42장 6절과 7절은 눈먼 사람의 눈을 열고 갇힌 사람을 감옥에서 이끌어 내며 어둠에 앉은 사람을 풀어 준다고 말하는데, 이 일을 하는 분이 \"민족들의 빛\"입니다.","s":267.372,"e":279.378,"p":false,"h":false},{"t":"이 구절의 표현은 그 말씀과 겹치는 것으로 읽는 해석이 많지만, 본문이 이사야를 직접 인용한 것은 아닙니다.","s":279.576,"e":287.347,"p":false,"h":false},{"t":"눈을 여는 분이 사도가 아니라는 점은 분명합니다.","s":287.712,"e":290.948,"p":false,"h":false},{"t":"눈을 열어 주시는 분은 주님이고, 바울은 그 일에 보냄을 받는 사람입니다.","s":291.168,"e":296.493,"p":true,"h":false},{"t":"26장 22절과 23절은 바울이 말하는 것이 새로운 종교가 아니라 \"선지자들과 모세가 말한 것\"이라는 선언입니다.","s":297.144,"e":305.67,"p":false,"h":false},{"t":"그리스도의 고난과 부활과, 이방인에게 빛을 전하시는 일이 구약이 이미 말한 것이라는 뜻이고, 이사야 49장 6절이나 53장을 먼저 읽으신 분은 이 말을 반갑게 느끼실 것입니다.","s":306.036,"e":319.109,"p":true,"h":false},{"t":"26장 28절의 아그립바의 말은 번역이 갈립니다.","s":319.896,"e":323.83,"p":false,"h":false},{"t":"\"네가 조금만 더 말하면 나를 그리스도인으로 만들겠다\"로 읽는 입장도 있고, 비웃으며 \"이렇게 짧은 말로 나를 그리스도인으로 만들려 하느냐\"는 말로 읽는 입장도 있습니다.","s":324.036,"e":336.067,"p":false,"h":false},{"t":"본문은 그가 끝내 믿었는지 말하지 않습니다.","s":336.42,"e":339.631,"p":false,"h":false},{"t":"바울의 대답이 분명한 것은, 왕 앞에서도 결박 외에는 자기와 같이 되기를 원한다는 것입니다.","s":339.84,"e":346.374,"p":true,"h":false},{"t":"26장 31절과 32절의 결말은 아이러니합니다.","s":347.184,"e":351.418,"p":false,"h":false},{"t":"이 사람은 죄가 없고 석방될 수도 있었지만, 가이사에게 상소했기 때문에 로마로 가야 합니다.","s":351.612,"e":358.275,"p":false,"h":false},{"t":"이 일을 바울의 실수로 읽을 수도 있고, 주님이 말씀하신 길(23장 11절)이 열린 것으로 읽을 수도 있습니다.","s":358.488,"e":367.522,"p":false,"h":false},{"t":"본문은 판정하지 않으니 한쪽으로 단정하지 않겠습니다.","s":367.848,"e":371.607,"p":true,"h":false}]},{"title":"사도행전_27장","audio":"doc27_2610231348.mp3","dur":384.2,"segs":[{"t":"사도행전 27장","s":0,"e":1.974,"p":true,"h":false},{"t":"전체 흐름","s":2.628,"e":3.66,"p":true,"h":false},{"t":"이탈리아로 배를 타고 가기로 결정되자 바울과 다른 죄수 몇 사람이 황제 부대의 백부장 율리오에게 넘겨집니다.","s":4.536,"e":11.983,"p":false,"h":false},{"t":"마게도냐 데살로니가 사람 아리스다고가 일행에 있었습니다(27:1-2).","s":12.312,"e":18.538,"p":false,"h":false},{"t":"여기서 본문은 다시 \"우리\"라고 말합니다.","s":18.756,"e":22.078,"p":false,"h":false},{"t":"이 글을 쓴 누가가 바울과 함께 배를 탔다는 뜻으로 읽습니다.","s":22.284,"e":26.635,"p":false,"h":false},{"t":"이튿날 시돈에 이르자 율리오는 바울을 친절하게 대하여 친구들에게 가서 대접받게 해 줍니다(27:3).","s":26.82,"e":34.366,"p":false,"h":false},{"t":"알렉산드리아 배를 갈아타고 여러 날 어렵게 가서 \"아름다운 항구\"라는 곳에 이릅니다(27:4-8).","s":34.596,"e":42.798,"p":true,"h":false},{"t":"금식하는 절기가 이미 지났고 항해하기가 위험하므로 바울이 경고합니다.","s":43.488,"e":48.626,"p":false,"h":false},{"t":"\"여러분, 내가 보니 이번 항해는 하물과 배만 아니라 우리 생명에도 큰 손해와 위험이 있을 것입니다\"(27:9-10).","s":48.816,"e":57.876,"p":false,"h":false},{"t":"그러나 백부장은 바울의 말보다 선장과 선주의 말을 따릅니다.","s":58.104,"e":62.401,"p":false,"h":false},{"t":"항구가 겨울을 나기에 불편하다고 하여 대다수가 출항하자는 의견이었습니다.","s":62.604,"e":67.763,"p":false,"h":false},{"t":"마침 남풍이 순하게 불자 뜻을 이룬 줄 알고 출항했으나, 얼마 못 되어 유라굴로라는 광풍이 몰아칩니다(27:11-15).","s":67.968,"e":77.611,"p":false,"h":false},{"t":"배는 바람에 밀려 떠내려가고, 사람들은 짐을 바다에 던지고 배의 기구까지 내버렸습니다.","s":77.832,"e":84.236,"p":false,"h":false},{"t":"여러 날 해도 별도 보이지 않고 큰 풍랑이 치자 \"구원의 여망마저 없어졌다\"고 본문은 말합니다(27:16-20).","s":84.6,"e":94.122,"p":true,"h":false},{"t":"그때 바울이 일어나 말합니다.","s":94.788,"e":97.047,"p":false,"h":false},{"t":"오래 먹지 못한 사람들에게 크레타에서 떠나지 말라고 했는데 그렇게 하지 않아 이 손해를 당했다고 하며 책망하는 듯하다가, 말을 이어 갑니다.","s":97.272,"e":106.451,"p":false,"h":false},{"t":"\"그러나 이제 여러분에게 권합니다.","s":106.632,"e":108.993,"p":false,"h":false},{"t":"안심하십시오.","s":109.224,"e":110.507,"p":false,"h":false},{"t":"배만 손해를 볼 뿐 여러분 중에 한 사람도 생명을 잃지 않을 것입니다.","s":111.132,"e":115.899,"p":false,"h":false},{"t":"내가 속한 하나님, 내가 섬기는 하나님의 사자가 어젯밤 내 곁에 서서 말했습니다.","s":116.1,"e":122.206,"p":false,"h":false},{"t":"'바울아, 두려워하지 말라.","s":122.58,"e":124.914,"p":false,"h":false},{"t":"네가 가이사 앞에 서야 하겠고, 보라, 하나님이 너와 함께 배 탄 모든 사람을 네게 주셨다.'","s":125.136,"e":131.806,"p":false,"h":false},{"t":"그러므로 여러분, 안심하십시오.","s":132.048,"e":134.675,"p":false,"h":false},{"t":"나는 하나님을 믿습니다.","s":134.892,"e":136.811,"p":false,"h":false},{"t":"내게 말씀하신 그대로 될 것입니다\"(27:21-25).","s":137.016,"e":142.416,"p":false,"h":false},{"t":"단, 어느 섬에 걸리게 될 것이라고 덧붙입니다(27:26).","s":142.632,"e":148.13,"p":true,"h":false},{"t":"열나흘째 밤이 되어 뱃사람들이 육지에 가까워지는 것을 짐작합니다.","s":148.824,"e":153.637,"p":false,"h":false},{"t":"그들은 닻을 내리고 날 새기를 기다렸으나, 일부 뱃사람들이 거룻배를 내려 뱃머리에서 닻을 놓는 척하면서 도망하려 합니다.","s":153.828,"e":162.327,"p":false,"h":false},{"t":"바울이 백부장과 군인들에게 말합니다.","s":162.54,"e":165.344,"p":false,"h":false},{"t":"\"이 사람들이 배에 있지 아니하면 당신들도 구원을 얻을 수 없습니다.\"","s":165.564,"e":170.325,"p":false,"h":false},{"t":"군인들은 거룻줄을 끊어 떨어지게 합니다(27:27-32).","s":170.532,"e":176.151,"p":false,"h":false},{"t":"날이 새려 할 때 바울은 모든 사람에게 음식을 먹으라고 권합니다.","s":176.364,"e":180.712,"p":false,"h":false},{"t":"\"여러분 중 머리카락 하나라도 잃을 사람이 없을 것입니다.\"","s":180.9,"e":184.784,"p":false,"h":false},{"t":"그러고는 떡을 가져다 모든 사람 앞에서 하나님께 감사하고 떼어 먹기 시작하자, 모두 안심하고 먹었습니다.","s":185.004,"e":192.403,"p":false,"h":false},{"t":"배 안의 사람은 모두 이백칠십육 명이었습니다(27:33-37).","s":192.744,"e":198.867,"p":true,"h":false},{"t":"날이 밝자 한 만을 발견하고 배를 해안으로 대려 하다가 두 물이 합하는 곳에서 배가 얹혀 뱃머리는 박혀 움직이지 않고 선미는 풍랑에 깨집니다(27:39-41).","s":199.548,"e":211.569,"p":false,"h":false},{"t":"군인들은 죄수들이 헤엄쳐 도망할까 봐 죽이려 하나, 백부장이 바울을 구하려고 그 뜻을 막습니다.","s":211.788,"e":218.735,"p":false,"h":false},{"t":"그는 헤엄칠 수 있는 사람은 먼저 뛰어내리고 나머지는 널조각이나 배 물건에 의지해 가라고 명합니다.","s":219.06,"e":225.715,"p":false,"h":false},{"t":"이리하여 모두 상륙하여 구원을 받았습니다(27:42-44).","s":226.08,"e":232.075,"p":true,"h":false},{"t":"구절 풀이","s":232.74,"e":233.787,"p":true,"h":false},{"t":"27장 23절에서 25절이 이 장의 열쇠입니다.","s":234.648,"e":238.817,"p":false,"h":false},{"t":"바울은 풍랑 속에서 자기가 사람들을 건져 낼 방법을 찾지 않습니다.","s":239.04,"e":243.832,"p":false,"h":false},{"t":"하나님의 사자가 한 말씀, \"네가 가이사 앞에 서야 한다\"는 23장 11절의 약속이 여기서 다시 확인됩니다.","s":244.044,"e":252.361,"p":false,"h":false},{"t":"그리고 하나님이 \"너와 함께 배 탄 모든 사람을 네게 주셨다\"고 하십니다.","s":252.72,"e":258.143,"p":false,"h":false},{"t":"바울이 이들을 구하는 것이 아니라 하나님이 주시는 것이라는 점을 놓치지 않는 것이 중요합니다.","s":258.372,"e":264.214,"p":false,"h":false},{"t":"바울은 사람들 앞에서 이 말씀을 전하며 \"나는 하나님을 믿습니다\"라고 말합니다.","s":264.564,"e":270.352,"p":false,"h":false},{"t":"이 구절에서 눈에 띄는 것은 바울이 해결사처럼 서는 것이 아니라 약속을 받은 사람으로 서 있다는 점입니다.","s":270.54,"e":277.662,"p":true,"h":false},{"t":"27장 10절과 11절에서 바울이 위험을 경고했으나 사람들은 따르지 않았고, 그 결과 큰 손해를 보았습니다.","s":278.46,"e":286.294,"p":false,"h":false},{"t":"이 일을 바울에게 영적 통찰이 있어서 미리 알았다고 읽는 입장도 있고, 경험 많은 여행자가 한 판단이라고 읽는 입장도 있습니다.","s":286.632,"e":295.324,"p":false,"h":false},{"t":"본문은 바울의 이 말을 예언이라고 설명하지 않으므로 단정하지 않겠습니다.","s":295.668,"e":300.577,"p":false,"h":false},{"t":"다만 약속된 구원은 이 경고를 무시한 실수들 속에서도 그대로 이루어집니다.","s":300.78,"e":306.391,"p":true,"h":false},{"t":"27장 31절의 \"이 사람들이 배에 있지 아니하면 당신들도 구원을 얻을 수 없다\"는 앞서 24절의 약속과 어긋나는 것처럼 보여서 읽는 사람을 멈추게 합니다.","s":307.044,"e":318.525,"p":false,"h":false},{"t":"하나님이 목숨을 구하겠다고 약속하셨는데 왜 뱃사람들을 붙잡아야 하는가 하는 질문입니다.","s":318.852,"e":324.881,"p":false,"h":false},{"t":"개혁신학은 이것을 하나님이 목적과 수단을 함께 정하셔서, 약속하신 구원이 사람의 책임 있는 행동을 통해 이루어지는 모습으로 읽어 왔습니다.","s":325.224,"e":334.76,"p":false,"h":false},{"t":"하나님이 하시는 일과 사람이 하는 일이 모순되지 않는다는 점이 이 구절에 잘 드러납니다.","s":335.088,"e":340.978,"p":true,"h":false},{"t":"27장 35절은 짧은 장면이지만 인상적입니다.","s":341.784,"e":345.906,"p":false,"h":false},{"t":"죽음을 눈앞에 둔 이백칠십육 명 앞에서 바울이 떡을 들고 \"하나님께 감사\"합니다.","s":346.14,"e":351.949,"p":false,"h":false},{"t":"이 구절은 성찬을 직접 가리키는 말이 아니라는 점에서 읽는 입장이 갈리지만, 중요한 것은 풍랑이 가라앉기 전에 먼저 감사하는 믿음의 모습입니다.","s":352.152,"e":361.836,"p":true,"h":false},{"t":"27장 43절에서 죄수 바울을 구한 사람은 군인을 제지한 이방인 백부장입니다.","s":362.628,"e":368.612,"p":false,"h":false},{"t":"본문은 \"바울을 구하려고\"라고 말합니다.","s":368.964,"e":372.223,"p":false,"h":false},{"t":"앞서 3절에서 친절히 대한 것도 같은 사람입니다.","s":372.42,"e":375.974,"p":false,"h":false},{"t":"하나님이 이방인 장교를 쓰셔서 약속을 지키셨다는 읽기가 가능하지만, 본문이 직접 말하는 것은 아닙니다.","s":376.2,"e":383.361,"p":true,"h":false}]},{"title":"사도행전_28장","audio":"doc28_2610231348.mp3","dur":408.7,"segs":[{"t":"사도행전 28장","s":0,"e":1.924,"p":true,"h":false},{"t":"전체 흐름","s":2.556,"e":3.588,"p":true,"h":false},{"t":"배에서 상륙한 뒤 그들은 그 섬이 멜리데라 불리는 곳임을 알게 됩니다.","s":4.464,"e":9.389,"p":false,"h":false},{"t":"원주민들이 특별한 동정을 보이며 비가 오고 추우므로 불을 피워 모두를 영접합니다(28:1-2).","s":9.756,"e":17.574,"p":false,"h":false},{"t":"바울이 나뭇가지 한 묶음을 거두어 불에 넣자 뜨거운 기운 때문에 독사가 나와 그의 손을 뭅니다.","s":17.784,"e":24.243,"p":false,"h":false},{"t":"원주민들은 뱀이 그의 손에 매달린 것을 보고 \"이 사람은 살인자로다.","s":24.588,"e":29.685,"p":false,"h":false},{"t":"바다에서는 구했으나 공의가 살려 두지 않는다\"고 서로 말합니다(28:3-4).","s":29.916,"e":36.983,"p":false,"h":false},{"t":"바울이 뱀을 불에 떨어 버렸으나 아무 해도 입지 않았습니다.","s":37.188,"e":41.058,"p":false,"h":false},{"t":"그가 붓거나 갑자기 쓰러져 죽을 줄 알고 오래 기다리던 사람들은 아무 이상이 없는 것을 보고 생각을 바꾸어 \"그는 신이다\" 하였습니다(28:5-6).","s":41.256,"e":52.495,"p":true,"h":false},{"t":"그 섬의 높은 사람 보블리오의 아버지가 열병과 이질로 누워 있었습니다.","s":53.172,"e":58.219,"p":false,"h":false},{"t":"바울이 들어가 기도하고 손을 얹어 고치자 섬의 다른 병자들도 와서 고침을 받았습니다.","s":58.428,"e":64.22,"p":false,"h":false},{"t":"그들은 우리를 극진히 예우하고 떠날 때 필요한 것들을 배에 실어 주었습니다(28:7-10).","s":64.584,"e":71.592,"p":false,"h":false},{"t":"석 달 후 알렉산드리아 배를 타고 시라구사와 레기온을 거쳐 보디올에 이릅니다.","s":71.82,"e":77.142,"p":false,"h":false},{"t":"거기서 형제들을 만나 이레를 함께 머물렀고, 그리고 로마로 갑니다(28:11-14).","s":77.364,"e":84.765,"p":true,"h":false},{"t":"로마의 형제들은 우리 소식을 듣고 아피오 광장과 트레이스 타베르네까지 마중 나옵니다.","s":85.428,"e":91.398,"p":false,"h":false},{"t":"바울은 그들을 보고 하나님께 감사하며 담대한 마음을 얻었습니다(28:15).","s":91.764,"e":98.124,"p":false,"h":false},{"t":"로마에 들어가서는 바울이 자기를 지키는 군인 한 명과 함께 따로 있도록 허락받습니다(28:16).","s":98.352,"e":105.775,"p":true,"h":false},{"t":"사흘 후 바울은 유대인 중 높은 사람들을 청해 말합니다.","s":106.452,"e":110.331,"p":false,"h":false},{"t":"자기는 우리 백성이나 조상의 관습을 거스른 일이 없는데 예루살렘에서 죄수로 로마 사람의 손에 넘겨졌고, 로마 사람들이 심문한 후 죽일 죄가 없어 놓으려 했으나 유대인들이 반대하여 어쩔 수 없이 가이사에게 상소했다고 합니다.","s":110.556,"e":125.743,"p":false,"h":false},{"t":"그리고 자기를 만나 이야기하자고 청한 것은 \"이스라엘의 소망 때문에 이 쇠사슬에 매였기 때문\"이라고 합니다(28:17-20).","s":126.072,"e":136.082,"p":false,"h":false},{"t":"그들은 유대에서 바울에 대한 편지도 받은 일이 없고 어떤 형제도 나쁜 말을 한 적이 없으나, 이 파에 대해서는 어디서나 반대가 있다고 들었으니 그 생각을 듣기 원한다고 합니다(28:21-22).","s":136.296,"e":150.76,"p":true,"h":false},{"t":"날을 정해 많은 사람이 바울의 숙소에 이릅니다.","s":151.452,"e":154.749,"p":false,"h":false},{"t":"바울은 아침부터 저녁까지 하나님 나라를 증언하며 모세의 율법과 선지자의 글로 예수에 대해 설득합니다(28:23).","s":154.98,"e":163.932,"p":false,"h":false},{"t":"어떤 사람은 그 말을 믿었고 어떤 사람은 믿지 않았습니다.","s":164.16,"e":168.311,"p":false,"h":false},{"t":"서로 의견이 맞지 않자 그들이 흩어질 때 바울이 마지막 한 말을 합니다.","s":168.516,"e":173.478,"p":false,"h":false},{"t":"\"성령이 선지자 이사야를 통해 여러분의 조상들에게 말씀하신 것이 옳도다\"(28:24-25).","s":173.664,"e":181.335,"p":false,"h":false},{"t":"그리고 이사야 6장 9절과 10절을 인용합니다.","s":181.548,"e":185.065,"p":false,"h":false},{"t":"\"이 백성에게 가서 말하라.","s":185.292,"e":187.355,"p":false,"h":false},{"t":"너희가 듣기는 들어도 깨닫지 못하고, 보기는 보아도 알지 못하리라.","s":187.596,"e":192.43,"p":false,"h":false},{"t":"이 백성의 마음이 둔하여 귀로는 듣기 어렵고 눈은 감았으니, 눈으로 보고 귀로 듣고 마음으로 깨달아 돌이켜 내게 고침을 받을까 함이라\"(28:26-27).","s":192.636,"e":204.621,"p":false,"h":false},{"t":"그리고 이어서 말합니다.","s":204.84,"e":206.749,"p":false,"h":false},{"t":"\"그러므로 하나님의 이 구원이 이방인에게 보내진 줄을 여러분이 알아야 합니다.","s":206.964,"e":211.952,"p":false,"h":false},{"t":"그들은 들을 것입니다\"(28:28).","s":212.148,"e":215.956,"p":true,"h":false},{"t":"마지막 두 절이 이 책의 끝입니다.","s":216.612,"e":219.171,"p":false,"h":false},{"t":"바울은 자기 셋집에서 꼬박 이 년을 지내며 자기에게 오는 사람을 다 영접하여 \"하나님 나라를 전파하고 주 예수 그리스도에 관한 것을 가르쳤는데 담대히 거침없이\" 했다고 합니다(28:30-31).","s":219.384,"e":233.858,"p":true,"h":false},{"t":"구절 풀이","s":234.54,"e":235.587,"p":true,"h":false},{"t":"28장 1절에서 6절의 독사 이야기는 읽는 사람에게 웃음과 놀라움을 줍니다.","s":236.448,"e":242.057,"p":false,"h":false},{"t":"원주민들은 처음에는 살인자라고 하다가 신이라고 합니다.","s":242.28,"e":246.172,"p":false,"h":false},{"t":"14장에서 루스드라 사람들이 사도들을 신이라 하던 장면과 닮았습니다.","s":246.384,"e":251.393,"p":false,"h":false},{"t":"바울은 여기서 아무 말도 하지 않습니다.","s":251.604,"e":254.477,"p":false,"h":false},{"t":"사람들의 생각은 바뀌지만, 바울이 구원받은 것은 하나님이 지키셨기 때문이라는 점이 본문의 흐름에 가깝습니다.","s":254.7,"e":262.438,"p":false,"h":false},{"t":"본문은 이 일을 하나님의 일이라고 직접 해석하지는 않습니다.","s":262.764,"e":266.873,"p":true,"h":false},{"t":"28장 15절의 \"하나님께 감사하며 담대한 마음을 얻었다\"는 문장이 눈에 띕니다.","s":267.516,"e":274.016,"p":false,"h":false},{"t":"풍랑과 뱀 앞에서도 굳셌던 바울이, 로마 형제들이 마중 나온 것을 보고서야 담대함을 얻었다고 합니다.","s":274.212,"e":281.421,"p":false,"h":false},{"t":"사도도 형제들의 얼굴을 통해 위로받는 사람이었다는 점을 조용히 보여 줍니다.","s":281.736,"e":286.79,"p":false,"h":false},{"t":"사도의 우월성이 아니라 교회가 서로를 세우는 모습입니다.","s":286.992,"e":291.103,"p":true,"h":false},{"t":"28장 25절에서 28절은 이 책에서 가장 중요한 마지막 말씀입니다.","s":291.78,"e":297.359,"p":false,"h":false},{"t":"바울은 이사야 6장 9절과 10절을 인용합니다.","s":297.72,"e":301.293,"p":false,"h":false},{"t":"이사야 6장은 이사야가 처음 소명을 받던 장면이고, 그때 주님이 이사야에게 이 백성의 귀와 눈이 막힐 것이라고 말씀하셨습니다.","s":301.5,"e":310.647,"p":false,"h":false},{"t":"이사야서의 첫 부분이 사도행전의 마지막 장면에 다시 나오는 셈입니다.","s":311.004,"e":316.052,"p":false,"h":false},{"t":"그리고 이 말씀을 하신 분을 바울은 \"성령\"이라고 말합니다.","s":316.26,"e":320.771,"p":false,"h":false},{"t":"이사야를 통해 말씀하신 분이 성령이시고, 같은 성령이 지금도 이 일을 이끌고 계신다는 뜻입니다.","s":320.976,"e":327.78,"p":false,"h":false},{"t":"복음이 이방인에게 보내진다는 선언은 이사야 49장 6절과 56장의 약속이 성취되는 흐름으로 읽을 수 있습니다.","s":328.14,"e":336.038,"p":false,"h":false},{"t":"다만 28절이 이스라엘이 버려졌다는 의미인지, 일부의 거절이 이방인 선교의 계기가 된다는 의미인지는 해석이 갈립니다.","s":336.384,"e":344.968,"p":false,"h":false},{"t":"이 글에서는 한쪽으로 단정하지 않겠습니다.","s":345.312,"e":348.434,"p":false,"h":false},{"t":"이스라엘 가운데 믿은 사람도 있었고(24절), 바울은 마지막 순간에도 모든 사람을 영접했다는 점(30절)을 함께 기억하는 것이 균형 있는 읽기입니다.","s":348.66,"e":360.306,"p":true,"h":false},{"t":"28장 30절과 31절은 이 책의 결말입니다.","s":361.08,"e":365.129,"p":false,"h":false},{"t":"이 책은 바울의 재판 결과도, 순교도 말하지 않고 끝납니다.","s":365.328,"e":370.132,"p":false,"h":false},{"t":"대신 마지막 단어가 \"거침없이\"입니다.","s":370.332,"e":373.529,"p":false,"h":false},{"t":"사슬에 매인 사람이 가이사의 도성에서 하나님 나라를 전파하는데, 그 복음을 막는 것은 아무것도 없다는 말입니다.","s":373.752,"e":381.635,"p":false,"h":false},{"t":"책의 첫머리에서 누가는 앞서 쓴 책이 \"예수께서 행하시고 가르치시기를 시작하신 모든 것\"이라 했는데, 마지막 두 절은 바울이 \"주 예수 그리스도에 관한 것을 가르쳤다\"고 합니다.","s":381.996,"e":394.577,"p":false,"h":false},{"t":"가르침을 시작하신 분의 일이 이렇게 계속된다는 읽기가 가능합니다.","s":394.92,"e":399.442,"p":false,"h":false},{"t":"이야기가 이렇게 열린 채로 끝나는 것을 두고, 교회의 역사가 지금도 이 이야기의 연장이라는 뜻으로 읽는 해석이 많습니다.","s":399.636,"e":407.908,"p":true,"h":false}]}];
  const N = TRACKS.length;
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narrall:' + TITLE + ':' + (N ? TRACKS[0].audio : '');
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let auto = true, spd = 1, fsi = 2, ti = 0, lastK = -1, lastI = -1, lastUser = 0, playing = false, tickId = 0, lastSave = 0;
  const audio = new Audio();
  audio.preload = 'auto';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }
  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }
  function segs() { return TRACKS[ti].segs; }

  /* 글 그리기 (모든 글을 위에서 아래로 이어서) */
  (function build() {
    let html = '', toc = '', total = 0;
    TRACKS.forEach((tr, k) => {
      total += tr.dur || 0;
      html += '<section class="trk" id="t' + k + '"><h2 class="tt">' + (k + 1) + '. ' + esc(tr.title) + '</h2>';
      let para = '';
      tr.segs.forEach((g, i) => {
        const span = '<span class="seg" id="g' + k + '_' + i + '" data-k="' + k + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
        if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h3 class="hd">' + span + '</h3>'; }
        else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
      });
      if (para) { html += '<p>' + para + '</p>'; }
      html += '</section>';
      toc += '<li><a href="#t' + k + '" data-k="' + k + '">' + esc(tr.title) + '<span class="d">' + fmt(tr.dur) + '</span></a></li>';
    });
    $('text').innerHTML = html;
    $('toc').innerHTML = toc;
    $('meta').textContent = '글 ' + N + '개 · 전체 듣는 시간 약 ' + fmt(total) + ' · 끝나면 다음 글로 이어서 들려요';
  })();

  function applyAuto() {
    const b = $('auto'), h = $('autohint');
    b.classList.toggle('on', auto); b.setAttribute('aria-pressed', auto ? 'true' : 'false');
    b.textContent = auto ? '🔁 이어듣기 켜짐 ✔' : '⏹ 이어듣기 꺼짐';
    h.classList.toggle('off', !auto);
    h.textContent = auto ? '초록색이면 켜진 상태입니다. 그대로 두고 아래 ▶ 재생만 누르세요. (이 단추를 누르면 꺼집니다)' : '지금은 꺼져 있어서 한 글만 듣고 멈춥니다. 위 회색 단추를 눌러 켜세요.';
  }
  function hideNote() { $('note').style.display = 'none'; }
  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.defaultPlaybackRate = SPEEDS[spd]; audio.playbackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applyAuto();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { const S = segs(); let k = -1; for (let i = 0; i < S.length; i++) { if (S[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function clearMark() { const o = $('g' + lastK + '_' + lastI); if (o) { o.classList.remove('on'); } lastK = -1; lastI = -1; }
  function mark(i, follow) {
    if (i === lastI && ti === lastK) { return; }
    const old = $('g' + lastK + '_' + lastI); if (old) { old.classList.remove('on'); }
    lastK = ti; lastI = i;
    const el = $('g' + ti + '_' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function updateNow() { $('now').textContent = (ti + 1) + ' / ' + N + ' · ' + TRACKS[ti].title; }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || TRACKS[ti].dur || 0;
    $('cur').textContent = fmt(t);
    $('tot').textContent = fmt(d);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
    try { if ('mediaSession' in navigator) { navigator.mediaSession.playbackState = p ? 'playing' : 'paused'; } } catch (e) {}
  }
  function savePos() { pref('pos', ti + ':' + (audio.currentTime || 0)); }
  function play() { const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); savePos(); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || TRACKS[ti].dur || t))); paint(); }

  function mediaMeta() {
    try { if ('mediaSession' in navigator && window.MediaMetadata) { navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[ti].title, artist: TITLE, album: TITLE }); } } catch (e) {}
  }
  function prefetch(k) { if (k >= 0 && k < N) { try { const a = new Audio(); a.preload = 'auto'; a.src = TRACKS[k].audio; } catch (e) {} } }

  /* 글 바꾸기: 같은 페이지, 같은 소리 재생기를 계속 써서 폰에서도 끊기지 않고 이어집니다 */
  function loadTrack(k, start, auto) {
    if (k < 0 || k >= N) { return; }
    ti = k; lastUser = 0;
    audio.src = TRACKS[k].audio;
    applySpd();
    const st = start || 0;
    const onMeta = () => { audio.removeEventListener('loadedmetadata', onMeta); if (st > 0) { try { audio.currentTime = st; } catch (e) {} } paint(); };
    audio.addEventListener('loadedmetadata', onMeta);
    clearMark(); updateNow(); mediaMeta(); prefetch(k + 1);
    if (auto) { play(); } else { paint(); }
  }
  function jump(k, i) {
    const S = TRACKS[k] && TRACKS[k].segs; if (!S || i < 0 || i >= S.length) { return; }
    lastUser = 0;
    if (k !== ti) { loadTrack(k, S[i].s, true); return; }
    seek(S[i].s); mark(i, true); if (!playing) { play(); }
  }

  audio.addEventListener('timeupdate', () => {
    if (!playing) { paint(); }
    if (Date.now() - lastSave > 4000) { lastSave = Date.now(); savePos(); }
  });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => {
    if (ti < N - 1) {
      if (auto) { loadTrack(ti + 1, 0, true); return; }
      setPlaying(false); clearMark(); pref('pos', (ti + 1) + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); loadTrack(ti + 1, 0, true); };
    } else { setPlaying(false); pref('pos', '0:0'); clearMark(); }
  });
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('auto').onclick = () => { auto = !auto; applyAuto(); hideNote(); };
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => {
    const t = audio.currentTime || 0, i = idxAt(t), cur = segs()[i];
    if (cur && t - cur.s > 2) { jump(ti, i); }
    else if (i > 0) { jump(ti, i - 1); }
    else if (ti > 0) { loadTrack(ti - 1, 0, true); }
    else { seek(0); }
  };
  $('next').onclick = () => {
    const i = idxAt(audio.currentTime || 0) + 1;
    if (i < segs().length) { jump(ti, i); } else if (ti < N - 1) { loadTrack(ti + 1, 0, true); }
  };
  $('pt').onclick = () => { if ((audio.currentTime || 0) > 5 || ti === 0) { jump(ti, 0); } else { loadTrack(ti - 1, 0, true); } };
  $('nt').onclick = () => { if (ti < N - 1) { loadTrack(ti + 1, 0, true); } };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || TRACKS[ti].dur || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-k'), +s.getAttribute('data-i')); } });
  $('toc').addEventListener('click', e => {
    const a = e.target.closest ? e.target.closest('a') : null; if (!a) { return; }
    e.preventDefault(); $('lst').open = false; lastUser = 0;
    const k = +a.getAttribute('data-k');
    loadTrack(k, 0, true);
    const sec = $('t' + k); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
  });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  /* 잠금 화면·이어폰 단추 */
  try {
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
      set('play', play); set('pause', pause);
      set('nexttrack', () => $('nt').onclick()); set('previoustrack', () => $('pt').onclick());
      set('seekbackward', () => seek((audio.currentTime || 0) - 10)); set('seekforward', () => seek((audio.currentTime || 0) + 10));
    }
  } catch (e) {}

  /* 시작: 첫 글을 준비해 두고, 지난번 위치가 있으면 이어 듣기 안내 */
  loadTrack(0, 0, false);
  const sp = (pref('pos') || '').split(':'), rk = parseInt(sp[0], 10), rt = parseFloat(sp[1]);
  if (rk >= 0 && rk < N && rt > 10 && rt < (TRACKS[rk].dur || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + esc(TRACKS[rk].title) + '</b> ' + fmt(rt) + '까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { r.style.display = 'none'; loadTrack(rk, rt, true); };
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, loadTrack, toggle, audio, TRACKS, state: () => ({ ti, auto, playing }) };
})();
</script>
</body>
</html>
