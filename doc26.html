(function () {
  const TITLE = "사도행전_26장", AUDIO_SRC = "doc26_2610231348.mp3", DUR = 372, SEGS = [{"t":"사도행전 26장","s":0,"e":1.936,"p":true,"h":false},{"t":"전체 흐름","s":2.592,"e":3.624,"p":true,"h":false},{"t":"아그립바 왕이 바울에게 \"네 일을 말해도 좋다\"고 허락하자, 바울은 손을 들어 변명을 시작합니다.","s":4.5,"e":11.684,"p":false,"h":false},{"t":"그는 오래전부터 자기를 아는 유대인들이 자기가 가장 엄격한 바리새파로 살았음을 증언할 수 있다고 하며, 자신이 지금 재판을 받는 것은 하나님이 조상들에게 하신 약속에 대한 소망 때문이라고 말합니다.","s":11.88,"e":25.143,"p":false,"h":false},{"t":"그리고 이렇게 묻습니다.","s":25.488,"e":27.344,"p":false,"h":false},{"t":"\"하나님이 죽은 사람을 살리시는 것을 어찌하여 여러분은 믿을 수 없는 일로 여깁니까\"(26:1-8).","s":27.576,"e":35.221,"p":true,"h":false},{"t":"그는 자신이 한때 나사렛 예수의 이름을 적대해야 한다고 생각했고, 예루살렘에서 많은 성도를 옥에 가두고 죽이는 데 찬성했으며, 회당마다 다니며 그들을 억지로 모독하게 하려 했다고 고백합니다.","s":35.892,"e":48.915,"p":false,"h":false},{"t":"심지어 외국 성들까지 가서 박해했다고 합니다(26:9-11).","s":49.284,"e":54.969,"p":true,"h":false},{"t":"그러고 나서 다메섹 도상의 일을 이야기합니다.","s":55.62,"e":58.904,"p":false,"h":false},{"t":"정오에 해보다 더 밝은 빛이 자기와 일행을 둘러 비추어 모두 땅에 엎드렸고, 히브리 말로 음성이 들렸습니다.","s":59.112,"e":66.621,"p":false,"h":false},{"t":"\"사울아, 사울아, 어찌하여 나를 박해하느냐.","s":66.96,"e":70.877,"p":false,"h":false},{"t":"가시채를 뒤로 차는 것이 네게 어려우니라.\"","s":71.1,"e":74.084,"p":false,"h":false},{"t":"\"주여, 누구십니까.\"","s":74.304,"e":76.163,"p":false,"h":false},{"t":"\"나는 네가 박해하는 예수다\"(26:12-15).","s":76.392,"e":80.98,"p":false,"h":false},{"t":"이어서 주님은 바울에게 사명을 주십니다.","s":81.18,"e":84.239,"p":false,"h":false},{"t":"\"일어나 네 발로 서라.","s":84.456,"e":86.312,"p":false,"h":false},{"t":"내가 네게 나타난 것은 너를 내 종과 네가 본 것과 앞으로 내가 네게 보일 것에 대한 증인으로 세우려는 것이다.","s":86.544,"e":93.867,"p":false,"h":false},{"t":"내가 너를 이 백성과 이방인들에게서 건져 내어 그들에게 보낸다.","s":94.068,"e":98.662,"p":false,"h":false},{"t":"그것은 그들의 눈을 열어 어둠에서 빛으로, 사탄의 권세에서 하나님께로 돌아가게 하고, 나를 믿음으로 죄 사함과 거룩하게 된 사람들 가운데 기업을 얻게 하려는 것이다\"(26:16-18).","s":98.856,"e":112.758,"p":true,"h":false},{"t":"그래서 바울은 \"하늘에서 보이신 것을 거역하지 않고\" 다메섹과 예루살렘과 온 유대 땅과 이방인에게 회개하고 하나님께 돌아와 회개에 합당한 일을 하라고 전했다고 합니다(26:19-20).","s":113.436,"e":127.313,"p":false,"h":false},{"t":"유대인들이 성전에서 자기를 잡아 죽이려 한 것도 이 때문이라고 합니다.","s":127.548,"e":132.274,"p":false,"h":false},{"t":"그리고 말합니다.","s":132.48,"e":133.893,"p":false,"h":false},{"t":"\"내가 하나님의 도움을 받아 오늘까지 서서 작은 사람에게나 큰 사람에게나 증언합니다.","s":134.388,"e":140.22,"p":false,"h":false},{"t":"선지자들과 모세가 장차 될 것이라고 한 것밖에는 말하지 않았습니다.","s":140.436,"e":145.103,"p":false,"h":false},{"t":"곧 그리스도가 고난을 받고, 죽은 자 가운데서 먼저 살아나셔서, 이 백성과 이방인에게 빛을 전하신다는 것입니다\"(26:21-23).","s":145.296,"e":156.309,"p":true,"h":false},{"t":"그가 이렇게 변명하자 베스도가 큰 소리로 말합니다.","s":156.96,"e":160.66,"p":false,"h":false},{"t":"\"바울아, 네가 미쳤다.","s":160.884,"e":163.084,"p":false,"h":false},{"t":"많은 학문이 너를 미치게 한다\"(26:24).","s":163.332,"e":167.539,"p":false,"h":false},{"t":"바울은 대답합니다.","s":167.76,"e":169.433,"p":false,"h":false},{"t":"\"베스도 각하, 나는 미치지 않았습니다.","s":169.668,"e":172.801,"p":false,"h":false},{"t":"참되고 온전한 말을 합니다\"(26:25).","s":173.016,"e":177.154,"p":false,"h":false},{"t":"그러고는 아그립바 왕을 돌아봅니다.","s":177.372,"e":180.006,"p":false,"h":false},{"t":"\"아그립바 왕이여, 선지자들을 믿으십니까.","s":180.216,"e":183.364,"p":false,"h":false},{"t":"믿으시는 줄 압니다\"(26:27).","s":183.564,"e":187.227,"p":false,"h":false},{"t":"아그립바가 대답합니다.","s":187.452,"e":189.361,"p":false,"h":false},{"t":"\"네가 잠깐 말로 나를 그리스도인이 되게 하려 하는구나\"(26:28).","s":189.576,"e":195.182,"p":false,"h":false},{"t":"바울이 말합니다.","s":195.408,"e":196.864,"p":false,"h":false},{"t":"\"말이 짧든 길든, 당신뿐 아니라 오늘 내 말을 듣는 모든 사람이 이 결박 외에는 나와 같이 되기를 하나님께 원합니다\"(26:29).","s":197.316,"e":207.48,"p":false,"h":false},{"t":"왕과 총독이 일어나 물러가며 서로 말합니다.","s":207.72,"e":210.992,"p":false,"h":false},{"t":"\"이 사람은 사형이나 결박을 받을 만한 일을 하지 않았다.\"","s":211.212,"e":215.082,"p":false,"h":false},{"t":"아그립바는 베스도에게 이렇게 말합니다.","s":215.316,"e":218.279,"p":false,"h":false},{"t":"\"이 사람이 가이사에게 상소하지 않았더라면 석방될 수 있었을 것이다\"(26:30-32).","s":218.484,"e":225.742,"p":true,"h":false},{"t":"구절 풀이","s":226.404,"e":227.451,"p":true,"h":false},{"t":"26장 14절의 \"가시채\"는 소를 몰기 위한 막대기입니다.","s":228.312,"e":233.186,"p":false,"h":false},{"t":"가시채를 뒤로 차면 소만 다친다는 속담 같은 말입니다.","s":233.388,"e":237.447,"p":false,"h":false},{"t":"사울이 그리스도를 박해한 것이 그를 해친 것이 아니라 자기를 해치는 일이었다는 뜻으로 읽는 해석이 많습니다.","s":237.672,"e":244.633,"p":false,"h":false},{"t":"이 속담은 9장과 22장에는 없고 이 장에만 나오는데, 청중이 헬라 문화권에 있었기 때문이라고 보는 견해가 있으나, 본문은 이유를 말하지 않습니다.","s":244.98,"e":255.678,"p":true,"h":false},{"t":"26장 16절에서 18절은 바울의 사명을 가장 자세히 말하는 곳입니다.","s":256.464,"e":261.725,"p":false,"h":false},{"t":"눈을 열어 어둠에서 빛으로 돌아가게 한다는 표현은 이사야서와 같은 소리를 냅니다.","s":261.936,"e":267.184,"p":false,"h":false},{"t":"이사야 42장 6절과 7절은 눈먼 사람의 눈을 열고 갇힌 사람을 감옥에서 이끌어 내며 어둠에 앉은 사람을 풀어 준다고 말하는데, 이 일을 하는 분이 \"민족들의 빛\"입니다.","s":267.372,"e":279.378,"p":false,"h":false},{"t":"이 구절의 표현은 그 말씀과 겹치는 것으로 읽는 해석이 많지만, 본문이 이사야를 직접 인용한 것은 아닙니다.","s":279.576,"e":287.347,"p":false,"h":false},{"t":"눈을 여는 분이 사도가 아니라는 점은 분명합니다.","s":287.712,"e":290.948,"p":false,"h":false},{"t":"눈을 열어 주시는 분은 주님이고, 바울은 그 일에 보냄을 받는 사람입니다.","s":291.168,"e":296.493,"p":true,"h":false},{"t":"26장 22절과 23절은 바울이 말하는 것이 새로운 종교가 아니라 \"선지자들과 모세가 말한 것\"이라는 선언입니다.","s":297.144,"e":305.67,"p":false,"h":false},{"t":"그리스도의 고난과 부활과, 이방인에게 빛을 전하시는 일이 구약이 이미 말한 것이라는 뜻이고, 이사야 49장 6절이나 53장을 먼저 읽으신 분은 이 말을 반갑게 느끼실 것입니다.","s":306.036,"e":319.109,"p":true,"h":false},{"t":"26장 28절의 아그립바의 말은 번역이 갈립니다.","s":319.896,"e":323.83,"p":false,"h":false},{"t":"\"네가 조금만 더 말하면 나를 그리스도인으로 만들겠다\"로 읽는 입장도 있고, 비웃으며 \"이렇게 짧은 말로 나를 그리스도인으로 만들려 하느냐\"는 말로 읽는 입장도 있습니다.","s":324.036,"e":336.067,"p":false,"h":false},{"t":"본문은 그가 끝내 믿었는지 말하지 않습니다.","s":336.42,"e":339.631,"p":false,"h":false},{"t":"바울의 대답이 분명한 것은, 왕 앞에서도 결박 외에는 자기와 같이 되기를 원한다는 것입니다.","s":339.84,"e":346.374,"p":true,"h":false},{"t":"26장 31절과 32절의 결말은 아이러니합니다.","s":347.184,"e":351.418,"p":false,"h":false},{"t":"이 사람은 죄가 없고 석방될 수도 있었지만, 가이사에게 상소했기 때문에 로마로 가야 합니다.","s":351.612,"e":358.275,"p":false,"h":false},{"t":"이 일을 바울의 실수로 읽을 수도 있고, 주님이 말씀하신 길(23장 11절)이 열린 것으로 읽을 수도 있습니다.","s":358.488,"e":367.522,"p":false,"h":false},{"t":"본문은 판정하지 않으니 한쪽으로 단정하지 않겠습니다.","s":367.848,"e":371.607,"p":true,"h":false}], NAV = {"prev":{"href":"doc25.   })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
