<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사도행전_03장</title>
<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:84px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }

  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  button:active { transform:scale(.96); }
  button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }

  #nvnote { display:none; background:#FFF3DC; color:#1F2A24; border:2px solid #F0D49A; border-radius:14px; padding:10px 14px; margin:8px 0; font-size:17px; line-height:1.6; text-align:center; }
  #nvnote button { background:var(--acc); color:#fff; padding:0 18px; margin-left:8px; font-size:17px; }
  .nvcard { display:none; margin:34px 0 10px; background:#fff; border:2px solid #DCE6DF; border-radius:16px; padding:18px 20px; }
  .nvcard .lb { color:var(--mute); font-size:16px; }
  .nvcard .nm { font-size:calc(var(--fs) + 2px); font-weight:900; margin:4px 0 14px; line-height:1.5; }
  .nvcard a.go { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; font-weight:900; font-size:19px; border-radius:14px; padding:12px 22px; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(63,174,106,.75); } 50% { box-shadow:0 0 0 10px rgba(63,174,106,0); } }
  #play.wait { animation:pulse 1.2s infinite; }
  #resume button { background:var(--acc); color:#fff; height:auto; padding:8px 14px; margin-left:8px; font-size:16px; }
  @media (max-width:640px) { header h1 { font-size:25px; } button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a id="tolist" href="#">← 목록으로</a>
    <h1>사도행전_03장</h1>
    <div class="meta" id="meta"></div>
    <div class="rule"></div>
  </header>
  <div id="resume"></div>
  <main id="text"></main>
  <div class="nvcard" id="nvcard"><div class="lb">다음 글</div><div class="nm" id="nvname"></div><a class="go" id="nvgo" href="#">다음 글 열기 ▶</a></div>
</div>

<div class="bar">
  <div id="nvnote"></div>
  <div class="prog" id="prog" aria-label="재생 위치"><i id="fill"></i></div>
  <div class="in">
    <button id="pt" class="o" aria-label="앞 글">앞 글</button>
    <button id="prev" aria-label="앞 문장" title="앞 문장">⏮</button>
    <button id="back" aria-label="10초 뒤로" title="10초 뒤로">↺10</button>
    <button id="play" aria-label="재생">▶ 재생</button>
    <button id="fwd" aria-label="10초 앞으로" title="10초 앞으로">10↻</button>
    <button id="next" aria-label="다음 문장" title="다음 문장">⏭</button>
    <button id="nt" class="o" aria-label="다음 글">다음 글</button>
    <span class="tm"><span id="cur">0:00</span> / <span id="tot">0:00</span></span>
    <button id="spd" class="o" aria-label="재생 속도">1.0x</button>
    <button id="fsm" class="o" aria-label="글자 줄이기">가-</button>
    <button id="fbg" class="o" aria-label="글자 키우기">가+</button>
    <button id="fs" class="o" aria-label="전체 화면" title="전체 화면 (F 키)">⛶ 전체</button>
  </div>
</div>

<script>
(function () {
  const TITLE = "사도행전_03장", AUDIO_SRC = "doc03_2610231348.mp3", DUR = 147, SEGS = [{"t":"사도행전 3장","s":0,"e":1.573,"p":true,"h":false},{"t":"전체 흐름","s":2.232,"e":3.264,"p":true,"h":false},{"t":"오후 세 시, 기도 시간에 베드로와 요한이 성전에 올라갑니다.","s":4.14,"e":8.687,"p":false,"h":false},{"t":"성전 미문 앞에는 태어날 때부터 걷지 못하는 사람이 날마다 앉아 구걸하고 있었습니다.","s":8.892,"e":14.716,"p":false,"h":false},{"t":"그는 두 사도를 보고 돈을 구합니다(3:1-3).","s":15.084,"e":19.55,"p":false,"h":false},{"t":"베드로가 대답합니다.","s":19.764,"e":21.536,"p":false,"h":false},{"t":"\"은과 금은 내게 없지만, 내게 있는 것을 네게 준다.","s":21.744,"e":25.775,"p":false,"h":false},{"t":"나사렛 예수 그리스도의 이름으로 걸어라.\"","s":25.992,"e":28.824,"p":false,"h":false},{"t":"그러고는 손을 잡아 일으키자 그 사람은 뛰어올라 서서 걷고, 뛰면서 하나님을 찬양하며 성전으로 들어갑니다(3:6-8).","s":29.016,"e":38.439,"p":false,"h":false},{"t":"돈을 구하러 왔다가 두 발을 얻은 셈입니다.","s":38.628,"e":41.679,"p":true,"h":false},{"t":"사람들이 놀라 솔로몬 행각으로 몰려들자 베드로가 말합니다.","s":42.336,"e":46.634,"p":false,"h":false},{"t":"\"왜 우리를 쳐다봅니까.","s":46.836,"e":48.643,"p":false,"h":false},{"t":"우리가 무슨 능력이나 경건으로 이 사람을 걷게 한 것처럼 말입니다\"(3:12).","s":48.852,"e":54.637,"p":false,"h":false},{"t":"사도 스스로 자기가 한 일이 아니라고 선을 긋는 장면입니다.","s":54.864,"e":58.973,"p":false,"h":false},{"t":"그는 이 일이 아브라함과 이삭과 야곱의 하나님이 그분의 종 예수를 영화롭게 하신 것이라고 말합니다.","s":59.184,"e":65.858,"p":false,"h":false},{"t":"여러분이 죽인 그분을 하나님이 살리셨고, 이 사람은 그 이름을 믿는 믿음으로 낫게 되었다고 합니다(3:13-16).","s":66.204,"e":75.207,"p":true,"h":false},{"t":"베드로의 말은 정죄로만 끝나지 않습니다.","s":75.888,"e":78.835,"p":false,"h":false},{"t":"여러분이 몰라서 그렇게 했다는 것을 안다며(3:17), 회개하고 돌이켜 죄 씻음을 받으라고 초대합니다.","s":79.056,"e":86.632,"p":false,"h":false},{"t":"그러면 새롭게 되는 날이 주께로부터 올 것이고, 하나님이 미리 정하신 그리스도 예수를 보내실 것이라고 합니다(3:19-20).","s":86.832,"e":96.529,"p":false,"h":false},{"t":"모든 선지자가 이 일을 말했고, 여러분은 선지자들의 자손이며 하나님이 아브라함에게 하신 언약의 자손이라고 말합니다.","s":96.768,"e":104.629,"p":false,"h":false},{"t":"하나님이 자기 종을 먼저 여러분에게 보내 악에서 돌아서게 하여 복 주신다는 것입니다(3:24-26).","s":104.976,"e":112.828,"p":true,"h":false},{"t":"구절 풀이","s":113.508,"e":114.555,"p":true,"h":false},{"t":"3장 12절에서 16절은 이 장의 중심입니다.","s":115.416,"e":118.939,"p":false,"h":false},{"t":"걷게 하신 분이 예수님이고, 사도들은 그 이름을 전하는 사람일 뿐이라고 베드로가 분명히 말합니다.","s":119.16,"e":126.007,"p":false,"h":false},{"t":"사도의 능력을 높이는 본문이 아니라 사도가 자기를 낮추는 본문입니다.","s":126.36,"e":131.241,"p":true,"h":false},{"t":"3장 19절에서 21절의 \"새롭게 되는 날\"과 \"만물이 회복될 때\"는 마지막 날의 완성을 가리킵니다.","s":131.904,"e":139.565,"p":false,"h":false},{"t":"그 시기를 두고 의견이 다양하지만, 본문의 초점은 지금 회개하고 돌이키라는 초대에 있습니다.","s":139.932,"e":146.316,"p":true,"h":false}], NAV = {"prev":{"href":"doc02.html","title":"사도행전_02장"},"next":{"href":"doc04.html","title":"사도행전_04장"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
