:false},{"t":"\"주 예수여, 내 영혼을 받으시옵소서.\"","s":124.092,"e":127.264,"p":false,"h":false},{"t":"그리고 무릎을 꿇고 크게 외칩니다.","s":127.44,"e":130.159,"p":false,"h":false},{"t":"\"주여, 이 죄를 그들에게 돌리지 마옵소서\"(7:59-60).","s":130.392,"e":136.086,"p":false,"h":false},{"t":"이 말을 하고 그는 잠들었습니다.","s":136.296,"e":138.807,"p":false,"h":false},{"t":"증인들은 옷을 사울이라는 청년의 발 앞에 두었습니다(7:58).","s":138.996,"e":144.402,"p":true,"h":false},{"t":"구절 풀이","s":145.044,"e":146.091,"p":true,"h":false},{"t":"7장 48절에서 50절은 이사야와 이어지는 본문입니다.","s":146.952,"e":151.536,"p":false,"h":false},{"t":"스데반이 인용한 이사야 66장 1절과 2절은 이사야서의 마지막 장입니다.","s":151.74,"e":157.251,"p":false,"h":false},{"t":"성전이 중요하지 않다는 말이 아니라, 하나님이 성전에 갇혀 계신 분이 아니라는 말입니다.","s":157.608,"e":163.656,"p":true,"h":false},{"t":"7장 51절에서 53절의 표현은 거칠지만, 스데반이 화가 나서 퍼부은 말이 아니라 선지자들이 해 온 말을 이어받은 것입니다.","s":164.34,"e":173.245,"p":false,"h":false},{"t":"성령을 거스른다는 말은 이 책 전체의 줄기를 다시 일깨웁니다.","s":173.592,"e":178.026,"p":false,"h":false},{"t":"일하시는 분은 성령이고, 사람의 일은 순종하거나 거스르거나 둘 중 하나입니다.","s":178.236,"e":183.865,"p":true,"h":false},{"t":"7장 55절과 56절에서 예수님이 \"서 계신\" 것은 의미를 두고 해석이 갈립니다.","s":184.5,"e":191.001,"p":false,"h":false},{"t":"다른 곳에서는 하나님 우편에 \"앉으신\" 것으로 말하기 때문입니다.","s":191.34,"e":196.137,"p":false,"h":false},{"t":"순교하는 증인을 맞이하려고 일어서신 것으로 보는 견해가 널리 알려져 있으나 본문이 직접 설명하지는 않습니다.","s":196.344,"e":203.641,"p":true,"h":false},{"t":"7장 60절의 기도는 예수님이 십자가에서 하신 기도와 닮았습니다.","s":204.444,"e":209.223,"p":false,"h":false},{"t":"스데반이 자기 힘으로 용서한 것이 아니라, 성령이 충만한 사람 안에서 그리스도의 마음이 이어진 것으로 읽을 수 있습니다.","s":209.592,"e":217.614,"p":true,"h":false}], NAV = {"prev":{"href":"doc06.html","title":"사도행전_06장"},"next":{"href":"doc08.html","title":"사도행전_08장"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');

    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };

  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }

    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }

  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */

  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
